				currentMoveDirectionX = moveDirectionX;
				currentMoveDirectionZ = moveDirectionZ;

				// 캐릭터 시각 회전은 부드럽게. (이동 자체는 입력 방향으로 즉시 진행)
				const targetYaw = System.Math.atan2(moveDirectionX, -moveDirectionZ);
				let yawDifference = targetYaw - characterYaw;
				while (yawDifference > System.Math.PI) {
					yawDifference -= System.Math.PI * 2;
				}
				while (yawDifference < -System.Math.PI) {
					yawDifference += System.Math.PI * 2;
				}
				characterYaw += yawDifference * System.Math.min(6.5 * deltaTime, 1);
			}

			// 질주. (Shift / 게임패드 L3 / 스틱·패드 풀 틸트)
			const padStrength = System.Math.sqrt(padInputX * padInputX + padInputY * padInputY);
			const gamepadStrength = System.Math.sqrt(gamepadMoveX * gamepadMoveX + gamepadMoveY * gamepadMoveY);
			const isSprinting = keyStateSet.has("ShiftLeft") || keyStateSet.has("ShiftRight") || gamepadSprintHeld || padStrength > 0.97 || gamepadStrength > 0.97;

			// 가감속 관성. (입력 시 서서히 가속, 놓으면 몇 걸음 미끄러지듯 감속)
			const targetMoveSpeed = (isSprinting ? SPRINT_SPEED : RUN_SPEED) * inputStrength;
			const accelerationRate = targetMoveSpeed > currentMoveSpeed ? 5.5 : 7.5;
			currentMoveSpeed += (targetMoveSpeed - currentMoveSpeed) * System.Math.min(accelerationRate * deltaTime, 1);

			if (currentMoveSpeed > 0.05) {
				// 입력 방향으로 즉시 전진. (입력이 없으면 마지막 방향으로 관성 감속)
				const headingX = currentMoveDirectionX;
				const headingZ = currentMoveDirectionZ;
				const stepLength = currentMoveSpeed * deltaTime;
				const currentHeight = terrainSurfaceHeightAt(playerX, playerZ);
				let candidateX = playerX + headingX * stepLength;
				let candidateZ = playerZ + headingZ * stepLength;
				let candidateHeight = terrainSurfaceHeightAt(candidateX, candidateZ);
				// 대칭 경사 차단. (오르막/내리막 모두 — 비대칭이면 중간 경사 구간에 갇힌다)
				const riseRate = (candidateHeight - currentHeight) / System.Math.max(stepLength, 0.0001);
				if (System.Math.abs(riseRate) > 1.15) {
					candidateX = playerX + headingX * stepLength;
					candidateZ = playerZ;
					candidateHeight = terrainSurfaceHeightAt(candidateX, candidateZ);
					const riseRateAxisX = (candidateHeight - currentHeight) / System.Math.max(stepLength, 0.0001);
					if (System.Math.abs(riseRateAxisX) > 1.15) {
						candidateX = playerX;
						candidateZ = playerZ + headingZ * stepLength;
						candidateHeight = terrainSurfaceHeightAt(candidateX, candidateZ);
						const riseRateAxisZ = (candidateHeight - currentHeight) / System.Math.max(stepLength, 0.0001);
						if (System.Math.abs(riseRateAxisZ) > 1.15) {
							candidateX = playerX;
							candidateZ = playerZ;
							currentMoveSpeed *= 0.5;
						}
					}
				}

				// 바위 밀어내기. (겹치면 경계선까지 밀림 — 장애물)
				for (const rock of rockList) {
					const rockDeltaX = candidateX - rock.centerX;
					const rockDeltaZ = candidateZ - rock.centerZ;
					const rockDistance = System.Math.sqrt(rockDeltaX * rockDeltaX + rockDeltaZ * rockDeltaZ);
					if (rockDistance > 0.001 && rockDistance < rock.blockRadius) {
						candidateX = rock.centerX + (rockDeltaX / rockDistance) * rock.blockRadius;
						candidateZ = rock.centerZ + (rockDeltaZ / rockDistance) * rock.blockRadius;
					}
				}

				// 여우 밀어내기. (동물도 장애물)
				for (const fox of FOX_LIST) {
					const foxDeltaX = candidateX - fox.currentX;
					const foxDeltaZ = candidateZ - fox.currentZ;
					const foxDistance = System.Math.sqrt(foxDeltaX * foxDeltaX + foxDeltaZ * foxDeltaZ);
					if (foxDistance > 0.001 && foxDistance < fox.blockRadius) {
						candidateX = fox.currentX + (foxDeltaX / foxDistance) * fox.blockRadius;
						candidateZ = fox.currentZ + (foxDeltaZ / foxDistance) * fox.blockRadius;
					}
				}

				// 맵 밖 이탈 방지.
				const candidateCenterDistance = System.Math.sqrt(candidateX * candidateX + candidateZ * candidateZ);
				if (candidateCenterDistance > 175) {
					candidateX *= 175 / candidateCenterDistance;
					candidateZ *= 175 / candidateCenterDistance;
				}

				playerX = candidateX;
				playerZ = candidateZ;
			}
			playerY = terrainSurfaceHeightAt(playerX, playerZ);

			// 정상 도달 판정.
			for (const hill of HILL_LIST) {
				if (!hill.cleared) {
					const summitDeltaX = playerX - hill.summitX;
					const summitDeltaZ = playerZ - hill.summitZ;
					const summitDistance = System.Math.sqrt(summitDeltaX * summitDeltaX + summitDeltaZ * summitDeltaZ);
					if (summitDistance < System.Math.max(hill.summitRadius * 0.2, 4) && playerY > hill.summitHeight * 0.78) {
						hill.cleared = true;
						hill.clearedPulseTime = elapsedTime;
						clearedSummitCount += 1;
						if (clearedSummitCount === HILL_LIST.length) {
							allClearedTime = elapsedTime;
						}
					}
				}
			}

			// 등반 시작. (O — 상호작용)
			climbAvailableTarget = detectClimbTarget();
			if (climbAvailableTarget && interactPressed) {
				const wallDirectionX = climbAvailableTarget.forwardX;
				const wallDirectionZ = climbAvailableTarget.forwardZ;
				climbData = {
					wallDirectionX: wallDirectionX,
					wallDirectionZ: wallDirectionZ,
					baseX: climbAvailableTarget.wallX - wallDirectionX * 0.95,
					baseZ: climbAvailableTarget.wallZ - wallDirectionZ * 0.95,
					baseY: playerY,
					topX: climbAvailableTarget.topX + wallDirectionX * 0.3,
					topZ: climbAvailableTarget.topZ + wallDirectionZ * 0.3,
					topY: climbAvailableTarget.topY,
					attachFromX: playerX,
					attachFromZ: playerZ,
					attachTime: 0,
				};
				characterYaw = System.Math.atan2(wallDirectionX, -wallDirectionZ);
				characterState = CharacterState.climbAttach;
				climbAvailableTarget = null;
				climbPhase = 0;
			}

			// 뛰어내리기. (등반 대상이 없고 아래를 내려보는 시야일 때)
			descendAvailableTarget = null;
			if (characterState === CharacterState.ground && !climbAvailableTarget && cameraPitch < -0.08) {
				descendAvailableTarget = detectDescendTarget();
			}
			if (descendAvailableTarget && interactPressed) {
				jumpDirectionX = descendAvailableTarget.forwardX;
				jumpDirectionZ = descendAvailableTarget.forwardZ;
				jumpHorizontalSpeed = 5.4;
				jumpVelocityY = 3.0;
				characterYaw = System.Math.atan2(jumpDirectionX, -jumpDirectionZ);
				characterState = CharacterState.jumpDown;
				descendAvailableTarget = null;
			}

			// 점프. (X / 좌클릭 — 달리던 관성을 유지한 채 도약)
			if (jumpPressed && characterState === CharacterState.ground) {
				jumpDirectionX = currentMoveDirectionX;
				jumpDirectionZ = currentMoveDirectionZ;
				jumpHorizontalSpeed = currentMoveSpeed;
				jumpVelocityY = JUMP_VELOCITY;
				characterState = CharacterState.jumpDown;
			}
		}
		else if (characterState === CharacterState.climbAttach) {
			// 벽면에 붙기. (짧은 보간 이동)
			climbData.attachTime += deltaTime;
			const attachProgress = System.Math.min(climbData.attachTime / CLIMB_ATTACH_DURATION, 1);
			playerX = climbData.attachFromX + (climbData.baseX - climbData.attachFromX) * attachProgress;
			playerZ = climbData.attachFromZ + (climbData.baseZ - climbData.attachFromZ) * attachProgress;
			playerY = climbData.baseY;
			resolveClimbWallContact(climbData.wallDirectionX, climbData.wallDirectionZ);
			if (attachProgress >= 1) {
				characterState = CharacterState.climbing;
			}
		}
		else if (characterState === CharacterState.climbing) {
			// 상승. (절벽면을 따라 상단 가장자리 아래 지점까지)
			climbPhase += deltaTime * 3.4;
			playerY += CLIMB_ASCEND_SPEED * deltaTime;
			const climbSpan = System.Math.max(climbData.topY - climbData.baseY, 0.001);
			const climbProgress = System.Math.min((playerY - climbData.baseY) / climbSpan, 1);
			const rimBaseX = climbData.topX - climbData.wallDirectionX * 1.5;
			const rimBaseZ = climbData.topZ - climbData.wallDirectionZ * 1.5;
			playerX = climbData.baseX + (rimBaseX - climbData.baseX) * climbProgress;
			playerZ = climbData.baseZ + (rimBaseZ - climbData.baseZ) * climbProgress;
			resolveClimbWallContact(climbData.wallDirectionX, climbData.wallDirectionZ);
			if (interactPressed) {
				characterState = CharacterState.climbCancel;
			}
			else if (playerY >= climbData.topY - 0.9) {
				climbData.vaultTime = 0;
				climbData.vaultFromX = playerX;
				climbData.vaultFromZ = playerZ;
				climbData.vaultFromY = playerY;
				characterState = CharacterState.vault;
			}
		}
		else if (characterState === CharacterState.climbCancel) {
			// 하강 복귀.
			climbPhase -= deltaTime * 3.0;
			playerY -= CLIMB_DESCEND_SPEED * deltaTime;
			const climbSpan = System.Math.max(climbData.topY - climbData.baseY, 0.001);
			const climbProgress = System.Math.max((playerY - climbData.baseY) / climbSpan, 0);
			const rimBaseX = climbData.topX - climbData.wallDirectionX * 1.5;
			const rimBaseZ = climbData.topZ - climbData.wallDirectionZ * 1.5;
			playerX = climbData.baseX + (rimBaseX - climbData.baseX) * climbProgress;
			playerZ = climbData.baseZ + (rimBaseZ - climbData.baseZ) * climbProgress;
			resolveClimbWallContact(climbData.wallDirectionX, climbData.wallDirectionZ);
			if (playerY <= climbData.baseY) {
				playerY = climbData.baseY;
				characterState = CharacterState.ground;
				climbData = null;
			}
		}
		else if (characterState === CharacterState.vault) {
			// 상단 가장자리 넘어가기.
			climbData.vaultTime += deltaTime;
			const vaultProgress = System.Math.min(climbData.vaultTime / VAULT_DURATION, 1);
			const easedProgress = vaultProgress * vaultProgress * (3 - 2 * vaultProgress);
			playerX = climbData.vaultFromX + (climbData.topX - climbData.vaultFromX) * easedProgress;
			playerZ = climbData.vaultFromZ + (climbData.topZ - climbData.vaultFromZ) * easedProgress;
			const vaultTargetY = terrainSurfaceHeightAt(climbData.topX, climbData.topZ);
			const vaultArc = System.Math.sin(vaultProgress * System.Math.PI) * 0.35;
			playerY = climbData.vaultFromY + (vaultTargetY - climbData.vaultFromY) * easedProgress + vaultArc;
			if (vaultProgress >= 1) {
				playerY = vaultTargetY;
				characterState = CharacterState.ground;
				climbData = null;
			}
		}
		else if (characterState === CharacterState.jumpDown) {
			// 도약/낙하. (전방 관성 + 중력 — 바위/벽에 막히고, 착지 시 충격량 기록)
			const horizontalStep = jumpHorizontalSpeed * deltaTime;
			const aheadX = playerX + jumpDirectionX * horizontalStep;
			const aheadZ = playerZ + jumpDirectionZ * horizontalStep;
			const aheadHeight = terrainSurfaceHeightAt(aheadX, aheadZ);
			let isBlockedByRock = false;
			for (const rock of rockList) {
				const rockDeltaX = aheadX - rock.centerX;
				const rockDeltaZ = aheadZ - rock.centerZ;
				const rockDistance = System.Math.sqrt(rockDeltaX * rockDeltaX + rockDeltaZ * rockDeltaZ);
				if (rockDistance < rock.blockRadius && playerY < rock.topHeight) {
					isBlockedByRock = true;
				}
			}
			for (const fox of FOX_LIST) {
				const foxDeltaX = aheadX - fox.currentX;
				const foxDeltaZ = aheadZ - fox.currentZ;
				const foxDistance = System.Math.sqrt(foxDeltaX * foxDeltaX + foxDeltaZ * foxDeltaZ);
				if (foxDistance < fox.blockRadius && playerY < fox.topHeight) {
					isBlockedByRock = true;
				}
			}
			if (!isBlockedByRock && aheadHeight < playerY + 0.4) {
				playerX = aheadX;
				playerZ = aheadZ;
			}
			jumpVelocityY -= 16 * deltaTime;
			jumpVelocityY = System.Math.max(jumpVelocityY, -26);
			playerY += jumpVelocityY * deltaTime;
			const groundHeight = terrainSurfaceHeightAt(playerX, playerZ);
			if (playerY <= groundHeight) {
				playerY = groundHeight;
				landingImpulse = System.Math.min(-jumpVelocityY / 16, 1);

				// 낙하 → 착지 → 대기/이동 순서를 항상 거친다. (낙하 높이와 무관)
				landRecoverTime = 0;
				characterState = CharacterState.landRecover;
			}
		}
		else if (characterState === CharacterState.landRecover) {
			// 착지 웅크림 회복.
			landRecoverTime += deltaTime;
			playerY = terrainSurfaceHeightAt(playerX, playerZ);
			if (landRecoverTime >= 0.42) {
				characterState = CharacterState.ground;
			}
		}
	}

	//==============================================================================
	// 캐릭터 애니메이션. (상태 → 스킨드 모델 클립)
	//==============================================================================
	function updateCharacterAnimation(deltaTime) {
		if (characterState === CharacterState.ground) {
			if (currentMoveSpeed < 0.15) {
				characterModel.playAnimation(idleClipName, 0.25);
				characterModel.setTimeScale(1);
			}
			else if (currentMoveSpeed < 3) {
				characterModel.playAnimation(walkClipName, 0.2);
				characterModel.setTimeScale(System.Math.max(currentMoveSpeed / 1.7, 0.6));
			}
			else {
				characterModel.playAnimation(runClipName, 0.2);
				characterModel.setTimeScale(currentMoveSpeed / (isRunClipShared ? 2.0 : 5));
			}
		}
		else if (characterState === CharacterState.climbAttach || characterState === CharacterState.climbing || characterState === CharacterState.climbCancel) {
			// 등반: 벽 오르기 클립. (루트 모션은 로드 시 제거 — 위치는 게임 로직이 제어)
			characterModel.playAnimation(climbClipName, 0.2);
			characterModel.setTimeScale(characterState === CharacterState.climbing ? 1 : 0.5);
		}
		else if (characterState === CharacterState.jumpDown) {
			// 도약/낙하: 공중 낙하 클립. (지상 클립과 자세 차이가 커 짧게 전환)
			characterModel.playAnimation(fallClipName, 0.08);
			characterModel.setTimeScale(1);
		}
		else if (characterState === CharacterState.landRecover) {
			// 착지: 착지 클립. (도입부를 잘라낸 애셋이라 접지 자세부터 시작 — 낙하 자세가 섞이지 않게 즉시 전환)
			characterModel.playAnimation(landClipName, 0);
			characterModel.setTimeScale(1.8);
		}
		else {
			characterModel.playAnimation(idleClipName, 0.2);
			characterModel.setTimeScale(1);
		}
		characterModel.update(deltaTime);
	}

	//==============================================================================
	// HUD. (엔진 Graphic 으로 캔버스 안에 직접 렌더링)
	//==============================================================================
	const uiGraphic = new Graphic(canvas);

	//==============================================================================
	// 화면 효과 옵션. (우측 상단 패널 — 토글은 매 프레임 부드럽게 보간)
	//==============================================================================
	const optionDefinitions = [
		{ name: "shadow", label: "SHADOW", type: "cycle", stateLabels: ["OFF", "SIMPLE", "REALTIME"] },
		{ name: "bloom", label: "BLOOM", type: "toggle" },
		{ name: "vignette", label: "VIGNETTE", type: "toggle" },
		{ name: "film", label: "FILM GRAIN", type: "toggle" },
		{ name: "collision", label: "COLLISION", type: "toggle" },
		{ name: "glow", label: "GLOW", type: "slider", minimumValue: 0, maximumValue: 1.5, defaultValue: 1 },
		{ name: "motionBlur", label: "MOTION BLUR", type: "slider", minimumValue: 0, maximumValue: 1, defaultValue: 0.35 },
	];
	const optionStates = {
		shadow: 2,
		bloom: true,
		vignette: true,
		film: true,
		collision: false,
	};
	const optionBlendValues = {
		bloom: 1,
		vignette: 1,
		film: 1,
		collision: 0,
	};
	const sliderValues = {
		glow: 1,
		motionBlur: 0.35,
	};
	let activeSliderName = null;
	let isPanelCollapsed = true;
	let panelCollapseBlend = 0;
	let motionBlurCurrentStrength = 0;
	let shadowRealtimeBlend = 1;

	// 패널 레이아웃. (CSS 픽셀 기준, 우측 상단 고정)
	const PANEL_WIDTH = 236;
	const PANEL_HEADER_HEIGHT = 40;
	const PANEL_ROW_HEIGHT = 30;
	const PANEL_MARGIN_RIGHT = 18;
	function calculatePanelLayout() {
		const panelX = System.window.innerWidth - PANEL_MARGIN_RIGHT - PANEL_WIDTH;
		const panelY = 18;
		const listHeight = (optionDefinitions.length * PANEL_ROW_HEIGHT + 10) * panelCollapseBlend;
		const panelHeight = PANEL_HEADER_HEIGHT + listHeight;
		return { panelX: panelX, panelY: panelY, panelHeight: panelHeight, listHeight: listHeight };
	}

	// 슬라이더 트랙의 화면 X 범위. (렌더링과 히트 테스트가 공유)
	const SLIDER_TRACK_WIDTH = 90;
	function calculateSliderTrackX(panelX) {
		return panelX + PANEL_WIDTH - 16 - SLIDER_TRACK_WIDTH;
	}

	// 드래그 중인 슬라이더 값 갱신.
	function updateSliderFromClientX(clientX) {
		if (activeSliderName === null) {
			return;
		}
		let sliderDefinition = null;
		for (const optionDefinition of optionDefinitions) {
			if (optionDefinition.name === activeSliderName) {
				sliderDefinition = optionDefinition;
			}
		}
		if (!sliderDefinition) {
			return;
		}
		const panelLayout = calculatePanelLayout();
		const trackX = calculateSliderTrackX(panelLayout.panelX);
		const normalized = System.Math.max(0, System.Math.min(1, (clientX - trackX) / SLIDER_TRACK_WIDTH));
		sliderValues[activeSliderName] = sliderDefinition.minimumValue + (sliderDefinition.maximumValue - sliderDefinition.minimumValue) * normalized;
	}

	// 패널 히트 테스트. (true 반환 시 다른 입력으로 전달하지 않음)
	function handlePanelPress(clientX, clientY) {
		const panelLayout = calculatePanelLayout();
		if (clientX < panelLayout.panelX || clientX > panelLayout.panelX + PANEL_WIDTH) {
			return false;
		}
		if (clientY < panelLayout.panelY || clientY > panelLayout.panelY + panelLayout.panelHeight) {
			return false;
		}

		// 헤더: 접기/펴기.
		if (clientY < panelLayout.panelY + PANEL_HEADER_HEIGHT) {
			isPanelCollapsed = !isPanelCollapsed;
			return true;
		}

		// 목록: 행 토글 / 슬라이더 드래그 시작.
		if (panelCollapseBlend > 0.9) {
			const rowIndex = System.Math.floor((clientY - panelLayout.panelY - PANEL_HEADER_HEIGHT - 4) / PANEL_ROW_HEIGHT);
			if (rowIndex >= 0 && rowIndex < optionDefinitions.length) {
				const optionDefinition = optionDefinitions[rowIndex];
				if (optionDefinition.type === "slider") {
					activeSliderName = optionDefinition.name;
					updateSliderFromClientX(clientX);
				}
				else if (optionDefinition.type === "cycle") {
					optionStates[optionDefinition.name] = (optionStates[optionDefinition.name] + 1) % optionDefinition.stateLabels.length;
				}
				else {
					optionStates[optionDefinition.name] = !optionStates[optionDefinition.name];
				}
			}
		}
		return true;
	}

	// 옵션 패널 렌더링. (우측 상단 글래스 패널 — 골드 액센트)
	function renderOptionPanel() {
		const panelLayout = calculatePanelLayout();

		// 패널 배경 + 테두리.
		const panelRect = Rect.create(panelLayout.panelX, panelLayout.panelY, PANEL_WIDTH, panelLayout.panelHeight);
		uiGraphic.setFillColor("rgba(12, 20, 32, 0.62)");
		uiGraphic.drawRoundRect(panelRect, 14);
		uiGraphic.setStrokeColor("rgba(255, 226, 150, 0.28)");
		uiGraphic.drawStrokeRoundRect(panelRect, 14, 1);

		// 헤더.
		uiGraphic.setFontString(`300 11px "Segoe UI", sans-serif`);
		uiGraphic.setTextAlign("left");
		uiGraphic.setTextBaseline("middle");
		uiGraphic.setFillColor("rgba(255, 236, 180, 0.92)");
		uiGraphic.drawFillText("O P T I O N S", panelLayout.panelX + 16, panelLayout.panelY + PANEL_HEADER_HEIGHT * 0.5 + 1);
		uiGraphic.setTextAlign("right");
		uiGraphic.setFillColor("rgba(255, 236, 180, 0.6)");
		const arrowText = isPanelCollapsed ? "▸" : "▾";
		uiGraphic.drawFillText(arrowText, panelLayout.panelX + PANEL_WIDTH - 16, panelLayout.panelY + PANEL_HEADER_HEIGHT * 0.5 + 1);

		// 목록. (접힘 애니메이션에 따라 알파 페이드)
		if (panelCollapseBlend > 0.05) {
			for (let rowIndex = 0; rowIndex < optionDefinitions.length; ++rowIndex) {
				const optionDefinition = optionDefinitions[rowIndex];
				const rowY = panelLayout.panelY + PANEL_HEADER_HEIGHT + 4 + rowIndex * PANEL_ROW_HEIGHT;
				if (rowY + PANEL_ROW_HEIGHT > panelLayout.panelY + panelLayout.panelHeight) {
					break;
				}
				const rowMiddleY = rowY + PANEL_ROW_HEIGHT * 0.5;
				uiGraphic.setGlobalAlpha(panelCollapseBlend);

				// 레이블.
				uiGraphic.setTextAlign("left");
				uiGraphic.setFontString(`300 11px "Segoe UI", sans-serif`);
				uiGraphic.setFillColor("rgba(238, 240, 244, 0.85)");
				uiGraphic.drawFillText(optionDefinition.label, panelLayout.panelX + 16, rowMiddleY + 1);

				if (optionDefinition.type === "cycle") {
					// 상태 순환 칩. (클릭할 때마다 다음 단계)
					const stateLabel = optionDefinition.stateLabels[optionStates[optionDefinition.name]];
					const cycleChipWidth = 78;
					const cycleChipRect = Rect.create(panelLayout.panelX + PANEL_WIDTH - 16 - cycleChipWidth, rowMiddleY - 9.5, cycleChipWidth, 19);
					uiGraphic.setFillColor("rgba(232, 186, 90, 0.2)");
					uiGraphic.drawRoundRect(cycleChipRect, 9.5);
					uiGraphic.setStrokeColor("rgba(255, 226, 150, 0.5)");
					uiGraphic.drawStrokeRoundRect(cycleChipRect, 9.5, 1);
					uiGraphic.setTextAlign("center");
					uiGraphic.setFontString(`600 10px "Segoe UI", sans-serif`);
					uiGraphic.setFillColor("rgba(255, 236, 180, 0.95)");
					uiGraphic.drawFillText(stateLabel, panelLayout.panelX + PANEL_WIDTH - 16 - cycleChipWidth * 0.5, rowMiddleY + 1);
				}
				else if (optionDefinition.type === "slider") {
					// 슬라이더. (트랙 + 채움 + 노브)
					const sliderRange = optionDefinition.maximumValue - optionDefinition.minimumValue;
					const sliderNormalized = (sliderValues[optionDefinition.name] - optionDefinition.minimumValue) / sliderRange;
					const trackX = calculateSliderTrackX(panelLayout.panelX);
					const trackRect = Rect.create(trackX, rowMiddleY - 2, SLIDER_TRACK_WIDTH, 4);
					uiGraphic.setFillColor("rgba(238, 240, 244, 0.18)");
					uiGraphic.drawRoundRect(trackRect, 2);
					const filledRect = Rect.create(trackX, rowMiddleY - 2, SLIDER_TRACK_WIDTH * sliderNormalized, 4);
					uiGraphic.setFillColor("rgba(232, 186, 90, 0.92)");
					uiGraphic.drawRoundRect(filledRect, 2);
					const sliderKnobCenter = Vector2.create(trackX + SLIDER_TRACK_WIDTH * sliderNormalized, rowMiddleY);
					uiGraphic.setFillColor("#fffaf0");
					uiGraphic.drawCircle(sliderKnobCenter, 6);
				}
				else {
					// 토글 스위치. (트랙 + 이동 노브, 상태 전환은 매 프레임 보간)
					const toggleBlend = optionBlendValues[optionDefinition.name];
					const switchX = panelLayout.panelX + PANEL_WIDTH - 16 - 36;
					const switchY = rowMiddleY - 9.5;
					const trackRect = Rect.create(switchX, switchY, 36, 19);
					const trackRed = 0.14 + (0.85 - 0.14) * toggleBlend;
					const trackGreen = 0.17 + (0.68 - 0.17) * toggleBlend;
					const trackBlue = 0.22 + (0.3 - 0.22) * toggleBlend;
					uiGraphic.setFillColor(`rgba(${System.Math.round(trackRed * 255)}, ${System.Math.round(trackGreen * 255)}, ${System.Math.round(trackBlue * 255)}, 0.85)`);
					uiGraphic.drawRoundRect(trackRect, 9.5);
					uiGraphic.setStrokeColor(`rgba(255, 226, 150, ${0.25 + toggleBlend * 0.45})`);
					uiGraphic.drawStrokeRoundRect(trackRect, 9.5, 1);
					const knobX = switchX + 9.5 + toggleBlend * 17;
					const knobCenter = Vector2.create(knobX, rowMiddleY);
					uiGraphic.setFillColor(toggleBlend > 0.5 ? "#fffaf0" : "rgba(238, 240, 244, 0.75)");
					uiGraphic.drawCircle(knobCenter, 6.5);
				}
			}
			uiGraphic.setGlobalAlpha(1);
		}
	}

	// PS 스타일 버튼 아이콘. (X = 크로스, O = 서클)
	function drawCrossIcon(centerX, centerY, iconRadius, iconColorString, lineWidth) {
		uiGraphic.setStrokeColor(iconColorString);
		const crossOffset = iconRadius * 0.72;
		const crossLineA = [Vector2.create(centerX - crossOffset, centerY - crossOffset), Vector2.create(centerX + crossOffset, centerY + crossOffset)];
		uiGraphic.drawLine(crossLineA, lineWidth);
		const crossLineB = [Vector2.create(centerX + crossOffset, centerY - crossOffset), Vector2.create(centerX - crossOffset, centerY + crossOffset)];
		uiGraphic.drawLine(crossLineB, lineWidth);
	}
	function drawCircleIcon(centerX, centerY, iconRadius, iconColorString, lineWidth) {
		uiGraphic.setStrokeColor(iconColorString);
		const iconCenter = Vector2.create(centerX, centerY);
		uiGraphic.drawStrokeCircle(iconCenter, iconRadius * 0.78, lineWidth);
	}

	// 그림자 곁들인 텍스트.
	function drawShadowedText(text, x, y) {
		const shadowFillColor = "rgba(10, 16, 24, 0.75)";
		uiGraphic.setFillColor(shadowFillColor);
		uiGraphic.drawFillText(text, x + 1.2, y + 1.4);
		uiGraphic.setFillColor("rgba(250, 250, 248, 0.95)");
		uiGraphic.drawFillText(text, x, y);
	}

	// 월드 좌표 → CSS 픽셀 화면 좌표.
	function projectWorldToScreen(viewProjectionMatrix, worldX, worldY, worldZ, cssWidth, cssHeight) {
		const clipPosition = viewProjectionMatrix.transformPoint(worldX, worldY, worldZ);
		if (clipPosition.w <= 0.001) {
			return null;
		}
		const normalizedX = clipPosition.x / clipPosition.w;
		const normalizedY = clipPosition.y / clipPosition.w;
		return {
			x: (normalizedX * 0.5 + 0.5) * cssWidth,
			y: (1 - (normalizedY * 0.5 + 0.5)) * cssHeight,
		};
	}

	function renderHud(viewProjectionMatrix, elapsedTime, deltaTime) {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const cssWidth = System.window.innerWidth;
		const cssHeight = System.window.innerHeight;

		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio, devicePixelRatio);
		uiGraphic.setGlobalAlpha(1);

		// 등반 프롬프트. (절벽의 손 닿는 높이에 O 아이콘 + 레이블 — 아이콘 탭/클릭도 등반 시작)
		promptScreenPosition = null;
		if (characterState === CharacterState.ground && climbAvailableTarget) {
			const promptScreen = projectWorldToScreen(viewProjectionMatrix, climbAvailableTarget.wallX, climbAvailableTarget.promptY, climbAvailableTarget.wallZ, cssWidth, cssHeight);
			if (promptScreen) {
				promptScreenPosition = promptScreen;
				const pulseScale = 1 + System.Math.sin(elapsedTime * 5.5) * 0.06;
				const promptRadius = 21 * pulseScale;
				const promptCenter = Vector2.create(promptScreen.x, promptScreen.y);
				uiGraphic.setFillColor("rgba(0, 0, 0, 0.82)");
				uiGraphic.drawCircle(promptCenter, promptRadius);
				uiGraphic.setStrokeColor("rgba(255, 255, 255, 0.4)");
				uiGraphic.drawStrokeCircle(promptCenter, promptRadius, 1.6);
				drawCircleIcon(promptScreen.x, promptScreen.y, promptRadius * 0.62, "rgba(255, 255, 255, 0.98)", 3);
				uiGraphic.setFontString(`600 15px "Segoe UI", "Malgun Gothic", sans-serif`);
				uiGraphic.setTextAlign("left");
				uiGraphic.setTextBaseline("middle");
				drawShadowedText("등반", promptScreen.x + promptRadius + 10, promptScreen.y);
			}
		}

		// 뛰어내리기 프롬프트. (낙하 가장자리에 X 아이콘 + 레이블)
		if (characterState === CharacterState.ground && !climbAvailableTarget && descendAvailableTarget) {
			const promptScreen = projectWorldToScreen(viewProjectionMatrix, descendAvailableTarget.edgeX, descendAvailableTarget.promptY, descendAvailableTarget.edgeZ, cssWidth, cssHeight);
			if (promptScreen) {
				promptScreenPosition = promptScreen;
				const pulseScale = 1 + System.Math.sin(elapsedTime * 5.5) * 0.06;
				const promptRadius = 21 * pulseScale;
				const promptCenter = Vector2.create(promptScreen.x, promptScreen.y);
				uiGraphic.setFillColor("rgba(0, 0, 0, 0.82)");
				uiGraphic.drawCircle(promptCenter, promptRadius);
				uiGraphic.setStrokeColor("rgba(255, 255, 255, 0.4)");
				uiGraphic.drawStrokeCircle(promptCenter, promptRadius, 1.6);
				drawCircleIcon(promptScreen.x, promptScreen.y, promptRadius * 0.62, "rgba(255, 255, 255, 0.98)", 3);
				uiGraphic.setFontString(`600 15px "Segoe UI", "Malgun Gothic", sans-serif`);
				uiGraphic.setTextAlign("left");
				uiGraphic.setTextBaseline("middle");
				drawShadowedText("뛰어내리기", promptScreen.x + promptRadius + 10, promptScreen.y);
			}
		}

		// 등반 중 취소 안내.
		if (characterState === CharacterState.climbing) {
			const cancelScreen = projectWorldToScreen(viewProjectionMatrix, playerX, playerY + 2.3, playerZ, cssWidth, cssHeight);
			if (cancelScreen) {
				const cancelCenter = Vector2.create(cancelScreen.x, cancelScreen.y);
				uiGraphic.setFillColor("rgba(0, 0, 0, 0.78)");
				uiGraphic.drawCircle(cancelCenter, 15);
				uiGraphic.setStrokeColor("rgba(255, 255, 255, 0.4)");
				uiGraphic.drawStrokeCircle(cancelCenter, 15, 1.6);
				drawCircleIcon(cancelScreen.x, cancelScreen.y, 10, "rgba(255, 255, 255, 0.95)", 2.4);
				uiGraphic.setFontString(`600 13px "Segoe UI", "Malgun Gothic", sans-serif`);
				uiGraphic.setTextAlign("left");
				uiGraphic.setTextBaseline("middle");
				drawShadowedText("취소", cancelScreen.x + 24, cancelScreen.y);
			}
		}

		// 정상 카운터 칩. (좌상단 글래스 칩 + 골드 아이콘)
		const counterRect = Rect.create(14, 14, 132, 30);
		uiGraphic.setFillColor("rgba(12, 20, 32, 0.55)");
		uiGraphic.drawRoundRect(counterRect, 15);
		uiGraphic.setStrokeColor("rgba(255, 226, 150, 0.28)");
		uiGraphic.drawStrokeRoundRect(counterRect, 15, 1);
		uiGraphic.setFontString(`500 14px "Segoe UI", "Malgun Gothic", sans-serif`);
		uiGraphic.setTextAlign("left");
		uiGraphic.setTextBaseline("middle");
		uiGraphic.setFillColor("rgba(255, 205, 90, 0.95)");
		uiGraphic.drawFillText("▲", 28, 30);
		drawShadowedText(`정상 ${clearedSummitCount} / ${HILL_LIST.length}`, 46, 30);

		// 전체 클리어 배너.
		const allClearedElapsed = elapsedTime - allClearedTime;
		if (allClearedElapsed > 0 && allClearedElapsed < 7) {
			const bannerAlpha = System.Math.min(allClearedElapsed / 0.8, 1) * (1 - smoothstepValue(5.5, 7, allClearedElapsed));
			uiGraphic.setGlobalAlpha(bannerAlpha);
			uiGraphic.setFontString(`300 34px "Segoe UI Light", "Segoe UI", "Malgun Gothic", sans-serif`);
			uiGraphic.setTextAlign("center");
			drawShadowedText("모든 정상을 정복했습니다", cssWidth * 0.5, cssHeight * 0.36);
			uiGraphic.setFontString(`300 14px "Segoe UI", "Malgun Gothic", sans-serif`);
			drawShadowedText("잃어버린 순환로의 여섯 봉우리를 모두 올랐습니다", cssWidth * 0.5, cssHeight * 0.36 + 34);
			uiGraphic.setGlobalAlpha(1);
		}

		// 가상 조이스틱. (터치 디바이스)
		if (isTouchDevice) {
			virtualPad.tick(deltaTime);
			virtualPad.draw(uiGraphic);
		}

		// X / O 버튼. (우하단)
		const jumpButtonCenter = calculateJumpButtonCenter();
		const interactButtonCenter = calculateInteractButtonCenter();
		const isActionReady = characterState === CharacterState.ground && (climbAvailableTarget !== null || descendAvailableTarget !== null);
		const isInteractReady = isActionReady || characterState === CharacterState.climbing;
		uiGraphic.setFillColor(isJumpButtonHeld ? "rgba(45, 45, 45, 0.75)" : "rgba(0, 0, 0, 0.6)");
		uiGraphic.drawCircle(jumpButtonCenter, BUTTON_RADIUS);
		uiGraphic.setStrokeColor("rgba(255, 255, 255, 0.35)");
		uiGraphic.drawStrokeCircle(jumpButtonCenter, BUTTON_RADIUS, 1.6);
		drawCrossIcon(jumpButtonCenter.x, jumpButtonCenter.y, BUTTON_RADIUS * 0.44, "rgba(255, 255, 255, 0.95)", 3.4);
		const interactGlowRadius = BUTTON_RADIUS * 0.82 + (isInteractReady ? 3 + System.Math.sin(elapsedTime * 6) * 2 : 0);
		uiGraphic.setFillColor(isInteractButtonHeld ? "rgba(45, 45, 45, 0.75)" : "rgba(0, 0, 0, 0.6)");
		uiGraphic.drawCircle(interactButtonCenter, interactGlowRadius);
		uiGraphic.setStrokeColor(isInteractReady ? "rgba(255, 255, 255, 0.9)" : "rgba(255, 255, 255, 0.35)");
		uiGraphic.drawStrokeCircle(interactButtonCenter, interactGlowRadius, isInteractReady ? 2.6 : 1.6);
		drawCircleIcon(interactButtonCenter.x, interactButtonCenter.y, interactGlowRadius * 0.52, isInteractReady ? "rgba(255, 255, 255, 0.98)" : "rgba(255, 255, 255, 0.8)", 3);

		// 조작 안내. (입력 시작 후 서서히 사라짐)
		const hintAlpha = hasAnyInputHappened ? System.Math.max(0, 1 - (elapsedTime - hintFadeStartTime) / 3) : 1;
		if (hintAlpha > 0.01) {
			uiGraphic.setGlobalAlpha(hintAlpha);
			uiGraphic.setFontString(`400 12px "Segoe UI", "Malgun Gothic", sans-serif`);
			uiGraphic.setTextAlign("left");
			uiGraphic.setTextBaseline("middle");
			const hintBaseY = cssHeight - 148;
			const hintCardRect = isTouchDevice ? Rect.create(10, hintBaseY - 16, 252, 72) : Rect.create(10, hintBaseY - 36, 366, 116);
			uiGraphic.setFillColor("rgba(12, 20, 32, 0.5)");
			uiGraphic.drawRoundRect(hintCardRect, 12);
			uiGraphic.setStrokeColor("rgba(255, 226, 150, 0.2)");
			uiGraphic.drawStrokeRoundRect(hintCardRect, 12, 1);
			if (isTouchDevice) {
				drawShadowedText("왼쪽 드래그 — 이동 (끝까지 밀면 질주)", 18, hintBaseY);
				drawShadowedText("오른쪽 드래그 — 시점", 18, hintBaseY + 20);
				drawShadowedText("✕ 점프 · ○ 등반 / 뛰어내리기", 18, hintBaseY + 40);
			}
			else {
				drawShadowedText("W A S D — 이동  ·  SHIFT / R2 — 질주", 18, hintBaseY - 20);
				drawShadowedText("방향키 / 마우스 드래그 — 시점", 18, hintBaseY);
				drawShadowedText("SPACE / 좌클릭 — 점프 (✕)", 18, hintBaseY + 20);
				drawShadowedText("O / 우클릭 — 등반 · 뛰어내리기 · 취소 (○)", 18, hintBaseY + 40);
				drawShadowedText("절벽을 바라보면 등반 · 가장자리에서 아래를 보면 뛰어내리기", 18, hintBaseY + 60);
			}
			uiGraphic.setGlobalAlpha(1);
		}

		// 충돌 영역 표시. (COLLISION 옵션 — 바위/여우/캐릭터 충돌 반경 링)
		function drawCollisionRing(centerX, centerZ, ringRadius, colorString) {
			const ringPositions = [];
			for (let segmentIndex = 0; segmentIndex < 16; ++segmentIndex) {
				const segmentAngle = (segmentIndex / 16) * System.Math.PI * 2;
				const ringWorldX = centerX + System.Math.cos(segmentAngle) * ringRadius;
				const ringWorldZ = centerZ + System.Math.sin(segmentAngle) * ringRadius;
				const ringWorldY = terrainSurfaceHeightAt(ringWorldX, ringWorldZ) + 0.15;
				const ringScreen = projectWorldToScreen(viewProjectionMatrix, ringWorldX, ringWorldY, ringWorldZ, cssWidth, cssHeight);
				if (!ringScreen) {
					return;
				}
				ringPositions.push(Vector2.create(ringScreen.x, ringScreen.y));
			}
			uiGraphic.setStrokeColor(colorString);
			uiGraphic.drawLineLoop(ringPositions, 2);
		}
		if (optionStates.collision) {
			for (const rock of rockList) {
				const rockDeltaX = rock.centerX - playerX;
				const rockDeltaZ = rock.centerZ - playerZ;
				if (rockDeltaX * rockDeltaX + rockDeltaZ * rockDeltaZ < 45 * 45) {
					drawCollisionRing(rock.centerX, rock.centerZ, rock.blockRadius, "rgba(120, 220, 255, 0.85)");
				}
			}
			for (const fox of FOX_LIST) {
				drawCollisionRing(fox.currentX, fox.currentZ, fox.blockRadius, "rgba(255, 180, 90, 0.9)");
			}
			drawCollisionRing(playerX, playerZ, 0.38, "rgba(255, 120, 200, 0.9)");
		}

		// 입력 상태 표시. (좌하단 — 이동 벡터 + 질주/점프/상호작용 눌림)
		const indicatorSprintHeld = keyStateSet.has("ShiftLeft") || keyStateSet.has("ShiftRight") || gamepadSprintHeld;
		const indicatorJumpHeld = keyStateSet.has("Space") || keyStateSet.has("KeyX") || previousGamepadJump || isJumpButtonHeld;
		const indicatorInteractHeld = keyStateSet.has("KeyO") || keyStateSet.has("Escape") || previousGamepadInteract || isInteractButtonHeld;
		const indicatorCenterX = 46;
		const indicatorCenterY = cssHeight - (isTouchDevice ? 258 : 40);
		const indicatorCenter = Vector2.create(indicatorCenterX, indicatorCenterY);
		uiGraphic.setFillColor("rgba(12, 20, 32, 0.5)");
		uiGraphic.drawCircle(indicatorCenter, 26);
		uiGraphic.setStrokeColor("rgba(255, 226, 150, 0.25)");
		uiGraphic.drawStrokeCircle(indicatorCenter, 26, 1);
		const moveMagnitude = System.Math.sqrt(currentMoveInputX * currentMoveInputX + currentMoveInputZ * currentMoveInputZ);
		const moveDotCenter = Vector2.create(indicatorCenterX + currentMoveInputX * 15, indicatorCenterY - currentMoveInputZ * 15);
		uiGraphic.setFillColor(moveMagnitude > 0.05 ? "rgba(255, 236, 180, 0.95)" : "rgba(238, 240, 244, 0.35)");
		uiGraphic.drawCircle(moveDotCenter, 6);
		const indicatorHeldList = [
			{ label: "질주", isHeld: indicatorSprintHeld },
			{ label: "점프", isHeld: indicatorJumpHeld },
			{ label: "상호작용", isHeld: indicatorInteractHeld },
		];
		uiGraphic.setFontString(`500 11px "Segoe UI", "Malgun Gothic", sans-serif`);
		uiGraphic.setTextAlign("center");
		uiGraphic.setTextBaseline("middle");
		let indicatorChipX = indicatorCenterX + 38;
		for (const indicatorItem of indicatorHeldList) {
			const chipWidth = indicatorItem.label.length > 2 ? 66 : 46;
			const chipRect = Rect.create(indicatorChipX, indicatorCenterY - 11, chipWidth, 22);
			uiGraphic.setFillColor(indicatorItem.isHeld ? "rgba(232, 186, 90, 0.85)" : "rgba(12, 20, 32, 0.5)");
			uiGraphic.drawRoundRect(chipRect, 11);
			uiGraphic.setStrokeColor(indicatorItem.isHeld ? "rgba(255, 236, 180, 0.9)" : "rgba(238, 240, 244, 0.2)");
			uiGraphic.drawStrokeRoundRect(chipRect, 11, 1);
			uiGraphic.setFillColor(indicatorItem.isHeld ? "rgba(20, 16, 8, 0.95)" : "rgba(238, 240, 244, 0.6)");
			uiGraphic.drawFillText(indicatorItem.label, indicatorChipX + chipWidth * 0.5, indicatorCenterY + 1);
			indicatorChipX += chipWidth + 8;
		}

		// 옵션 패널. (우측 상단)
		renderOptionPanel();

		// 인트로 페이드인. (자연 지형에 어울리는 아침 안개 톤)
		const introAlpha = 1 - System.Math.min(elapsedTime / 1.6, 1);
		if (introAlpha > 0.001) {
			const introRect = Rect.create(0, 0, cssWidth, cssHeight);
			uiGraphic.setFillColor(`rgba(206, 214, 200, ${introAlpha})`);
			uiGraphic.drawRect(introRect);
		}
	}
	let hintFadeStartTime = 8;

	//==============================================================================
	// 리사이즈.
	//==============================================================================
	function resizeCanvas() {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const displayWidth = System.Math.floor(canvas.clientWidth * devicePixelRatio);
		const displayHeight = System.Math.floor(canvas.clientHeight * devicePixelRatio);
		if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
			canvas.width = displayWidth;
			canvas.height = displayHeight;
			sceneRenderTarget.resize(displayWidth, displayHeight);
			bloomEffect.resize(displayWidth, displayHeight);
		}
	}

	//==============================================================================
	// 메인 루프.
	//==============================================================================
	const sunDirectionVector = Vector3.create(-0.42, 0.62, -0.35).normalize();
	skinnedModelRenderer.setSunDirection(sunDirectionVector.x, sunDirectionVector.y, sunDirectionVector.z);
	skinnedModelRenderer.setFogColor(0.8, 0.85, 0.92);
	skinnedModelRenderer.setFogRange(55, 250);
	const startTimestamp = System.performance.now();
	let previousTimestamp = startTimestamp;
	let hintFadeStarted = false;

	function renderFrame() {
		resizeCanvas();
		const currentTimestamp = System.performance.now();
		const elapsedTime = (currentTimestamp - startTimestamp) / 1000;
		const deltaTime = System.Math.min((currentTimestamp - previousTimestamp) / 1000, 0.1);
		previousTimestamp = currentTimestamp;
		const aspectRatio = canvas.width / canvas.height;

		// 입력 갱신.
		pollGamepad();
		if (hasAnyInputHappened && !hintFadeStarted) {
			hintFadeStarted = true;
			hintFadeStartTime = elapsedTime + 4;
		}

		// 카메라 회전 입력. (방향키 + 드래그 + 게임패드 오른스틱 — 목표값에 누적)
		let cameraYawVelocity = 0;
		let cameraPitchVelocity = 0;
		if (keyStateSet.has("ArrowRight")) {
			cameraYawVelocity += 1.3;
		}
		if (keyStateSet.has("ArrowLeft")) {
			cameraYawVelocity -= 1.3;
		}
		if (keyStateSet.has("ArrowUp")) {
			cameraPitchVelocity += 0.9;
		}
		if (keyStateSet.has("ArrowDown")) {
			cameraPitchVelocity -= 0.9;
		}
		cameraYawVelocity += gamepadCameraX * 1.8;
		cameraPitchVelocity -= gamepadCameraY * 1.3;
		cameraYawTarget += cameraYawVelocity * deltaTime + pendingDragYawDelta * 0.72;
		cameraPitchTarget += cameraPitchVelocity * deltaTime + pendingDragPitchDelta * 0.72;
		pendingDragYawDelta = 0;
		pendingDragPitchDelta = 0;
		cameraPitchTarget = System.Math.max(-0.78, System.Math.min(0.55, cameraPitchTarget));

		// 이동 중 카메라 소프트 팔로우. (달리는 방향 뒤로 천천히 따라붙되 수동 드래그가 우선)
		if (characterState === CharacterState.ground && currentMoveSpeed > 0.5 && cameraDragLastX === null) {
			let followYawDifference = characterYaw - cameraYawTarget;
			while (followYawDifference > System.Math.PI) {
				followYawDifference -= System.Math.PI * 2;
			}
			while (followYawDifference < -System.Math.PI) {
				followYawDifference += System.Math.PI * 2;
			}
			const followRate = 2.2 * System.Math.min(currentMoveSpeed / RUN_SPEED, 1);
			cameraYawTarget += followYawDifference * System.Math.min(followRate * deltaTime, 1);
		}

		// 등반 중 카메라 재정렬. (벽 정면을 바라보도록 부드럽게 복귀)
		if (characterState === CharacterState.climbAttach || characterState === CharacterState.climbing) {
			const recenterRate = characterState === CharacterState.climbAttach ? 10 : 2.2;
			let recenterYawDifference = characterYaw - cameraYawTarget;
			while (recenterYawDifference > System.Math.PI) {
				recenterYawDifference -= System.Math.PI * 2;
			}
			while (recenterYawDifference < -System.Math.PI) {
				recenterYawDifference += System.Math.PI * 2;
			}
			cameraYawTarget += recenterYawDifference * System.Math.min(recenterRate * deltaTime, 1);
			cameraPitchTarget += (0.28 - cameraPitchTarget) * System.Math.min(recenterRate * 0.8 * deltaTime, 1);
		}

		// 카메라 관성 추적. (실제 카메라가 목표를 묵직하게 뒤따르는 시네마틱 감)
		let cameraYawFollowDifference = cameraYawTarget - cameraYaw;
		while (cameraYawFollowDifference > System.Math.PI) {
			cameraYawFollowDifference -= System.Math.PI * 2;
		}
		while (cameraYawFollowDifference < -System.Math.PI) {
			cameraYawFollowDifference += System.Math.PI * 2;
		}
		cameraYaw += cameraYawFollowDifference * System.Math.min(7.5 * deltaTime, 1);
		cameraPitch += (cameraPitchTarget - cameraPitch) * System.Math.min(7.5 * deltaTime, 1);

		// 여우 위치 갱신. (충돌 판정에 앞서)
		updateFoxPositions(elapsedTime);

		// 캐릭터 갱신.
		updateCharacter(deltaTime, elapsedTime);

		// 모션 블러 강도 / 착지 충격 감쇠. (은은하게 켜지고 빠르게 꺼진다 — 왜곡 꼬리 방지 스냅 종료)
		let motionBlurTargetStrength = 0;
		if (characterState === CharacterState.jumpDown) {
			motionBlurTargetStrength = System.Math.min(System.Math.max(-jumpVelocityY, 0) / 26, 0.28);
		}
		motionBlurTargetStrength += landingImpulse * 0.2;
		motionBlurTargetStrength += System.Math.max(0, currentMoveSpeed - RUN_SPEED) / (SPRINT_SPEED - RUN_SPEED) * 0.03;
		const blurSmoothingRate = motionBlurTargetStrength > motionBlurCurrentStrength ? 10 : 16;
		motionBlurCurrentStrength += (motionBlurTargetStrength - motionBlurCurrentStrength) * System.Math.min(blurSmoothingRate * deltaTime, 1);
		if (motionBlurCurrentStrength < 0.02 && motionBlurTargetStrength < 0.01) {
			motionBlurCurrentStrength = 0;
		}
		landingImpulse -= landingImpulse * 5.5 * deltaTime;

		// 캐릭터 애니메이션 갱신. (클립 선택 + 조인트 오프셋 + 골격 계산)
		updateCharacterAnimation(deltaTime);

		// 여우 행렬 구성. (updateFoxPositions 에서 계산한 위치/방향 사용 — 같은 포즈를 여러 위치에 출력)
		foxModel.update(deltaTime);
		const foxMatrixList = [];
		for (const fox of FOX_LIST) {
			const foxMatrix = Matrix4.createTranslation(fox.currentX, fox.currentY, fox.currentZ);
			foxMatrix.rotateY(System.Math.PI - fox.currentYaw);
			foxMatrix.scale(fox.bodyScale, fox.bodyScale, fox.bodyScale);
			foxMatrixList.push(foxMatrix);
		}

		// 옵션 토글 / 패널 접힘 / 실시간 그림자 보간. (부드러운 트랜지션)
		for (const optionDefinition of optionDefinitions) {
			if (optionDefinition.type !== "toggle") {
				continue;
			}
			const optionTarget = optionStates[optionDefinition.name] ? 1 : 0;
			optionBlendValues[optionDefinition.name] += (optionTarget - optionBlendValues[optionDefinition.name]) * System.Math.min(7 * deltaTime, 1);
		}
		const collapseTarget = isPanelCollapsed ? 0 : 1;
		panelCollapseBlend += (collapseTarget - panelCollapseBlend) * System.Math.min(8 * deltaTime, 1);
		const shadowRealtimeTarget = optionStates.shadow === 2 ? 1 : 0;
		shadowRealtimeBlend += (shadowRealtimeTarget - shadowRealtimeBlend) * System.Math.min(7 * deltaTime, 1);

		// 숄더뷰 카메라. (어깨 오프셋 피벗 + 지형 차폐 회피)
		const cameraForwardX = System.Math.sin(cameraYaw) * System.Math.cos(cameraPitch);
		const cameraForwardY = System.Math.sin(cameraPitch);
		const cameraForwardZ = -System.Math.cos(cameraYaw) * System.Math.cos(cameraPitch);
		const cameraRightX = System.Math.cos(cameraYaw);
		const cameraRightZ = System.Math.sin(cameraYaw);
		const isClimbingState = characterState === CharacterState.climbAttach || characterState === CharacterState.climbing || characterState === CharacterState.climbCancel;
		const isAirState = characterState === CharacterState.jumpDown || characterState === CharacterState.landRecover;
		const pivotTargetY = playerY + (isClimbingState ? 2.0 : 1.55);
		const pivotFollowRate = isAirState ? 3.5 : 10;
		smoothedPivotY += (pivotTargetY - smoothedPivotY) * System.Math.min(pivotFollowRate * deltaTime, 1);
		const shoulderSideOffset = isClimbingState ? 0.15 : 0.55;
		const shoulderPivotX = playerX + cameraRightX * shoulderSideOffset;
		const cameraShakeOffset = System.Math.sin(elapsedTime * 55) * landingImpulse * 0.035;
		const shoulderPivotY = smoothedPivotY + cameraShakeOffset;
		const shoulderPivotZ = playerZ + cameraRightZ * shoulderSideOffset;
		let cameraDistanceTarget = 3.6;
		if (isClimbingState) {
			cameraDistanceTarget = 5.4;
		}
		else if (isAirState) {
			cameraDistanceTarget = 4.6;
		}

		// 상태별 카메라 거리 전환 스무딩. (착지/등반 종료 시 순간 줌 방지)
		smoothedCameraDistance += (cameraDistanceTarget - smoothedCameraDistance) * System.Math.min(3.2 * deltaTime, 1);
		const cameraDistance = smoothedCameraDistance;
		let cameraDistanceFactor = 1;
		for (let sampleIndex = 1; sampleIndex <= 24; ++sampleIndex) {
			const sampleFactor = sampleIndex / 24;
			const sampleX = shoulderPivotX - cameraForwardX * cameraDistance * sampleFactor;
			const sampleY = shoulderPivotY - cameraForwardY * cameraDistance * sampleFactor;
			const sampleZ = shoulderPivotZ - cameraForwardZ * cameraDistance * sampleFactor;
			const sampleGroundY = terrainSurfaceHeightAt(sampleX, sampleZ) + 0.26;
			if (sampleY < sampleGroundY) {
				cameraDistanceFactor = System.Math.max(sampleFactor - 0.05, 0.2);
				break;
			}
		}

		// 카메라 거리 스무딩. (막히면 빠르게 당겨지고, 풀리면 천천히 복귀 — 틱틱 끊김 방지)
		const distanceSmoothingRate = cameraDistanceFactor < smoothedCameraDistanceFactor ? 9 : 3;
		smoothedCameraDistanceFactor += (cameraDistanceFactor - smoothedCameraDistanceFactor) * System.Math.min(distanceSmoothingRate * deltaTime, 1);
		const cameraPositionX = shoulderPivotX - cameraForwardX * cameraDistance * smoothedCameraDistanceFactor;
		let cameraPositionY = shoulderPivotY - cameraForwardY * cameraDistance * smoothedCameraDistanceFactor;
		const cameraPositionZ = shoulderPivotZ - cameraForwardZ * cameraDistance * smoothedCameraDistanceFactor;
		const cameraGroundY = terrainSurfaceHeightAt(cameraPositionX, cameraPositionZ) + 0.3;
		cameraPositionY = System.Math.max(cameraPositionY, cameraGroundY);

		// 뷰 / 투영 행렬. (엔진 Matrix4 — 질주 시 화각 확장)
		const speedFactor = System.Math.min(currentMoveSpeed / RUN_SPEED, 1.6);
		const fieldOfViewRadian = ((55 + speedFactor * 4) * System.Math.PI) / 180;
		const cameraPosition = Vector3.create(cameraPositionX, cameraPositionY, cameraPositionZ);
		const cameraTarget = Vector3.create(cameraPositionX + cameraForwardX, cameraPositionY + cameraForwardY, cameraPositionZ + cameraForwardZ);
		const cameraUp = Vector3.up();
		const viewMatrix = Matrix4.createLookAt(cameraPosition, cameraTarget, cameraUp);
		const projectionMatrix = Matrix4.createPerspective(fieldOfViewRadian, aspectRatio, 0.1, 520);
		const viewProjectionMatrix = projectionMatrix.clone();
		viewProjectionMatrix.multiply(viewMatrix);
		const viewProjectionElements = viewProjectionMatrix.getElements();

		// 캐릭터 모델 행렬. (본 패스와 깊이 패스 공용 — Remy 는 로컬 +z 정면이라 -yaw + 180도, cm 스케일 축소)
		const characterModelMatrix = Matrix4.createTranslation(playerX, playerY, playerZ);
		characterModelMatrix.rotateY(-characterYaw + System.Math.PI);
		characterModelMatrix.scale(CHARACTER_MODEL_SCALE, CHARACTER_MODEL_SCALE, CHARACTER_MODEL_SCALE);
		const characterModelElements = characterModelMatrix.getElements();

		// 깃발천 행렬 목록. (본 패스와 깊이 패스 공용)
		const flagBannerList = [];
		for (let hillIndex = 0; hillIndex < HILL_LIST.length; ++hillIndex) {
			const hill = HILL_LIST[hillIndex];
			const bannerWave = System.Math.sin(elapsedTime * 2.6 + hillIndex * 1.7) * 0.24;
			const clearedPulse = System.Math.max(0, 1 - (elapsedTime - hill.clearedPulseTime) * 1.2);
			const bannerScale = 1 + clearedPulse * 0.6;
			const bannerMatrix = Matrix4.createTranslation(hill.summitX, hill.flagBaseHeight + FLAG_POLE_HEIGHT - 0.42, hill.summitZ);
			bannerMatrix.rotateY(bannerWave + hillIndex * 0.9);
			bannerMatrix.translate(0.62 * bannerScale, 0, 0);
			bannerMatrix.scale(1.15 * bannerScale, 0.6 * bannerScale, 0.05);
			const bannerColor = hill.cleared ? [1.0, 0.78, 0.2] : [0.78, 0.2, 0.16];
			flagBannerList.push({ matrix: bannerMatrix, color: bannerColor });
		}

		// === 0. 섀도우 맵 깊이 패스 (REALTIME 모드) ===
		const shadowDepthTexture = shadowMap.getDepthTexture();
		let lightViewProjectionElements = identityModelMatrix.getElements();
		if (shadowRealtimeBlend > 0.01) {
			const lightFocusPosition = Vector3.create(playerX + cameraForwardX * 12, playerY, playerZ + cameraForwardZ * 12);
			const lightTravelDirection = Vector3.create(-sunDirectionVector.x, -sunDirectionVector.y, -sunDirectionVector.z);
			shadowMap.updateLightMatrix(lightFocusPosition, lightTravelDirection, 48, 5, 260);
			const lightViewProjectionMatrix = shadowMap.getLightViewProjectionMatrix();
			lightViewProjectionElements = lightViewProjectionMatrix.getElements();
			shadowMap.beginRender();
			depthShaderProgram.use();
			webGL2RenderingContext.uniformMatrix4fv(depthLightViewProjectionLocation, false, lightViewProjectionElements);
			const identityElements = identityModelMatrix.getElements();

			// 지형.
			webGL2RenderingContext.uniformMatrix4fv(depthModelMatrixLocation, false, identityElements);
			webGL2RenderingContext.bindVertexArray(terrainVertexArray);
			webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, terrainIndexArray.length, webGL2RenderingContext.UNSIGNED_INT, 0);

			// 바위.
			for (const rock of rockList) {
				const rockModelElements = rock.matrix.getElements();
				webGL2RenderingContext.uniformMatrix4fv(depthModelMatrixLocation, false, rockModelElements);
				const rockVariant = rockVariantList[rock.variantIndex];
				webGL2RenderingContext.bindVertexArray(rockVariant.vertexArray);
				webGL2RenderingContext.drawArrays(webGL2RenderingContext.TRIANGLES, 0, rockVariant.vertexCount);
			}

			// 깃발.
			webGL2RenderingContext.bindVertexArray(cubeVertexArray);
			for (const hill of HILL_LIST) {
				const poleElements = hill.poleMatrix.getElements();
				webGL2RenderingContext.uniformMatrix4fv(depthModelMatrixLocation, false, poleElements);
				webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, cubeIndexCount, webGL2RenderingContext.UNSIGNED_SHORT, 0);
			}
			for (const flagBanner of flagBannerList) {
				const bannerElements = flagBanner.matrix.getElements();
				webGL2RenderingContext.uniformMatrix4fv(depthModelMatrixLocation, false, bannerElements);
				webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, cubeIndexCount, webGL2RenderingContext.UNSIGNED_SHORT, 0);
			}

			// 캐릭터 / 여우.
			skinnedModelRenderer.drawDepth(characterModel, lightViewProjectionElements, characterModelElements);
			for (const foxMatrix of foxMatrixList) {
				const foxElements = foxMatrix.getElements();
				skinnedModelRenderer.drawDepth(foxModel, lightViewProjectionElements, foxElements);
			}
			webGL2RenderingContext.bindVertexArray(null);
		}

		// 섀도우 맵 텍스처 바인드. (본 패스 공용 — 유닛 3)
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE3);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, shadowDepthTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		skinnedModelRenderer.setShadowMap(shadowDepthTexture, lightViewProjectionElements, 1 / SHADOWMAP_RESOLUTION);
		skinnedModelRenderer.setShadowStrength(shadowRealtimeBlend);

		// === 1. 씬 렌더 타겟 클리어 ===
		sceneRenderTarget.bind();
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.clearColor(0.8, 0.85, 0.92, 1);
		webGL2RenderingContext.clear(webGL2RenderingContext.COLOR_BUFFER_BIT | webGL2RenderingContext.DEPTH_BUFFER_BIT);

		// === 2. 하늘 (엔진 FullscreenPass) ===
		webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
		skyPass.use();
		const upBasisX = -System.Math.sin(cameraPitch) * System.Math.sin(cameraYaw);
		const upBasisY = System.Math.cos(cameraPitch);
		const upBasisZ = System.Math.sin(cameraPitch) * System.Math.cos(cameraYaw);
		webGL2RenderingContext.uniform3f(skyCameraRightLocation, cameraRightX, 0, cameraRightZ);
		webGL2RenderingContext.uniform3f(skyCameraUpLocation, upBasisX, upBasisY, upBasisZ);
		webGL2RenderingContext.uniform3f(skyCameraForwardLocation, cameraForwardX, cameraForwardY, cameraForwardZ);
		webGL2RenderingContext.uniform3f(skySunDirectionLocation, sunDirectionVector.x, sunDirectionVector.y, sunDirectionVector.z);
		const tangentHalfFieldOfView = System.Math.tan(fieldOfViewRadian / 2);
		webGL2RenderingContext.uniform1f(skyTangentHalfFieldOfViewLocation, tangentHalfFieldOfView);
		webGL2RenderingContext.uniform1f(skyAspectRatioLocation, aspectRatio);
		webGL2RenderingContext.uniform1f(skyElapsedTimeLocation, elapsedTime);
		skyPass.draw();

		// === 3. 지형 ===
		webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
		terrainShaderProgram.use();
		webGL2RenderingContext.bindVertexArray(terrainVertexArray);
		webGL2RenderingContext.uniformMatrix4fv(terrainViewProjectionLocation, false, viewProjectionElements);
		webGL2RenderingContext.uniform1i(terrainGrassTextureLocation, 0);
		webGL2RenderingContext.uniform1i(terrainRockTextureLocation, 1);
		webGL2RenderingContext.uniform1i(terrainDirtTextureLocation, 2);
		webGL2RenderingContext.uniform3f(terrainSunDirectionLocation, sunDirectionVector.x, sunDirectionVector.y, sunDirectionVector.z);
		webGL2RenderingContext.uniform3f(terrainCameraPositionLocation, cameraPositionX, cameraPositionY, cameraPositionZ);
		webGL2RenderingContext.uniform1f(terrainPathRadiusLocation, PATH_RADIUS);
		webGL2RenderingContext.uniformMatrix4fv(terrainLightViewProjectionLocation, false, lightViewProjectionElements);
		webGL2RenderingContext.uniform1i(terrainShadowMapTextureLocation, 3);
		webGL2RenderingContext.uniform1f(terrainShadowStrengthLocation, shadowRealtimeBlend);
		webGL2RenderingContext.uniform1f(terrainShadowTexelSizeLocation, 1 / SHADOWMAP_RESOLUTION);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, grassTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, rockTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE2);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, dirtTexture);
		webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, terrainIndexArray.length, webGL2RenderingContext.UNSIGNED_INT, 0);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);

		// === 4. 바위 (트라이플래너 볼더 텍스처) ===
		rockShaderProgram.use();
		webGL2RenderingContext.uniformMatrix4fv(rockViewProjectionLocation, false, viewProjectionElements);
		webGL2RenderingContext.uniform3f(rockSunDirectionLocation, sunDirectionVector.x, sunDirectionVector.y, sunDirectionVector.z);
		webGL2RenderingContext.uniform3f(rockCameraPositionLocation, cameraPositionX, cameraPositionY, cameraPositionZ);
		webGL2RenderingContext.uniform1i(rockBoulderTextureLocation, 0);
		webGL2RenderingContext.uniformMatrix4fv(rockLightViewProjectionLocation, false, lightViewProjectionElements);
		webGL2RenderingContext.uniform1i(rockShadowMapTextureLocation, 3);
		webGL2RenderingContext.uniform1f(rockShadowStrengthLocation, shadowRealtimeBlend);
		webGL2RenderingContext.uniform1f(rockShadowTexelSizeLocation, 1 / SHADOWMAP_RESOLUTION);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, boulderTexture);
		for (const rock of rockList) {
			const rockVariant = rockVariantList[rock.variantIndex];
			webGL2RenderingContext.bindVertexArray(rockVariant.vertexArray);
			const rockModelElements = rock.matrix.getElements();
			webGL2RenderingContext.uniformMatrix4fv(rockModelMatrixLocation, false, rockModelElements);
			webGL2RenderingContext.uniform3f(rockTintColorLocation, rock.tint[0], rock.tint[1], rock.tint[2]);
			webGL2RenderingContext.drawArrays(webGL2RenderingContext.TRIANGLES, 0, rockVariant.vertexCount);
		}

		// === 5. 오브젝트 (캐릭터 / 깃발) ===
		objectShaderProgram.use();
		webGL2RenderingContext.bindVertexArray(cubeVertexArray);
		webGL2RenderingContext.uniformMatrix4fv(objectViewProjectionLocation, false, viewProjectionElements);
		webGL2RenderingContext.uniform3f(objectSunDirectionLocation, sunDirectionVector.x, sunDirectionVector.y, sunDirectionVector.z);
		webGL2RenderingContext.uniform3f(objectCameraPositionLocation, cameraPositionX, cameraPositionY, cameraPositionZ);
		webGL2RenderingContext.uniformMatrix4fv(objectLightViewProjectionLocation, false, lightViewProjectionElements);
		webGL2RenderingContext.uniform1i(objectShadowMapTextureLocation, 3);
		webGL2RenderingContext.uniform1f(objectShadowStrengthLocation, shadowRealtimeBlend);
		webGL2RenderingContext.uniform1f(objectShadowTexelSizeLocation, 1 / SHADOWMAP_RESOLUTION);

		function drawCubeObject(modelMatrix, colorArray) {
			const modelElements = modelMatrix.getElements();
			webGL2RenderingContext.uniformMatrix4fv(objectModelMatrixLocation, false, modelElements);
			webGL2RenderingContext.uniform3f(objectColorLocation, colorArray[0], colorArray[1], colorArray[2]);
			webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, cubeIndexCount, webGL2RenderingContext.UNSIGNED_SHORT, 0);
		}

		// 깃발. (기둥 + 물결치는 깃발천, 정복 시 금색 + 펄스)
		for (const hill of HILL_LIST) {
			drawCubeObject(hill.poleMatrix, [0.82, 0.8, 0.74]);
		}
		for (const flagBanner of flagBannerList) {
			drawCubeObject(flagBanner.matrix, flagBanner.color);
		}

		// 캐릭터. (스킨드 모델)
		skinnedModelRenderer.draw(characterModel, viewProjectionElements, characterModelElements, cameraPositionX, cameraPositionY, cameraPositionZ);

		// 여우.
		for (const foxMatrix of foxMatrixList) {
			const foxElements = foxMatrix.getElements();
			skinnedModelRenderer.draw(foxModel, viewProjectionElements, foxElements, cameraPositionX, cameraPositionY, cameraPositionZ);
		}

		// === 6. 블롭 그림자 (SIMPLE 모드 — 정적: 바위/깃발 + 동적: 캐릭터) ===
		if (optionStates.shadow === 1) {
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFunc(webGL2RenderingContext.SRC_ALPHA, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
		webGL2RenderingContext.depthMask(false);
		shadowShaderProgram.use();
		webGL2RenderingContext.uniformMatrix4fv(shadowViewProjectionLocation, false, viewProjectionElements);
		webGL2RenderingContext.uniform1f(shadowStrengthLocation, 1);
		webGL2RenderingContext.bindVertexArray(staticShadowVertexArray);
		webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, staticShadowIndexCount, webGL2RenderingContext.UNSIGNED_SHORT, 0);
		const groundHeightUnderPlayer = terrainSurfaceHeightAt(playerX, playerZ);
		const heightAboveGround = playerY - groundHeightUnderPlayer;
		const shadowStrength = System.Math.max(0, 1 - heightAboveGround * 0.6);
		if (shadowStrength > 0.01) {
			shadowVertexData[0] = playerX;
			shadowVertexData[1] = terrainSurfaceHeightAt(playerX, playerZ) + 0.12;
			shadowVertexData[2] = playerZ;
			shadowVertexData[3] = 0.42;
			for (let segmentIndex = 0; segmentIndex < SHADOW_SEGMENT_COUNT; ++segmentIndex) {
				const segmentAngle = (segmentIndex / SHADOW_SEGMENT_COUNT) * System.Math.PI * 2;
				const segmentX = playerX + System.Math.cos(segmentAngle) * SHADOW_RADIUS;
				const segmentZ = playerZ + System.Math.sin(segmentAngle) * SHADOW_RADIUS;
				const segmentOffset = (segmentIndex + 1) * 4;
				shadowVertexData[segmentOffset + 0] = segmentX;
				shadowVertexData[segmentOffset + 1] = terrainSurfaceHeightAt(segmentX, segmentZ) + 0.12;
				shadowVertexData[segmentOffset + 2] = segmentZ;
				shadowVertexData[segmentOffset + 3] = 0;
			}
			webGL2RenderingContext.bindVertexArray(shadowVertexArray);
			webGL2RenderingContext.bindBuffer(webGL2RenderingContext.ARRAY_BUFFER, shadowVertexBuffer);
			webGL2RenderingContext.bufferSubData(webGL2RenderingContext.ARRAY_BUFFER, 0, shadowVertexData);
			webGL2RenderingContext.uniform1f(shadowStrengthLocation, shadowStrength);
			webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, shadowIndexCount, webGL2RenderingContext.UNSIGNED_SHORT, 0);
		}
		webGL2RenderingContext.depthMask(true);
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		}

		// === 7. 블룸 (엔진 BloomEffect) ===
		const sceneColorTexture = sceneRenderTarget.getColorTexture();
		bloomEffect.render(sceneColorTexture);

		// === 8. 최종 합성 → 화면 (블룸 가산 + 모션 블러 + 비네트 + 그레인 + ACES) ===
		webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
		webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
		compositePass.use();
		webGL2RenderingContext.uniform1i(compositeSceneTextureLocation, 0);
		webGL2RenderingContext.uniform1i(compositeBloomTextureLocation, 1);
		webGL2RenderingContext.uniform2f(compositeResolutionLocation, canvas.width, canvas.height);
		webGL2RenderingContext.uniform1f(compositeElapsedTimeLocation, elapsedTime);
		webGL2RenderingContext.uniform1f(compositeBloomStrengthLocation, optionBlendValues.bloom * sliderValues.glow * 0.9);
		webGL2RenderingContext.uniform1f(compositeMotionBlurStrengthLocation, motionBlurCurrentStrength * sliderValues.motionBlur * 1.2);
		let motionBlurCenterX = 0.5;
		let motionBlurCenterY = 0.5;
		const motionBlurClip = viewProjectionMatrix.transformPoint(playerX, playerY + 1.0, playerZ);
		if (motionBlurClip.w > 0.001) {
			motionBlurCenterX = (motionBlurClip.x / motionBlurClip.w) * 0.5 + 0.5;
			motionBlurCenterY = (motionBlurClip.y / motionBlurClip.w) * 0.5 + 0.5;
		}
		webGL2RenderingContext.uniform2f(compositeMotionBlurCenterLocation, motionBlurCenterX, motionBlurCenterY);
		webGL2RenderingContext.uniform1f(compositeVignetteStrengthLocation, optionBlendValues.vignette);
		webGL2RenderingContext.uniform1f(compositeFilmStrengthLocation, optionBlendValues.film);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, sceneColorTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		const bloomResultTexture = bloomEffect.getResultTexture();
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, bloomResultTexture);
		compositePass.draw();
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);

		// === 9. HUD (엔진 Graphic — 프리멀티플라이드 알파 블렌딩 보장) ===
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFunc(webGL2RenderingContext.ONE, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
		renderHud(viewProjectionMatrix, elapsedTime, deltaTime);
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);

		// 프레임 눌림 플래그 초기화.
		jumpPressed = false;
		interactPressed = false;

		System.window.requestAnimationFrame(renderFrame);
	}

	System.window.requestAnimationFrame(renderFrame);
	</script>
