		webGL2RenderingContext.uniform1i(shaderProgram.getUniformLocation("isSeeThrough"), isSeeThroughPass ? 1 : 0);
		webGL2RenderingContext.uniform1f(shaderProgram.getUniformLocation("seeThroughAlpha"), frame.seeThroughAlpha);

		const jointMatricesLocation = shaderProgram.getUniformLocation("jointMatrices[0]");
		const materialTypeLocation = shaderProgram.getUniformLocation("materialType");
		const shadeColorLocation = shaderProgram.getUniformLocation("shadeColor");
		const useAlphaTestLocation = shaderProgram.getUniformLocation("useAlphaTest");
		let drawCount = 0;
		for (const info of drawableInfoList) {
			if (isSeeThroughPass && !info.isSeeThroughPart) {
				continue;
			}
			webGL2RenderingContext.uniformMatrix4fv(jointMatricesLocation, false, skinList[info.drawable.skinIndex].jointMatrixArray);
			toonRenderer.applyMorphUniforms(shaderProgram, info.drawable);
			info.drawable.material.apply();
			webGL2RenderingContext.uniform1i(materialTypeLocation, info.materialType);
			webGL2RenderingContext.uniform3f(shadeColorLocation, info.shadeColor[0], info.shadeColor[1], info.shadeColor[2]);
			webGL2RenderingContext.uniform1i(useAlphaTestLocation, info.useAlphaTest ? 1 : 0);

		webGL2RenderingContext.bindVertexArray(null);

	}

	// 아웃라인 패스. (뒤집힌 껍질 — 앞면 컬링)
	function drawOutlinePass(frame) {
		outlineProgram.use();
		webGL2RenderingContext.uniformMatrix4fv(outlineProgram.getUniformLocation("viewProjectionMatrix"), false, frame.viewProjectionElements);
		webGL2RenderingContext.uniformMatrix4fv(outlineProgram.getUniformLocation("modelMatrix"), false, frame.modelElements);
		webGL2RenderingContext.uniformMatrix4fv(outlineProgram.getUniformLocation("viewMatrix"), false, frame.viewElements);
		webGL2RenderingContext.uniform2f(outlineProgram.getUniformLocation("screenResolution"), sceneRenderTarget.getWidth(), sceneRenderTarget.getHeight());
		webGL2RenderingContext.uniform1f(outlineProgram.getUniformLocation("projectionScaleY"), frame.projectionScaleY);
		webGL2RenderingContext.uniform2f(outlineProgram.getUniformLocation("outlinePixelRange"), sliderStates.outlineMinimum, System.Math.max(sliderStates.outlineMinimum, sliderStates.outlineMaximum));
		webGL2RenderingContext.uniform1f(outlineProgram.getUniformLocation("outlineTint"), sliderStates.outlineTint);
		webGL2RenderingContext.uniform1f(outlineProgram.getUniformLocation("outlineBrightness"), sliderStates.outlineBrightness);
		const jointMatricesLocation = outlineProgram.getUniformLocation("jointMatrices[0]");
		const outlineWidthLocation = outlineProgram.getUniformLocation("outlineWidth");
		const useOutlineMaskLocation = outlineProgram.getUniformLocation("useOutlineMask");
		const outlineColorLocation = outlineProgram.getUniformLocation("outlineColorFactor");
		let drawCount = 0;
		for (const info of drawableInfoList) {
			if (info.outlineWidth <= 0) {
				continue;
			}
			webGL2RenderingContext.uniformMatrix4fv(jointMatricesLocation, false, skinList[info.drawable.skinIndex].jointMatrixArray);
			toonRenderer.applyMorphUniforms(outlineProgram, info.drawable);
			bindMaterialTextures(outlineProgram, info.drawable.material);
			webGL2RenderingContext.uniform1f(outlineWidthLocation, info.outlineWidth * sliderStates.outlineWidth);
			webGL2RenderingContext.uniform1i(useOutlineMaskLocation, info.useOutlineMask ? 1 : 0);
			webGL2RenderingContext.uniform3f(outlineColorLocation, info.outlineColor[0], info.outlineColor[1], info.outlineColor[2]);
			drawDrawable(info.drawable);
			drawCount += 1;
		}
		webGL2RenderingContext.bindVertexArray(null);
		return drawCount;
	}

	// 바닥.
	function drawFloor(frame) {
		floorProgram.use();
		webGL2RenderingContext.uniformMatrix4fv(floorProgram.getUniformLocation("viewProjectionMatrix"), false, frame.viewProjectionElements);
		bindShadowMap(floorProgram, frame.lightViewProjectionElements);
		webGL2RenderingContext.uniform3f(floorProgram.getUniformLocation("backgroundColor"), 0.014, 0.013, 0.016);
		webGL2RenderingContext.uniform3f(floorProgram.getUniformLocation("glowColor"), 0.085, 0.07, 0.05);
		webGL2RenderingContext.uniform2f(floorProgram.getUniformLocation("screenResolution"), sceneRenderTarget.getWidth(), sceneRenderTarget.getHeight());
		webGL2RenderingContext.uniform1f(floorProgram.getUniformLocation("aspectRatio"), frame.aspectRatio);
		webGL2RenderingContext.uniform3f(floorProgram.getUniformLocation("floorColor"), 0.03, 0.028, 0.03);
		webGL2RenderingContext.uniform3f(floorProgram.getUniformLocation("ringColor"), 0.62, 0.48, 0.24);
		webGL2RenderingContext.uniform1f(floorProgram.getUniformLocation("ringRadius"), 0.78);
		webGL2RenderingContext.bindVertexArray(floorVertexArray);
		webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, 6, webGL2RenderingContext.UNSIGNED_SHORT, 0);
		webGL2RenderingContext.bindVertexArray(null);
	}

	//==============================================================================
	// GPU 패스 타이머 / 통계 / HUD.
	//==============================================================================
	const timerExtension = webGL2RenderingContext.getExtension("EXT_disjoint_timer_query_webgl2");
	const passTimer = { current: null, pendingList: [], milliseconds: {} };
	function beginPass(passName) {
		if (!timerExtension || passTimer.current) {
			return;
		}
		const query = webGL2RenderingContext.createQuery();
		webGL2RenderingContext.beginQuery(timerExtension.TIME_ELAPSED_EXT, query);
		passTimer.current = { name: passName, query: query };
	}
	function endPass() {
		if (!timerExtension || !passTimer.current) {
			return;
		}
		webGL2RenderingContext.endQuery(timerExtension.TIME_ELAPSED_EXT);
		passTimer.pendingList.push(passTimer.current);
		passTimer.current = null;
	}
	function pollPassTimers() {
		if (!timerExtension) {
			return;
		}
		const disjoint = webGL2RenderingContext.getParameter(timerExtension.GPU_DISJOINT_EXT);
		const remainingList = [];
		for (const pending of passTimer.pendingList) {
			const isAvailable = webGL2RenderingContext.getQueryParameter(pending.query, webGL2RenderingContext.QUERY_RESULT_AVAILABLE);
			if (!isAvailable) {
				remainingList.push(pending);
				continue;
			}
			if (!disjoint) {
				const nanoseconds = webGL2RenderingContext.getQueryParameter(pending.query, webGL2RenderingContext.QUERY_RESULT);
				const previous = passTimer.milliseconds[pending.name] !== undefined ? passTimer.milliseconds[pending.name] : nanoseconds / 1e6;
				passTimer.milliseconds[pending.name] = previous * 0.9 + (nanoseconds / 1e6) * 0.1;
			}
			webGL2RenderingContext.deleteQuery(pending.query);
		}
		passTimer.pendingList = remainingList;
	}
	function formatPassTime(passName) {
		const milliseconds = passTimer.milliseconds[passName];
		return milliseconds !== undefined ? milliseconds.toFixed(2) + " ms" : "n/a";
	}
	function formatMegabytes(bytes) {
		return (bytes / 1048576).toFixed(0) + " MB";
	}
	// GPU 메모리 추정. (문서 이미지 밉 포함 + 메시 배열 + 모프 텍스처 + 렌더 타겟 + 섀도우 맵)
	function estimateGpuMemoryBytes() {
		let bytes = 0;
		for (const image of vrmDocument.images) {
			const bufferView = vrmDocument.bufferViews[image.bufferView];
			bytes += bufferView.byteLength * 6;
		}
		for (const drawable of drawableList) {
			const meshDescription = drawable.meshDescription;
			for (const arrayName of ["positions", "normals", "textureCoordinates", "joints", "weights", "indices"]) {
				const array = meshDescription[arrayName];
				if (array && array.byteLength) {
					bytes += array.byteLength;
				}
			}
			if (drawable.morphTexture) {
				bytes += drawable.morphTextureWidth * drawable.morphRowsPerTarget * 2 * drawable.morphTargetList.length * 16;
			}
		}
		const renderPixels = sceneRenderTarget.getWidth() * sceneRenderTarget.getHeight();
		bytes += renderPixels * (8 * 2 + 4);
		bytes += renderPixels * (4 + 4);
		bytes += renderPixels * 4;
		bytes += renderPixels * 0.25 * 8 * 3;
		bytes += SHADOWMAP_RESOLUTION * SHADOWMAP_RESOLUTION * 4;
		return bytes;
	}
	const statistics = {
		smoothedFrameSeconds: 1 / 60,
		drawCallCount: 0,
		cpuFrameMilliseconds: 0,
		optionMaximumHeight: 0,
		memorySampleTime: -1e9,
		gpuMemoryBytes: 0,
		gpuMemoryText: "",
		jsHeapBytes: 0,
		jsHeapText: "",
	};
	const homeLinkElement = System.document.getElementById("homeLink");
	function updatePanelLimits(hudTop) {
		const optionMaximumHeight = System.Math.max(120, hudTop - 18 - 12);
		if (statistics.optionMaximumHeight !== optionMaximumHeight) {
			statistics.optionMaximumHeight = optionMaximumHeight;
			optionPanelElement.style.maxHeight = optionMaximumHeight + "px";
		}
	}
	function renderHud() {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const cssWidth = System.window.innerWidth;
		const cssHeight = System.window.innerHeight;
		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio, devicePixelRatio);
		uiGraphic.setGlobalAlpha(1);
		const hudTimestamp = System.performance.now();
		if (hudTimestamp - statistics.memorySampleTime >= 1000) {
			statistics.memorySampleTime = hudTimestamp;
			const gpuMemoryBytes = estimateGpuMemoryBytes();
			if (System.Math.abs(gpuMemoryBytes - statistics.gpuMemoryBytes) > statistics.gpuMemoryBytes * 0.05) {
				statistics.gpuMemoryBytes = gpuMemoryBytes;
				statistics.gpuMemoryText = formatMegabytes(gpuMemoryBytes);
			}
			if (System.performance.memory) {
				const usedHeapBytes = System.performance.memory.usedJSHeapSize;
				if (System.Math.abs(usedHeapBytes - statistics.jsHeapBytes) > statistics.jsHeapBytes * 0.05) {
					statistics.jsHeapBytes = usedHeapBytes;
					statistics.jsHeapText = formatMegabytes(usedHeapBytes) + " / " + formatMegabytes(System.performance.memory.jsHeapSizeLimit);
				}
			}
		}
		const rowHeight = 16;
		const rows = [
			["fps", System.Math.round(1 / System.Math.max(statistics.smoothedFrameSeconds, 0.0001)).toString()],
			["display", canvas.width + " x " + canvas.height],
			["render buffer", sceneRenderTarget.getWidth() + " x " + sceneRenderTarget.getHeight()],
			["triangles", System.Math.round(triangleCount).toLocaleString("en-US")],
			["vertices", vertexCount.toLocaleString("en-US")],
			["draw calls", statistics.drawCallCount.toString()],
			["morph targets", morphTargetCount.toString()],
			["spring joints", springJointList.length.toString()],
			["cpu frame", statistics.cpuFrameMilliseconds.toFixed(2) + " ms"],
		];
		if (timerExtension) {
			rows.push(["gpu shadow + hair", formatPassTime("shadow")]);
			rows.push(["gpu scene", formatPassTime("scene")]);
			rows.push(["gpu post", formatPassTime("post")]);
		}
		rows.push(["gpu memory (est.)", statistics.gpuMemoryText]);
		if (System.performance.memory) {
			rows.push(["js heap", statistics.jsHeapText]);
		}
		const isNarrowScreen = cssWidth < 640;
		if (isNarrowScreen) {
			rows.length = System.Math.min(rows.length, 4);
		}
		const panelWidth = isNarrowScreen ? 150 : 214;
		const panelHeight = rows.length * rowHeight + 18;
		const panelX = cssWidth - panelWidth - 18;
		let panelY = cssHeight - panelHeight - 18;
		const homeLinkRect = homeLinkElement.getBoundingClientRect();
		const isOverlappingHomeLink = homeLinkRect.right > panelX && homeLinkRect.top < panelY + panelHeight;
		if (isOverlappingHomeLink) {
			panelY = homeLinkRect.top - panelHeight - 12;
		}
		updatePanelLimits(panelY);
		const panelRect = Rect.create(panelX, panelY, panelWidth, panelHeight);
		uiGraphic.setFillColor("rgba(14, 12, 14, 0.55)");
		uiGraphic.drawRoundRect(panelRect, 10);
		uiGraphic.setStrokeColor("rgba(242, 236, 226, 0.14)");
		uiGraphic.drawStrokeRoundRect(panelRect, 10, 1);
		uiGraphic.setFontString(`400 10.5px "Segoe UI", "Malgun Gothic", sans-serif`);
		uiGraphic.setTextBaseline("middle");
		for (let rowIndex = 0; rowIndex < rows.length; ++rowIndex) {
			const rowY = panelY + 9 + rowHeight * rowIndex + rowHeight * 0.5;
			uiGraphic.setTextAlign("left");
			uiGraphic.setFillColor("rgba(242, 236, 226, 0.45)");
			uiGraphic.drawFillText(rows[rowIndex][0], panelX + 14, rowY);
			uiGraphic.setTextAlign("right");
			uiGraphic.setFillColor("rgba(242, 236, 226, 0.88)");
			uiGraphic.drawFillText(rows[rowIndex][1], panelX + panelWidth - 14, rowY);
		}
	}

	//==============================================================================
	// 메인 루프. (포즈 / 스프링 → 섀도우 깊이 → 머리카락 깊이 → 배경 / 바닥 / 셀 셰이딩 MRT → 아웃라인 → 앞머리 비침 → 블룸 → 림 + 톤 매핑 → FXAA → 와이어프레임 → HUD)
	//==============================================================================
	const startTimestamp = System.performance.now();
	let previousTimestamp = startTimestamp;
	const frameLimiter = { nextFrameDue: startTimestamp };
	let turntableAngle = 0;

	function renderFrame() {
		const targetFrameRate = FRAME_RATE_OPTIONS[sliderStates.frameRate];
		const frameInterval = 1000 / targetFrameRate;
		const nowTimestamp = System.performance.now();
		if (nowTimestamp < frameLimiter.nextFrameDue - 6) {
			System.window.requestAnimationFrame(renderFrame);
			return;
		}
		frameLimiter.nextFrameDue = nowTimestamp - frameLimiter.nextFrameDue > frameInterval ? nowTimestamp + frameInterval : frameLimiter.nextFrameDue + frameInterval;
		const cpuFrameStart = nowTimestamp;
		resizeCanvas();
		const elapsedTime = (nowTimestamp - startTimestamp) / 1000;
		const deltaTime = System.Math.min((nowTimestamp - previousTimestamp) / 1000, 0.1);
		previousTimestamp = nowTimestamp;
		statistics.smoothedFrameSeconds = statistics.smoothedFrameSeconds * 0.92 + deltaTime * 0.08;
		const aspectRatio = canvas.width / canvas.height;
		let drawCallCount = 0;

		// 턴테이블. (모델 행렬 — 스프링 본은 이 회전을 포함한 월드에서 돈다)
		if (optionStates.turntable) {
			turntableAngle += deltaTime * sliderStates.turntableSpeed;
		}
		modelMatrix = Matrix4.createRotationY(turntableAngle);
		modelRotation = quaternionFromAxisAngle(makeVector(0, 1, 0), turntableAngle);
		const modelElements = modelMatrix.getElements();

		// 카메라. (목표값 지수 접근 + 미세한 자동 흔들림)
		const cameraApproach = System.Math.min(1, deltaTime * 5);
		cameraState.yaw += (cameraState.targetYaw - cameraState.yaw) * cameraApproach;
		cameraState.pitch += (cameraState.targetPitch - cameraState.pitch) * cameraApproach;
		cameraState.distance += (cameraState.targetDistance - cameraState.distance) * cameraApproach;
		cameraState.focusHeight += (cameraState.targetFocusHeight - cameraState.focusHeight) * cameraApproach;
		const swayYaw = cameraState.yaw + System.Math.sin(elapsedTime * 0.19) * 0.015;
		const swayPitch = cameraState.pitch + System.Math.sin(elapsedTime * 0.27 + 1) * 0.008;
		const portraitFactor = aspectRatio < 1.2 ? System.Math.pow(1.2 / aspectRatio, 0.55) : 1;
		const cameraDistance = cameraState.distance * portraitFactor;
		const cameraTarget = Vector3.create(0, cameraState.focusHeight, 0);
		const cameraX = cameraTarget.x + System.Math.sin(swayYaw) * System.Math.cos(swayPitch) * cameraDistance;
		const cameraY = cameraTarget.y + System.Math.sin(swayPitch) * cameraDistance;
		const cameraZ = cameraTarget.z + System.Math.cos(swayYaw) * System.Math.cos(swayPitch) * cameraDistance;
		const cameraPosition = Vector3.create(cameraX, cameraY, cameraZ);
		const viewMatrix = Matrix4.createLookAt(cameraPosition, cameraTarget, Vector3.up());
		const projectionMatrix = Matrix4.createPerspective(CAMERA_FIELD_OF_VIEW, aspectRatio, CAMERA_NEAR_DISTANCE, CAMERA_FAR_DISTANCE);
		const viewProjectionMatrix = projectionMatrix.clone();
		viewProjectionMatrix.multiply(viewMatrix);
		const viewProjectionElements = viewProjectionMatrix.getElements();
		const viewElements = viewMatrix.getElements();
		const projectionScaleY = projectionMatrix.getElements()[5];

		// 조명. (방위 / 고도 → 빛을 향하는 방향, 따뜻함 → 색)
		const lightDirection = vectorNormalize(makeVector(
			System.Math.sin(sliderStates.lightAzimuth) * System.Math.cos(sliderStates.lightElevation),
			System.Math.sin(sliderStates.lightElevation),
			System.Math.cos(sliderStates.lightAzimuth) * System.Math.cos(sliderStates.lightElevation)));
		const warmth = sliderStates.lightWarmth;
		const lightColor = [1, 1 - 0.1 * warmth, 1 - 0.26 * warmth];
		const lightView = viewMatrix.transformDirection(lightDirection.x, lightDirection.y, lightDirection.z);
		const lightScreenLength = System.Math.max(System.Math.sqrt(lightView.x * lightView.x + lightView.y * lightView.y), 0.0001);
		const lightScreenDirection = { x: lightView.x / lightScreenLength, y: lightView.y / lightScreenLength };

		rebakeNormals(optionStates.faceShadow ? sliderStates.faceFlatten : 0, sliderStates.hairSmooth);

		// 표정 / 머리 / 시선 / 제약 / 스프링 → 스키닝 갱신. (직전 프레임 월드 행렬 기준으로 오프셋을 정하고 한 번 갱신한다)
		updateExpressions(elapsedTime, deltaTime);
		updateHeadAndEyes(elapsedTime, deltaTime, makeVector(cameraX, cameraY, cameraZ));
		updateConstraints();
		if (optionStates.springBones) {
			updateSpringBones(deltaTime);
		}
		else {
			resetSpringBones();
		}
		model.update(deltaTime);
		const headFrame = getHeadFrame();
		headForwardWorld = rotateVector(modelRotation, headFrame.forward);
		headPositionWorld = transformPoint(modelMatrix, headFrame.position);
		const facing = vectorDot(headForwardWorld, vectorNormalize(vectorSubtract(makeVector(cameraX, cameraY, cameraZ), headPositionWorld)));
		const seeThroughAlpha = optionStates.seeThrough ? 0.42 * clampValue((facing - 0.25) / 0.3, 0, 1) : 0;

		const renderWidth = sceneRenderTarget.getWidth();
		const renderHeight = sceneRenderTarget.getHeight();
		pollPassTimers();

		// === 1. 섀도우 깊이 패스 (키 라이트) + 머리카락 깊이 패스 (카메라) ===
		beginPass("shadow");
		webGL2RenderingContext.disable(webGL2RenderingContext.CULL_FACE);
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		const lightTravelDirection = Vector3.create(-lightDirection.x, -lightDirection.y, -lightDirection.z);
		shadowMap.updateLightMatrix(Vector3.create(0, 0.82, 0), lightTravelDirection, 1.25, 0.1, 8);
		const lightViewProjectionElements = shadowMap.getLightViewProjectionMatrix().getElements();
		shadowMap.beginRender();
		if (sliderStates.shadowStrength > 0.001) {
			toonRenderer.drawDepth(model, lightViewProjectionElements, modelElements);
			drawCallCount += drawableList.length;
		}
		hairDepthRenderTarget.bind();
		webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
		webGL2RenderingContext.depthMask(true);
		webGL2RenderingContext.depthFunc(webGL2RenderingContext.LESS);
		webGL2RenderingContext.clearColor(0, 0, 0, 0);
		webGL2RenderingContext.clear(webGL2RenderingContext.COLOR_BUFFER_BIT | webGL2RenderingContext.DEPTH_BUFFER_BIT);
		drawCallCount += drawHairDepth(viewProjectionElements, modelElements);
		endPass();

		const frame = {
			viewProjectionElements: viewProjectionElements,
			viewElements: viewElements,
			modelElements: modelElements,
			lightViewProjectionElements: lightViewProjectionElements,
			cameraPosition: { x: cameraX, y: cameraY, z: cameraZ },
			lightDirection: lightDirection,
			lightColor: lightColor,
			lightScreenDirection: lightScreenDirection,
			projectionScaleY: projectionScaleY,
			seeThroughAlpha: seeThroughAlpha,
			aspectRatio: aspectRatio,
		};

		// === 2. 씬 MRT (배경 → 바닥 → 셀 셰이딩 → 아웃라인 → 앞머리 비침) ===
		beginPass("scene");
		sceneRenderTarget.bind();
		webGL2RenderingContext.drawBuffers([webGL2RenderingContext.COLOR_ATTACHMENT0, webGL2RenderingContext.COLOR_ATTACHMENT1]);
		webGL2RenderingContext.clearColor(0, 0, 0, 0);
		webGL2RenderingContext.clear(webGL2RenderingContext.COLOR_BUFFER_BIT | webGL2RenderingContext.DEPTH_BUFFER_BIT);
		webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
		backgroundPass.use();
		webGL2RenderingContext.uniform1f(backgroundPass.getUniformLocation("aspectRatio"), aspectRatio);
		webGL2RenderingContext.uniform3f(backgroundPass.getUniformLocation("backgroundColor"), 0.014, 0.013, 0.016);
		webGL2RenderingContext.uniform3f(backgroundPass.getUniformLocation("glowColor"), 0.085, 0.07, 0.05);
		backgroundPass.draw();
		drawCallCount += 1;
		webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
		webGL2RenderingContext.depthMask(true);
		drawFloor(frame);
		drawCallCount += 1;
		drawCallCount += drawToonPass(frame, false);
		if (optionStates.outline && sliderStates.outlineWidth > 0) {
			webGL2RenderingContext.enable(webGL2RenderingContext.CULL_FACE);
			webGL2RenderingContext.cullFace(webGL2RenderingContext.FRONT);
			drawCallCount += drawOutlinePass(frame);
			webGL2RenderingContext.disable(webGL2RenderingContext.CULL_FACE);
		}
		if (seeThroughAlpha > 0.001) {
			webGL2RenderingContext.drawBuffers([webGL2RenderingContext.COLOR_ATTACHMENT0, webGL2RenderingContext.NONE]);
			webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
			webGL2RenderingContext.blendFunc(webGL2RenderingContext.SRC_ALPHA, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
			webGL2RenderingContext.depthMask(false);
			webGL2RenderingContext.depthFunc(webGL2RenderingContext.GREATER);
			drawCallCount += drawToonPass(frame, true);
			webGL2RenderingContext.depthFunc(webGL2RenderingContext.LESS);
			webGL2RenderingContext.depthMask(true);
			webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
			webGL2RenderingContext.drawBuffers([webGL2RenderingContext.COLOR_ATTACHMENT0, webGL2RenderingContext.COLOR_ATTACHMENT1]);
		}
		webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
		endPass();

		// === 3. 블룸 ===
		beginPass("post");
		const sceneColorTexture = sceneRenderTarget.getColorTexture(0);
		bloomEffect.setThreshold(sliderStates.bloomThreshold, sliderStates.bloomThreshold + 0.85);
		if (optionStates.bloom) {
			bloomEffect.render(sceneColorTexture);
			drawCallCount += 1 + bloomEffect.getIterationCount() * 2;
		}

		// === 4. 림 + 톤 매핑 합성 → LDR (FXAA 켜짐) 또는 화면 ===
		const useAntialias = sliderStates.antialias > 0;
		if (useAntialias) {
			ldrRenderTarget.bind();
		}
		else {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
		}
		compositePass.use();
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("sceneTexture"), 0);
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("normalTexture"), 1);
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("depthTexture"), 2);
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("bloomTexture"), 3);
		webGL2RenderingContext.uniform2f(compositePass.getUniformLocation("resolution"), renderWidth, renderHeight);
		webGL2RenderingContext.uniform2f(compositePass.getUniformLocation("cameraPlanes"), CAMERA_NEAR_DISTANCE, CAMERA_FAR_DISTANCE);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("exposure"), sliderStates.exposure);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("bloomStrength"), optionStates.bloom ? sliderStates.bloomStrength : 0);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("vignetteStrength"), sliderStates.vignette);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("saturation"), sliderStates.saturation);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("contrast"), sliderStates.contrast);
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("useRim"), optionStates.rim ? 1 : 0);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("rimWidth"), sliderStates.rimWidth * renderHeight / 1080);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("rimThreshold"), sliderStates.rimThreshold);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("rimStrength"), sliderStates.rimStrength);
		webGL2RenderingContext.uniform3f(compositePass.getUniformLocation("rimColor"), lightColor[0], lightColor[1], lightColor[2]);
		webGL2RenderingContext.uniform2f(compositePass.getUniformLocation("rimLightScreenDirection"), lightScreenDirection.x, lightScreenDirection.y);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, sceneColorTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, sceneRenderTarget.getColorTexture(1));
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE2);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, sceneRenderTarget.getDepthTexture());
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE3);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, optionStates.bloom ? bloomEffect.getResultTexture() : sceneColorTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		compositePass.draw();
		drawCallCount += 1;
		// 유닛 1 은 다음 프레임에 섀도우 맵이 쓴다. (일반 텍스처가 남아 있으면 비교 샘플러와 어긋난다)
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, null);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE2);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, null);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);

		// === 5. FXAA (+ 샤픈) → 화면 ===
		if (useAntialias) {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
			antialiasPass.use();
			webGL2RenderingContext.uniform1i(antialiasPass.getUniformLocation("sourceTexture"), 0);
			webGL2RenderingContext.uniform2f(antialiasPass.getUniformLocation("texelSize"), 1 / renderWidth, 1 / renderHeight);
			webGL2RenderingContext.uniform1f(antialiasPass.getUniformLocation("sharpenStrength"), sliderStates.antialias >= 2 ? 0.5 : 0);
			webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, ldrRenderTarget.getColorTexture());
			antialiasPass.draw();
			drawCallCount += 1;
		}
		endPass();

		// === 6. 와이어프레임 (화면 깊이 프리패스로 앞면 모서리만 — 모프 / 스키닝 반영) ===
		if (optionStates.wireframe) {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
			webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
			webGL2RenderingContext.depthMask(true);
			webGL2RenderingContext.clear(webGL2RenderingContext.DEPTH_BUFFER_BIT);
			webGL2RenderingContext.colorMask(false, false, false, false);
			webGL2RenderingContext.enable(webGL2RenderingContext.POLYGON_OFFSET_FILL);
			webGL2RenderingContext.polygonOffset(1.5, 2);
			toonRenderer.drawDepth(model, viewProjectionElements, modelElements);
			webGL2RenderingContext.disable(webGL2RenderingContext.POLYGON_OFFSET_FILL);
			webGL2RenderingContext.colorMask(true, true, true, true);
			webGL2RenderingContext.depthMask(false);
			webGL2RenderingContext.depthFunc(webGL2RenderingContext.LEQUAL);
			webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
			webGL2RenderingContext.blendFunc(webGL2RenderingContext.SRC_ALPHA, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
			toonRenderer.drawWireframe(model, viewProjectionElements, modelElements, 0.91, 0.79, 0.54, 0.55);
			webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
			webGL2RenderingContext.depthMask(true);
			webGL2RenderingContext.depthFunc(webGL2RenderingContext.LESS);
			webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
			drawCallCount += 2;
		}

		// === 7. HUD (엔진 Graphic — 프리멀티플라이드 알파 블렌딩) ===
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFunc(webGL2RenderingContext.ONE, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
		statistics.drawCallCount = drawCallCount;
		if (optionStates.hud) {
			renderHud();
		}
		else {
			updatePanelLimits(System.window.innerHeight - 18);
		}
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		statistics.cpuFrameMilliseconds = statistics.cpuFrameMilliseconds * 0.9 + (System.performance.now() - cpuFrameStart) * 0.1;

		System.window.requestAnimationFrame(renderFrame);
	}

	{
		const restHeadFrame = getHeadFrame();
		bakeState.faceCenter = makeVector(restHeadFrame.position.x + FACE_SPHERE_OFFSET[0], restHeadFrame.position.y + FACE_SPHERE_OFFSET[1], restHeadFrame.position.z + FACE_SPHERE_OFFSET[2]);
		bakeState.hairCenter = makeVector(restHeadFrame.position.x + HAIR_SPHERE_OFFSET[0], restHeadFrame.position.y + HAIR_SPHERE_OFFSET[1], restHeadFrame.position.z + HAIR_SPHERE_OFFSET[2]);
		rebakeNormals(sliderStates.faceFlatten, sliderStates.hairSmooth);
	}
	reportLoading("ready", 1);
	System.document.getElementById("loadingOverlay").classList.add("hidden");
	System.window.requestAnimationFrame(renderFrame);
	</script>
</body>
</html>
