<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vanilla.js - EFFECTS</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #07090f;
		touch-action: none;
		user-select: none;
	}
	#mainCanvas {
		position: absolute;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
		display: block;
	}
</style>
</head>
<body>
<canvas id="mainCanvas"></canvas>
<script type="module">
	"use strict";
	const System = globalThis;

	//==============================================================================
	// 엔진 모듈 로드. (배포본은 ./vanilla.js, 저장소는 ../../build/vanilla.js)
	//==============================================================================
	let engineModule = null;
	try {
		try {
			engineModule = await import("./vanilla.js");
		}
		catch (importError) {
			engineModule = await import("../../build/vanilla.js");
		}
	}
	catch (engineError) {
		System.document.body.innerHTML = "<p style=\"color:#fff;font-family:sans-serif;padding:2em\">vanilla.js 엔진 모듈을 불러오지 못했습니다.</p>";
		throw engineError;
	}

	const Engine = engineModule.Engine;
	const EngineConfiguration = engineModule.EngineConfiguration;
	const Scene = engineModule.Scene;
	const WorldNode = engineModule.WorldNode;
	const Vector2 = engineModule.Vector2;
	const Color = engineModule.Color;
	const Pivot = engineModule.Pivot;
	const Rect = engineModule.Rect;
	const Paint = engineModule.Paint;
	const UILabel = engineModule.UILabel;
	const UIButton = engineModule.UIButton;
	const TouchRecognizer = engineModule.TouchRecognizer;
	const ViewScaleMode = engineModule.ViewScaleMode;
	const ParticleSystem = engineModule.ParticleSystem;
	const EmitterShape = engineModule.EmitterShape;
	const TrailRenderer = engineModule.TrailRenderer;
	const SeededRandom = engineModule.SeededRandom;

	//==============================================================================
	// 전역 상수 목록.
	//==============================================================================
	const REFERENCE_WIDTH = 1280;
	const REFERENCE_HEIGHT = 720;
	const TEXT_COLOR = new Color(0.9, 0.92, 0.95, 1);
	const TEXT_DIM_COLOR = new Color(0.5, 0.54, 0.6, 1);
	const BUTTON_COLOR = new Color(0.1, 0.12, 0.17, 0.9);
	const BUTTON_ACTIVE_COLOR = new Color(0.357, 0.424, 1, 1);
	const MODE_DEFINITIONS = [
		{ key: "fire", title: "FIRE", caption: "cone emitter · additive · color over lifetime" },
		{ key: "fountain", title: "FOUNTAIN", caption: "gravity · damping · size over lifetime" },
		{ key: "snow", title: "SNOW", caption: "edge emitter · slow fall · variable size" },
		{ key: "confetti", title: "CONFETTI", caption: "click to burst · rect particles · angular velocity" },
		{ key: "explosion", title: "EXPLOSION", caption: "click to burst · sparks + flash + smoke" },
		{ key: "fireworks", title: "FIREWORKS", caption: "timed bursts · additive spheres · gravity" },
		{ key: "trail", title: "MAGIC TRAIL", caption: "move the pointer · TrailRenderer + sparkles" },
	];
	const effectRandom = new SeededRandom(20260901);

	//==============================================================================
	// 이펙트 씬.
	// - 엔진 ParticleSystem / TrailRenderer 놀이터. 위 단추로 모드를 바꾸고,
	//   포인터 클릭 / 이동으로 상호작용한다.
	//==============================================================================
	class EffectsScene extends Scene {
		//==============================================================================
		// 멤버 변수 목록.
		//==============================================================================
		/** @private @type { TouchRecognizer | null } */ #touchRecognizer;
		/** @private @type { string } */ #modeKey;
		/** @private @type { System.Map } */ #modeRootMap; // key → WorldNode
		/** @private @type { System.Map } */ #modeButtonMap; // key → { paintComponent }
		/** @private @type { UILabel | null } */ #captionLabel;
		/** @private @type { UILabel | null } */ #countLabel;
		/** @private @type { ParticleSystem[] } */ #particleSystems;
		/** @private @type { WorldNode | null } */ #trailNode;
		/** @private @type { ParticleSystem | null } */ #trailSparkles;
		/** @private @type { object[] } */ #clickBurstSystems; // { key, systems: ParticleSystem[] }
		/** @private @type { number } */ #fireworkAccumulator;
		/** @private @type { ParticleSystem[] } */ #fireworkSystems;
		/** @private @type { number } */ #fireworkCursor;
		/** @private @type { number } */ #elapsedSeconds;
		/** @private @type { Vector2 } */ #appliedViewSize;

		//==============================================================================
		// 생성.
		//==============================================================================
		constructor() {
			super();
			this.#touchRecognizer = null;
			this.#modeKey = "fire";
			this.#modeRootMap = new System.Map();
			this.#modeButtonMap = new System.Map();
			this.#captionLabel = null;
			this.#countLabel = null;
			this.#particleSystems = [];
			this.#trailNode = null;
			this.#trailSparkles = null;
			this.#clickBurstSystems = [];
			this.#fireworkAccumulator = 0;
			this.#fireworkSystems = [];
			this.#fireworkCursor = 0;
			this.#elapsedSeconds = 0;
			this.#appliedViewSize = Vector2.create(0, 0);
		}

		//==============================================================================
		// 씬 구성.
		//==============================================================================
		create() {
			super.create();
			const root = this.getRoot();
			root.setPivot(Pivot.topLeft.clone());
			root.setAnchor(Pivot.topLeft.clone());
			this.#touchRecognizer = new TouchRecognizer();
			this.#touchRecognizer.setRootNode(root);
		}

		//==============================================================================
		// 로드.
		//==============================================================================
		/**
		 * @param { Engine } engine
		 */
		async load(engine) {
			const viewManager = engine.getViewManager();
			viewManager.setViewScaleMode(ViewScaleMode.stretchShortExpandLong);

			const root = this.getRoot();

			// 모드별 이펙트 뿌리.
			this.buildFireMode();
			this.buildFountainMode();
			this.buildSnowMode();
			this.buildConfettiMode();
			this.buildExplosionMode();
			this.buildFireworksMode();
			this.buildTrailMode();

			// 상단 제목 / 모드 단추 / 하단 캡션.
			this.buildOverlayUi();

			// URL 로 초기 모드 지정. (?mode=fire)
			const searchParams = new System.URLSearchParams(System.location.search);
			const requestedMode = searchParams.get("mode");
			const isKnownMode = MODE_DEFINITIONS.some((definition) => definition.key === requestedMode);
			this.selectMode(isKnownMode ? requestedMode : "fire");
		}

		//==============================================================================
		// 보조: 모드 뿌리 노드 하나 만들기.
		//==============================================================================
		/**
		 * @param { string } modeKey
		 * @returns { WorldNode }
		 */
		makeModeRoot(modeKey) {
			const root = this.getRoot();
			const modeRootNode = new WorldNode();
			modeRootNode.setName("Mode_" + modeKey);
			modeRootNode.setPivot(Pivot.topLeft.clone());
			modeRootNode.setAnchor(Pivot.topLeft.clone());
			modeRootNode.setActive(false);
			root.addChild(modeRootNode);
			this.#modeRootMap.set(modeKey, modeRootNode);
			return modeRootNode;
		}

		//==============================================================================
		// 보조: 파티클 노드 하나 만들기.
		//==============================================================================
		/**
		 * @param { WorldNode } parentNode
		 * @param { number } x
		 * @param { number } y
		 * @returns { ParticleSystem }
		 */
		makeParticleNode(parentNode, x, y) {
			const particleNode = new WorldNode();
			particleNode.setPivot(Pivot.topLeft.clone());
			particleNode.setAnchor(Pivot.topLeft.clone());
			particleNode.setLocalPosition(Vector2.create(x, y));
			parentNode.addChild(particleNode);
			const particleSystem = particleNode.addComponent(ParticleSystem);
			this.#particleSystems.push(particleSystem);
			return particleSystem;
		}

		//==============================================================================
		// 모드: 불.
		//==============================================================================
		buildFireMode() {
			const modeRootNode = this.makeModeRoot("fire");
			const centerX = REFERENCE_WIDTH * 0.5;
			const baseY = REFERENCE_HEIGHT * 0.72;

			// 연기. (불보다 먼저 그려 뒤에 깔린다)
			const smoke = this.makeParticleNode(modeRootNode, centerX, baseY - 30);
			smoke.setEmitterShape(EmitterShape.circle);
			smoke.setShapeRadius(16);
			smoke.setEmissionRate(22);
			smoke.setStartLifetime(1.6, 2.6);
			smoke.setStartSpeed(26, 60);
			smoke.setStartSize(26, 52);
			smoke.setGravity(6, -70);
			smoke.setDamping(0.6);
			smoke.setStartColor(new Color(0.16, 0.15, 0.15, 0.35), new Color(0.28, 0.26, 0.25, 0.25));
			smoke.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 0) },
				{ time: 0.2, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			smoke.setSizeOverLifetime(0.7, 1.8);

			// 불꽃 본체.
			const flame = this.makeParticleNode(modeRootNode, centerX, baseY);
			flame.setEmitterShape(EmitterShape.cone);
			flame.setConeAngle(0.35);
			flame.setShapeRadius(22);
			flame.setEmissionRate(110);
			flame.setStartLifetime(0.45, 0.95);
			flame.setStartSpeed(70, 150);
			flame.setStartSize(10, 22);
			flame.setGravity(0, -110);
			flame.setDamping(1.1);
			flame.setAdditive(true);
			flame.setStartColor(new Color(1, 0.75, 0.28, 1), new Color(1, 0.5, 0.12, 1));
			flame.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 0.85, 1) },
				{ time: 0.45, color: new Color(1, 0.62, 0.2, 0.9) },
				{ time: 1, color: new Color(0.7, 0.1, 0.02, 0) },
			]);
			flame.setSizeOverLifetime(1, 0.25);

			// 불티.
			const sparks = this.makeParticleNode(modeRootNode, centerX, baseY - 8);
			sparks.setEmitterShape(EmitterShape.cone);
			sparks.setConeAngle(0.55);
			sparks.setEmissionRate(14);
			sparks.setStartLifetime(0.8, 1.5);
			sparks.setStartSpeed(120, 260);
			sparks.setStartSize(2, 3.5);
			sparks.setGravity(0, 40);
			sparks.setDamping(0.8);
			sparks.setAdditive(true);
			sparks.setStartColor(new Color(1, 0.85, 0.4, 1), new Color(1, 0.6, 0.2, 1));
			sparks.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 0.4, 0.1, 0) },
			]);
		}

		//==============================================================================
		// 모드: 분수.
		//==============================================================================
		buildFountainMode() {
			const modeRootNode = this.makeModeRoot("fountain");
			const centerX = REFERENCE_WIDTH * 0.5;
			const baseY = REFERENCE_HEIGHT * 0.78;

			const water = this.makeParticleNode(modeRootNode, centerX, baseY);
			water.setEmitterShape(EmitterShape.cone);
			water.setConeAngle(0.22);
			water.setEmissionRate(160);
			water.setStartLifetime(1.4, 2.0);
			water.setStartSpeed(360, 470);
			water.setStartSize(3, 7);
			water.setGravity(0, 420);
			water.setStartColor(new Color(0.55, 0.8, 1, 0.9), new Color(0.8, 0.95, 1, 0.7));
			water.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 1) },
				{ time: 0.8, color: new Color(1, 1, 1, 0.7) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			water.setSizeOverLifetime(1, 0.6);
			water.setMaxParticleCount(900);

			// 물안개.
			const mist = this.makeParticleNode(modeRootNode, centerX, baseY - 140);
			mist.setEmitterShape(EmitterShape.circle);
			mist.setShapeRadius(50);
			mist.setEmissionRate(12);
			mist.setStartLifetime(1.2, 2.2);
			mist.setStartSpeed(6, 20);
			mist.setStartSize(30, 60);
			mist.setStartColor(new Color(0.6, 0.8, 1, 0.08), new Color(0.7, 0.9, 1, 0.05));
			mist.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 0) },
				{ time: 0.4, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			mist.setSizeOverLifetime(0.8, 1.6);
		}

		//==============================================================================
		// 모드: 눈.
		//==============================================================================
		buildSnowMode() {
			const modeRootNode = this.makeModeRoot("snow");

			const snow = this.makeParticleNode(modeRootNode, REFERENCE_WIDTH * 0.5, -20);
			snow.setEmitterShape(EmitterShape.edge);
			snow.setEdgeWidth(REFERENCE_WIDTH * 1.4);
			snow.setEmissionRate(60);
			snow.setStartLifetime(6, 9);
			snow.setStartSpeed(30, 70);
			snow.setStartSize(2, 6);
			snow.setGravity(6, 14);
			snow.setDamping(0.12);
			snow.setStartColor(new Color(1, 1, 1, 0.9), new Color(0.8, 0.88, 1, 0.5));
			snow.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 0) },
				{ time: 0.08, color: new Color(1, 1, 1, 1) },
				{ time: 0.9, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			snow.setMaxParticleCount(700);
		}

		//==============================================================================
		// 모드: 색종이. (클릭 버스트)
		//==============================================================================
		buildConfettiMode() {
			const modeRootNode = this.makeModeRoot("confetti");
			const colorPairs = [
				[new Color(1, 0.4, 0.5, 1), new Color(1, 0.7, 0.3, 1)],
				[new Color(0.35, 0.75, 1, 1), new Color(0.4, 1, 0.7, 1)],
				[new Color(0.8, 0.55, 1, 1), new Color(1, 0.9, 0.4, 1)],
			];
			const burstSystems = [];
			for (const colorPair of colorPairs) {
				const confetti = this.makeParticleNode(modeRootNode, 0, 0);
				confetti.setEmissionRate(0);
				confetti.setEmitterShape(EmitterShape.circle);
				confetti.setShapeRadius(8);
				confetti.setStartLifetime(1.4, 2.4);
				confetti.setStartSpeed(160, 420);
				confetti.setStartSize(4, 9);
				confetti.setGravity(0, 520);
				confetti.setDamping(1.4);
				confetti.setRenderShape("rect");
				confetti.setStartRotation(0, System.Math.PI * 2);
				confetti.setAngularVelocity(-8, 8);
				confetti.setStartColor(colorPair[0], colorPair[1]);
				confetti.setColorOverLifetime([
					{ time: 0, color: new Color(1, 1, 1, 1) },
					{ time: 0.8, color: new Color(1, 1, 1, 1) },
					{ time: 1, color: new Color(1, 1, 1, 0) },
				]);
				confetti.setWorldSpace(true);
				confetti.setMaxParticleCount(900);
				burstSystems.push(confetti);
			}
			this.#clickBurstSystems.push({ key: "confetti", systems: burstSystems, counts: [26, 26, 26] });
		}

		//==============================================================================
		// 모드: 폭발. (클릭 버스트)
		//==============================================================================
		buildExplosionMode() {
			const modeRootNode = this.makeModeRoot("explosion");

			// 섬광.
			const flash = this.makeParticleNode(modeRootNode, 0, 0);
			flash.setEmissionRate(0);
			flash.setStartLifetime(0.18, 0.25);
			flash.setStartSpeed(0, 10);
			flash.setStartSize(60, 90);
			flash.setAdditive(true);
			flash.setStartColor(new Color(1, 0.9, 0.6, 1));
			flash.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 0.6, 0.2, 0) },
			]);
			flash.setSizeOverLifetime(0.6, 1.6);
			flash.setWorldSpace(true);

			// 파편 불꽃.
			const sparks = this.makeParticleNode(modeRootNode, 0, 0);
			sparks.setEmissionRate(0);
			sparks.setEmitterShape(EmitterShape.circle);
			sparks.setShapeRadius(6);
			sparks.setStartLifetime(0.5, 1.1);
			sparks.setStartSpeed(220, 560);
			sparks.setStartSize(2.5, 5);
			sparks.setGravity(0, 320);
			sparks.setDamping(2.2);
			sparks.setAdditive(true);
			sparks.setStartColor(new Color(1, 0.8, 0.35, 1), new Color(1, 0.5, 0.15, 1));
			sparks.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 0.3, 0.05, 0) },
			]);
			sparks.setWorldSpace(true);
			sparks.setMaxParticleCount(900);

			// 연기.
			const smoke = this.makeParticleNode(modeRootNode, 0, 0);
			smoke.setEmissionRate(0);
			smoke.setEmitterShape(EmitterShape.circle);
			smoke.setShapeRadius(20);
			smoke.setStartLifetime(1.2, 2.2);
			smoke.setStartSpeed(30, 110);
			smoke.setStartSize(20, 46);
			smoke.setGravity(0, -40);
			smoke.setDamping(1.4);
			smoke.setStartColor(new Color(0.2, 0.19, 0.18, 0.5), new Color(0.32, 0.3, 0.28, 0.35));
			smoke.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 0.9) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			smoke.setSizeOverLifetime(0.8, 2.2);
			smoke.setWorldSpace(true);

			this.#clickBurstSystems.push({ key: "explosion", systems: [smoke, flash, sparks], counts: [14, 3, 60] });
		}

		//==============================================================================
		// 모드: 불꽃놀이. (일정 주기로 하늘에서 터진다)
		//==============================================================================
		buildFireworksMode() {
			const modeRootNode = this.makeModeRoot("fireworks");
			const paletteList = [
				[new Color(1, 0.5, 0.6, 1), new Color(1, 0.8, 0.5, 1)],
				[new Color(0.5, 0.8, 1, 1), new Color(0.7, 1, 0.9, 1)],
				[new Color(0.8, 0.6, 1, 1), new Color(1, 0.85, 0.5, 1)],
				[new Color(0.55, 1, 0.6, 1), new Color(1, 1, 0.7, 1)],
			];
			for (const palette of paletteList) {
				const burst = this.makeParticleNode(modeRootNode, 0, 0);
				burst.setEmissionRate(0);
				burst.setEmitterShape(EmitterShape.circle);
				burst.setShapeRadius(4);
				burst.setStartLifetime(0.9, 1.7);
				burst.setStartSpeed(120, 340);
				burst.setStartSize(2.5, 4.5);
				burst.setGravity(0, 130);
				burst.setDamping(1.1);
				burst.setAdditive(true);
				burst.setStartColor(palette[0], palette[1]);
				burst.setColorOverLifetime([
					{ time: 0, color: new Color(1, 1, 1, 1) },
					{ time: 0.7, color: new Color(1, 1, 1, 0.9) },
					{ time: 1, color: new Color(1, 1, 1, 0) },
				]);
				burst.setWorldSpace(true);
				burst.setMaxParticleCount(700);
				this.#fireworkSystems.push(burst);
			}
		}

		//==============================================================================
		// 모드: 마법 궤적. (포인터 추적 + 트레일 + 반짝임)
		//==============================================================================
		buildTrailMode() {
			const modeRootNode = this.makeModeRoot("trail");

			this.#trailNode = new WorldNode();
			this.#trailNode.setName("TrailFollower");
			this.#trailNode.setPivot(Pivot.middleCenter.clone());
			this.#trailNode.setAnchor(Pivot.topLeft.clone());
			this.#trailNode.setContentSize(Vector2.create(8, 8));
			this.#trailNode.setLocalPosition(Vector2.create(REFERENCE_WIDTH * 0.5, REFERENCE_HEIGHT * 0.5));
			const coreTrail = this.#trailNode.addComponent(TrailRenderer);
			coreTrail.setTime(0.55);
			coreTrail.setWidth(16, 0);
			coreTrail.setMinVertexDistance(2);
			coreTrail.setAdditive(true);
			coreTrail.setColors(new Color(0.45, 0.7, 1, 0.85), new Color(0.6, 0.4, 1, 0));
			const sparkles = this.#trailNode.addComponent(ParticleSystem);
			this.#particleSystems.push(sparkles);
			sparkles.setEmitterShape(EmitterShape.circle);
			sparkles.setShapeRadius(6);
			sparkles.setEmissionRate(90);
			sparkles.setStartLifetime(0.4, 0.9);
			sparkles.setStartSpeed(8, 50);
			sparkles.setStartSize(1.5, 4);
			sparkles.setGravity(0, 60);
			sparkles.setAdditive(true);
			sparkles.setStartColor(new Color(0.7, 0.85, 1, 1), new Color(0.85, 0.7, 1, 1));
			sparkles.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			this.#trailSparkles = sparkles;
			modeRootNode.addChild(this.#trailNode);
		}

		//==============================================================================
		// 상단 제목 / 모드 단추 / 하단 캡션.
		//==============================================================================
		buildOverlayUi() {
			const root = this.getRoot();

			const titleNode = new WorldNode();
			titleNode.setName("Title");
			titleNode.setPivot(Pivot.topLeft.clone());
			titleNode.setAnchor(Pivot.topLeft.clone());
			titleNode.setContentSize(Vector2.create(400, 28));
			titleNode.setLocalPosition(Vector2.create(24, 18));
			const titleLabel = titleNode.addComponent(UILabel);
			titleLabel.setText("EFFECTS");
			titleLabel.setFontSize(19);
			titleLabel.setTextColor(TEXT_COLOR);
			titleLabel.setTextAlign("left");
			titleLabel.setBold(true);
			root.addChild(titleNode);

			const subtitleNode = new WorldNode();
			subtitleNode.setName("Subtitle");
			subtitleNode.setPivot(Pivot.topLeft.clone());
			subtitleNode.setAnchor(Pivot.topLeft.clone());
			subtitleNode.setContentSize(Vector2.create(500, 16));
			subtitleNode.setLocalPosition(Vector2.create(26, 48));
			const subtitleLabel = subtitleNode.addComponent(UILabel);
			subtitleLabel.setText("engine ParticleSystem / TrailRenderer");
			subtitleLabel.setFontSize(11);
			subtitleLabel.setTextColor(TEXT_DIM_COLOR);
			subtitleLabel.setTextAlign("left");
			root.addChild(subtitleNode);

			for (let modeIndex = 0; modeIndex < MODE_DEFINITIONS.length; ++modeIndex) {
				const definition = MODE_DEFINITIONS[modeIndex];
				const buttonNode = new WorldNode();
				buttonNode.setName("ModeButton_" + definition.key);
				buttonNode.setPivot(Pivot.topLeft.clone());
				buttonNode.setAnchor(Pivot.topLeft.clone());
				buttonNode.setContentSize(Vector2.create(118, 30));
				buttonNode.setLocalPosition(Vector2.create(24 + modeIndex * 126, 78));
				buttonNode.setInteractable(true);
				const buttonPaint = buttonNode.addComponent(Paint);
				buttonPaint.setColor(BUTTON_COLOR.clone());
				buttonPaint.setRoundSize(8);
				const buttonComponent = buttonNode.addComponent(UIButton);
				buttonComponent.setClickedEvent(() => {
					this.selectMode(definition.key);
				});
				const buttonLabel = buttonNode.addComponent(UILabel);
				buttonLabel.setText(definition.title);
				buttonLabel.setFontSize(10.5);
				buttonLabel.setTextColor(TEXT_COLOR);
				buttonLabel.setBold(true);
				root.addChild(buttonNode);
				this.#modeButtonMap.set(definition.key, { paintComponent: buttonPaint });
			}

			const captionNode = new WorldNode();
			captionNode.setName("Caption");
			captionNode.setPivot(Pivot.topLeft.clone());
			captionNode.setAnchor(Pivot.topLeft.clone());
			captionNode.setContentSize(Vector2.create(700, 16));
			captionNode.setLocalPosition(Vector2.create(24, REFERENCE_HEIGHT - 54));
			this.#captionLabel = captionNode.addComponent(UILabel);
			this.#captionLabel.setFontSize(11);
			this.#captionLabel.setTextColor(TEXT_DIM_COLOR);
			this.#captionLabel.setTextAlign("left");
			root.addChild(captionNode);

			const countNode = new WorldNode();
			countNode.setName("Count");
			countNode.setPivot(Pivot.topLeft.clone());
			countNode.setAnchor(Pivot.topLeft.clone());
			countNode.setContentSize(Vector2.create(400, 16));
			countNode.setLocalPosition(Vector2.create(24, REFERENCE_HEIGHT - 34));
			this.#countLabel = countNode.addComponent(UILabel);
			this.#countLabel.setFontSize(11);
			this.#countLabel.setTextColor(TEXT_DIM_COLOR);
			this.#countLabel.setTextAlign("left");
			root.addChild(countNode);
		}

		//==============================================================================
		// 모드 선택.
		//==============================================================================
		/**
		 * @param { string } modeKey
		 */
		selectMode(modeKey) {
			this.#modeKey = modeKey;
			for (const [key, modeRootNode] of this.#modeRootMap) {
				modeRootNode.setActive(key === modeKey);
			}
			for (const [key, buttonEntry] of this.#modeButtonMap) {
				buttonEntry.paintComponent.setColor(key === modeKey ? BUTTON_ACTIVE_COLOR.clone() : BUTTON_COLOR.clone());
			}
			const definition = MODE_DEFINITIONS.find((entry) => entry.key === modeKey);
			if (this.#captionLabel && definition) {
				this.#captionLabel.setText(definition.caption);
			}
		}

		//==============================================================================
		// 갱신.
		//==============================================================================
		/**
		 * @param { number } deltaTime
		 */
		tick(deltaTime) {
			super.tick(deltaTime);
			this.#elapsedSeconds += deltaTime;

			// 마법 궤적: 포인터 추적.
			if (this.#modeKey === "trail" && this.#trailNode) {
				const engine = this.getEngine();
				const inputManager = engine.getInputManager();
				const pointerPosition = inputManager.getViewInputPosition();
				const currentPosition = this.#trailNode.getLocalPosition();
				const blend = System.Math.min(deltaTime * 14, 1);
				this.#trailNode.setLocalPosition(Vector2.create(
					currentPosition.x + (pointerPosition.x - currentPosition.x) * blend,
					currentPosition.y + (pointerPosition.y - currentPosition.y) * blend));
			}

			// 불꽃놀이: 주기적으로 하늘에서 터진다.
			if (this.#modeKey === "fireworks") {
				this.#fireworkAccumulator += deltaTime;
				if (this.#fireworkAccumulator >= 0.9) {
					this.#fireworkAccumulator -= 0.9;
					const burst = this.#fireworkSystems[this.#fireworkCursor % this.#fireworkSystems.length];
					this.#fireworkCursor += 1;
					const burstX = effectRandom.nextRange(REFERENCE_WIDTH * 0.15, REFERENCE_WIDTH * 0.85);
					const burstY = effectRandom.nextRange(REFERENCE_HEIGHT * 0.15, REFERENCE_HEIGHT * 0.5);
					burst.emit(70, Vector2.create(burstX, burstY));
				}
			}

			// 파티클 수 표기.
			if (this.#countLabel) {
				let totalCount = 0;
				for (const particleSystem of this.#particleSystems) {
					totalCount += particleSystem.getParticleCount();
				}
				this.#countLabel.setText("particles  " + totalCount);
			}
		}

		//==============================================================================
		// 출력 전 처리. (뷰 좌표계 적용 + 배경 채움)
		//==============================================================================
		/**
		 * @param { Graphic } graphic
		 */
		preDraw(graphic) {
			super.preDraw(graphic);
			const engine = this.getEngine();
			const viewManager = engine.getViewManager();
			const canvasNativeSize = viewManager.getCanvasNativeSize();
			viewManager.applyCanvasNativeRect(graphic);
			graphic.setFillColor("rgb(7, 9, 15)");
			graphic.drawRect(Rect.create(0, 0, canvasNativeSize.x, canvasNativeSize.y));
			viewManager.applyViewRect(graphic);
		}

		//==============================================================================
		// 터치 전달. (버스트 모드에서는 클릭 위치에서 터뜨린다)
		//==============================================================================
		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchPress(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchPress(viewInputPosition);
			}
			for (const burstEntry of this.#clickBurstSystems) {
				if (burstEntry.key !== this.#modeKey) {
					continue;
				}
				for (let systemIndex = 0; systemIndex < burstEntry.systems.length; ++systemIndex) {
					burstEntry.systems[systemIndex].emit(burstEntry.counts[systemIndex], viewInputPosition);
				}
			}
		}

		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchMove(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchMove(viewInputPosition);
			}
		}

		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchRelease(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchRelease(viewInputPosition);
			}
		}
	}

	//==============================================================================
	// 엔진 실행.
	//==============================================================================
	const engineConfiguration = new EngineConfiguration();
	engineConfiguration.referenceResolutionSize = Vector2.create(REFERENCE_WIDTH, REFERENCE_HEIGHT);
	engineConfiguration.canvasId = "mainCanvas";
	engineConfiguration.autoResizeOnWindowResize = true;
	const engine = new Engine(engineConfiguration);
	const effectsScene = new EffectsScene();
	engine.run(effectsScene);
	System.effectsEngine = engine;

	// 헤드리스 검증용 수동 스테퍼. (고정 16.67ms 프레임을 몰아서 돌린다)
	let syntheticTimestamp = performance.now();
	let stepCount = 0;
	function stepFrame() {
		syntheticTimestamp += 16.67;
		stepCount += 1;
		try {
			engine.updateEngine(syntheticTimestamp);
		}
		catch (stepError) {
			document.title = "STEP-ERROR";
			return;
		}
		if (stepCount === 80 || stepCount === 150) {
			try {
				effectsScene.touchPress(Vector2.create(640, 380));
				effectsScene.touchRelease(Vector2.create(640, 380));
			}
			catch (pressError) {
				document.title = "PRESS-ERROR " + pressError.message;
			}
		}
		if (stepCount < 200) {
			setTimeout(stepFrame, 1);
		}
	}
	setTimeout(stepFrame, 50);
</script>
</body>
</html>
