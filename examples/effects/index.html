<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vanilla.js - EFFECTS</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #14171e;
		touch-action: none;
		user-select: none;
	}
	#mainCanvas {
		position: absolute;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
		display: block;
	}
</style>
</head>
<body>
<canvas id="mainCanvas"></canvas>
<script type="module">
	"use strict";
	const System = globalThis;

	//==============================================================================
	// 엔진 모듈 로드. (배포본은 ./vanilla.js, 저장소는 ../../build/vanilla.js)
	//==============================================================================
	let engineModule = null;
	try {
		try {
			engineModule = await import("./vanilla.js");
		}
		catch (importError) {
			engineModule = await import("../../build/vanilla.js");
		}
	}
	catch (engineError) {
		System.document.body.innerHTML = "<p style=\"color:#fff;font-family:sans-serif;padding:2em\">vanilla.js 엔진 모듈을 불러오지 못했습니다.</p>";
		throw engineError;
	}

	const Engine = engineModule.Engine;
	const EngineConfiguration = engineModule.EngineConfiguration;
	const Scene = engineModule.Scene;
	const WorldNode = engineModule.WorldNode;
	const Vector2 = engineModule.Vector2;
	const Color = engineModule.Color;
	const Pivot = engineModule.Pivot;
	const Rect = engineModule.Rect;
	const Paint = engineModule.Paint;
	const Mask = engineModule.Mask;
	const UILabel = engineModule.UILabel;
	const UIButton = engineModule.UIButton;
	const TouchRecognizer = engineModule.TouchRecognizer;
	const ViewScaleMode = engineModule.ViewScaleMode;
	const ParticleSystem = engineModule.ParticleSystem;
	const EmitterShape = engineModule.EmitterShape;
	const TrailRenderer = engineModule.TrailRenderer;
	const SeededRandom = engineModule.SeededRandom;

	//==============================================================================
	// 전역 상수 목록.
	//==============================================================================
	const REFERENCE_WIDTH = 1280;
	const REFERENCE_HEIGHT = 760;
	const STAGE_X = 24;
	const STAGE_Y = 128;
	const STAGE_WIDTH = 1232;
	const STAGE_HEIGHT = 470;
	const TEXT_COLOR = new Color(0.91, 0.922, 0.949, 1);
	const TEXT_DIM_COLOR = new Color(0.604, 0.635, 0.698, 1);
	const TEXT_FAINT_COLOR = new Color(0.42, 0.451, 0.529, 1);
	const SURFACE_COLOR = new Color(0.106, 0.125, 0.165, 1);
	const STAGE_COLOR = new Color(0.051, 0.063, 0.09, 1);
	const HAIRLINE_COLOR = new Color(0.224, 0.255, 0.329, 1);
	const ACCENT_COLOR = new Color(0.427, 0.49, 1, 1);
	const effectRandom = new SeededRandom(20260901);

	const MODE_DEFINITIONS = [
		{ key: "fire", title: "FIRE",
			description: "모닥불. 원뿔 방출 불꽃 위로 연기가 깔리고 불티가 튄다.",
			modules: "ParticleSystem  ·  cone / circle emitter  ·  additive  ·  colorOverLifetime" },
		{ key: "fountain", title: "FOUNTAIN",
			description: "분수. 좁은 원뿔로 쏘아 올린 물줄기가 중력으로 떨어지고 물안개가 피어오른다.",
			modules: "ParticleSystem  ·  gravity  ·  sizeOverLifetime" },
		{ key: "snow", title: "SNOW",
			description: "눈. 무대 위쪽 가장자리에서 흩날리며 떨어진다. 좌우 살랑임은 wobble 로 만든다.",
			modules: "ParticleSystem  ·  edge emitter  ·  wobble" },
		{ key: "rain", title: "RAIN",
			description: "비. 속도 방향으로 늘어난 빗줄기가 쏟아지고 바닥에서 물방울이 튄다.",
			modules: "ParticleSystem  ·  streak render  ·  edge emitter" },
		{ key: "confetti", title: "CONFETTI",
			description: "색종이. 1.2초마다 위쪽 임의 지점에서 터진다. 조각마다 회전이 걸려 있다.",
			modules: "ParticleSystem  ·  burst  ·  rect render  ·  angular velocity" },
		{ key: "explosion", title: "EXPLOSION",
			description: "폭발. 섬광 → 파편 불꽃 → 피어오르는 연기가 겹쳐 한 번의 폭발을 만든다.",
			modules: "ParticleSystem  ·  burst  ·  additive + normal 합성" },
		{ key: "firework", title: "FIREWORK",
			description: "불꽃놀이. 0.9초마다 밤하늘 임의 위치에서 색색의 구가 터지고 잔광이 떨어진다.",
			modules: "ParticleSystem  ·  burst  ·  additive  ·  gravity" },
		{ key: "sparkle", title: "SPARKLE",
			description: "별가루. 무대 전체에 잔잔히 돋아나는 반짝임. 커졌다 사라지기를 반복한다.",
			modules: "ParticleSystem  ·  box emitter  ·  soft disc sprite" },
		{ key: "embers", title: "EMBERS",
			description: "불씨. 바닥에서 피어올라 흔들리며 사그라드는 잉걸불.",
			modules: "ParticleSystem  ·  edge emitter  ·  wobble  ·  additive" },
		{ key: "bubbles", title: "BUBBLES",
			description: "거품. 바닥에서 떠오르며 좌우로 흔들리고 수면 근처에서 사라진다.",
			modules: "ParticleSystem  ·  wobble  ·  sizeOverLifetime" },
		{ key: "vortex", title: "VORTEX",
			description: "소용돌이. 중심을 향해 끌리면서 접선 방향으로 휘도는 입자들.",
			modules: "ParticleSystem  ·  attractor (radial + swirl)" },
		{ key: "trail", title: "TRAIL",
			description: "마법 궤적. 리사주 곡선을 따라 도는 발광체가 띠를 남기고 별가루를 흩뿌린다.",
			modules: "TrailRenderer + ParticleSystem  ·  additive" },
	];

	//==============================================================================
	// 이펙트 씬.
	// - 엔진 ParticleSystem / TrailRenderer 놀이터. 모든 연출은 무대 상자 안에서
	//   자동으로 무한 반복된다. (마우스 조작 불필요)
	//==============================================================================
	class EffectsScene extends Scene {
		//==============================================================================
		// 멤버 변수 목록.
		//==============================================================================
		/** @private @type { TouchRecognizer | null } */ #touchRecognizer;
		/** @private @type { string } */ #modeKey;
		/** @private @type { System.Map } */ #modeRootMap; // key → WorldNode
		/** @private @type { System.Map } */ #modeSystemsMap; // key → ParticleSystem[]
		/** @private @type { System.Map } */ #tabMap; // key → { paintComponent, labelComponent }
		/** @private @type { WorldNode | null } */ #stageNode;
		/** @private @type { UILabel | null } */ #modeNameLabel;
		/** @private @type { UILabel | null } */ #descriptionLabel;
		/** @private @type { UILabel | null } */ #modulesLabel;
		/** @private @type { UILabel | null } */ #countLabel;
		/** @private @type { WorldNode | null } */ #trailNode;
		/** @private @type { number } */ #burstAccumulator;
		/** @private @type { number } */ #burstCursor;
		/** @private @type { number } */ #elapsedSeconds;

		//==============================================================================
		// 생성.
		//==============================================================================
		constructor() {
			super();
			this.#touchRecognizer = null;
			this.#modeKey = "fire";
			this.#modeRootMap = new System.Map();
			this.#modeSystemsMap = new System.Map();
			this.#tabMap = new System.Map();
			this.#stageNode = null;
			this.#modeNameLabel = null;
			this.#descriptionLabel = null;
			this.#modulesLabel = null;
			this.#countLabel = null;
			this.#trailNode = null;
			this.#burstAccumulator = 0;
			this.#burstCursor = 0;
			this.#elapsedSeconds = 0;
		}

		//==============================================================================
		// 씬 구성.
		//==============================================================================
		create() {
			super.create();
			const root = this.getRoot();
			root.setPivot(Pivot.topLeft.clone());
			root.setAnchor(Pivot.topLeft.clone());
			this.#touchRecognizer = new TouchRecognizer();
			this.#touchRecognizer.setRootNode(root);
		}

		//==============================================================================
		// 로드.
		//==============================================================================
		/**
		 * @param { Engine } engine
		 */
		async load(engine) {
			const viewManager = engine.getViewManager();
			viewManager.setViewScaleMode(ViewScaleMode.stretchShort);

			this.buildStage();
			this.buildOverlayUi();

			this.buildFireMode();
			this.buildFountainMode();
			this.buildSnowMode();
			this.buildRainMode();
			this.buildConfettiMode();
			this.buildExplosionMode();
			this.buildFireworkMode();
			this.buildSparkleMode();
			this.buildEmbersMode();
			this.buildBubblesMode();
			this.buildVortexMode();
			this.buildTrailMode();

			// URL 로 초기 모드 지정. (?mode=fire)
			const searchParams = new System.URLSearchParams(System.location.search);
			const requestedMode = searchParams.get("mode");
			const isKnownMode = MODE_DEFINITIONS.some((definition) => definition.key === requestedMode);
			this.selectMode(isKnownMode ? requestedMode : "fire");
		}

		//==============================================================================
		// 무대 상자. (테두리 + 클리핑 — 모든 이펙트는 이 안에서만 그려진다)
		//==============================================================================
		buildStage() {
			const root = this.getRoot();

			// 테두리 프레임.
			const frameNode = new WorldNode();
			frameNode.setName("StageFrame");
			frameNode.setPivot(Pivot.topLeft.clone());
			frameNode.setAnchor(Pivot.topLeft.clone());
			frameNode.setContentSize(Vector2.create(STAGE_WIDTH + 2, STAGE_HEIGHT + 2));
			frameNode.setLocalPosition(Vector2.create(STAGE_X - 1, STAGE_Y - 1));
			const framePaint = frameNode.addComponent(Paint);
			framePaint.setColor(HAIRLINE_COLOR.clone());
			framePaint.setRoundSize(15);
			root.addChild(frameNode);

			// 무대 본체. (자식을 contentSize 로 클리핑)
			this.#stageNode = new WorldNode();
			this.#stageNode.setName("Stage");
			this.#stageNode.setPivot(Pivot.topLeft.clone());
			this.#stageNode.setAnchor(Pivot.topLeft.clone());
			this.#stageNode.setContentSize(Vector2.create(STAGE_WIDTH, STAGE_HEIGHT));
			this.#stageNode.setLocalPosition(Vector2.create(STAGE_X, STAGE_Y));
			const stagePaint = this.#stageNode.addComponent(Paint);
			stagePaint.setColor(STAGE_COLOR.clone());
			stagePaint.setRoundSize(14);
			this.#stageNode.addComponent(Mask);
			root.addChild(this.#stageNode);
		}

		//==============================================================================
		// 상단 제목 / 세그먼트 탭 바 / 하단 설명.
		//==============================================================================
		buildOverlayUi() {
			const root = this.getRoot();

			const makeLabelNode = (name, x, y, width, height, fontSize, textColor, isBold) => {
				const labelNode = new WorldNode();
				labelNode.setName(name);
				labelNode.setPivot(Pivot.topLeft.clone());
				labelNode.setAnchor(Pivot.topLeft.clone());
				labelNode.setContentSize(Vector2.create(width, height));
				labelNode.setLocalPosition(Vector2.create(x, y));
				const labelComponent = labelNode.addComponent(UILabel);
				labelComponent.setFontSize(fontSize);
				labelComponent.setTextColor(textColor);
				labelComponent.setTextAlign("left");
				if (isBold) {
					labelComponent.setBold(true);
				}
				root.addChild(labelNode);
				return labelComponent;
			};

			const titleLabel = makeLabelNode("Title", 24, 18, 400, 26, 18, TEXT_COLOR, true);
			titleLabel.setText("EFFECTS");
			const subtitleLabel = makeLabelNode("Subtitle", 26, 46, 700, 16, 11, TEXT_DIM_COLOR, false);
			subtitleLabel.setText("엔진 파티클 놀이터 — 모든 연출은 무대 안에서 자동으로 반복됩니다.");

			// 세그먼트 탭 바. (하나의 막대 안에서 활성 탭만 액센트로 칠해진다)
			const tabBarNode = new WorldNode();
			tabBarNode.setName("TabBar");
			tabBarNode.setPivot(Pivot.topLeft.clone());
			tabBarNode.setAnchor(Pivot.topLeft.clone());
			tabBarNode.setContentSize(Vector2.create(STAGE_WIDTH, 36));
			tabBarNode.setLocalPosition(Vector2.create(STAGE_X, 78));
			const tabBarPaint = tabBarNode.addComponent(Paint);
			tabBarPaint.setColor(SURFACE_COLOR.clone());
			tabBarPaint.setRoundSize(10);
			root.addChild(tabBarNode);

			const tabWidth = (STAGE_WIDTH - 8) / MODE_DEFINITIONS.length;
			for (let modeIndex = 0; modeIndex < MODE_DEFINITIONS.length; ++modeIndex) {
				const definition = MODE_DEFINITIONS[modeIndex];
				const tabNode = new WorldNode();
				tabNode.setName("Tab_" + definition.key);
				tabNode.setPivot(Pivot.topLeft.clone());
				tabNode.setAnchor(Pivot.topLeft.clone());
				tabNode.setContentSize(Vector2.create(tabWidth, 28));
				tabNode.setLocalPosition(Vector2.create(4 + modeIndex * tabWidth, 4));
				tabNode.setInteractable(true);
				const tabPaint = tabNode.addComponent(Paint);
				tabPaint.setColor(new Color(0, 0, 0, 0));
				tabPaint.setRoundSize(8);
				const tabButton = tabNode.addComponent(UIButton);
				tabButton.setPressedTintColor(new Color(1, 1, 1, 0.06));
				tabButton.setClickedEvent(() => {
					this.selectMode(definition.key);
				});
				const tabLabel = tabNode.addComponent(UILabel);
				tabLabel.setText(definition.title);
				tabLabel.setFontSize(9.5);
				tabLabel.setTextColor(TEXT_DIM_COLOR);
				tabLabel.setBold(true);
				tabBarNode.addChild(tabNode);
				this.#tabMap.set(definition.key, { paintComponent: tabPaint, labelComponent: tabLabel });
			}

			// 하단 설명 블록.
			this.#modeNameLabel = makeLabelNode("ModeName", 24, STAGE_Y + STAGE_HEIGHT + 16, 300, 20, 13, TEXT_COLOR, true);
			this.#descriptionLabel = makeLabelNode("ModeDescription", 24, STAGE_Y + STAGE_HEIGHT + 40, 900, 16, 11.5, TEXT_DIM_COLOR, false);
			this.#modulesLabel = makeLabelNode("ModeModules", 24, STAGE_Y + STAGE_HEIGHT + 62, 900, 16, 10, TEXT_FAINT_COLOR, false);
			this.#countLabel = makeLabelNode("ParticleCount", STAGE_X + STAGE_WIDTH - 220, STAGE_Y + STAGE_HEIGHT + 16, 220, 20, 11, TEXT_FAINT_COLOR, false);
			this.#countLabel.setTextAlign("right");
		}

		//==============================================================================
		// 보조: 모드 뿌리 / 파티클 노드.
		//==============================================================================
		/**
		 * @param { string } modeKey
		 * @returns { WorldNode }
		 */
		makeModeRoot(modeKey) {
			const modeRootNode = new WorldNode();
			modeRootNode.setName("Mode_" + modeKey);
			modeRootNode.setPivot(Pivot.topLeft.clone());
			modeRootNode.setAnchor(Pivot.topLeft.clone());
			modeRootNode.setActive(false);
			this.#stageNode.addChild(modeRootNode);
			this.#modeRootMap.set(modeKey, modeRootNode);
			this.#modeSystemsMap.set(modeKey, []);
			return modeRootNode;
		}

		/**
		 * @param { string } modeKey
		 * @param { WorldNode } parentNode
		 * @param { number } x
		 * @param { number } y
		 * @returns { ParticleSystem }
		 */
		makeParticleNode(modeKey, parentNode, x, y) {
			const particleNode = new WorldNode();
			particleNode.setPivot(Pivot.topLeft.clone());
			particleNode.setAnchor(Pivot.topLeft.clone());
			particleNode.setLocalPosition(Vector2.create(x, y));
			parentNode.addChild(particleNode);
			const particleSystem = particleNode.addComponent(ParticleSystem);
			this.#modeSystemsMap.get(modeKey).push(particleSystem);
			return particleSystem;
		}

		//==============================================================================
		// 모드: 불.
		//==============================================================================
		buildFireMode() {
			const modeRootNode = this.makeModeRoot("fire");
			const centerX = STAGE_WIDTH * 0.5;
			const baseY = STAGE_HEIGHT * 0.82;

			const smoke = this.makeParticleNode("fire", modeRootNode, centerX, baseY - 40);
			smoke.setEmitterShape(EmitterShape.circle);
			smoke.setShapeRadius(18);
			smoke.setEmissionRate(20);
			smoke.setStartLifetime(1.8, 2.8);
			smoke.setStartSpeed(24, 56);
			smoke.setStartSize(30, 60);
			smoke.setGravity(8, -80);
			smoke.setDamping(0.6);
			smoke.setStartColor(new Color(0.13, 0.13, 0.14, 0.32), new Color(0.24, 0.23, 0.23, 0.22));
			smoke.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 0) },
				{ time: 0.25, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			smoke.setSizeOverLifetime(0.7, 1.9);

			const flame = this.makeParticleNode("fire", modeRootNode, centerX, baseY);
			flame.setEmitterShape(EmitterShape.cone);
			flame.setConeAngle(0.32);
			flame.setShapeRadius(26);
			flame.setEmissionRate(130);
			flame.setStartLifetime(0.5, 1.0);
			flame.setStartSpeed(80, 170);
			flame.setStartSize(12, 26);
			flame.setGravity(0, -120);
			flame.setDamping(1.1);
			flame.setAdditive(true);
			flame.setStartColor(new Color(1, 0.76, 0.3, 1), new Color(1, 0.5, 0.12, 1));
			flame.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 0.85, 1) },
				{ time: 0.45, color: new Color(1, 0.62, 0.2, 0.9) },
				{ time: 1, color: new Color(0.65, 0.1, 0.02, 0) },
			]);
			flame.setSizeOverLifetime(1, 0.25);
			flame.setMaxParticleCount(700);

			const sparks = this.makeParticleNode("fire", modeRootNode, centerX, baseY - 10);
			sparks.setEmitterShape(EmitterShape.cone);
			sparks.setConeAngle(0.6);
			sparks.setEmissionRate(16);
			sparks.setStartLifetime(0.9, 1.6);
			sparks.setStartSpeed(130, 280);
			sparks.setStartSize(2, 3.5);
			sparks.setGravity(0, 60);
			sparks.setDamping(0.9);
			sparks.setAdditive(true);
			sparks.setWobble(3, 9);
			sparks.setStartColor(new Color(1, 0.85, 0.4, 1), new Color(1, 0.6, 0.2, 1));
			sparks.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 0.4, 0.1, 0) },
			]);
		}

		//==============================================================================
		// 모드: 분수.
		//==============================================================================
		buildFountainMode() {
			const modeRootNode = this.makeModeRoot("fountain");
			const centerX = STAGE_WIDTH * 0.5;
			const baseY = STAGE_HEIGHT * 0.9;

			const water = this.makeParticleNode("fountain", modeRootNode, centerX, baseY);
			water.setEmitterShape(EmitterShape.cone);
			water.setConeAngle(0.2);
			water.setEmissionRate(170);
			water.setStartLifetime(1.5, 2.1);
			water.setStartSpeed(380, 500);
			water.setStartSize(3, 7);
			water.setGravity(0, 460);
			water.setStartColor(new Color(0.55, 0.8, 1, 0.9), new Color(0.8, 0.95, 1, 0.7));
			water.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 1) },
				{ time: 0.8, color: new Color(1, 1, 1, 0.7) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			water.setSizeOverLifetime(1, 0.6);
			water.setMaxParticleCount(1000);

			const mist = this.makeParticleNode("fountain", modeRootNode, centerX, baseY - 170);
			mist.setEmitterShape(EmitterShape.circle);
			mist.setShapeRadius(60);
			mist.setEmissionRate(12);
			mist.setStartLifetime(1.4, 2.4);
			mist.setStartSpeed(6, 22);
			mist.setStartSize(34, 66);
			mist.setStartColor(new Color(0.6, 0.8, 1, 0.07), new Color(0.7, 0.9, 1, 0.05));
			mist.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 0) },
				{ time: 0.4, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			mist.setSizeOverLifetime(0.8, 1.6);
		}

		//==============================================================================
		// 모드: 눈.
		//==============================================================================
		buildSnowMode() {
			const modeRootNode = this.makeModeRoot("snow");

			const snow = this.makeParticleNode("snow", modeRootNode, STAGE_WIDTH * 0.5, -16);
			snow.setEmitterShape(EmitterShape.edge);
			snow.setEdgeWidth(STAGE_WIDTH * 1.1);
			snow.setEmissionRate(70);
			snow.setStartLifetime(7, 10);
			snow.setStartSpeed(34, 74);
			snow.setStartSize(2.5, 6.5);
			snow.setGravity(0, 10);
			snow.setDamping(0.12);
			snow.setWobble(14, 1.4);
			snow.setStartColor(new Color(1, 1, 1, 0.95), new Color(0.8, 0.88, 1, 0.55));
			snow.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 0) },
				{ time: 0.06, color: new Color(1, 1, 1, 1) },
				{ time: 0.92, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			snow.setMaxParticleCount(900);
		}

		//==============================================================================
		// 모드: 비.
		//==============================================================================

		//==============================================================================

		buildConfettiMode() {

				{ colors: [new Color(0.78, 0.58, 1, 1), new Color(1, 0.9, 0.45, 1)], spin: [2.6, 4.0] },

			for (const setup of confettiSetups) {

		//==============================================================================

		//==============================================================================
		// 모드: 마법 궤적. (리사주 곡선 자동 주행)
		//==============================================================================
		buildTrailMode() {
			const modeRootNode = this.makeModeRoot("trail");

			this.#trailNode = new WorldNode();
			this.#trailNode.setName("TrailFollower");
			this.#trailNode.setPivot(Pivot.middleCenter.clone());
			this.#trailNode.setAnchor(Pivot.topLeft.clone());
			this.#trailNode.setContentSize(Vector2.create(8, 8));
			this.#trailNode.setLocalPosition(Vector2.create(STAGE_WIDTH * 0.5, STAGE_HEIGHT * 0.5));
			const coreTrail = this.#trailNode.addComponent(TrailRenderer);
			coreTrail.setTime(0.6);
			coreTrail.setWidth(18, 0);
			coreTrail.setMinVertexDistance(2);
			coreTrail.setAdditive(true);
			coreTrail.setColors(new Color(0.45, 0.7, 1, 0.85), new Color(0.6, 0.4, 1, 0));
			const sparkles = this.#trailNode.addComponent(ParticleSystem);
			this.#modeSystemsMap.get("trail").push(sparkles);
			sparkles.setEmitterShape(EmitterShape.circle);
			sparkles.setShapeRadius(6);
			sparkles.setEmissionRate(110);
			sparkles.setStartLifetime(0.4, 1.0);
			sparkles.setStartSpeed(8, 60);
			sparkles.setStartSize(1.6, 4.5);
			sparkles.setGravity(0, 70);
			sparkles.setAdditive(true);
			sparkles.setStartColor(new Color(0.7, 0.85, 1, 1), new Color(0.85, 0.7, 1, 1));
			sparkles.setColorOverLifetime([
				{ time: 0, color: new Color(1, 1, 1, 1) },
				{ time: 1, color: new Color(1, 1, 1, 0) },
			]);
			modeRootNode.addChild(this.#trailNode);
		}

		//==============================================================================
		// 모드 선택. (이전 모드의 파티클을 지우고 새 모드를 재생)
		//==============================================================================
		/**
		 * @param { string } modeKey
		 */
		selectMode(modeKey) {
			this.#modeKey = modeKey;
			this.#burstAccumulator = 0;
			for (const [key, modeRootNode] of this.#modeRootMap) {
				const isActive = (key === modeKey);
				modeRootNode.setActive(isActive);
				for (const particleSystem of this.#modeSystemsMap.get(key)) {
					if (isActive) {
						particleSystem.stop(true);
						particleSystem.play();
					}
					else {
						particleSystem.stop(true);
					}
				}
			}
			for (const [key, tabEntry] of this.#tabMap) {
				const isActive = (key === modeKey);
				tabEntry.paintComponent.setColor(isActive ? ACCENT_COLOR.clone() : new Color(0, 0, 0, 0));
				tabEntry.labelComponent.setTextColor(isActive ? new Color(1, 1, 1, 1) : TEXT_DIM_COLOR.clone());
			}
			const definition = MODE_DEFINITIONS.find((entry) => entry.key === modeKey);
			this.#modeNameLabel.setText(definition.title);
			this.#descriptionLabel.setText(definition.description);
			this.#modulesLabel.setText(definition.modules);
		}

		//==============================================================================
		// 갱신. (자동 연출 진행)
		//==============================================================================
		/**
		 * @param { number } deltaTime
		 */
		tick(deltaTime) {
			super.tick(deltaTime);
			this.#elapsedSeconds += deltaTime;

			// 자동 버스트 모드.
			if (this.#modeKey === "confetti") {
				this.#burstAccumulator += deltaTime;
				if (this.#burstAccumulator >= 1.2) {
					this.#burstAccumulator -= 1.2;
					const burstX = effectRandom.nextRange(STAGE_WIDTH * 0.15, STAGE_WIDTH * 0.85);
					const burstY = effectRandom.nextRange(STAGE_HEIGHT * 0.12, STAGE_HEIGHT * 0.4);
					for (const confetti of this.#modeSystemsMap.get("confetti")) {
						confetti.emit(24, Vector2.create(burstX, burstY));
					}
				}
			}
			else if (this.#modeKey === "explosion") {
				this.#burstAccumulator += deltaTime;
				if (this.#burstAccumulator >= 1.6) {
					this.#burstAccumulator -= 1.6;
					const burstX = effectRandom.nextRange(STAGE_WIDTH * 0.2, STAGE_WIDTH * 0.8);
					const burstY = effectRandom.nextRange(STAGE_HEIGHT * 0.25, STAGE_HEIGHT * 0.75);
					const explosionSystems = this.#modeSystemsMap.get("explosion");
					explosionSystems[0].emit(14, Vector2.create(burstX, burstY));
					explosionSystems[1].emit(3, Vector2.create(burstX, burstY));
					explosionSystems[2].emit(64, Vector2.create(burstX, burstY));
				}
			}
			else if (this.#modeKey === "firework") {
				this.#burstAccumulator += deltaTime;
				if (this.#burstAccumulator >= 0.9) {
					this.#burstAccumulator -= 0.9;
					const fireworkSystems = this.#modeSystemsMap.get("firework");
					const burst = fireworkSystems[this.#burstCursor % fireworkSystems.length];
					this.#burstCursor += 1;
					const burstX = effectRandom.nextRange(STAGE_WIDTH * 0.12, STAGE_WIDTH * 0.88);
					const burstY = effectRandom.nextRange(STAGE_HEIGHT * 0.15, STAGE_HEIGHT * 0.55);
					burst.emit(72, Vector2.create(burstX, burstY));
				}
			}
			else if (this.#modeKey === "trail" && this.#trailNode) {

				// 리사주 곡선 주행.
				const pathTime = this.#elapsedSeconds * 0.8;
				const pathX = STAGE_WIDTH * 0.5 + STAGE_WIDTH * 0.36 * System.Math.sin(pathTime * 1.0);
				const pathY = STAGE_HEIGHT * 0.5 + STAGE_HEIGHT * 0.32 * System.Math.sin(pathTime * 1.7 + 1.3);
				this.#trailNode.setLocalPosition(Vector2.create(pathX, pathY));
			}

			// 파티클 수 표기. (활성 모드만)
			let totalCount = 0;
			for (const particleSystem of this.#modeSystemsMap.get(this.#modeKey)) {
				totalCount += particleSystem.getParticleCount();
			}
			this.#countLabel.setText("particles  " + totalCount);
		}

		//==============================================================================
		// 출력 전 처리. (뷰 좌표계 적용 + 배경 채움)
		//==============================================================================
		/**
		 * @param { Graphic } graphic
		 */
		preDraw(graphic) {
			super.preDraw(graphic);
			const engine = this.getEngine();
			const viewManager = engine.getViewManager();
			const canvasNativeSize = viewManager.getCanvasNativeSize();
			viewManager.applyCanvasNativeRect(graphic);
			graphic.setFillColor("rgb(20, 23, 30)");
			graphic.drawRect(Rect.create(0, 0, canvasNativeSize.x, canvasNativeSize.y));
			viewManager.applyViewRect(graphic);
		}

		//==============================================================================
		// 터치 전달.
		//==============================================================================
		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchPress(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchPress(viewInputPosition);
			}
		}

		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchMove(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchMove(viewInputPosition);
			}
		}

		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchRelease(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchRelease(viewInputPosition);
			}
		}
	}

	//==============================================================================
	// 엔진 실행.
	//==============================================================================
	const engineConfiguration = new EngineConfiguration();
	engineConfiguration.referenceResolutionSize = Vector2.create(REFERENCE_WIDTH, REFERENCE_HEIGHT);
	engineConfiguration.canvasId = "mainCanvas";
	engineConfiguration.autoResizeOnWindowResize = true;
	const engine = new Engine(engineConfiguration);
	engine.run(new EffectsScene());
	System.effectsEngine = engine;
</script>
