<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vanilla.js - Effects</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #14171e;
		touch-action: none;
		user-select: none;
	}
	#mainCanvas {
		position: absolute;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
		display: block;
	}
</style>
</head>
<body>
<canvas id="mainCanvas"></canvas>
<script type="module">
	"use strict";
	const System = globalThis;

	//==============================================================================
	// 엔진 모듈 로드. (배포본은 ./vanilla.js, 저장소는 ../../build/vanilla.js)
	//==============================================================================
	let engineModule = null;
	try {
		try {
			engineModule = await import("./vanilla.js");
		}
		catch (importError) {
			engineModule = await import("../../build/vanilla.js");
		}
	}
	catch (engineError) {
		System.document.body.innerHTML = "<p style=\"color:#fff;font-family:sans-serif;padding:2em\">vanilla.js 엔진 모듈을 불러오지 못했습니다.</p>";
		throw engineError;
	}

	const Engine = engineModule.Engine;
	const EngineConfiguration = engineModule.EngineConfiguration;
	const Scene = engineModule.Scene;
	const WorldNode = engineModule.WorldNode;
	const Vector2 = engineModule.Vector2;
	const Color = engineModule.Color;
	const Pivot = engineModule.Pivot;
	const Rect = engineModule.Rect;
	const Paint = engineModule.Paint;
	const Mask = engineModule.Mask;
	const UILabel = engineModule.UILabel;
	const UIButton = engineModule.UIButton;
	const UIScrollView = engineModule.UIScrollView;
	const TouchRecognizer = engineModule.TouchRecognizer;
	const ViewScaleMode = engineModule.ViewScaleMode;
	const ParticleSystem = engineModule.ParticleSystem;
	const EmitterShape = engineModule.EmitterShape;
	const TrailRenderer = engineModule.TrailRenderer;
	const SeededRandom = engineModule.SeededRandom;

	//==============================================================================
	// 전역 상수 목록.
	//==============================================================================
	const REFERENCE_WIDTH = 1280;
	const REFERENCE_HEIGHT = 760;
	const LIST_X = 24;
	const LIST_Y = 78;
	const LIST_WIDTH = 248;
	const LIST_HEIGHT = 656;
	const LIST_ROW_HEIGHT = 46;
	const STAGE_X = 288;
	const STAGE_Y = 78;
	const STAGE_WIDTH = 968;
	const STAGE_HEIGHT = 656;
	const TEXT_COLOR = new Color(0.91, 0.922, 0.949, 1);
	const TEXT_DIM_COLOR = new Color(0.604, 0.635, 0.698, 1);
	const TEXT_FAINT_COLOR = new Color(0.42, 0.451, 0.529, 1);
	const SURFACE_COLOR = new Color(0.106, 0.125, 0.165, 1);
	const ROW_COLOR = new Color(0.137, 0.161, 0.216, 1);
	const STAGE_COLOR = new Color(0.051, 0.063, 0.09, 1);
	const HAIRLINE_COLOR = new Color(0.224, 0.255, 0.329, 1);
	const ACCENT_COLOR = new Color(0.831, 0.69, 0.416, 1);
	const ON_ACCENT_COLOR = new Color(0.165, 0.126, 0.086, 1);
	const effectRandom = new SeededRandom(20260901);

	const MODE_DEFINITIONS = [
		{ key: "fire", title: "FIRE", tag: "cone, additive", usage: [
			"const flame = node.addComponent(ParticleSystem);",
			"flame.setEmitterShape(EmitterShape.cone);",
			"flame.setConeAngle(0.34);",
			"flame.setAdditive(true);",
			"flame.setGravity(0, -130);",
			"flame.setColorOverLifetime([{ time: 0, color: yellow }, { time: 1, color: darkRed }]);",
		] },
		{ key: "fountain", title: "FOUNTAIN", tag: "gravity", usage: [
			"const water = node.addComponent(ParticleSystem);",
			"water.setEmitterShape(EmitterShape.cone);",
			"water.setConeAngle(0.22);",
			"water.setStartSpeed(420, 560);",
			"water.setGravity(0, 460);",
			"water.setSizeOverLifetime(1, 0.6);",
		] },
		{ key: "snow", title: "SNOW", tag: "edge, wobble", usage: [
			"const snow = node.addComponent(ParticleSystem);",
			"snow.setEmitterShape(EmitterShape.edge);",
			"snow.setEdgeWidth(stageWidth * 1.1);",
			"snow.setStartLifetime(7, 11);",
			"snow.setWobble(16, 1.4);",
		] },
		{ key: "rain", title: "RAIN", tag: "streak", usage: [
			"const rain = node.addComponent(ParticleSystem);",
			"rain.setEmitterShape(EmitterShape.edge);",
			"rain.setRenderShape(\"streak\");",
			"rain.setStreakScale(0.03);",
			"rain.setStartSpeed(500, 620);",
			"rain.setEmissionRate(520);",
		] },
		{ key: "confetti", title: "CONFETTI", tag: "burst, rect", usage: [
			"const confetti = node.addComponent(ParticleSystem);",
			"confetti.setRenderShape(\"rect\");",
			"confetti.setAngularVelocity(1.6, 3.2);",
			"confetti.setGravity(0, 460);",
			"confetti.emit(40, burstPosition);",
		] },
		{ key: "explosion", title: "EXPLOSION", tag: "burst, mixed", usage: [
			"const sparks = node.addComponent(ParticleSystem);",
			"sparks.setRenderShape(\"streak\");",
			"sparks.setStreakScale(0.045);",
			"sparks.setAdditive(true);",
			"sparks.setDamping(2.2);",
			"sparks.emit(110, position);",
		] },
		{ key: "firework", title: "FIREWORK", tag: "burst, additive", usage: [
			"const burst = node.addComponent(ParticleSystem);",
			"burst.setEmitterShape(EmitterShape.circle);",
			"burst.setShapeRadius(4);",
			"burst.setAdditive(true);",
			"burst.setGravity(0, 150);",
			"burst.emit(130, skyPosition);",
		] },
		{ key: "sparkle", title: "SPARKLE", tag: "box, soft disc", usage: [
			"const sparkle = node.addComponent(ParticleSystem);",
			"sparkle.setEmitterShape(EmitterShape.box);",
			"sparkle.setBoxSize(stageWidth * 0.94, stageHeight * 0.86);",
			"sparkle.setAdditive(true);",
			"sparkle.setSizeOverLifetime(0.4, 1.3);",
		] },
		{ key: "embers", title: "EMBERS", tag: "rise, wobble", usage: [
			"const embers = node.addComponent(ParticleSystem);",
			"embers.setEmitterShape(EmitterShape.edge);",
			"embers.setGravity(0, -85);",
			"embers.setWobble(18, 1.8);",
			"embers.setAdditive(true);",
		] },
		{ key: "bubbles", title: "BUBBLES", tag: "rise, sway", usage: [
			"const bubbles = node.addComponent(ParticleSystem);",
			"bubbles.setEmitterShape(EmitterShape.edge);",
			"bubbles.setGravity(0, -75);",
			"bubbles.setWobble(22, 2.4);",
			"bubbles.setSizeOverLifetime(0.7, 1.15);",
		] },
		{ key: "vortex", title: "VORTEX", tag: "attractor", usage: [
			"const vortex = node.addComponent(ParticleSystem);",
			"vortex.setEmitterShape(EmitterShape.circle);",
			"vortex.setShapeRadius(280);",
			"vortex.setAttractor(0, 0, 190, 260);",
			"vortex.setDamping(0.35);",
		] },
		{ key: "trail", title: "TRAIL", tag: "TrailRenderer", usage: [
			"const trail = node.addComponent(TrailRenderer);",
			"trail.setTime(0.65);",
			"trail.setWidth(20, 0);",
			"trail.setAdditive(true);",
			"trail.setColors(startColor, endColor);",
		] },
		{ key: "smoke", title: "SMOKE", tag: "plume, soft", usage: [
			"const smoke = node.addComponent(ParticleSystem);",
			"smoke.setEmitterShape(EmitterShape.circle);",
			"smoke.setGravity(14, -110);",
			"smoke.setDamping(0.5);",
			"smoke.setSizeOverLifetime(0.8, 2.2);",
		] },
		{ key: "fireflies", title: "FIREFLIES", tag: "box, blink", usage: [
			"const fireflies = node.addComponent(ParticleSystem);",
			"fireflies.setEmitterShape(EmitterShape.box);",
			"fireflies.setWobble(26, 1.2);",
			"fireflies.setAdditive(true);",
			"fireflies.setColorOverLifetime([{ time: 0.2, color: on }, { time: 0.5, color: off }, ...]);",
		] },
		{ key: "waterfall", title: "WATERFALL", tag: "edge, streak", usage: [
			"const water = node.addComponent(ParticleSystem);",
			"water.setEmitterShape(EmitterShape.edge);",
			"water.setEdgeWidth(240);",
			"water.setRenderShape(\"streak\");",
			"water.setGravity(0, 720);",
		] },
		{ key: "leaves", title: "LEAVES", tag: "rect, spin", usage: [
			"const leaves = node.addComponent(ParticleSystem);",
			"leaves.setEmitterShape(EmitterShape.edge);",
			"leaves.setRenderShape(\"rect\");",
			"leaves.setAngularVelocity(0.8, 2.2);",
			"leaves.setWobble(34, 1.1);",
		] },
		{ key: "meteor", title: "METEOR", tag: "streak, diagonal", usage: [
			"const meteor = node.addComponent(ParticleSystem);",
			"meteor.setEmitterShape(EmitterShape.edge);",
			"meteor.setRenderShape(\"streak\");",
			"meteor.setStreakScale(0.09);",
			"meteor.setGravity(420, 340);",
		] },
		{ key: "portal", title: "PORTAL", tag: "ring, swirl", usage: [
			"const portal = node.addComponent(ParticleSystem);",
			"portal.setEmitterShape(EmitterShape.circle);",
			"portal.setShapeRadius(170);",
			"portal.setAttractor(0, 0, 230, 320);",
			"portal.setAdditive(true);",
		] },
		{ key: "steam", title: "STEAM", tag: "rise, expand", usage: [
			"const steam = node.addComponent(ParticleSystem);",
			"steam.setEmitterShape(EmitterShape.circle);",
			"steam.setGravity(6, -100);",
			"steam.setWobble(10, 1.6);",
			"steam.setSizeOverLifetime(0.7, 1.9);",
		] },
		{ key: "blizzard", title: "BLIZZARD", tag: "wind, wobble", usage: [
			"const blizzard = node.addComponent(ParticleSystem);",
			"blizzard.setEmitterShape(EmitterShape.edge);",
			"blizzard.setEdgeWidth(stageWidth * 1.8);",
			"blizzard.setGravity(-260, 160);",
			"blizzard.setWobble(18, 2.6);",
		] },
	];

	//==============================================================================
	// 이펙트 씬.
	// - 왼쪽 목록에서 이펙트를 고르면 오른쪽 무대에서 자동으로 무한 반복된다.
	//   무대 안쪽에 제목 / 설명이 깔리고 그 위로 이펙트가 뿌려진다.
	//==============================================================================
	class EffectsScene extends Scene {
		//==============================================================================
		// 멤버 변수 목록.
		//==============================================================================
		/** @private @type { TouchRecognizer | null } */ #touchRecognizer;
		/** @private @type { string } */ #modeKey;
		/** @private @type { System.Map } */ #modeRootMap; // key → WorldNode
		/** @private @type { System.Map } */ #modeSystemsMap; // key → ParticleSystem[]
		/** @private @type { System.Map } */ #listRowMap; // key → { paintComponent, titleLabel, tagLabel }
		/** @private @type { WorldNode | null } */ #stageNode;
		/** @private @type { UILabel | null } */ #stageTitleLabel;
		/** @private @type { UILabel | null } */ #stageUsageLabel;
		/** @private @type { WorldNode | null } */ #usagePanelNode;
		/** @private @type { WorldNode | null } */ #copyButtonNode;
		/** @private @type { UILabel | null } */ #copyButtonLabel;
		/** @private @type { number } */ #copyResetSeconds;
		/** @private @type { UILabel | null } */ #fpsLabel;
		/** @private @type { number } */ #averageDelta;
		/** @private @type { UILabel | null } */ #countLabel;
		/** @private @type { UILabel | null } */ #vertexLabel;
		/** @private @type { UILabel | null } */ #triangleLabel;
		/** @private @type { TrailRenderer | null } */ #trailRenderer;
		/** @private @type { WorldNode | null } */ #trailNode;
		/** @private @type { number } */ #burstAccumulator;
		/** @private @type { number } */ #burstCursor;
		/** @private @type { number } */ #elapsedSeconds;

		//==============================================================================
		// 생성.
		//==============================================================================
		constructor() {
			super();
			this.#touchRecognizer = null;
			this.#modeKey = "fire";
			this.#modeRootMap = new System.Map();
			this.#modeSystemsMap = new System.Map();
			this.#listRowMap = new System.Map();
			this.#stageNode = null;
			this.#stageTitleLabel = null;
			this.#stageUsageLabel = null;
			this.#usagePanelNode = null;
			this.#copyButtonNode = null;
			this.#copyButtonLabel = null;
			this.#copyResetSeconds = 0;
			this.#fpsLabel = null;
			this.#averageDelta = 0;
			this.#countLabel = null;
			this.#vertexLabel = null;
			this.#triangleLabel = null;
			this.#trailRenderer = null;
			this.#trailNode = null;
			this.#burstAccumulator = 0;
			this.#burstCursor = 0;
			this.#elapsedSeconds = 0;
		}

		//==============================================================================
		// 씬 구성.
		//==============================================================================
		create() {
			super.create();
			const root = this.getRoot();
			root.setPivot(Pivot.topLeft.clone());
			root.setAnchor(Pivot.topLeft.clone());
			this.#touchRecognizer = new TouchRecognizer();
			this.#touchRecognizer.setRootNode(root);
		}

		//==============================================================================
		// 로드.
		//==============================================================================
		/**
		 * @param { Engine } engine
		 */
		async load(engine) {
			const viewManager = engine.getViewManager();
			viewManager.setViewScaleMode(ViewScaleMode.stretchShort);

			this.buildHeader();
			this.buildEffectList();
			this.buildStage();

			this.buildFireMode();
			this.buildFountainMode();
			this.buildSnowMode();
			this.buildRainMode();
			this.buildConfettiMode();
			this.buildExplosionMode();
			this.buildFireworkMode();
			this.buildSparkleMode();
			this.buildEmbersMode();
			this.buildBubblesMode();
			this.buildVortexMode();
			this.buildTrailMode();
			this.buildSmokeMode();
			this.buildFirefliesMode();
			this.buildWaterfallMode();
			this.buildLeavesMode();
			this.buildMeteorMode();
			this.buildPortalMode();
			this.buildSteamMode();
			this.buildBlizzardMode();

			// URL 로 초기 모드 지정. (?mode=fire)
			const searchParams = new System.URLSearchParams(System.location.search);
			const requestedMode = searchParams.get("mode");
			const isKnownMode = MODE_DEFINITIONS.some((definition) => definition.key === requestedMode);
			this.selectMode(isKnownMode ? requestedMode : "fire");
		}

		//==============================================================================
		// 상단 제목.
		//==============================================================================
		buildHeader() {
			const root = this.getRoot();
			const makeLabelNode = (name, x, y, width, height, fontSize, textColor, isBold) => {
				const labelNode = new WorldNode();
				labelNode.setName(name);
				labelNode.setPivot(Pivot.topLeft.clone());
				labelNode.setAnchor(Pivot.topLeft.clone());
				labelNode.setContentSize(Vector2.create(width, height));
				labelNode.setLocalPosition(Vector2.create(x, y));
				const labelComponent = labelNode.addComponent(UILabel);
				labelComponent.setFontSize(fontSize);
				labelComponent.setTextColor(textColor);
				labelComponent.setTextAlign("left");
				if (isBold) {
					labelComponent.setBold(true);
				}
				root.addChild(labelNode);
				return labelComponent;
			};
			const titleLabel = makeLabelNode("Title", 24, 24, 400, 26, 18, TEXT_COLOR, true);
			titleLabel.setText("EFFECTS");
		}

		//==============================================================================
		// 왼쪽 이펙트 목록. (스크롤 목록 — 선택 행은 액센트로 칠한다)
		//==============================================================================
		buildEffectList() {
			const root = this.getRoot();

			const listNode = new WorldNode();
			listNode.setName("EffectList");
			listNode.setPivot(Pivot.topLeft.clone());
			listNode.setAnchor(Pivot.topLeft.clone());
			listNode.setContentSize(Vector2.create(LIST_WIDTH, LIST_HEIGHT));
			listNode.setLocalPosition(Vector2.create(LIST_X, LIST_Y));
			listNode.setInteractable(true);
			const listPaint = listNode.addComponent(Paint);
			listPaint.setColor(SURFACE_COLOR.clone());
			listPaint.setRoundSize(12);
			const listScroll = listNode.addComponent(UIScrollView);
			listScroll.setHorizontal(false);
			listScroll.setVertical(true);
			listScroll.setScrollContentSize(Vector2.create(LIST_WIDTH, MODE_DEFINITIONS.length * LIST_ROW_HEIGHT + 16));
			root.addChild(listNode);

			const contentNode = listScroll.getContent();
			for (let modeIndex = 0; modeIndex < MODE_DEFINITIONS.length; ++modeIndex) {
				const definition = MODE_DEFINITIONS[modeIndex];
				const rowNode = new WorldNode();
				rowNode.setName("EffectRow_" + definition.key);
				rowNode.setPivot(Pivot.topLeft.clone());
				rowNode.setAnchor(Pivot.topLeft.clone());
				rowNode.setContentSize(Vector2.create(LIST_WIDTH - 16, LIST_ROW_HEIGHT - 6));
				rowNode.setLocalPosition(Vector2.create(8, 8 + modeIndex * LIST_ROW_HEIGHT));
				rowNode.setInteractable(true);
				const rowPaint = rowNode.addComponent(Paint);
				rowPaint.setColor(new Color(0, 0, 0, 0));
				rowPaint.setRoundSize(9);
				const rowButton = rowNode.addComponent(UIButton);
				rowButton.setPressedTintColor(new Color(1, 1, 1, 0.05));
				rowButton.setClickedEvent(() => {
					this.selectMode(definition.key);
				});

				// 선택 색은 코드가 관리하므로 버튼 틴트 캐시에서 제외한다.
				rowButton.excludeComponentFromTint(rowPaint);

				const titleNode = new WorldNode();
				titleNode.setName("EffectRowTitle_" + definition.key);
				titleNode.setPivot(Pivot.topLeft.clone());
				titleNode.setAnchor(Pivot.topLeft.clone());
				titleNode.setContentSize(Vector2.create(LIST_WIDTH - 44, 20));
				titleNode.setLocalPosition(Vector2.create(14, 4));
				const titleLabel = titleNode.addComponent(UILabel);
				titleLabel.setText(definition.title);
				titleLabel.setFontSize(11.5);
				titleLabel.setTextColor(TEXT_COLOR);
				titleLabel.setTextAlign("left");
				titleLabel.setBold(true);
				rowNode.addChild(titleNode);
				rowButton.excludeNodeFromTint(titleNode);

				const tagNode = new WorldNode();
				tagNode.setName("EffectRowTag_" + definition.key);
				tagNode.setPivot(Pivot.topLeft.clone());
				tagNode.setAnchor(Pivot.topLeft.clone());
				tagNode.setContentSize(Vector2.create(LIST_WIDTH - 44, 14));
				tagNode.setLocalPosition(Vector2.create(14, 23));
				const tagLabel = tagNode.addComponent(UILabel);
				tagLabel.setText(definition.tag);
				tagLabel.setFontSize(9);
				tagLabel.setTextColor(TEXT_FAINT_COLOR);
				tagLabel.setTextAlign("left");
				rowNode.addChild(tagNode);
				rowButton.excludeNodeFromTint(tagNode);

				contentNode.addChild(rowNode);
				this.#listRowMap.set(definition.key, { paintComponent: rowPaint, titleLabel: titleLabel, tagLabel: tagLabel });
			}
		}

		//==============================================================================
		// 오른쪽 무대. (테두리 + 클리핑 + 안쪽 글씨 — 이펙트가 글씨 위로 뿌려진다)
		//==============================================================================
		buildStage() {
			const root = this.getRoot();

			const frameNode = new WorldNode();
			frameNode.setName("StageFrame");
			frameNode.setPivot(Pivot.topLeft.clone());
			frameNode.setAnchor(Pivot.topLeft.clone());
			frameNode.setContentSize(Vector2.create(STAGE_WIDTH + 2, STAGE_HEIGHT + 2));
			frameNode.setLocalPosition(Vector2.create(STAGE_X - 1, STAGE_Y - 1));
			const framePaint = frameNode.addComponent(Paint);
			framePaint.setColor(HAIRLINE_COLOR.clone());
			framePaint.setRoundSize(15);
			root.addChild(frameNode);

			this.#stageNode = new WorldNode();
			this.#stageNode.setName("Stage");
			this.#stageNode.setPivot(Pivot.topLeft.clone());
			this.#stageNode.setAnchor(Pivot.topLeft.clone());
			this.#stageNode.setContentSize(Vector2.create(STAGE_WIDTH, STAGE_HEIGHT));
			this.#stageNode.setLocalPosition(Vector2.create(STAGE_X, STAGE_Y));
			const stagePaint = this.#stageNode.addComponent(Paint);
			stagePaint.setColor(STAGE_COLOR.clone());
			stagePaint.setRoundSize(14);
			this.#stageNode.addComponent(Mask);
			root.addChild(this.#stageNode);

			// 무대 안쪽 글씨. (이펙트보다 먼저 붙여 뒤에 깔린다)
			const makeStageLabel = (name, x, y, width, height, fontSize, textColor, isBold) => {
				const labelNode = new WorldNode();
				labelNode.setName(name);
				labelNode.setPivot(Pivot.topLeft.clone());
				labelNode.setAnchor(Pivot.topLeft.clone());
				labelNode.setContentSize(Vector2.create(width, height));
				labelNode.setLocalPosition(Vector2.create(x, y));
				const labelComponent = labelNode.addComponent(UILabel);
				labelComponent.setFontSize(fontSize);
				labelComponent.setTextColor(textColor);
				labelComponent.setTextAlign("left");
				if (isBold) {
					labelComponent.setBold(true);
				}
				this.#stageNode.addChild(labelNode);
				return labelComponent;
			};
			this.#stageTitleLabel = makeStageLabel("StageTitle", 26, 20, 600, 34, 26, new Color(1, 1, 1, 0.16), true);

			// 사용 코드 패널. (뒤 배경으로 구분감을 주고, 복사 단추를 함께 둔다)
			this.#usagePanelNode = new WorldNode();
			this.#usagePanelNode.setName("UsagePanel");
			this.#usagePanelNode.setPivot(Pivot.topLeft.clone());
			this.#usagePanelNode.setAnchor(Pivot.topLeft.clone());
			this.#usagePanelNode.setContentSize(Vector2.create(420, 100));
			this.#usagePanelNode.setLocalPosition(Vector2.create(16, 48));
			const usagePanelPaint = this.#usagePanelNode.addComponent(Paint);
			usagePanelPaint.setColor(new Color(0, 0, 0, 0.38));
			usagePanelPaint.setRoundSize(10);
			this.#stageNode.addChild(this.#usagePanelNode);

		//==============================================================================
		// 보조: 모드 뿌리 / 파티클 노드.
		//==============================================================================
		/**
		 * @param { string } modeKey
		 * @returns { WorldNode }
		 */
		makeModeRoot(modeKey) {
			const modeRootNode = new WorldNode();
			modeRootNode.setName("Mode_" + modeKey);
			modeRootNode.setPivot(Pivot.topLeft.clone());
			modeRootNode.setAnchor(Pivot.topLeft.clone());
			modeRootNode.setActive(false);
			this.#stageNode.addChild(modeRootNode);
			this.#modeRootMap.set(modeKey, modeRootNode);
			this.#modeSystemsMap.set(modeKey, []);
			return modeRootNode;
		}

		/**
		 * @param { string } modeKey
		 * @param { WorldNode } parentNode
		 * @param { number } x
		 * @param { number } y
		 * @returns { ParticleSystem }
		 */
		makeParticleNode(modeKey, parentNode, x, y) {
			const particleNode = new WorldNode();
			particleNode.setPivot(Pivot.topLeft.clone());
			particleNode.setAnchor(Pivot.topLeft.clone());
			particleNode.setLocalPosition(Vector2.create(x, y));
			parentNode.addChild(particleNode);
			const particleSystem = particleNode.addComponent(ParticleSystem);
			this.#modeSystemsMap.get(modeKey).push(particleSystem);
			return particleSystem;
		}

		//==============================================================================
		// 모드 선택. (이전 모드의 파티클을 지우고 새 모드를 재생)
		//==============================================================================
		/**
		 * @param { string } modeKey
		 */
		selectMode(modeKey) {
			this.#modeKey = modeKey;
			this.#burstAccumulator = 0;
			for (const [key, modeRootNode] of this.#modeRootMap) {
				const isActive = (key === modeKey);
				modeRootNode.setActive(isActive);
				for (const particleSystem of this.#modeSystemsMap.get(key)) {
					particleSystem.stop(true);
					if (isActive) {
						particleSystem.play();
					}
				}
			}
			for (const [key, rowEntry] of this.#listRowMap) {
				const isActive = (key === modeKey);
				rowEntry.paintComponent.setColor(isActive ? ACCENT_COLOR.clone() : new Color(0, 0, 0, 0));
				rowEntry.titleLabel.setTextColor(isActive ? ON_ACCENT_COLOR.clone() : TEXT_COLOR.clone());
				rowEntry.tagLabel.setTextColor(isActive ? new Color(0.165, 0.126, 0.086, 0.72) : TEXT_FAINT_COLOR.clone());
			}
			const definition = MODE_DEFINITIONS.find((entry) => entry.key === modeKey);
			this.#stageTitleLabel.setText(definition.title);
			this.#stageUsageLabel.setText(definition.usage.join("\n"));

			// 사용 코드 패널을 코드 줄 수와 최장 줄 길이에 맞춘다.
			let longestLineLength = 0;
			for (const usageLine of definition.usage) {
				longestLineLength = System.Math.max(longestLineLength, usageLine.length);
			}
			const usageLineHeight = 10.5 * 1.25;
			const panelWidth = System.Math.min(STAGE_WIDTH - 32, longestLineLength * 5.9 + 24 + 66);
			const panelHeight = definition.usage.length * usageLineHeight + 20;
			this.#usagePanelNode.setContentSize(Vector2.create(panelWidth, panelHeight));
			this.#copyButtonNode.setLocalPosition(Vector2.create(panelWidth - 60, 7));
			const usageLabelNode = this.#stageUsageLabel.getNode();
			usageLabelNode.setContentSize(Vector2.create(panelWidth - 22, panelHeight - 16));
			this.#copyButtonLabel.setText("COPY");
			this.#copyButtonLabel.setTextColor(TEXT_DIM_COLOR.clone());
			this.#copyResetSeconds = 0;
		}

		//==============================================================================
		// 현재 모드의 사용 코드를 클립보드에 복사.
		//==============================================================================
		copyUsageToClipboard() {
			const definition = MODE_DEFINITIONS.find((entry) => entry.key === this.#modeKey);
			const usageText = definition.usage.join("\n");
			const markCopied = () => {
				this.#copyButtonLabel.setText("COPIED");
				this.#copyButtonLabel.setTextColor(new Color(1, 1, 1, 0.95));
				this.#copyResetSeconds = 1.4;
			};
			if (System.navigator.clipboard && System.navigator.clipboard.writeText) {
				System.navigator.clipboard.writeText(usageText).then(markCopied).catch(() => {
					markCopied();
				});
			}
			else {
				const temporaryTextArea = System.document.createElement("textarea");
				temporaryTextArea.value = usageText;
				System.document.body.appendChild(temporaryTextArea);
				temporaryTextArea.select();
				System.document.execCommand("copy");
				temporaryTextArea.remove();
				markCopied();
			}
		}

		//==============================================================================
		// 갱신. (자동 연출 진행)
		//==============================================================================
		/**
		 * @param { number } deltaTime
		 */
		tick(deltaTime) {
			super.tick(deltaTime);
			this.#elapsedSeconds += deltaTime;

			// 자동 버스트 모드.
			if (this.#modeKey === "confetti") {
				this.#burstAccumulator += deltaTime;
				if (this.#burstAccumulator >= 0.9) {
					this.#burstAccumulator -= 0.9;
					const burstX = effectRandom.nextRange(STAGE_WIDTH * 0.15, STAGE_WIDTH * 0.85);
					const burstY = effectRandom.nextRange(STAGE_HEIGHT * 0.12, STAGE_HEIGHT * 0.4);
					for (const confetti of this.#modeSystemsMap.get("confetti")) {
						confetti.emit(40, Vector2.create(burstX, burstY));
					}
				}
			}
			else if (this.#modeKey === "explosion") {
				this.#burstAccumulator += deltaTime;
				if (this.#burstAccumulator >= 1.2) {
					this.#burstAccumulator -= 1.2;
					const burstX = effectRandom.nextRange(STAGE_WIDTH * 0.2, STAGE_WIDTH * 0.8);
					const burstY = effectRandom.nextRange(STAGE_HEIGHT * 0.25, STAGE_HEIGHT * 0.75);
					const explosionSystems = this.#modeSystemsMap.get("explosion");
					explosionSystems[0].emit(20, Vector2.create(burstX, burstY));
					explosionSystems[1].emit(4, Vector2.create(burstX, burstY));
					explosionSystems[2].emit(110, Vector2.create(burstX, burstY));
				}
			}
			else if (this.#modeKey === "firework") {
				this.#burstAccumulator += deltaTime;
				if (this.#burstAccumulator >= 0.65) {
					this.#burstAccumulator -= 0.65;
					const fireworkSystems = this.#modeSystemsMap.get("firework");
					const burst = fireworkSystems[this.#burstCursor % fireworkSystems.length];
					this.#burstCursor += 1;
					const burstX = effectRandom.nextRange(STAGE_WIDTH * 0.12, STAGE_WIDTH * 0.88);
					const burstY = effectRandom.nextRange(STAGE_HEIGHT * 0.15, STAGE_HEIGHT * 0.55);
					burst.emit(130, Vector2.create(burstX, burstY));
				}
			}
			else if (this.#modeKey === "trail" && this.#trailNode) {

				// 리사주 곡선 주행.
				const pathTime = this.#elapsedSeconds * 0.8;
				const pathX = STAGE_WIDTH * 0.5 + STAGE_WIDTH * 0.38 * System.Math.sin(pathTime * 1.0);
				const pathY = STAGE_HEIGHT * 0.5 + STAGE_HEIGHT * 0.34 * System.Math.sin(pathTime * 1.7 + 1.3);
				this.#trailNode.setLocalPosition(Vector2.create(pathX, pathY));
			}

			// 복사 표시 복귀.
			if (this.#copyResetSeconds > 0) {
				this.#copyResetSeconds -= deltaTime;
				if (this.#copyResetSeconds <= 0) {
					this.#copyButtonLabel.setText("COPY");
					this.#copyButtonLabel.setTextColor(TEXT_DIM_COLOR.clone());
				}
			}

			// 렌더 통계 표기. (활성 모드만 — 파티클당 쿼드 6정점 2삼각형, 트레일은 세그먼트당 쿼드)
			if (deltaTime > 0) {
				this.#averageDelta = (this.#averageDelta === 0) ? deltaTime : (this.#averageDelta * 0.9 + deltaTime * 0.1);
			}
			const framePerSecond = (this.#averageDelta > 0) ? System.Math.round(1 / this.#averageDelta) : 0;
			this.#fpsLabel.setText("fps  " + framePerSecond);
			let totalCount = 0;
			for (const particleSystem of this.#modeSystemsMap.get(this.#modeKey)) {
				totalCount += particleSystem.getParticleCount();
			}
			let vertexCount = totalCount * 6;
			if (this.#modeKey === "trail" && this.#trailRenderer) {
				vertexCount += System.Math.max(0, this.#trailRenderer.getPointCount() - 1) * 6;
			}
			const triangleCount = vertexCount / 3;
			this.#countLabel.setText("particles  " + totalCount);
			this.#vertexLabel.setText("vertices  " + vertexCount);
			this.#triangleLabel.setText("triangles  " + triangleCount);
		}

		//==============================================================================
		// 출력 전 처리. (뷰 좌표계 적용 + 배경 채움)
		//==============================================================================
		/**
		 * @param { Graphic } graphic
		 */
		preDraw(graphic) {
			super.preDraw(graphic);
			const engine = this.getEngine();
			const viewManager = engine.getViewManager();
			const canvasNativeSize = viewManager.getCanvasNativeSize();
			viewManager.applyCanvasNativeRect(graphic);
			graphic.setFillColor("rgb(20, 23, 30)");
			graphic.drawRect(Rect.create(0, 0, canvasNativeSize.x, canvasNativeSize.y));
			viewManager.applyViewRect(graphic);
		}

		//==============================================================================
		// 터치 전달.
		//==============================================================================
		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchPress(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchPress(viewInputPosition);
			}
		}

		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchMove(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchMove(viewInputPosition);
			}
		}

		/**
		 * @param { Vector2 } viewInputPosition
		 */
		touchRelease(viewInputPosition) {
			if (this.#touchRecognizer) {
				this.#touchRecognizer.touchRelease(viewInputPosition);
			}
		}
	}

	//==============================================================================
	// 엔진 실행.
	//==============================================================================
	const engineConfiguration = new EngineConfiguration();
	engineConfiguration.referenceResolutionSize = Vector2.create(REFERENCE_WIDTH, REFERENCE_HEIGHT);
	engineConfiguration.canvasId = "mainCanvas";
	engineConfiguration.autoResizeOnWindowResize = true;
	const engine = new Engine(engineConfiguration);
	engine.run(new EffectsScene());
	System.effectsEngine = engine;
</script>
