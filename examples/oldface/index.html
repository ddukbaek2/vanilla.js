	<script type="module">
	"use strict";
	const System = globalThis;

	//==============================================================================
	// 엔진 모듈 로드. (배포본은 ./vanilla.js, 저장소는 ../../build/vanilla.js)
	//==============================================================================
	let engineModule = null;
	try {
		try {
			engineModule = await import("./vanilla.js");
		}
		catch (importError) {
			engineModule = await import("../../build/vanilla.js");
		}
	}
	catch (engineError) {
		System.document.body.innerHTML = "<p style=\"color:#fff;font-family:sans-serif;padding:2em\">vanilla.js 엔진 모듈을 불러오지 못했습니다.</p>";
		throw engineError;
	}
	const Graphic = engineModule.Graphic;
	const Rect = engineModule.Rect;
	const Vector2 = engineModule.Vector2;
	const Vector3 = engineModule.Vector3;
	const Matrix4 = engineModule.Matrix4;
	const Quaternion = engineModule.Quaternion;
	const RenderTarget = engineModule.RenderTarget;
	const FullscreenPass = engineModule.FullscreenPass;
	const BloomEffect = engineModule.BloomEffect;
	const SkinnedModel = engineModule.SkinnedModel;
	const HumanSkinRenderer = engineModule.HumanSkinRenderer;
	const SubsurfaceScatteringEffect = engineModule.SubsurfaceScatteringEffect;
	const Material = engineModule.Material;
	const ShadowMap = engineModule.ShadowMap;

	//==============================================================================
	// 전역 상수 목록.
	//==============================================================================
	const CAMERA_FIELD_OF_VIEW = 0.44;
	const CAMERA_NEAR_DISTANCE = 0.05;
	const CAMERA_FAR_DISTANCE = 20;
	const CAMERA_MINIMUM_DISTANCE = 0.42;
	const CAMERA_MAXIMUM_DISTANCE = 1.9;
	const SHADOWMAP_RESOLUTION = 2048;
	const DETAIL_TEXTURE_SIZE = 4096;
	const KEY_LIGHT_DIRECTION = Vector3.create(0.5, 0.62, 0.62).normalize();
	const FILL_LIGHT_DIRECTION = Vector3.create(-0.75, 0.1, 0.6).normalize();
	const RIM_LIGHT_DIRECTION = Vector3.create(0.55, 0.45, -0.72).normalize();

	// 표정 프리셋 표시 목록. (assets/expressions.json 의 키 — ARKit 블렌드셰이프 52종의 가중치 조합)
	const EXPRESSION_DEFINITIONS = [
		{ name: "neutral", label: "NEUTRAL" },
		{ name: "happy", label: "HAPPY" },
		{ name: "grin", label: "GRIN" },
		{ name: "peaceful", label: "PEACEFUL" },
		{ name: "excited", label: "EXCITED" },
		{ name: "angry", label: "ANGRY" },
		{ name: "furious", label: "FURIOUS" },
		{ name: "sad", label: "SAD" },
		{ name: "pain", label: "PAIN" },
		{ name: "disgusted", label: "DISGUSTED" },
		{ name: "bored", label: "BORED" },
		{ name: "confused", label: "CONFUSED" },
		{ name: "embarrassed", label: "EMBARRASSED" },
	];

	// 부위별 머티리얼 정의. (glb 머티리얼 이름 부분 일치 → 텍스처 / 팩터 / 산란 마스크)
	const PART_MATERIAL_DEFINITIONS = [
		{ keyword: "eyes", albedo: "head_albedo.jpg", normal: null, roughness: null, opacity: null, baseColorFactor: null, useDetail: false, roughnessFactor: 0.14, subsurfaceFactor: 0.0 },
		{ keyword: "head", albedo: "head_albedo.jpg", normal: "head_normal.jpg", roughness: "head_roughness.jpg", opacity: null, baseColorFactor: null, useDetail: true, roughnessFactor: 1.0, subsurfaceFactor: 1.0 },
		{ keyword: "body", albedo: "body_albedo.jpg", normal: "body_normal.jpg", roughness: "body_roughness.jpg", opacity: null, baseColorFactor: null, useDetail: false, roughnessFactor: 1.0, subsurfaceFactor: 0.5 },
		{ keyword: "opacity", albedo: "hair.png", normal: null, roughness: null, opacity: "hair.png", baseColorFactor: null, useDetail: false, roughnessFactor: 1.0, subsurfaceFactor: 0.0 },
	];

	//==============================================================================
	// 셰이더 소스 목록.
	//==============================================================================
	// 합성. (산란된 조도 x 알베도 + 스펙큘러 → 선형 HDR, 배경은 스튜디오 그라디언트)
	const COMBINE_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec2 fragmentTextureCoordinate;
	uniform sampler2D irradianceTexture;
	uniform sampler2D albedoTexture;
	uniform sampler2D specularTexture;
	uniform float aspectRatio;
	out vec4 outputColor;

	void main() {
		vec4 irradiance = texture(irradianceTexture, fragmentTextureCoordinate);
		vec4 albedo = texture(albedoTexture, fragmentTextureCoordinate);
		vec3 specular = texture(specularTexture, fragmentTextureCoordinate).rgb;
		vec3 surfaceColor = irradiance.rgb * albedo.rgb + specular;

		// 배경. (어두운 스튜디오 — 두상 뒤가 은은하게 밝은 방사형 그라디언트)
		vec2 centered = (fragmentTextureCoordinate - vec2(0.5, 0.56)) * vec2(aspectRatio, 1.0);
		float radial = dot(centered, centered);
		vec3 backgroundColor = vec3(0.012, 0.012, 0.015) + vec3(0.075, 0.068, 0.07) * exp(-radial * 3.2);
		backgroundColor += vec3(0.02, 0.016, 0.012) * smoothstep(0.2, -0.6, fragmentTextureCoordinate.y - 0.5);
		vec3 color = mix(backgroundColor, surfaceColor, albedo.a);
		outputColor = vec4(color, 1.0);
	}
	`;

	// 톤 매핑 합성. (노출 → 블룸 가산 → ACES → 비네트 → 그레인 → sRGB)
	const COMPOSITE_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec2 fragmentTextureCoordinate;
	uniform sampler2D sceneTexture;
	uniform sampler2D bloomTexture;
	uniform float exposure;
	uniform float bloomStrength;
	uniform float vignetteStrength;
	uniform float grainStrength;
	uniform float elapsedTime;
	uniform vec2 resolution;
	out vec4 outputColor;

	vec3 acesToneMap(vec3 color) {
		const float a = 2.51;
		const float b = 0.03;
		const float c = 2.43;
		const float d = 0.59;
		const float e = 0.14;
		return clamp((color * (a * color + b)) / (color * (c * color + d) + e), 0.0, 1.0);
	}

	float hash21(vec2 point) {
		point = fract(point * vec2(234.34, 435.345));
		point += dot(point, point + 34.23);
		return fract(point.x * point.y);
	}

	void main() {
		vec3 sceneColor = texture(sceneTexture, fragmentTextureCoordinate).rgb;
		vec3 bloomColor = texture(bloomTexture, fragmentTextureCoordinate).rgb;
		vec3 color = sceneColor * exposure + bloomColor * bloomStrength;
		color = acesToneMap(color);

		// 비네트.
		vec2 centered = fragmentTextureCoordinate - 0.5;
		float vignette = 1.0 - smoothstep(0.35, 0.95, length(centered * vec2(1.0, 0.85)) * 1.25);
		color *= mix(1.0, vignette, vignetteStrength);

		// 필름 그레인. (중간 밝기에서 가장 보이고 어두운 곳은 절반)
		float grain = hash21(fragmentTextureCoordinate * resolution + fract(elapsedTime * 13.7) * 100.0) - 0.5;
		float grainLuminance = dot(color, vec3(0.299, 0.587, 0.114));
		color += grain * grainStrength * mix(0.5, 1.0, grainLuminance) * (1.0 - grainLuminance * 0.5);

		// sRGB 인코딩.
		vec3 encoded = mix(color * 12.92, 1.055 * pow(max(color, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, color));
		outputColor = vec4(encoded, 1.0);
	}
	`;

	// FXAA. (휘도 대비 기반 가장자리 방향 검출 + 방향 블러 — LDR 출력에 적용)
	const FXAA_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec2 fragmentTextureCoordinate;
	uniform sampler2D sourceTexture;
	uniform vec2 texelSize;
	out vec4 outputColor;

	float luminance(vec3 color) {
		return dot(color, vec3(0.299, 0.587, 0.114));
	}

	void main() {
		vec3 colorNorthWest = texture(sourceTexture, fragmentTextureCoordinate + vec2(-1.0, -1.0) * texelSize).rgb;
		vec3 colorNorthEast = texture(sourceTexture, fragmentTextureCoordinate + vec2(1.0, -1.0) * texelSize).rgb;
		vec3 colorSouthWest = texture(sourceTexture, fragmentTextureCoordinate + vec2(-1.0, 1.0) * texelSize).rgb;
		vec3 colorSouthEast = texture(sourceTexture, fragmentTextureCoordinate + vec2(1.0, 1.0) * texelSize).rgb;
		vec3 colorCenter = texture(sourceTexture, fragmentTextureCoordinate).rgb;
		float lumaNorthWest = luminance(colorNorthWest);
		float lumaNorthEast = luminance(colorNorthEast);
		float lumaSouthWest = luminance(colorSouthWest);
		float lumaSouthEast = luminance(colorSouthEast);
		float lumaCenter = luminance(colorCenter);
		float lumaMinimum = min(lumaCenter, min(min(lumaNorthWest, lumaNorthEast), min(lumaSouthWest, lumaSouthEast)));
		float lumaMaximum = max(lumaCenter, max(max(lumaNorthWest, lumaNorthEast), max(lumaSouthWest, lumaSouthEast)));

		vec2 direction;
		direction.x = -((lumaNorthWest + lumaNorthEast) - (lumaSouthWest + lumaSouthEast));
		direction.y = ((lumaNorthWest + lumaSouthWest) - (lumaNorthEast + lumaSouthEast));
		float directionReduce = max((lumaNorthWest + lumaNorthEast + lumaSouthWest + lumaSouthEast) * (0.25 * 0.125), 1.0 / 128.0);
		float reciprocalDirectionMinimum = 1.0 / (min(abs(direction.x), abs(direction.y)) + directionReduce);
		direction = min(vec2(8.0), max(vec2(-8.0), direction * reciprocalDirectionMinimum)) * texelSize;

		vec3 colorA = 0.5 * (texture(sourceTexture, fragmentTextureCoordinate + direction * (1.0 / 3.0 - 0.5)).rgb + texture(sourceTexture, fragmentTextureCoordinate + direction * (2.0 / 3.0 - 0.5)).rgb);
		vec3 colorB = colorA * 0.5 + 0.25 * (texture(sourceTexture, fragmentTextureCoordinate + direction * -0.5).rgb + texture(sourceTexture, fragmentTextureCoordinate + direction * 0.5).rgb);
		float lumaB = luminance(colorB);
		vec3 color = (lumaB < lumaMinimum || lumaB > lumaMaximum) ? colorA : colorB;
		outputColor = vec4(color, 1.0);
	}
	`;

	// 버퍼 미리보기. (머티리얼 그래프 패널 — 중간 버퍼를 작은 뷰포트에 톤 매핑해 표시)
	const PREVIEW_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec2 fragmentTextureCoordinate;
	uniform sampler2D sourceTexture;
	uniform float displayScale;
	uniform int useCoverage;
	out vec4 outputColor;

	void main() {
		vec4 sourceSample = texture(sourceTexture, fragmentTextureCoordinate);
		vec3 color = sourceSample.rgb * displayScale;
		color = color / (1.0 + color);
		if (useCoverage == 1) {
			color = mix(vec3(0.05, 0.05, 0.06), color, sourceSample.a);
		}
		outputColor = vec4(pow(color, vec3(1.0 / 2.2)), 1.0);
	}
	`;

	//==============================================================================
	// 전역 함수 목록.
	//==============================================================================
	function clampValue(value, minimumValue, maximumValue) {
		return System.Math.max(minimumValue, System.Math.min(maximumValue, value));
	}

	//==============================================================================
	// 캔버스 / 렌더링 컨텍스트.
	//==============================================================================
	const canvas = System.document.getElementById("mainCanvas");
	const webGL2RenderingContext = canvas.getContext("webgl2", { antialias: false, depth: true, stencil: true, alpha: false, premultipliedAlpha: true });
	if (!webGL2RenderingContext) {
		System.document.body.innerHTML = "<p style=\"color:#fff;font-family:sans-serif;padding:2em\">WebGL2 를 지원하지 않는 브라우저입니다.</p>";
		throw new Error("WebGL2 unsupported");
	}
	const uiGraphic = new Graphic(canvas);
	const skinRenderer = new HumanSkinRenderer(webGL2RenderingContext);
	const subsurfaceEffect = new SubsurfaceScatteringEffect(webGL2RenderingContext);
	const bloomEffect = new BloomEffect(webGL2RenderingContext);
	const shadowMap = new ShadowMap(webGL2RenderingContext, SHADOWMAP_RESOLUTION);
	const sceneRenderTarget = new RenderTarget(webGL2RenderingContext, 2, 2, true, { colorAttachmentCount: 3, useFloatColor: true, useDepthTexture: true });
	const hdrRenderTarget = new RenderTarget(webGL2RenderingContext, 2, 2, false, { useFloatColor: true });
	const ldrRenderTarget = new RenderTarget(webGL2RenderingContext, 2, 2, false);
	const combinePass = new FullscreenPass(webGL2RenderingContext, COMBINE_FRAGMENTSHADER_SOURCE);
	const compositePass = new FullscreenPass(webGL2RenderingContext, COMPOSITE_FRAGMENTSHADER_SOURCE);
	const antialiasPass = new FullscreenPass(webGL2RenderingContext, FXAA_FRAGMENTSHADER_SOURCE);
	const previewPass = new FullscreenPass(webGL2RenderingContext, PREVIEW_FRAGMENTSHADER_SOURCE);

	// 조명 / 피부 / 산란 / 블룸 기본값. (선형 공간, 미터 단위 캐릭터)
	skinRenderer.setLight(0, KEY_LIGHT_DIRECTION.x, KEY_LIGHT_DIRECTION.y, KEY_LIGHT_DIRECTION.z, 1.0, 0.92, 0.82, 2.6);
	skinRenderer.setLight(1, FILL_LIGHT_DIRECTION.x, FILL_LIGHT_DIRECTION.y, FILL_LIGHT_DIRECTION.z, 0.6, 0.7, 0.9, 1.1);
	skinRenderer.setLight(2, RIM_LIGHT_DIRECTION.x, RIM_LIGHT_DIRECTION.y, RIM_LIGHT_DIRECTION.z, 0.95, 0.97, 1.0, 1.4);
	skinRenderer.setAmbientColors([0.2, 0.21, 0.25], [0.13, 0.12, 0.12], [0.09, 0.08, 0.075]);
	skinRenderer.setSheenStrength(0.18);
	skinRenderer.setNormalStrength(1.5);
	skinRenderer.setSpecularStrength(0.65);
	skinRenderer.setRoughnessRange(1.0, 1.0);
	skinRenderer.setDetailTexelSize(1 / DETAIL_TEXTURE_SIZE);
	subsurfaceEffect.setScatterWidth(0.008);
	bloomEffect.setThreshold(1.05, 1.9);
	bloomEffect.setIterationCount(3);

	//==============================================================================
	// 렌더링 옵션. (우측 상단 패널 — 숫자 키로도 전환)
	//==============================================================================
	const optionDefinitions = [
		{ name: "subsurface", label: "SUBSURFACE SCATTERING" },
		{ name: "detail", label: "4K PORE DETAIL" },
		{ name: "shadow", label: "KEY LIGHT SHADOW" },
		{ name: "bloom", label: "BLOOM" },
		{ name: "antialias", label: "FXAA" },
		{ name: "wireframe", label: "WIREFRAME" },
		{ name: "materialGraph", label: "MATERIAL GRAPH" },
	];
	const optionStates = {
		subsurface: true,
		detail: true,
		shadow: true,
		bloom: true,
		antialias: true,
		wireframe: false,
		materialGraph: false,
	};
	const optionRowElements = {};
	const optionPanelElement = System.document.getElementById("optionPanel");
	optionDefinitions.forEach((definition, definitionIndex) => {
		const rowElement = System.document.createElement("div");
		rowElement.className = "optionRow";
		const keyElement = System.document.createElement("span");
		keyElement.className = "optionKey";
		keyElement.textContent = String(definitionIndex + 1);
		const labelElement = System.document.createElement("span");
		labelElement.className = "optionLabel";
		labelElement.textContent = definition.label;
		const stateElement = System.document.createElement("span");
		stateElement.className = "optionState";
		rowElement.appendChild(keyElement);
		rowElement.appendChild(labelElement);
		rowElement.appendChild(stateElement);
		rowElement.addEventListener("click", () => {
			toggleOption(definition.name);
		});
		optionPanelElement.appendChild(rowElement);
		optionRowElements[definition.name] = { rowElement: rowElement, stateElement: stateElement };
	});

	function refreshOptionPanel() {
		for (const definition of optionDefinitions) {
			const elements = optionRowElements[definition.name];
			const isOn = optionStates[definition.name];
			elements.stateElement.textContent = isOn ? "ON" : "OFF";
			elements.rowElement.classList.toggle("on", isOn);
		}
	}

	function toggleOption(optionName) {
		optionStates[optionName] = !optionStates[optionName];
		refreshOptionPanel();
	}
	refreshOptionPanel();

	//==============================================================================
	// 애셋 로드. (Microsoft Rocketbox 중년 남성 glb — 골격 + ARKit 블렌드셰이프 52종, 부위별 텍스처는 직접 로드)
	//==============================================================================
	const headModel = await SkinnedModel.loadFromUrl(webGL2RenderingContext, "./assets/character.glb", skinRenderer);
	const drawableList = headModel.getDrawableList();

	const imageDescriptionCache = new System.Map();
	async function loadAssetImage(fileName) {
		if (!fileName) {
			return null;
		}
		if (!imageDescriptionCache.has(fileName)) {
			const imageDescription = await Material.loadImageDescription("./assets/" + fileName, { flipY: false, isColorData: false, anisotropy: 8 });
			imageDescriptionCache.set(fileName, imageDescription);
		}
		return imageDescriptionCache.get(fileName);
	}

	const detailDescription = await loadAssetImage("skin_detail.jpg");
	let detailHeightTexture = null;
	const materialByKeyword = new System.Map();
	for (const definition of PART_MATERIAL_DEFINITIONS) {
		const description = Material.createDefaultDescription();
		description.baseColorImage = await loadAssetImage(definition.albedo);
		description.normalImage = await loadAssetImage(definition.normal);
		description.metallicRoughnessImage = await loadAssetImage(definition.roughness);
		description.opacityImage = await loadAssetImage(definition.opacity);
		description.roughnessFactor = definition.roughnessFactor;
		if (definition.baseColorFactor) {
			description.baseColorFactor = definition.baseColorFactor.slice();
		}
		const material = await Material.createFromDescription(webGL2RenderingContext, skinRenderer.getShaderProgram(), description);
		material.setSubsurfaceFactor(definition.subsurfaceFactor);
		if (definition.useDetail) {
			if (!detailHeightTexture) {
				detailHeightTexture = await material.createTexture(detailDescription, [128, 128, 128, 255]);
			}
			material.setTexture("detailHeightTexture", 9, detailHeightTexture);
		}
		materialByKeyword.set(definition.keyword, material);
	}
	for (let drawableIndex = 0; drawableIndex < drawableList.length; ++drawableIndex) {
		const drawable = drawableList[drawableIndex];
		for (const [keyword, material] of materialByKeyword) {
			if (drawable.materialName.includes(keyword)) {
				headModel.setMaterial(drawableIndex, material);
				break;
			}
		}
	}

	// 카메라 초점. (눈알 프리미티브의 정점 중심 = 눈 높이 — 캐릭터 키가 달라도 얼굴이 화면 중앙에 오도록)
	const eyeCenter = Vector3.create(0, 1.6, 0.1);
	for (const drawable of drawableList) {
		if (!drawable.materialName.includes("eyes")) {
			continue;
		}
		const positions = drawable.meshDescription.positions;
		const eyeVertexCount = positions.length / 3;
		let sumX = 0;
		let sumY = 0;
		let sumZ = 0;
		for (let vertexIndex = 0; vertexIndex < eyeVertexCount; ++vertexIndex) {
			sumX += positions[vertexIndex * 3];
			sumY += positions[vertexIndex * 3 + 1];
			sumZ += positions[vertexIndex * 3 + 2];
		}
		eyeCenter.set(sumX / eyeVertexCount, sumY / eyeVertexCount, sumZ / eyeVertexCount);
	}
	const CAMERA_TARGET = Vector3.create(eyeCenter.x, eyeCenter.y - 0.06, eyeCenter.z - 0.08);

	// 통계용 합계.
	let triangleCount = 0;
	let vertexCount = 0;
	let morphTargetCount = 0;
	for (const drawable of drawableList) {
		triangleCount += drawable.isIndexed ? drawable.indexCount / 3 : drawable.vertexCount / 3;
		vertexCount += drawable.vertexCount;
		morphTargetCount = System.Math.max(morphTargetCount, drawable.morphTargetList.length);
	}

	// 머티리얼 그래프용 축소본.
	async function createThumbnail(fileName) {
		const imageDescription = await loadAssetImage(fileName);
		const bitmap = await System.createImageBitmap(new System.Blob([imageDescription.bytes], { type: imageDescription.mimeType || "image/jpeg" }));
		const thumbnailCanvas = System.document.createElement("canvas");
		thumbnailCanvas.width = 96;
		thumbnailCanvas.height = 96;
		const thumbnailContext = thumbnailCanvas.getContext("2d");
		thumbnailContext.fillStyle = "#101012";
		thumbnailContext.fillRect(0, 0, 96, 96);
		thumbnailContext.imageSmoothingEnabled = true;
		thumbnailContext.imageSmoothingQuality = "high";
		thumbnailContext.drawImage(bitmap, 0, 0, 96, 96);
		bitmap.close();
		return thumbnailCanvas;
	}
	const thumbnails = {
		albedo: await createThumbnail("head_albedo.jpg"),
		normal: await createThumbnail("head_normal.jpg"),
		roughness: await createThumbnail("head_roughness.jpg"),
		detail: await createThumbnail("skin_detail.jpg"),
		body: await createThumbnail("body_albedo.jpg"),
		hair: await createThumbnail("hair.png"),
	};
	headModel.update(0);

	//==============================================================================
	// 표정. (ARKit 블렌드셰이프 가중치 프리셋 — 버튼으로 전환, 매 프레임 부드럽게 접근)
	// - 깜빡임과 호흡도 애셋의 표정 단위(눈 감기 / 가슴 팽창)를 그대로 쓴다.
	//==============================================================================
	const expressionResponse = await System.fetch("./assets/expressions.json");
	const expressionTable = await expressionResponse.json();
	const expressionUnitNameSet = new System.Set();
	for (const presetName in expressionTable) {
		for (const unitName in expressionTable[presetName]) {
			expressionUnitNameSet.add(unitName);
		}
	}
	const expressionState = {
		activeName: "neutral",
		targetWeights: new System.Map(),
		currentWeights: new System.Map(),
		nextBlinkTime: 2.5,
		blinkStartTime: -10,
	};
	for (const unitName of expressionUnitNameSet) {
		expressionState.targetWeights.set(unitName, 0);
		expressionState.currentWeights.set(unitName, 0);
	}

	const expressionPanelElement = System.document.getElementById("expressionPanel");
	const expressionButtonMap = new System.Map();
	for (const definition of EXPRESSION_DEFINITIONS) {
		if (!expressionTable[definition.name]) {
			continue;
		}
		const buttonElement = System.document.createElement("button");
		buttonElement.className = "expressionButton";
		buttonElement.textContent = definition.label;
		buttonElement.addEventListener("click", () => {
			selectExpression(definition.name);
		});
		expressionPanelElement.appendChild(buttonElement);
		expressionButtonMap.set(definition.name, buttonElement);
	}

	function selectExpression(presetName) {
		expressionState.activeName = presetName;
		const preset = expressionTable[presetName];
		for (const unitName of expressionUnitNameSet) {
			expressionState.targetWeights.set(unitName, preset[unitName] !== undefined ? preset[unitName] : 0);
		}
		for (const [name, buttonElement] of expressionButtonMap) {
			buttonElement.classList.toggle("active", name === presetName);
		}
	}
	selectExpression("neutral");

	function updateExpressions(elapsedTime, deltaTime) {
		const approach = System.Math.min(1, deltaTime * 6);
		for (const unitName of expressionUnitNameSet) {
			const currentWeight = expressionState.currentWeights.get(unitName);
			const targetWeight = expressionState.targetWeights.get(unitName);
			const nextWeight = currentWeight + (targetWeight - currentWeight) * approach;
			expressionState.currentWeights.set(unitName, nextWeight);
			headModel.setMorphWeight(unitName, nextWeight);
		}

		// 깜빡임. (눈 감기 단위 — 표정이 감은 만큼보다 크게 덮어쓴다)
		if (elapsedTime >= expressionState.nextBlinkTime) {
			expressionState.blinkStartTime = elapsedTime;
			expressionState.nextBlinkTime = elapsedTime + 2.8 + System.Math.random() * 3.6;
		}
		const blinkLocal = elapsedTime - expressionState.blinkStartTime;
		const blink = blinkLocal >= 0 && blinkLocal < 0.3 ? System.Math.sin(blinkLocal / 0.3 * System.Math.PI) : 0;
		const leftClosed = System.Math.max(expressionState.currentWeights.get("AK_09_EyeBlinkLeft") || 0, blink);
		const rightClosed = System.Math.max(expressionState.currentWeights.get("AK_10_EyeBlinkRight") || 0, blink);
		headModel.setMorphWeight("AK_09_EyeBlinkLeft", leftClosed);
		headModel.setMorphWeight("AK_10_EyeBlinkRight", rightClosed);
	}

	//==============================================================================
	// 머리 방향. (골격 head / neck 조인트 회전 오프셋 — 포인터 방향 + 느린 배회)
	//==============================================================================
	const headState = {
		currentYaw: 0,
		currentPitch: 0,
	};
	const pointerState = {
		normalizedX: 0,
		normalizedY: 0,
		hasMoved: false,
	};

	function updateHeadDirection(elapsedTime, deltaTime) {
		const wanderYaw = 0.08 * System.Math.sin(elapsedTime * 0.23) + 0.05 * System.Math.sin(elapsedTime * 0.61 + 1.3);
		const wanderPitch = 0.04 * System.Math.sin(elapsedTime * 0.31 + 0.6);
		const followYaw = pointerState.hasMoved ? pointerState.normalizedX * 0.42 : 0;
		const followPitch = pointerState.hasMoved ? pointerState.normalizedY * 0.22 : 0;
		const targetYaw = clampValue(wanderYaw + followYaw, -0.6, 0.6);
		const targetPitch = clampValue(wanderPitch + followPitch, -0.35, 0.35);
		const approach = System.Math.min(1, deltaTime * 2.2);
		headState.currentYaw += (targetYaw - headState.currentYaw) * approach;
		headState.currentPitch += (targetPitch - headState.currentPitch) * approach;
		headModel.setJointRotationOffset("Bip01 Head", Quaternion.createFromEuler(headState.currentPitch * 0.6, headState.currentYaw * 0.65, 0));
		headModel.setJointRotationOffset("Bip01 Neck", Quaternion.createFromEuler(headState.currentPitch * 0.4, headState.currentYaw * 0.35, 0));
	}

	//==============================================================================
	// 카메라 / 입력. (드래그 궤도 회전, 휠 / 핀치 줌, 포인터 이동 = 머리 방향)
	//==============================================================================
	const cameraState = {
		yaw: 0.16,
		pitch: 0.04,
		distance: 0.78,
		targetYaw: 0.16,
		targetPitch: 0.04,
		targetDistance: 0.78,
		isDragging: false,
		dragPointerId: -1,
		lastPointerX: 0,
		lastPointerY: 0,
	};
	const activePointerMap = new System.Map();
	const pinchState = {
		isPinching: false,
		lastDistance: 0,
	};

	function getPinchDistance() {
		const pointerList = System.Array.from(activePointerMap.values());
		const deltaX = pointerList[0].x - pointerList[1].x;
		const deltaY = pointerList[0].y - pointerList[1].y;
		return System.Math.sqrt(deltaX * deltaX + deltaY * deltaY);
	}

	canvas.addEventListener("pointerdown", (event) => {
		activePointerMap.set(event.pointerId, { x: event.clientX, y: event.clientY });
		canvas.setPointerCapture(event.pointerId);
		if (activePointerMap.size >= 2) {
			pinchState.isPinching = true;
			pinchState.lastDistance = getPinchDistance();
			cameraState.isDragging = false;
			cameraState.dragPointerId = -1;
			canvas.classList.remove("dragging");
			return;
		}
		cameraState.isDragging = true;
		cameraState.dragPointerId = event.pointerId;
		cameraState.lastPointerX = event.clientX;
		cameraState.lastPointerY = event.clientY;
		canvas.classList.add("dragging");
	});
	canvas.addEventListener("pointermove", (event) => {
		if (activePointerMap.has(event.pointerId)) {
			activePointerMap.set(event.pointerId, { x: event.clientX, y: event.clientY });
		}
		if (pinchState.isPinching && activePointerMap.size >= 2) {
			const pinchDistance = getPinchDistance();
			if (pinchState.lastDistance > 0) {
				const zoomRatio = pinchState.lastDistance / System.Math.max(pinchDistance, 1);
				cameraState.targetDistance = clampValue(cameraState.targetDistance * zoomRatio, CAMERA_MINIMUM_DISTANCE, CAMERA_MAXIMUM_DISTANCE);
			}
			pinchState.lastDistance = pinchDistance;
			return;
		}
		if (cameraState.isDragging && event.pointerId === cameraState.dragPointerId) {
			const deltaX = event.clientX - cameraState.lastPointerX;
			const deltaY = event.clientY - cameraState.lastPointerY;
			cameraState.lastPointerX = event.clientX;
			cameraState.lastPointerY = event.clientY;
			cameraState.targetYaw = clampValue(cameraState.targetYaw - deltaX * 0.006, -1.25, 1.25);
			cameraState.targetPitch = clampValue(cameraState.targetPitch + deltaY * 0.004, -0.4, 0.55);
			return;
		}
		pointerState.normalizedX = clampValue((event.clientX / System.window.innerWidth) * 2 - 1, -1, 1);
		pointerState.normalizedY = clampValue((event.clientY / System.window.innerHeight) * 2 - 1, -1, 1);
		pointerState.hasMoved = true;
	});
	function endDrag(event) {
		activePointerMap.delete(event.pointerId);
		if (activePointerMap.size < 2) {
			pinchState.isPinching = false;
			pinchState.lastDistance = 0;
		}
		if (event.pointerId === cameraState.dragPointerId) {
			cameraState.isDragging = false;
			cameraState.dragPointerId = -1;
			canvas.classList.remove("dragging");
		}
	}
	canvas.addEventListener("pointerup", endDrag);
	canvas.addEventListener("pointercancel", endDrag);
	canvas.addEventListener("wheel", (event) => {
		event.preventDefault();
		cameraState.targetDistance = clampValue(cameraState.targetDistance * (1 + event.deltaY * 0.0012), CAMERA_MINIMUM_DISTANCE, CAMERA_MAXIMUM_DISTANCE);
	}, { passive: false });
	System.window.addEventListener("keydown", (event) => {
		const optionIndex = System.parseInt(event.key, 10) - 1;
		if (optionIndex >= 0 && optionIndex < optionDefinitions.length) {
			toggleOption(optionDefinitions[optionIndex].name);
		}
	});

	//==============================================================================
	// 리사이즈.
	//==============================================================================
	function resizeCanvas() {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const displayWidth = System.Math.floor(canvas.clientWidth * devicePixelRatio);
		const displayHeight = System.Math.floor(canvas.clientHeight * devicePixelRatio);
		if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
			canvas.width = displayWidth;
			canvas.height = displayHeight;
			sceneRenderTarget.resize(displayWidth, displayHeight);
			hdrRenderTarget.resize(displayWidth, displayHeight);
			ldrRenderTarget.resize(displayWidth, displayHeight);
			subsurfaceEffect.resize(displayWidth, displayHeight);
			bloomEffect.resize(displayWidth, displayHeight);
		}
	}

	//==============================================================================
	// 머티리얼 그래프. (좌측 — 텍스처 입력부터 셰이딩 / MRT / SSS / 합성 / 포스트까지의 흐름을 노드로 표시)
	// - 텍스처는 축소본 이미지, 중간 버퍼는 매 프레임 GL 블릿으로 실시간 표시한다.
	//==============================================================================
	const GRAPH_PANEL_X = 18;
	const GRAPH_PANEL_Y = 18;
	const GRAPH_PANEL_WIDTH = 262;
	const GRAPH_PADDING = 12;
	const GRAPH_NODE_GAP = 8;
	const GRAPH_IMAGE_THUMBNAIL_SIZE = 44;
	const GRAPH_BUFFER_THUMBNAIL_WIDTH = 70;
	const GRAPH_LINE_HEIGHT = 13;
	const GRAPH_ACTIVE_TITLE_COLOR = "rgba(232, 201, 138, 0.95)";
	const GRAPH_INACTIVE_TITLE_COLOR = "rgba(232, 201, 138, 0.38)";
	const GRAPH_ACTIVE_TEXT_COLOR = "rgba(242, 236, 226, 0.74)";
	const GRAPH_INACTIVE_TEXT_COLOR = "rgba(242, 236, 226, 0.32)";
	const GRAPH_LABEL_COLOR = "rgba(242, 236, 226, 0.5)";

	function buildMaterialGraphNodes(buffers) {
		let activeUnitCount = 0;
		for (const unitName of expressionUnitNameSet) {
			if (expressionState.currentWeights.get(unitName) > 0.02) {
				activeUnitCount += 1;
			}
		}
		const nodes = [
			{
				title: "SKIN TEXTURES",
				isActive: true,
				lines: [],
				thumbnails: [
					{ label: "ALBEDO 2K", image: thumbnails.albedo },
					{ label: "NORMAL 2K", image: thumbnails.normal },
					{ label: "ROUGH 2K", image: thumbnails.roughness },
					{ label: "DETAIL 4K", image: thumbnails.detail },
				],
			},
			{
				title: "BODY, EYES AND HAIR",
				isActive: true,
				lines: ["eyes from the head atlas, hair and brow cards with alpha cutout", "no subsurface on eyes and hair"],
				thumbnails: [
					{ label: "BODY 2K", image: thumbnails.body },
					{ label: "HAIR CARDS", image: thumbnails.hair },
				],
			},
			{
				title: "SURFACE",
				isActive: true,
				lines: [
					"normal = displacement map x 1.5 + 4K height x " + (optionStates.detail ? "6" : "0"),
					"cavity = height - blur(height), roughness map x factor",
					"skin F0 0.028, eyes 0.04 glossy",
				],
				thumbnails: [],
			},
			{
				title: "LIGHTING",
				isActive: true,
				lines: [
					"key 2.6 warm, shadow " + (optionStates.shadow ? "on" : "off") + ", fill 0.85 cool, rim 1.4",
					"hemisphere ambient, dual-lobe GGX, sheen, env BRDF",
				],
				thumbnails: [],
			},
			{
				title: "G-BUFFER (MRT RGBA16F)",
				isActive: true,
				lines: [],
				thumbnails: [
					{ label: "IRRADIANCE", texture: buffers.irradianceTexture, displayScale: 0.5, useCoverage: 1 },
					{ label: "ALBEDO", texture: buffers.albedoTexture, displayScale: 1.6, useCoverage: 1 },
					{ label: "SPECULAR", texture: buffers.specularTexture, displayScale: 3, useCoverage: 1 },
				],
			},
			{
				title: "SUBSURFACE AND COMBINE",
				isActive: optionStates.subsurface,
				lines: ["separable SSS, width 8 mm, depth aware", "irradiance x albedo + specular + background"],
				thumbnails: [
					{ label: "SCATTERED", texture: buffers.scatteredIrradianceTexture, displayScale: 0.5, useCoverage: 1 },
					{ label: "HDR", texture: buffers.hdrColorTexture, displayScale: 0.72, useCoverage: 0 },
				],
			},
			{
				title: "EXPRESSION",
				isActive: true,
				lines: ["preset " + expressionState.activeName + ", " + morphTargetCount + " ARKit units, " + activeUnitCount + " active", "blink from eye blink units, head via bones"],
				thumbnails: [],
			},
			{
				title: "POST",
				isActive: true,
				lines: ["bloom " + (optionStates.bloom ? "on" : "off") + ", ACES, vignette, grain, FXAA " + (optionStates.antialias ? "on" : "off")],
				thumbnails: [],
			},
		];
		return nodes;
	}

	function layoutMaterialGraph(nodes, aspectRatio) {
		const contentWidth = GRAPH_PANEL_WIDTH - GRAPH_PADDING * 2;
		let cursorY = GRAPH_PANEL_Y + GRAPH_PADDING;
		for (const node of nodes) {
			node.x = GRAPH_PANEL_X + GRAPH_PADDING;
			node.y = cursorY;
			let contentY = node.y + 22;
			if (node.thumbnails.length > 0) {
				const isImageRow = node.thumbnails[0].image !== undefined;
				const thumbnailWidth = isImageRow ? GRAPH_IMAGE_THUMBNAIL_SIZE : GRAPH_BUFFER_THUMBNAIL_WIDTH;
				const thumbnailHeight = isImageRow ? GRAPH_IMAGE_THUMBNAIL_SIZE : System.Math.round(GRAPH_BUFFER_THUMBNAIL_WIDTH / aspectRatio);
				const spacing = clampValue((contentWidth - 16 - node.thumbnails.length * thumbnailWidth) / System.Math.max(node.thumbnails.length - 1, 1), 6, 26);
				for (let thumbnailIndex = 0; thumbnailIndex < node.thumbnails.length; ++thumbnailIndex) {
					const thumbnail = node.thumbnails[thumbnailIndex];
					thumbnail.x = node.x + 8 + thumbnailIndex * (thumbnailWidth + spacing);
					thumbnail.y = contentY;
					thumbnail.width = thumbnailWidth;
					thumbnail.height = thumbnailHeight;
				}
				contentY += thumbnailHeight + 14;
			}
			node.textY = contentY;
			contentY += node.lines.length * GRAPH_LINE_HEIGHT;
			node.width = contentWidth;
			node.height = contentY - node.y + 8;
			cursorY = node.y + node.height + GRAPH_NODE_GAP;
		}
		const panelHeight = cursorY - GRAPH_NODE_GAP + GRAPH_PADDING - GRAPH_PANEL_Y;
		return panelHeight;
	}

	function renderMaterialGraph(buffers) {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const cssHeight = System.window.innerHeight;
		const aspectRatio = canvas.width / canvas.height;
		const nodes = buildMaterialGraphNodes(buffers);
		const panelHeight = layoutMaterialGraph(nodes, aspectRatio);
		const graphScale = System.Math.min(1, (cssHeight - 96) / panelHeight);
		let previewDrawCallCount = 0;

		// 1. 패널 / 노드 배경. (엔진 Graphic)
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFunc(webGL2RenderingContext.ONE, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio * graphScale, devicePixelRatio * graphScale);
		uiGraphic.setGlobalAlpha(1);
		const panelRect = Rect.create(GRAPH_PANEL_X, GRAPH_PANEL_Y, GRAPH_PANEL_WIDTH, panelHeight);
		uiGraphic.setFillColor("rgba(14, 12, 14, 0.55)");
		uiGraphic.drawRoundRect(panelRect, 12);
		uiGraphic.setStrokeColor("rgba(242, 236, 226, 0.14)");
		uiGraphic.drawStrokeRoundRect(panelRect, 12, 1);
		for (const node of nodes) {
			const nodeRect = Rect.create(node.x, node.y, node.width, node.height);
			uiGraphic.setFillColor(node.isActive ? "rgba(255, 255, 255, 0.045)" : "rgba(255, 255, 255, 0.02)");
			uiGraphic.drawRoundRect(nodeRect, 8);
			for (const thumbnail of node.thumbnails) {
				uiGraphic.setFillColor("rgba(0, 0, 0, 0.4)");
				uiGraphic.drawRect(Rect.create(thumbnail.x, thumbnail.y, thumbnail.width, thumbnail.height));
			}
		}

		// 2. 중간 버퍼 블릿. (뷰포트를 썸네일 사각형으로 제한)
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		previewPass.use();
		webGL2RenderingContext.uniform1i(previewPass.getUniformLocation("sourceTexture"), 0);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		const pixelScale = devicePixelRatio * graphScale;
		for (const node of nodes) {
			for (const thumbnail of node.thumbnails) {
				if (!thumbnail.texture) {
					continue;
				}
				const viewportX = System.Math.round(thumbnail.x * pixelScale);
				const viewportY = System.Math.round(canvas.height - (thumbnail.y + thumbnail.height) * pixelScale);
				const viewportWidth = System.Math.round(thumbnail.width * pixelScale);
				const viewportHeight = System.Math.round(thumbnail.height * pixelScale);
				webGL2RenderingContext.viewport(viewportX, viewportY, viewportWidth, viewportHeight);
				webGL2RenderingContext.uniform1f(previewPass.getUniformLocation("displayScale"), thumbnail.displayScale);
				webGL2RenderingContext.uniform1i(previewPass.getUniformLocation("useCoverage"), thumbnail.useCoverage);
				webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, thumbnail.texture);
				previewPass.draw();
				previewDrawCallCount += 1;
			}
		}
		webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);

		// 3. 텍스처 축소본 / 제목 / 설명 / 연결선. (엔진 Graphic)
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio * graphScale, devicePixelRatio * graphScale);
		uiGraphic.setTextBaseline("middle");
		uiGraphic.setTextAlign("left");
		for (let nodeIndex = 0; nodeIndex < nodes.length; ++nodeIndex) {
			const node = nodes[nodeIndex];
			uiGraphic.setGlobalAlpha(1);
			for (const thumbnail of node.thumbnails) {
				if (thumbnail.image) {
					uiGraphic.setGlobalAlpha(node.isActive ? 1 : 0.4);
					uiGraphic.drawImage(thumbnail.image, Vector2.create(thumbnail.x, thumbnail.y), Vector2.create(thumbnail.width, thumbnail.height));
					uiGraphic.setGlobalAlpha(1);
				}
				uiGraphic.setStrokeColor("rgba(242, 236, 226, 0.18)");
				uiGraphic.drawStrokeRect(Rect.create(thumbnail.x, thumbnail.y, thumbnail.width, thumbnail.height), 1);
				uiGraphic.setFontString(`400 8px "Segoe UI", "Malgun Gothic", sans-serif`);
				uiGraphic.setFillColor(GRAPH_LABEL_COLOR);
				uiGraphic.drawFillText(thumbnail.label, thumbnail.x, thumbnail.y + thumbnail.height + 7);
			}
			uiGraphic.setFontString(`600 9.5px "Segoe UI", "Malgun Gothic", sans-serif`);
			uiGraphic.setFillColor(node.isActive ? GRAPH_ACTIVE_TITLE_COLOR : GRAPH_INACTIVE_TITLE_COLOR);
			uiGraphic.drawFillText(node.title, node.x + 8, node.y + 11);
			uiGraphic.setFontString(`400 9px "Segoe UI", "Malgun Gothic", sans-serif`);
			uiGraphic.setFillColor(node.isActive ? GRAPH_ACTIVE_TEXT_COLOR : GRAPH_INACTIVE_TEXT_COLOR);
			for (let lineIndex = 0; lineIndex < node.lines.length; ++lineIndex) {
				uiGraphic.drawFillText(node.lines[lineIndex], node.x + 8, node.textY + lineIndex * GRAPH_LINE_HEIGHT + 6);
			}
			if (nodeIndex < nodes.length - 1) {
				const connectorX = node.x + 22;
				const connectorTop = node.y + node.height;
				uiGraphic.setStrokeColor("rgba(232, 201, 138, 0.5)");
				uiGraphic.drawLine([Vector2.create(connectorX, connectorTop), Vector2.create(connectorX, connectorTop + GRAPH_NODE_GAP)], 1);
				uiGraphic.setFillColor("rgba(232, 201, 138, 0.8)");
				uiGraphic.drawCircle(Vector2.create(connectorX, connectorTop + GRAPH_NODE_GAP * 0.5), 1.8);
			}
		}
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		return previewDrawCallCount;
	}

	//==============================================================================
	// HUD. (우측 하단 렌더링 정보 — 엔진 Graphic 으로 캔버스 안에 렌더링, 홈 링크와 겹치면 그 위로)
	//==============================================================================
	const statistics = {
		smoothedFrameSeconds: 1 / 60,
		drawCallCount: 0,
	};
	const homeLinkElement = System.document.getElementById("homeLink");

	function renderHud() {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const cssWidth = System.window.innerWidth;
		const cssHeight = System.window.innerHeight;
		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio, devicePixelRatio);
		uiGraphic.setGlobalAlpha(1);

		const rowHeight = 16;
		const rows = [
			["fps", System.Math.round(1 / System.Math.max(statistics.smoothedFrameSeconds, 0.0001)).toString()],
			["render", canvas.width + " x " + canvas.height],
			["triangles", System.Math.round(triangleCount).toLocaleString("en-US")],
			["vertices", vertexCount.toLocaleString("en-US")],
			["draw calls", statistics.drawCallCount.toString()],
			["morph targets", morphTargetCount.toString()],
		];
		const panelWidth = 178;
		const panelHeight = rows.length * rowHeight + 18;
		const panelX = cssWidth - panelWidth - 18;
		let panelY = cssHeight - panelHeight - 18;
		const homeLinkRect = homeLinkElement.getBoundingClientRect();
		const isOverlappingHomeLink = homeLinkRect.right > panelX && homeLinkRect.top < panelY + panelHeight;
		if (isOverlappingHomeLink) {
			panelY = homeLinkRect.top - panelHeight - 12;
		}
		const panelRect = Rect.create(panelX, panelY, panelWidth, panelHeight);
		uiGraphic.setFillColor("rgba(14, 12, 14, 0.55)");
		uiGraphic.drawRoundRect(panelRect, 10);
		uiGraphic.setStrokeColor("rgba(242, 236, 226, 0.14)");
		uiGraphic.drawStrokeRoundRect(panelRect, 10, 1);
		uiGraphic.setFontString(`400 10.5px "Segoe UI", "Malgun Gothic", sans-serif`);
		uiGraphic.setTextBaseline("middle");
		for (let rowIndex = 0; rowIndex < rows.length; ++rowIndex) {
			const rowY = panelY + 9 + rowHeight * rowIndex + rowHeight * 0.5;
			uiGraphic.setTextAlign("left");
			uiGraphic.setFillColor("rgba(242, 236, 226, 0.45)");
			uiGraphic.drawFillText(rows[rowIndex][0], panelX + 14, rowY);
			uiGraphic.setTextAlign("right");
			uiGraphic.setFillColor("rgba(242, 236, 226, 0.88)");
			uiGraphic.drawFillText(rows[rowIndex][1], panelX + panelWidth - 14, rowY);
		}
	}

	//==============================================================================
	// 메인 루프. (섀도우 깊이 → 피부 MRT → 화면 공간 SSS → 합성(HDR) → 블룸 → 톤 매핑 → FXAA → 와이어프레임 → 머티리얼 그래프 → HUD)
	//==============================================================================
	const startTimestamp = System.performance.now();
	let previousTimestamp = startTimestamp;
	const identityModelMatrix = Matrix4.createIdentity();
	const identityModelElements = identityModelMatrix.getElements();
	const shadowFocusPosition = Vector3.create(eyeCenter.x, eyeCenter.y - 0.08, eyeCenter.z - 0.09);
	const shadowLightTravelDirection = KEY_LIGHT_DIRECTION.multiply(-1);

	function renderFrame() {
		resizeCanvas();
		const currentTimestamp = System.performance.now();
		const elapsedTime = (currentTimestamp - startTimestamp) / 1000;
		const deltaTime = System.Math.min((currentTimestamp - previousTimestamp) / 1000, 0.1);
		previousTimestamp = currentTimestamp;
		statistics.smoothedFrameSeconds = statistics.smoothedFrameSeconds * 0.92 + deltaTime * 0.08;
		const aspectRatio = canvas.width / canvas.height;
		let drawCallCount = 0;

		// 카메라. (목표값 지수 접근 + 미세한 자동 흔들림)
		const cameraApproach = System.Math.min(1, deltaTime * 5);
		cameraState.yaw += (cameraState.targetYaw - cameraState.yaw) * cameraApproach;
		cameraState.pitch += (cameraState.targetPitch - cameraState.pitch) * cameraApproach;
		cameraState.distance += (cameraState.targetDistance - cameraState.distance) * cameraApproach;
		const swayYaw = cameraState.yaw + System.Math.sin(elapsedTime * 0.19) * 0.02;
		const swayPitch = cameraState.pitch + System.Math.sin(elapsedTime * 0.27 + 1) * 0.01;
		const cameraX = CAMERA_TARGET.x + System.Math.sin(swayYaw) * System.Math.cos(swayPitch) * cameraState.distance;
		const cameraY = CAMERA_TARGET.y + System.Math.sin(swayPitch) * cameraState.distance;
		const cameraZ = CAMERA_TARGET.z + System.Math.cos(swayYaw) * System.Math.cos(swayPitch) * cameraState.distance;
		const cameraPosition = Vector3.create(cameraX, cameraY, cameraZ);
		const viewMatrix = Matrix4.createLookAt(cameraPosition, CAMERA_TARGET, Vector3.up());
		const projectionMatrix = Matrix4.createPerspective(CAMERA_FIELD_OF_VIEW, aspectRatio, CAMERA_NEAR_DISTANCE, CAMERA_FAR_DISTANCE);
		const viewProjectionMatrix = projectionMatrix.clone();
		viewProjectionMatrix.multiply(viewMatrix);
		const viewProjectionElements = viewProjectionMatrix.getElements();

		// 표정 / 머리 방향 / 스키닝 갱신.
		updateExpressions(elapsedTime, deltaTime);
		updateHeadDirection(elapsedTime, deltaTime);
		skinRenderer.setDetailStrength(optionStates.detail ? 3.5 : 0);
		skinRenderer.setCavityStrength(optionStates.detail ? 2.5 : 0);
		headModel.update(deltaTime);

		// === 1. 섀도우 깊이 패스 (키 라이트) ===
		webGL2RenderingContext.enable(webGL2RenderingContext.CULL_FACE);
		webGL2RenderingContext.cullFace(webGL2RenderingContext.BACK);
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		shadowMap.updateLightMatrix(shadowFocusPosition, shadowLightTravelDirection, 0.45, 0.2, 4);
		const lightViewProjectionMatrix = shadowMap.getLightViewProjectionMatrix();
		const lightViewProjectionElements = lightViewProjectionMatrix.getElements();
		if (optionStates.shadow) {
			shadowMap.beginRender();
			skinRenderer.drawDepth(headModel, lightViewProjectionElements, identityModelElements);
			drawCallCount += drawableList.length;
		}
		const shadowDepthTexture = shadowMap.getDepthTexture();
		skinRenderer.setShadowMap(shadowDepthTexture, lightViewProjectionElements, 1 / SHADOWMAP_RESOLUTION);
		skinRenderer.setShadowStrength(optionStates.shadow ? 0.85 : 0);

		// === 2. 피부 MRT 패스 (조도 / 알베도 / 스펙큘러 + 깊이) ===
		sceneRenderTarget.bind();
		webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
		webGL2RenderingContext.depthMask(true);
		webGL2RenderingContext.clearColor(0, 0, 0, 0);
		webGL2RenderingContext.clear(webGL2RenderingContext.COLOR_BUFFER_BIT | webGL2RenderingContext.DEPTH_BUFFER_BIT);
		skinRenderer.draw(headModel, viewProjectionElements, identityModelElements, cameraX, cameraY, cameraZ);
		drawCallCount += drawableList.length;

		// === 3. 화면 공간 서브서피스 스캐터링 ===
		const irradianceTexture = sceneRenderTarget.getColorTexture(0);
		const albedoTexture = sceneRenderTarget.getColorTexture(1);
		const specularTexture = sceneRenderTarget.getColorTexture(2);
		const sceneDepthTexture = sceneRenderTarget.getDepthTexture();
		let scatteredIrradianceTexture = irradianceTexture;
		if (optionStates.subsurface) {
			subsurfaceEffect.render(irradianceTexture, sceneDepthTexture, CAMERA_FIELD_OF_VIEW, aspectRatio, CAMERA_NEAR_DISTANCE, CAMERA_FAR_DISTANCE);
			scatteredIrradianceTexture = subsurfaceEffect.getResultTexture();
			drawCallCount += 2;
		}

		// === 4. 합성 → HDR (조도 x 알베도 + 스펙큘러 + 배경) ===
		hdrRenderTarget.bind();
		webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
		combinePass.use();
		webGL2RenderingContext.uniform1i(combinePass.getUniformLocation("irradianceTexture"), 0);
		webGL2RenderingContext.uniform1i(combinePass.getUniformLocation("albedoTexture"), 1);
		webGL2RenderingContext.uniform1i(combinePass.getUniformLocation("specularTexture"), 2);
		webGL2RenderingContext.uniform1f(combinePass.getUniformLocation("aspectRatio"), aspectRatio);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, scatteredIrradianceTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, albedoTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE2);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, specularTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		combinePass.draw();
		drawCallCount += 1;

		// === 5. 블룸 ===
		const hdrColorTexture = hdrRenderTarget.getColorTexture();
		if (optionStates.bloom) {
			bloomEffect.render(hdrColorTexture);
			const bloomIterationCount = bloomEffect.getIterationCount();
			drawCallCount += 1 + bloomIterationCount * 2;
		}

		// === 6. 톤 매핑 합성 → LDR (FXAA 켜짐) 또는 화면 ===
		if (optionStates.antialias) {
			ldrRenderTarget.bind();
		}
		else {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
		}
		compositePass.use();
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("sceneTexture"), 0);
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("bloomTexture"), 1);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("exposure"), 0.72);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("bloomStrength"), optionStates.bloom ? 0.12 : 0);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("vignetteStrength"), 0.5);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("grainStrength"), 0.018);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("elapsedTime"), elapsedTime);
		webGL2RenderingContext.uniform2f(compositePass.getUniformLocation("resolution"), canvas.width, canvas.height);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, hdrColorTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		const bloomResultTexture = optionStates.bloom ? bloomEffect.getResultTexture() : hdrColorTexture;
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, bloomResultTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		compositePass.draw();
		drawCallCount += 1;

		// === 7. FXAA → 화면 ===
		if (optionStates.antialias) {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
			antialiasPass.use();
			webGL2RenderingContext.uniform1i(antialiasPass.getUniformLocation("sourceTexture"), 0);
			webGL2RenderingContext.uniform2f(antialiasPass.getUniformLocation("texelSize"), 1 / canvas.width, 1 / canvas.height);
			const ldrColorTexture = ldrRenderTarget.getColorTexture();
			webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, ldrColorTexture);
			antialiasPass.draw();
			drawCallCount += 1;
		}

		// === 8. 와이어프레임 (화면 깊이 프리패스로 앞면 모서리만 — 모프 / 스키닝 반영) ===
		if (optionStates.wireframe) {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
			webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
			webGL2RenderingContext.depthMask(true);
			webGL2RenderingContext.clear(webGL2RenderingContext.DEPTH_BUFFER_BIT);
			webGL2RenderingContext.colorMask(false, false, false, false);
			webGL2RenderingContext.enable(webGL2RenderingContext.POLYGON_OFFSET_FILL);
			webGL2RenderingContext.polygonOffset(1.5, 2);
			skinRenderer.drawDepth(headModel, viewProjectionElements, identityModelElements);
			webGL2RenderingContext.disable(webGL2RenderingContext.POLYGON_OFFSET_FILL);
			webGL2RenderingContext.colorMask(true, true, true, true);
			webGL2RenderingContext.depthMask(false);
			webGL2RenderingContext.depthFunc(webGL2RenderingContext.LEQUAL);
			webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
			webGL2RenderingContext.blendFunc(webGL2RenderingContext.SRC_ALPHA, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
			skinRenderer.drawWireframe(headModel, viewProjectionElements, identityModelElements, 0.91, 0.79, 0.54, 0.55);
			webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
			webGL2RenderingContext.depthMask(true);
			webGL2RenderingContext.depthFunc(webGL2RenderingContext.LESS);
			webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
			drawCallCount += drawableList.length * 2;
		}

		// === 9. 머티리얼 그래프 (좌측 — 텍스처 / 셰이딩 흐름 + 중간 버퍼 실시간 미리보기) ===
		webGL2RenderingContext.disable(webGL2RenderingContext.CULL_FACE);
		if (optionStates.materialGraph) {
			drawCallCount += renderMaterialGraph({
				irradianceTexture: irradianceTexture,
				albedoTexture: albedoTexture,
				specularTexture: specularTexture,
				scatteredIrradianceTexture: scatteredIrradianceTexture,
				hdrColorTexture: hdrColorTexture,
			});
		}

		// === 10. HUD (엔진 Graphic — 프리멀티플라이드 알파 블렌딩, 컬링 해제) ===
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFunc(webGL2RenderingContext.ONE, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
		statistics.drawCallCount = drawCallCount;
		renderHud();
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);

		System.window.requestAnimationFrame(renderFrame);
	}

	System.document.getElementById("loadingOverlay").classList.add("hidden");
	System.window.requestAnimationFrame(renderFrame);
	</script>
</body>
</html>
