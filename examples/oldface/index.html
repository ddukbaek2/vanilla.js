		{ group: "EYES", name: "irisSize", label: "IRIS SIZE", minimum: 0.1, maximum: 0.18, step: 0.002, value: 0.14, format: (value) => value.toFixed(3) },
		{ group: "EYES", name: "pupilSize", label: "PUPIL SIZE", minimum: 0.015, maximum: 0.075, step: 0.001, value: 0.042, format: (value) => value.toFixed(3) },
		{ group: "EYES", name: "irisDepth", label: "IRIS DEPTH", minimum: 0, maximum: 0.1, step: 0.005, value: 0.05, format: (value) => value.toFixed(3) },
		{ group: "ANIMATION", name: "headFollow", label: "HEAD FOLLOW POINTER", minimum: 0, maximum: 1, step: 0.05, value: 0, format: (value) => value.toFixed(2) },
		{ group: "ANIMATION", name: "blinkRate", label: "BLINK RATE", minimum: 0, maximum: 2, step: 0.1, value: 1, format: (value) => value.toFixed(1) + "X" },
	];
	const sliderStates = {};
	const sliderValueElements = {};
	let previousGroupName = null;
	for (const definition of sliderDefinitions) {
		sliderStates[definition.name] = definition.value;
		if (definition.group !== previousGroupName) {
			const groupElement = System.document.createElement("div");
			groupElement.className = "optionGroup";
			groupElement.textContent = definition.group;
			optionPanelElement.appendChild(groupElement);
			previousGroupName = definition.group;
		}
		const rowElement = System.document.createElement("div");
		rowElement.className = "sliderRow";
		const labelElement = System.document.createElement("span");
		labelElement.className = "sliderLabel";
		labelElement.textContent = definition.label;
		const inputElement = System.document.createElement("input");
		inputElement.className = "sliderInput";
		inputElement.dataset.sliderName = definition.name;
		inputElement.type = "range";
		inputElement.min = String(definition.minimum);
		inputElement.max = String(definition.maximum);
		inputElement.step = String(definition.step);
		inputElement.value = String(definition.value);
		const valueElement = System.document.createElement("span");
		valueElement.className = "sliderValue";
		valueElement.textContent = definition.format(definition.value);
		inputElement.addEventListener("input", () => {
			const value = System.Number(inputElement.value);
			sliderStates[definition.name] = value;
			valueElement.textContent = definition.format(value);
			onSliderChanged(definition.name, value);
		});
		rowElement.appendChild(labelElement);
		rowElement.appendChild(inputElement);
		rowElement.appendChild(valueElement);
		optionPanelElement.appendChild(rowElement);
		sliderValueElements[definition.name] = valueElement;
	}
	// 옵션 리셋. (토글 / 슬라이더를 정의된 기본값으로 — 모델 / 텍스처 / 섀도우 변경 처리도 그대로 탄다)
	const sliderInputElements = {};
	for (const inputElement of optionPanelElement.querySelectorAll("input[type=range]")) {
		sliderInputElements[inputElement.dataset.sliderName] = inputElement;
	}
	function resetOptions() {
		for (const definition of optionDefinitions) {
			optionStates[definition.name] = DEFAULT_OPTION_STATES[definition.name];
		}
		refreshOptionPanel();
		for (const definition of sliderDefinitions) {
			if (sliderStates[definition.name] === definition.value) {
				continue;
			}
			sliderStates[definition.name] = definition.value;
			sliderInputElements[definition.name].value = String(definition.value);
			sliderValueElements[definition.name].textContent = definition.format(definition.value);
			onSliderChanged(definition.name, definition.value);
		}
	}

	// 우클릭 컨텍스트 메뉴. (브라우저 메뉴 대신 — 회전 리셋 / 옵션 리셋 / 머티리얼 그래프)
	const contextMenuElement = System.document.getElementById("contextMenu");
	const CONTEXT_MENU_ITEMS = [
		{ label: "RESET VIEW", action: () => { resetView(); } },
		{ label: "RESET OPTIONS", action: () => { resetOptions(); } },
		{ label: "TOGGLE MATERIAL GRAPH", action: () => { toggleOption("materialGraph"); } },
	];
	for (const item of CONTEXT_MENU_ITEMS) {
		const itemElement = System.document.createElement("div");
		itemElement.className = "contextItem";
		itemElement.textContent = item.label;
		itemElement.addEventListener("click", () => {
			contextMenuElement.classList.remove("open");
			item.action();
		});
		contextMenuElement.appendChild(itemElement);
	}
	System.document.addEventListener("contextmenu", (event) => {
		event.preventDefault();
		if (event.target.closest("#optionPanel") || event.target.closest("#expressionPanel")) {
			return;
		}
		const menuWidth = contextMenuElement.offsetWidth || 180;
		const menuHeight = contextMenuElement.offsetHeight || 110;
		contextMenuElement.style.left = System.Math.min(event.clientX, System.window.innerWidth - menuWidth - 8) + "px";
		contextMenuElement.style.top = System.Math.min(event.clientY, System.window.innerHeight - menuHeight - 8) + "px";
		contextMenuElement.classList.add("open");
	});
	System.document.addEventListener("pointerdown", (event) => {
		if (!event.target.closest("#contextMenu")) {
			contextMenuElement.classList.remove("open");
		}
	});

	// 슬라이더 조작 중 캔버스 카메라 입력을 막는다.
	optionPanelElement.addEventListener("pointerdown", (event) => {
		event.stopPropagation();
	});
	optionPanelElement.addEventListener("wheel", (event) => {
		event.stopPropagation();
	});

	//==============================================================================
	// 애셋 로드. (메타휴먼 얼굴 glb — DNA 의 RigLogic 을 굽은 ARKit 셰이프키, 부위별 텍스처는 직접 로드)
	//==============================================================================
	// 머리 LOD 와 머리카락 단계는 별도 glb — 슬라이더로 바꾸면 필요할 때 로드해 캐시한다.
	const modelCache = new System.Map();
	async function loadModelFile(fileName) {
		if (!modelCache.has(fileName)) {
			const model = await SkinnedModel.loadFromUrl(webGL2RenderingContext, "./assets/" + fileName, skinRenderer);
			assignMaterials(model);
			model.update(0);
			modelCache.set(fileName, model);
			if (loadingProgress.completed < loadingProgress.total) {
				advanceLoading(fileName);
			}
		}
		return modelCache.get(fileName);
	}
	const materialByKeyword = new System.Map();
	function assignMaterials(model) {
		const modelDrawableList = model.getDrawableList();
		for (let drawableIndex = 0; drawableIndex < modelDrawableList.length; ++drawableIndex) {
			const drawable = modelDrawableList[drawableIndex];
			for (const [keyword, material] of materialByKeyword) {
				if (drawable.materialName.includes(keyword)) {
					model.setMaterial(drawableIndex, material);
					break;
				}
			}
		}
	}
	let headModel = null;
	let hairModel = null;
	function getActiveModels() {
		const models = [];
		if (headModel) {
			models.push(headModel);
		}
		if (hairModel) {
			models.push(hairModel);
		}
		return models;
	}

	// 로딩 진행. (텍스처 파일 + 모델 + 표정 / 주름 정의 — 항목 완료 수 기준)
	const loadingProgress = { completed: 0, total: 0 };
	const loadingFillElement = System.document.getElementById("loadingFill");
	const loadingDetailElement = System.document.getElementById("loadingDetail");
	function advanceLoading(itemName) {
		loadingProgress.completed += 1;
		const ratio = loadingProgress.total > 0 ? System.Math.min(1, loadingProgress.completed / loadingProgress.total) : 0;
		loadingFillElement.style.width = (ratio * 100).toFixed(1) + "%";
		loadingDetailElement.textContent = itemName.toUpperCase() + "  " + loadingProgress.completed + " / " + loadingProgress.total;
	}
	{
		const assetFileSet = new System.Set();
		for (const definition of PART_MATERIAL_DEFINITIONS) {
			for (const fileName of [definition.albedo, definition.normal, definition.roughness, definition.specular, definition.opacity]) {
				if (fileName) {
					assetFileSet.add(fileName);
				}
			}
			for (const slotName in definition.extra) {
				assetFileSet.add(definition.extra[slotName]);
			}
		}
		assetFileSet.add("skin_detail.jpg");
		loadingProgress.total = assetFileSet.size + 2 + 2;
	}
	const imageDescriptionCache = new System.Map();
	// PNG / JPEG 헤더에서 크기를 읽는다. (텍스처 GPU 메모리 추정 — 디코드 없이)
	function readImageSize(bytes) {
		if (bytes.length > 24 && bytes[0] === 0x89 && bytes[1] === 0x50) {
			const view = new System.DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
			return { width: view.getUint32(16), height: view.getUint32(20) };
		}
		let offset = 2;
		while (offset + 9 < bytes.length) {
			if (bytes[offset] !== 0xFF) {
				offset += 1;
				continue;
			}
			const marker = bytes[offset + 1];
			const segmentLength = (bytes[offset + 2] << 8) | bytes[offset + 3];
			if (marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {
				return { width: (bytes[offset + 7] << 8) | bytes[offset + 8], height: (bytes[offset + 5] << 8) | bytes[offset + 6] };
			}
			offset += 2 + segmentLength;
		}
		return { width: 0, height: 0 };
	}
	async function loadAssetImage(fileName) {
		if (!fileName) {
			return null;
		}
		if (!imageDescriptionCache.has(fileName)) {
			const imageDescription = await Material.loadImageDescription("./assets/" + fileName, { flipY: false, isColorData: false, anisotropy: 8 });
			imageDescription.size = readImageSize(imageDescription.bytes);
			imageDescriptionCache.set(fileName, imageDescription);
			advanceLoading(fileName);
		}
		return imageDescriptionCache.get(fileName);
	}

	const detailDescription = await loadAssetImage("skin_detail.jpg");
	let detailHeightTexture = null;
	for (const definition of PART_MATERIAL_DEFINITIONS) {
		const description = Material.createDefaultDescription();
		description.baseColorImage = await loadAssetImage(definition.albedo);
		description.normalImage = await loadAssetImage(definition.normal);
		description.metallicRoughnessImage = await loadAssetImage(definition.roughness);
		description.specularImage = await loadAssetImage(definition.specular);
		description.opacityImage = await loadAssetImage(definition.opacity);
		description.roughnessFactor = definition.roughnessFactor;
		if (definition.baseColorFactor) {
			description.baseColorFactor = definition.baseColorFactor.slice();
		}
		const material = await Material.createFromDescription(webGL2RenderingContext, skinRenderer.getShaderProgram(), description);
		material.setSubsurfaceFactor(definition.subsurfaceFactor);
		if (definition.useDetail) {
			if (!detailHeightTexture) {
				detailHeightTexture = await material.createTexture(detailDescription, [128, 128, 128, 255]);
			}
			material.setTexture("detailHeightTexture", SKIN_TEXTURE_UNIT_DETAILHEIGHT, detailHeightTexture);
		}
		for (const slotName in definition.extra) {
			const extraDescription = await loadAssetImage(definition.extra[slotName]);
			const extraTexture = await material.createTexture(extraDescription, [128, 128, 255, 255]);
			material.setTexture(slotName + "Texture", EXTRA_TEXTURE_UNITS[slotName], extraTexture);
		}
		skinRenderer.setMaterialShading(material, SHADING_MODE_BY_NAME[definition.shading]);
		materialByKeyword.set(definition.keyword, material);
	}
	headModel = await loadModelFile(HEAD_LOD_FILES[2 - sliderStates.headLod]);
	hairModel = HAIR_LEVEL_DEFINITIONS[sliderStates.hairQuality].file ? await loadModelFile(HAIR_LEVEL_DEFINITIONS[sliderStates.hairQuality].file) : null;
	const drawableList = headModel.getDrawableList();

	// 카메라 초점. (양쪽 눈알 프리미티브 정점의 평균 = 두 눈 사이 — 캐릭터 키가 달라도 얼굴이 화면 정중앙에 오도록)
	const eyeCenter = Vector3.create(0, 1.6, 0.1);
	{
		let sumX = 0;
		let sumY = 0;
		let sumZ = 0;
		let eyeVertexCount = 0;
		for (const drawable of drawableList) {
			if (!drawable.materialName.includes("eyeball")) {
				continue;
			}
			const positions = drawable.meshDescription.positions;
			const vertexCountOfEye = positions.length / 3;
			for (let vertexIndex = 0; vertexIndex < vertexCountOfEye; ++vertexIndex) {
				sumX += positions[vertexIndex * 3];
				sumY += positions[vertexIndex * 3 + 1];
				sumZ += positions[vertexIndex * 3 + 2];
			}
			eyeVertexCount += vertexCountOfEye;
		}
		if (eyeVertexCount > 0) {
			eyeCenter.set(sumX / eyeVertexCount, sumY / eyeVertexCount, sumZ / eyeVertexCount);
		}
	}
	const CAMERA_TARGET = Vector3.create(eyeCenter.x, eyeCenter.y - 0.045, eyeCenter.z - 0.08);

	// 통계용 합계. (활성 모델 전체 — LOD / 머리카락 단계가 바뀌면 다시 센다)
	let triangleCount = 0;
	let vertexCount = 0;
	let morphTargetCount = 0;
	function refreshStatistics() {
		triangleCount = 0;
		vertexCount = 0;
		morphTargetCount = 0;
		for (const model of getActiveModels()) {
			for (const drawable of model.getDrawableList()) {
				triangleCount += drawable.isIndexed ? drawable.indexCount / 3 : drawable.vertexCount / 3;
				vertexCount += drawable.vertexCount;
				morphTargetCount = System.Math.max(morphTargetCount, drawable.morphTargetList.length);
			}
		}
	}
	refreshStatistics();

	// GPU 메모리 추정. (텍스처 밉 포함 + 로드된 모델의 버텍스 / 인덱스 / 모프 텍스처 + 렌더 타겟 + 섀도우 맵 — 브라우저 API 없이 계산)
	function estimateGpuMemoryBytes() {
		let bytes = 0;
		for (const imageDescription of imageDescriptionCache.values()) {
			bytes += imageDescription.size.width * imageDescription.size.height * 4 * 1.3333;
		}
		for (const model of modelCache.values()) {
			for (const drawable of model.getDrawableList()) {
				const meshDescription = drawable.meshDescription;
				for (const arrayName of ["positions", "normals", "textureCoordinates", "joints", "weights", "indices"]) {
					const array = meshDescription[arrayName];
					if (array && array.byteLength) {
						bytes += array.byteLength;
					}
				}
				if (drawable.morphTexture) {
					bytes += drawable.morphTextureWidth * drawable.morphRowsPerTarget * 2 * drawable.morphTargetList.length * 16;
				}
			}
		}
		const renderPixels = sceneRenderTarget.getWidth() * sceneRenderTarget.getHeight();
		bytes += renderPixels * (4 * 8 + 4);
		bytes += renderPixels * 8;
		bytes += renderPixels * 4;
		bytes += renderPixels * 8 * 2;
		bytes += renderPixels * 0.25 * 8 * 3;
		bytes += renderPixels * 8 * 0.4;
		bytes += shadowMapResolution * shadowMapResolution * 4;
		return bytes;
	}
	function formatMegabytes(bytes) {
		return (bytes / 1048576).toFixed(0) + " MB";
	}

	// 슬라이더 변경 처리. (모델 교체는 비동기 로드 — 로드가 끝날 때까지 이전 모델을 유지)
	let pendingHeadLod = -1;
	let pendingHairQuality = -1;
	function onSliderChanged(name, value) {
		if (name === "headLod") {
			pendingHeadLod = value;
			loadModelFile(HEAD_LOD_FILES[2 - value]).then((model) => {
				if (pendingHeadLod === value) {
					headModel = model;
					refreshStatistics();
				}
			});
		}
		else if (name === "hairQuality") {
			pendingHairQuality = value;
			const hairFile = HAIR_LEVEL_DEFINITIONS[value].file;
			if (!hairFile) {
				hairModel = null;
				refreshStatistics();
			}
			else {
				loadModelFile(hairFile).then((model) => {
					if (pendingHairQuality === value) {
						hairModel = model;
						refreshStatistics();
					}
				});
			}
		}
		else if (name === "textureSize") {
			applyTextureSize(3 - value);
		}
		else if (name === "shadowQuality") {
			applyShadowQuality(value);
		}
	}

	// 텍스처 크기. (모든 머티리얼 텍스처의 최소 밉 레벨을 올려 실효 해상도를 낮춘다 — 1x1 대체 텍스처는 영향 없음)
	function applyTextureSize(level) {
		for (const material of materialByKeyword.values()) {
			for (const binding of material.getTextureBindings()) {
				webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, binding[2]);
				webGL2RenderingContext.texParameterf(webGL2RenderingContext.TEXTURE_2D, webGL2RenderingContext.TEXTURE_MIN_LOD, level);
			}
		}
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, null);
	}

	// 섀도우 품질. (해상도가 바뀌면 섀도우 맵 재생성)
	function applyShadowQuality(level) {
		const shadowLevel = SHADOW_LEVEL_DEFINITIONS[level];
		if (shadowLevel.resolution !== shadowMapResolution) {
			shadowMap = new ShadowMap(webGL2RenderingContext, shadowLevel.resolution);
			shadowMapResolution = shadowLevel.resolution;
		}
		skinRenderer.setShadowSampleCount(shadowLevel.sampleCount);
	}
	applyShadowQuality(sliderStates.shadowQuality);

	// 머티리얼 그래프용 축소본.
	async function createThumbnail(fileName) {
		const imageDescription = await loadAssetImage(fileName);
		const bitmap = await System.createImageBitmap(new System.Blob([imageDescription.bytes], { type: imageDescription.mimeType || "image/jpeg" }));
		const thumbnailCanvas = System.document.createElement("canvas");
		thumbnailCanvas.width = 96;
		thumbnailCanvas.height = 96;
		const thumbnailContext = thumbnailCanvas.getContext("2d");
		thumbnailContext.fillStyle = "#101012";
		thumbnailContext.fillRect(0, 0, 96, 96);
		thumbnailContext.imageSmoothingEnabled = true;
		thumbnailContext.imageSmoothingQuality = "high";
		thumbnailContext.drawImage(bitmap, 0, 0, 96, 96);
		bitmap.close();
		return thumbnailCanvas;
	}
	const thumbnails = {
		albedo: await createThumbnail("head_albedo.jpg"),
		normal: await createThumbnail("head_normal.jpg"),
		detail: await createThumbnail("skin_detail.jpg"),
		hair: await createThumbnail("hair.png"),
		eye: await createThumbnail("eye_iris.png"),
		teeth: await createThumbnail("teeth_albedo.jpg"),
		eyelash: await createThumbnail("eyelash.png"),
	};
	headModel.update(0);

	//==============================================================================
	// 표정. (ARKit 블렌드셰이프 가중치 프리셋 — 버튼으로 전환, 매 프레임 부드럽게 접근)
	// - 깜빡임과 호흡도 애셋의 표정 단위(눈 감기 / 가슴 팽창)를 그대로 쓴다.
	//==============================================================================
	const expressionResponse = await System.fetch("./assets/expressions.json");
	const expressionTable = await expressionResponse.json();
	advanceLoading("expressions.json");
	// 주름 맵 정의. (channels: 마스크 아틀라스 채널 → 영역 이름 / 주름 맵 기여, shapes: ARKit 셰이프 → 영역 값 — RigLogic 애니메이티드 맵 출력)
	const wrinkleResponse = await System.fetch("./assets/wrinkles.json");
	const wrinkleTable = await wrinkleResponse.json();
	advanceLoading("wrinkles.json");
	const wrinkleRegionValues = new System.Map();
	function updateWrinkleWeights() {
		wrinkleRegionValues.clear();
		if (optionStates.wrinkle) {
			for (const [unitName, weight] of expressionState.currentWeights) {
				const regionTable = wrinkleTable.shapes[unitName];
				if (!regionTable || weight < 0.001) {
					continue;
				}
				for (const regionName in regionTable) {
					const previousValue = wrinkleRegionValues.has(regionName) ? wrinkleRegionValues.get(regionName) : 0;
					wrinkleRegionValues.set(regionName, previousValue + regionTable[regionName] * weight);
				}
			}
		}
		for (let channelIndex = 0; channelIndex < wrinkleTable.channels.length; ++channelIndex) {
			const channel = wrinkleTable.channels[channelIndex];
			const regionValue = wrinkleRegionValues.has(channel.region) ? System.Math.min(wrinkleRegionValues.get(channel.region), 1) : 0;
			skinRenderer.setWrinkleChannelWeight(channelIndex, regionValue * channel.maps[0], regionValue * channel.maps[1], regionValue * channel.maps[2]);
		}
		skinRenderer.finishWrinkleChannelWeights();
	}
	const expressionUnitNameSet = new System.Set();
	for (const presetName in expressionTable) {
		for (const unitName in expressionTable[presetName]) {
			expressionUnitNameSet.add(unitName);
		}
	}
	const expressionState = {
		activeName: "serious",
		targetWeights: new System.Map(),
		currentWeights: new System.Map(),
		nextBlinkTime: 2.5,
		blinkStartTime: -10,
	};
	for (const unitName of expressionUnitNameSet) {
		expressionState.targetWeights.set(unitName, 0);
		expressionState.currentWeights.set(unitName, 0);
	}

	const expressionPanelElement = System.document.getElementById("expressionPanel");
	const expressionButtonMap = new System.Map();
	for (const definition of EXPRESSION_DEFINITIONS) {
		if (!expressionTable[definition.name]) {
			continue;
		}
		const buttonElement = System.document.createElement("button");
		buttonElement.className = "expressionButton";
		buttonElement.textContent = definition.label;
		buttonElement.addEventListener("click", () => {
			selectExpression(definition.name);
		});
		expressionPanelElement.appendChild(buttonElement);
		expressionButtonMap.set(definition.name, buttonElement);
	}

	function selectExpression(presetName) {
		expressionState.activeName = presetName;
		const preset = expressionTable[presetName];
		for (const unitName of expressionUnitNameSet) {
			expressionState.targetWeights.set(unitName, preset[unitName] !== undefined ? preset[unitName] : 0);
		}
		for (const [name, buttonElement] of expressionButtonMap) {
			buttonElement.classList.toggle("active", name === presetName);
		}
	}
	selectExpression("serious");

	function updateExpressions(elapsedTime, deltaTime) {
		const approach = System.Math.min(1, deltaTime * 6);
		for (const unitName of expressionUnitNameSet) {
			const currentWeight = expressionState.currentWeights.get(unitName);
			const targetWeight = expressionState.targetWeights.get(unitName);
			const nextWeight = currentWeight + (targetWeight - currentWeight) * approach;
			expressionState.currentWeights.set(unitName, nextWeight);
			for (const model of getActiveModels()) {
				model.setMorphWeight(unitName, nextWeight);
			}
		}

		// 깜빡임. (눈 감기 단위 — 표정이 감은 만큼보다 크게 덮어쓴다, 간격은 BLINK RATE 슬라이더)
		if (elapsedTime >= expressionState.nextBlinkTime) {
			expressionState.blinkStartTime = elapsedTime;
			const blinkInterval = sliderStates.blinkRate > 0.001 ? (2.8 + System.Math.random() * 3.6) / sliderStates.blinkRate : 1e9;
			expressionState.nextBlinkTime = elapsedTime + blinkInterval;
		}
		const blinkLocal = elapsedTime - expressionState.blinkStartTime;
		const blink = blinkLocal >= 0 && blinkLocal < 0.3 ? System.Math.sin(blinkLocal / 0.3 * System.Math.PI) : 0;
		const leftClosed = System.Math.max(expressionState.currentWeights.get("EyeBlinkLeft") || 0, blink);
		const rightClosed = System.Math.max(expressionState.currentWeights.get("EyeBlinkRight") || 0, blink);
		for (const model of getActiveModels()) {
			model.setMorphWeight("EyeBlinkLeft", leftClosed);
			model.setMorphWeight("EyeBlinkRight", rightClosed);
		}
		skinRenderer.setEyeClosure(System.Math.max(leftClosed, rightClosed));
	}

	//==============================================================================
	// 머리 방향. (골격 head / neck 조인트 회전 오프셋 — 포인터 방향 + 느린 배회)
	//==============================================================================
	const headState = {
		currentYaw: 0,
		currentPitch: 0,
	};
	const pointerState = {
		normalizedX: 0,
		normalizedY: 0,
		hasMoved: false,
	};

	function updateHeadDirection(elapsedTime, deltaTime) {
		const wanderYaw = 0.08 * System.Math.sin(elapsedTime * 0.23) + 0.05 * System.Math.sin(elapsedTime * 0.61 + 1.3);
		const wanderPitch = 0.04 * System.Math.sin(elapsedTime * 0.31 + 0.6);
		const followYaw = pointerState.hasMoved ? pointerState.normalizedX * 0.42 * sliderStates.headFollow : 0;
		const followPitch = pointerState.hasMoved ? pointerState.normalizedY * 0.22 * sliderStates.headFollow : 0;
		const targetYaw = clampValue(wanderYaw + followYaw, -0.6, 0.6);
		const targetPitch = clampValue(wanderPitch + followPitch, -0.35, 0.35);
		const approach = System.Math.min(1, deltaTime * 2.2);
		headState.currentYaw += (targetYaw - headState.currentYaw) * approach;
		headState.currentPitch += (targetPitch - headState.currentPitch) * approach;
		updateModelMatrix();
	}

	//==============================================================================
	// 카메라 / 입력. (드래그 궤도 회전, 휠 / 핀치 줌, 포인터 이동 = 머리 방향)
	//==============================================================================
	const cameraState = {
		yaw: 0,
		pitch: 0.02,
		distance: 0.68,
		targetYaw: 0,
		targetPitch: 0.02,
		targetDistance: 0.68,
		isDragging: false,
		dragPointerId: -1,
		lastPointerX: 0,
		lastPointerY: 0,
	};
	const DEFAULT_CAMERA_YAW = cameraState.yaw;
	const DEFAULT_CAMERA_PITCH = cameraState.pitch;
	const DEFAULT_CAMERA_DISTANCE = cameraState.distance;
	function resetView() {
		cameraState.targetYaw = DEFAULT_CAMERA_YAW;
		cameraState.targetPitch = DEFAULT_CAMERA_PITCH;
		cameraState.targetDistance = DEFAULT_CAMERA_DISTANCE;
	}
	const activePointerMap = new System.Map();
	const pinchState = {
		isPinching: false,
		lastDistance: 0,
	};

	function getPinchDistance() {
		const pointerList = System.Array.from(activePointerMap.values());
		const deltaX = pointerList[0].x - pointerList[1].x;
		const deltaY = pointerList[0].y - pointerList[1].y;
		return System.Math.sqrt(deltaX * deltaX + deltaY * deltaY);
	}

	canvas.addEventListener("pointerdown", (event) => {
		activePointerMap.set(event.pointerId, { x: event.clientX, y: event.clientY });
		canvas.setPointerCapture(event.pointerId);
		if (activePointerMap.size >= 2) {
			pinchState.isPinching = true;
			pinchState.lastDistance = getPinchDistance();
			cameraState.isDragging = false;
			cameraState.dragPointerId = -1;
			canvas.classList.remove("dragging");
			return;
		}
		// 머티리얼 그래프 위에서는 드래그로 그래프를 스크롤한다
		if (isPointerOnMaterialGraph(event.clientX, event.clientY)) {
			materialGraphState.isDragging = true;
			materialGraphState.dragPointerId = event.pointerId;
			materialGraphState.lastPointerY = event.clientY;
			return;
		}
		cameraState.isDragging = true;
		cameraState.dragPointerId = event.pointerId;
		cameraState.lastPointerX = event.clientX;
		cameraState.lastPointerY = event.clientY;
		canvas.classList.add("dragging");
	});
	canvas.addEventListener("pointermove", (event) => {
		if (activePointerMap.has(event.pointerId)) {
			activePointerMap.set(event.pointerId, { x: event.clientX, y: event.clientY });
		}
		if (materialGraphState.isDragging && event.pointerId === materialGraphState.dragPointerId) {
			materialGraphState.scrollOffset = clampValue(materialGraphState.scrollOffset - (event.clientY - materialGraphState.lastPointerY), 0, materialGraphState.maximumScroll);
			materialGraphState.lastPointerY = event.clientY;
			return;
		}
		if (pinchState.isPinching && activePointerMap.size >= 2) {
			const pinchDistance = getPinchDistance();
			if (pinchState.lastDistance > 0) {
				const zoomRatio = pinchState.lastDistance / System.Math.max(pinchDistance, 1);
				cameraState.targetDistance = clampValue(cameraState.targetDistance * zoomRatio, CAMERA_MINIMUM_DISTANCE, CAMERA_MAXIMUM_DISTANCE);
			}
			pinchState.lastDistance = pinchDistance;
			return;
		}
		if (cameraState.isDragging && event.pointerId === cameraState.dragPointerId) {
			const deltaX = event.clientX - cameraState.lastPointerX;
			const deltaY = event.clientY - cameraState.lastPointerY;
			cameraState.lastPointerX = event.clientX;
			cameraState.lastPointerY = event.clientY;
			cameraState.targetYaw = clampValue(cameraState.targetYaw - deltaX * 0.006, -1.25, 1.25);
			cameraState.targetPitch = clampValue(cameraState.targetPitch + deltaY * 0.004, -0.4, 0.55);
			return;
		}
		pointerState.normalizedX = clampValue((event.clientX / System.window.innerWidth) * 2 - 1, -1, 1);
		pointerState.normalizedY = clampValue((event.clientY / System.window.innerHeight) * 2 - 1, -1, 1);
		pointerState.hasMoved = true;
	});
	function endDrag(event) {
		activePointerMap.delete(event.pointerId);
		if (event.pointerId === materialGraphState.dragPointerId) {
			materialGraphState.isDragging = false;
			materialGraphState.dragPointerId = -1;
		}
		if (activePointerMap.size < 2) {
			pinchState.isPinching = false;
			pinchState.lastDistance = 0;
		}
		if (event.pointerId === cameraState.dragPointerId) {
			cameraState.isDragging = false;
			cameraState.dragPointerId = -1;
			canvas.classList.remove("dragging");
		}
	}
	canvas.addEventListener("pointerup", endDrag);
	canvas.addEventListener("pointercancel", endDrag);
	canvas.addEventListener("wheel", (event) => {
		event.preventDefault();
		if (isPointerOnMaterialGraph(event.clientX, event.clientY)) {
			materialGraphState.scrollOffset = clampValue(materialGraphState.scrollOffset + event.deltaY, 0, materialGraphState.maximumScroll);
			return;
		}
		cameraState.targetDistance = clampValue(cameraState.targetDistance * (1 + event.deltaY * 0.0012), CAMERA_MINIMUM_DISTANCE, CAMERA_MAXIMUM_DISTANCE);
	}, { passive: false });
	System.window.addEventListener("keydown", (event) => {
		const optionIndex = System.parseInt(event.key, 10) - 1;
		if (optionIndex >= 0 && optionIndex < optionDefinitions.length) {
			toggleOption(optionDefinitions[optionIndex].name);
		}
	});

	//==============================================================================
	// 리사이즈.
	//==============================================================================
	function resizeCanvas() {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const displayWidth = System.Math.floor(canvas.clientWidth * devicePixelRatio);
		const displayHeight = System.Math.floor(canvas.clientHeight * devicePixelRatio);
		// 내부 렌더 해상도. (기준 픽셀 수를 넘는 캔버스는 기준 크기로 줄인 뒤 RESOLUTION SCALE 을 곱한다 — 4K 모니터에서 8 메가픽셀을 매 프레임 셰이딩하지 않도록)
		const pixelBudgetScale = System.Math.min(1, System.Math.sqrt(RENDER_PIXEL_BUDGET / System.Math.max(displayWidth * displayHeight, 1)));
		const effectiveRenderScale = sliderStates.renderScale * pixelBudgetScale;
		const renderWidth = System.Math.max(2, System.Math.floor(displayWidth * effectiveRenderScale));
		const renderHeight = System.Math.max(2, System.Math.floor(displayHeight * effectiveRenderScale));
		if (canvas.width !== displayWidth || canvas.height !== displayHeight || sceneRenderTarget.getWidth() !== renderWidth || sceneRenderTarget.getHeight() !== renderHeight) {
			canvas.width = displayWidth;
			canvas.height = displayHeight;
			sceneRenderTarget.resize(renderWidth, renderHeight);
			hdrRenderTarget.resize(renderWidth, renderHeight);
			ldrRenderTarget.resize(renderWidth, renderHeight);
			subsurfaceEffect.resize(renderWidth, renderHeight);
			ambientOcclusionEffect.resize(renderWidth, renderHeight);
			bloomEffect.resize(renderWidth, renderHeight);
		}
	}

	//==============================================================================
	// 머티리얼 그래프. (좌측 — 텍스처 입력부터 셰이딩 / MRT / SSS / 합성 / 포스트까지의 흐름을 노드로 표시)
	// - 텍스처는 축소본 이미지, 중간 버퍼는 매 프레임 GL 블릿으로 실시간 표시한다.
	//==============================================================================
	// 그래픽 설정 패널과 같은 규격. (여백 18 / 폭 372, 제목 바 34, 패딩 12 — 모바일은 여백 10 / 전체 폭)
	const GRAPH_PANEL_MARGIN = 18;
	const GRAPH_PANEL_WIDTH = 372;
	const GRAPH_TITLE_HEIGHT = 34;
	const GRAPH_PADDING = 12;
	const GRAPH_NODE_PADDING = 10;
	const GRAPH_NODE_GAP = 8;
	const GRAPH_IMAGE_THUMBNAIL_SIZE = 72;
	const GRAPH_BUFFER_THUMBNAIL_WIDTH = 104;
	const GRAPH_LINE_HEIGHT = 20;
	const GRAPH_TITLE_FONT = `600 10px "Segoe UI", "Malgun Gothic", sans-serif`;
	const GRAPH_TITLE_SPACING = 3.2;
	const GRAPH_NODE_TITLE_FONT = `600 9px "Segoe UI", "Malgun Gothic", sans-serif`;
	const GRAPH_NODE_TITLE_SPACING = 2.7;
	const GRAPH_TEXT_FONT = `400 10.5px "Segoe UI", "Malgun Gothic", sans-serif`;
	const GRAPH_TEXT_SPACING = 1.26;
	const GRAPH_LABEL_FONT = `400 9px "Segoe UI", "Malgun Gothic", sans-serif`;
	const GRAPH_LABEL_SPACING = 1.6;
	const GRAPH_ACTIVE_TITLE_COLOR = "rgba(232, 201, 138, 0.95)";
	const GRAPH_INACTIVE_TITLE_COLOR = "rgba(232, 201, 138, 0.38)";
	const GRAPH_ACTIVE_TEXT_COLOR = "rgba(242, 236, 226, 0.74)";
	const GRAPH_INACTIVE_TEXT_COLOR = "rgba(242, 236, 226, 0.32)";
	const GRAPH_LABEL_COLOR = "rgba(242, 236, 226, 0.5)";

	function buildMaterialGraphNodes(buffers) {
		let activeUnitCount = 0;
		for (const unitName of expressionUnitNameSet) {
			if (expressionState.currentWeights.get(unitName) > 0.02) {
				activeUnitCount += 1;
			}
		}
		const nodes = [
			{
				title: "SKIN TEXTURES",
				isActive: true,
				lines: [],
				thumbnails: [
					{ label: "ALBEDO", image: thumbnails.albedo },
					{ label: "NORMAL", image: thumbnails.normal },
					{ label: "CAVITY", image: thumbnails.detail },
				],
			},
			{
				title: "EYES, TEETH, LASHES AND GROOM",
				isActive: true,
				lines: ["refractive cornea, iris parallax and normal, eyelid occlusion shell", "kajiya-kay dual lobe hair cards, cutout + blended fringe"],
				thumbnails: [
					{ label: "EYE", image: thumbnails.eye },
					{ label: "TEETH", image: thumbnails.teeth },
					{ label: "LASHES", image: thumbnails.eyelash },
					{ label: "HAIR", image: thumbnails.hair },
				],
			},
			{
				title: "SURFACE",
				isActive: true,
				lines: [
					"normal = metahuman normal x 1.5 + wrinkle maps x mask weights + micro normal x38",
					"cavity = height - blur(height) x micro cavity, roughness from cavity",
					"skin F0 0.028, eyes 0.04 glossy",
				],
				thumbnails: [],
			},
			{
				title: "LIGHTING",
				isActive: true,
				lines: [
					"key 2.6 warm, shadow " + (optionStates.shadow ? "on" : "off") + ", fill 0.85 cool, rim 1.4",
					"hemisphere ambient, dual-lobe GGX, sheen, env BRDF",
				],
				thumbnails: [],
			},
			{
				title: "G-BUFFER (MRT RGBA16F)",
				isActive: true,
				lines: [],
				thumbnails: [
					{ label: "IRRADIANCE", texture: buffers.irradianceTexture, displayScale: 0.5, useCoverage: 1 },
					{ label: "ALBEDO", texture: buffers.albedoTexture, displayScale: 1.6, useCoverage: 1 },
					{ label: "SPECULAR", texture: buffers.specularTexture, displayScale: 3, useCoverage: 1 },
				],
			},
			{
				title: "SUBSURFACE AND COMBINE",
				isActive: optionStates.subsurface,
				lines: ["separable SSS, width 8 mm, depth aware", "irradiance x albedo + specular + background"],
				thumbnails: [
					{ label: "SCATTERED", texture: buffers.scatteredIrradianceTexture, displayScale: 0.5, useCoverage: 1 },
					{ label: "HDR", texture: buffers.hdrColorTexture, displayScale: 0.72, useCoverage: 0 },
				],
			},
			{
				title: "EXPRESSION",
				isActive: true,
				lines: ["preset " + expressionState.activeName + ", " + morphTargetCount + " ARKit shapes baked from RigLogic, " + activeUnitCount + " active", "blink from eye blink shapes"],
				thumbnails: [],
			},
			{
				title: "POST",
				isActive: true,
				lines: ["bloom " + (optionStates.bloom ? sliderStates.bloomStrength.toFixed(2) : "off") + ", exposure " + sliderStates.exposure.toFixed(2) + ", ACES, vignette, grain", "resolution scale " + System.Math.round(sliderStates.renderScale * 100) + "%, " + ANTIALIAS_LABELS[sliderStates.antialias].toLowerCase() + ", " + HAIR_LEVEL_DEFINITIONS[sliderStates.hairQuality].label.toLowerCase() + " hair, head lod " + (2 - sliderStates.headLod)],
				thumbnails: [],
			},
		];
		return nodes;
	}

	// 노드 설명을 노드 폭에 맞춰 단어 단위로 줄바꿈한다. (실제 폰트로 측정)
	function wrapGraphLines(lines, maximumWidth) {
		uiGraphic.setFontString(GRAPH_TEXT_FONT);
		const wrappedLines = [];
		for (const line of lines) {
			const words = line.split(" ");
			let currentLine = "";
			for (const word of words) {
				const candidate = currentLine.length > 0 ? currentLine + " " + word : word;
				const candidateWidth = uiGraphic.measureText(candidate).width + candidate.length * GRAPH_TEXT_SPACING;
				if (candidateWidth > maximumWidth && currentLine.length > 0) {
					wrappedLines.push(currentLine);
					currentLine = word;
				}
				else {
					currentLine = candidate;
				}
			}
			if (currentLine.length > 0) {
				wrappedLines.push(currentLine);
			}
		}
		return wrappedLines;
	}

	// 자간 있는 텍스트. (제목 — CSS letter-spacing 과 같은 느낌으로 글자마다 간격을 더한다)
	function drawSpacedText(text, x, y, spacing) {
		let cursorX = x;
		for (const character of text) {
			uiGraphic.drawFillText(character, cursorX, y);
			cursorX += uiGraphic.measureText(character).width + spacing;
		}
		return cursorX - x - spacing;
	}

	// 패널 배치. (모바일은 접힌 그래픽 설정 아래 전체 폭 카드, 아래쪽은 표정 버튼 / 크레딧 영역을 남긴다)
	function getMaterialGraphFrame() {
		const cssWidth = System.window.innerWidth;
		const cssHeight = System.window.innerHeight;
		const isNarrow = cssWidth < 640;
		const margin = isNarrow ? 10 : GRAPH_PANEL_MARGIN;
		const panelWidth = isNarrow ? cssWidth - margin * 2 : GRAPH_PANEL_WIDTH;
		const panelY = isNarrow ? margin + 34 + 8 : margin;
		const maximumHeight = System.Math.max(GRAPH_TITLE_HEIGHT + 60, System.Math.min(cssHeight, statistics.hudTop) - panelY - 12);
		return { x: margin, y: panelY, width: panelWidth, maximumHeight: maximumHeight };
	}

	// 노드 배치. (패널 좌표계 — 내용 영역의 y 는 제목 바 아래 0 부터)
	function layoutMaterialGraph(nodes, panelWidth, aspectRatio) {
		const contentWidth = panelWidth - GRAPH_PADDING * 2;
		const textWidth = contentWidth - GRAPH_NODE_PADDING * 2;
		let cursorY = GRAPH_PADDING;
		for (const node of nodes) {
			node.lines = wrapGraphLines(node.lines, textWidth);
			node.x = GRAPH_PADDING;
			node.y = cursorY;
			let contentY = node.y + 28;
			if (node.thumbnails.length > 0) {
				const isImageRow = node.thumbnails[0].image !== undefined;
				const thumbnailWidth = isImageRow ? GRAPH_IMAGE_THUMBNAIL_SIZE : GRAPH_BUFFER_THUMBNAIL_WIDTH;
				const thumbnailHeight = isImageRow ? GRAPH_IMAGE_THUMBNAIL_SIZE : System.Math.round(GRAPH_BUFFER_THUMBNAIL_WIDTH / aspectRatio);
				const spacing = clampValue((textWidth - node.thumbnails.length * thumbnailWidth) / System.Math.max(node.thumbnails.length - 1, 1), 6, 30);
				for (let thumbnailIndex = 0; thumbnailIndex < node.thumbnails.length; ++thumbnailIndex) {
					const thumbnail = node.thumbnails[thumbnailIndex];
					thumbnail.x = node.x + GRAPH_NODE_PADDING + thumbnailIndex * (thumbnailWidth + spacing);
					thumbnail.y = contentY;
					thumbnail.width = thumbnailWidth;
					thumbnail.height = thumbnailHeight;
				}
				contentY += thumbnailHeight + 20;
			}
			node.textY = contentY;
			contentY += node.lines.length * GRAPH_LINE_HEIGHT;
			node.width = contentWidth;
			node.height = contentY - node.y + GRAPH_NODE_PADDING;
			cursorY = node.y + node.height + GRAPH_NODE_GAP;
		}
		return cursorY - GRAPH_NODE_GAP + GRAPH_PADDING;
	}

	// 스크롤 / 입력 상태. (휠 / 드래그로 세로 스크롤 — 패널 사각형 안에서만)
	const materialGraphState = { scrollOffset: 0, maximumScroll: 0, left: 0, top: 0, right: 0, bottom: 0, isDragging: false, dragPointerId: -1, lastPointerY: 0 };
	function isPointerOnMaterialGraph(clientX, clientY) {
		return optionStates.materialGraph && clientX >= materialGraphState.left && clientX < materialGraphState.right && clientY >= materialGraphState.top && clientY < materialGraphState.bottom;
	}

	function renderMaterialGraph(buffers) {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const aspectRatio = canvas.width / canvas.height;
		const frame = getMaterialGraphFrame();
		const nodes = buildMaterialGraphNodes(buffers);
		const contentHeight = layoutMaterialGraph(nodes, frame.width, aspectRatio);
		const panelHeight = System.Math.min(GRAPH_TITLE_HEIGHT + contentHeight, frame.maximumHeight);
		const viewHeight = panelHeight - GRAPH_TITLE_HEIGHT;
		materialGraphState.maximumScroll = System.Math.max(0, contentHeight - viewHeight);
		materialGraphState.scrollOffset = clampValue(materialGraphState.scrollOffset, 0, materialGraphState.maximumScroll);
		materialGraphState.left = frame.x;
		materialGraphState.top = frame.y;
		materialGraphState.right = frame.x + frame.width;
		materialGraphState.bottom = frame.y + panelHeight;
		const contentTop = frame.y + GRAPH_TITLE_HEIGHT;
		const originY = contentTop - materialGraphState.scrollOffset;
		const contentRect = Rect.create(frame.x, contentTop, frame.width, viewHeight);
		let previewDrawCallCount = 0;

		// 1. 패널 / 제목 바 / 노드 배경. (엔진 Graphic — 내용은 제목 아래 영역으로 클립)
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFunc(webGL2RenderingContext.ONE, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio, devicePixelRatio);
		uiGraphic.setGlobalAlpha(1);
		const panelRect = Rect.create(frame.x, frame.y, frame.width, panelHeight);
		uiGraphic.setFillColor("rgba(14, 12, 14, 0.5)");
		uiGraphic.drawRoundRect(panelRect, 12);
		uiGraphic.setStrokeColor("rgba(242, 236, 226, 0.14)");
		uiGraphic.drawStrokeRoundRect(panelRect, 12, 1);
		uiGraphic.setTextBaseline("middle");
		uiGraphic.setTextAlign("left");
		uiGraphic.setFontString(GRAPH_TITLE_FONT);
		uiGraphic.setFillColor(GRAPH_ACTIVE_TITLE_COLOR);
		drawSpacedText("MATERIAL GRAPH", frame.x + 16, frame.y + GRAPH_TITLE_HEIGHT * 0.5 + 1, GRAPH_TITLE_SPACING);
		uiGraphic.setFontString(GRAPH_LABEL_FONT);
		uiGraphic.setFillColor(GRAPH_LABEL_COLOR);
		const hintText = materialGraphState.maximumScroll > 0 ? "SCROLL" : "";
		if (hintText.length > 0) {
			const hintWidth = uiGraphic.measureText(hintText).width + hintText.length * GRAPH_LABEL_SPACING;
			drawSpacedText(hintText, frame.x + frame.width - 16 - hintWidth, frame.y + GRAPH_TITLE_HEIGHT * 0.5 + 1, GRAPH_LABEL_SPACING);
		}
		uiGraphic.setStrokeColor("rgba(242, 236, 226, 0.1)");
		uiGraphic.drawLine([Vector2.create(frame.x, contentTop), Vector2.create(frame.x + frame.width, contentTop)], 1);
		uiGraphic.beginClipRect(contentRect);
		for (const node of nodes) {
			const nodeRect = Rect.create(frame.x + node.x, originY + node.y, node.width, node.height);
			uiGraphic.setFillColor(node.isActive ? "rgba(255, 255, 255, 0.045)" : "rgba(255, 255, 255, 0.02)");
			uiGraphic.drawRoundRect(nodeRect, 8);
			for (const thumbnail of node.thumbnails) {
				uiGraphic.setFillColor("rgba(0, 0, 0, 0.4)");
				uiGraphic.drawRect(Rect.create(frame.x + thumbnail.x, originY + thumbnail.y, thumbnail.width, thumbnail.height));
			}
		}
		uiGraphic.endClipRect();

		// 2. 중간 버퍼 블릿. (뷰포트를 썸네일 사각형으로 제한 — 내용 영역 안에 온전히 들어온 것만)
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		previewPass.use();
		webGL2RenderingContext.uniform1i(previewPass.getUniformLocation("sourceTexture"), 0);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		for (const node of nodes) {
			for (const thumbnail of node.thumbnails) {
				if (!thumbnail.texture) {
					continue;
				}
				const thumbnailTop = originY + thumbnail.y;
				if (thumbnailTop < contentTop || thumbnailTop + thumbnail.height > contentTop + viewHeight) {
					continue;
				}
				const viewportX = System.Math.round((frame.x + thumbnail.x) * devicePixelRatio);
				const viewportY = System.Math.round(canvas.height - (thumbnailTop + thumbnail.height) * devicePixelRatio);
				const viewportWidth = System.Math.round(thumbnail.width * devicePixelRatio);
				const viewportHeight = System.Math.round(thumbnail.height * devicePixelRatio);
				webGL2RenderingContext.viewport(viewportX, viewportY, viewportWidth, viewportHeight);
				webGL2RenderingContext.uniform1f(previewPass.getUniformLocation("displayScale"), thumbnail.displayScale);
				webGL2RenderingContext.uniform1i(previewPass.getUniformLocation("useCoverage"), thumbnail.useCoverage);
				webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, thumbnail.texture);
				previewPass.draw();
				previewDrawCallCount += 1;
			}
		}
		webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);

		// 3. 텍스처 축소본 / 제목 / 설명 / 연결선. (엔진 Graphic — 클립)
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio, devicePixelRatio);
		uiGraphic.setTextBaseline("middle");
		uiGraphic.setTextAlign("left");
		uiGraphic.beginClipRect(contentRect);
		for (let nodeIndex = 0; nodeIndex < nodes.length; ++nodeIndex) {
			const node = nodes[nodeIndex];
			const nodeX = frame.x + node.x;
			const nodeY = originY + node.y;
			uiGraphic.setGlobalAlpha(1);
			for (const thumbnail of node.thumbnails) {
				const thumbnailX = frame.x + thumbnail.x;
				const thumbnailY = originY + thumbnail.y;
				if (thumbnail.image) {
					uiGraphic.setGlobalAlpha(node.isActive ? 1 : 0.4);
					uiGraphic.drawImage(thumbnail.image, Vector2.create(thumbnailX, thumbnailY), Vector2.create(thumbnail.width, thumbnail.height));
					uiGraphic.setGlobalAlpha(1);
				}
				uiGraphic.setStrokeColor("rgba(242, 236, 226, 0.18)");
				uiGraphic.drawStrokeRect(Rect.create(thumbnailX, thumbnailY, thumbnail.width, thumbnail.height), 1);
				uiGraphic.setFontString(GRAPH_LABEL_FONT);
				uiGraphic.setFillColor(GRAPH_LABEL_COLOR);
				drawSpacedText(thumbnail.label, thumbnailX, thumbnailY + thumbnail.height + 9, GRAPH_LABEL_SPACING);
			}
			uiGraphic.setFontString(GRAPH_NODE_TITLE_FONT);
			uiGraphic.setFillColor(node.isActive ? GRAPH_ACTIVE_TITLE_COLOR : GRAPH_INACTIVE_TITLE_COLOR);
			drawSpacedText(node.title, nodeX + GRAPH_NODE_PADDING, nodeY + 14, GRAPH_NODE_TITLE_SPACING);
			uiGraphic.setFontString(GRAPH_TEXT_FONT);
			uiGraphic.setFillColor(node.isActive ? GRAPH_ACTIVE_TEXT_COLOR : GRAPH_INACTIVE_TEXT_COLOR);
			for (let lineIndex = 0; lineIndex < node.lines.length; ++lineIndex) {
				drawSpacedText(node.lines[lineIndex], nodeX + GRAPH_NODE_PADDING, originY + node.textY + lineIndex * GRAPH_LINE_HEIGHT + 9, GRAPH_TEXT_SPACING);
			}
			if (nodeIndex < nodes.length - 1) {
				const connectorX = nodeX + 22;
				const connectorTop = nodeY + node.height;
				uiGraphic.setStrokeColor("rgba(232, 201, 138, 0.5)");
				uiGraphic.drawLine([Vector2.create(connectorX, connectorTop), Vector2.create(connectorX, connectorTop + GRAPH_NODE_GAP)], 1);
				uiGraphic.setFillColor("rgba(232, 201, 138, 0.8)");
				uiGraphic.drawCircle(Vector2.create(connectorX, connectorTop + GRAPH_NODE_GAP * 0.5), 1.8);
			}
		}
		uiGraphic.endClipRect();
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		return previewDrawCallCount;
	}

	//==============================================================================
	// HUD. (우측 하단 렌더링 정보 — 엔진 Graphic 으로 캔버스 안에 렌더링, 홈 링크와 겹치면 그 위로)
	//==============================================================================
	// 패스별 GPU 시간. (EXT_disjoint_timer_query_webgl2 — 결과는 몇 프레임 뒤에 도착하므로 대기 목록을 매 프레임 확인)
	const timerExtension = webGL2RenderingContext.getExtension("EXT_disjoint_timer_query_webgl2");
	const passTimer = { pendingList: [], current: null, milliseconds: {} };
	function beginPass(passName) {
		if (!timerExtension || passTimer.current) {
			return;
		}
		const query = webGL2RenderingContext.createQuery();
		webGL2RenderingContext.beginQuery(timerExtension.TIME_ELAPSED_EXT, query);
		passTimer.current = { name: passName, query: query };
	}
	function endPass() {
		if (!timerExtension || !passTimer.current) {
			return;
		}
		webGL2RenderingContext.endQuery(timerExtension.TIME_ELAPSED_EXT);
		passTimer.pendingList.push(passTimer.current);
		passTimer.current = null;
	}
	function pollPassTimers() {
		if (!timerExtension) {
			return;
		}
		const disjoint = webGL2RenderingContext.getParameter(timerExtension.GPU_DISJOINT_EXT);
		const remainingList = [];
		for (const pending of passTimer.pendingList) {
			const isAvailable = webGL2RenderingContext.getQueryParameter(pending.query, webGL2RenderingContext.QUERY_RESULT_AVAILABLE);
			if (!isAvailable) {
				remainingList.push(pending);
				continue;
			}
			if (!disjoint) {
				const nanoseconds = webGL2RenderingContext.getQueryParameter(pending.query, webGL2RenderingContext.QUERY_RESULT);
				const previous = passTimer.milliseconds[pending.name] !== undefined ? passTimer.milliseconds[pending.name] : nanoseconds / 1e6;
				passTimer.milliseconds[pending.name] = previous * 0.9 + (nanoseconds / 1e6) * 0.1;
			}
			webGL2RenderingContext.deleteQuery(pending.query);
		}
		passTimer.pendingList = remainingList;
	}
	function formatPassTime(passName) {
		const milliseconds = passTimer.milliseconds[passName];
		return milliseconds !== undefined ? milliseconds.toFixed(2) + " ms" : "n/a";
	}

	const statistics = {
		smoothedFrameSeconds: 1 / 60,
		drawCallCount: 0,
		hudTop: System.window.innerHeight - 190,
		optionMaximumHeight: 0,
		memorySampleTime: -1e9,
		gpuMemoryBytes: 0,
		gpuMemoryText: "",
		jsHeapBytes: 0,
		jsHeapText: "",
	};
	const homeLinkElement = System.document.getElementById("homeLink");

	function renderHud() {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const cssWidth = System.window.innerWidth;
		const cssHeight = System.window.innerHeight;
		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio, devicePixelRatio);
		uiGraphic.setGlobalAlpha(1);

		// 메모리 수치는 1초에 한 번 표본을 읽고, 직전 표시값 대비 5% 넘게 변할 때만 바꾼다. (JS 힙은 GC 로 오르내리므로 매 프레임 보여 주면 톱니처럼 흔들린다)
		const hudTimestamp = System.performance.now();
		if (hudTimestamp - statistics.memorySampleTime >= 1000) {
			statistics.memorySampleTime = hudTimestamp;
			const gpuMemoryBytes = estimateGpuMemoryBytes();
			if (System.Math.abs(gpuMemoryBytes - statistics.gpuMemoryBytes) > statistics.gpuMemoryBytes * 0.05) {
				statistics.gpuMemoryBytes = gpuMemoryBytes;
				statistics.gpuMemoryText = formatMegabytes(gpuMemoryBytes);
			}
			if (System.performance.memory) {
				const usedHeapBytes = System.performance.memory.usedJSHeapSize;
				if (System.Math.abs(usedHeapBytes - statistics.jsHeapBytes) > statistics.jsHeapBytes * 0.05) {
					statistics.jsHeapBytes = usedHeapBytes;
					statistics.jsHeapText = formatMegabytes(usedHeapBytes) + " / " + formatMegabytes(System.performance.memory.jsHeapSizeLimit);
				}
			}
			else {
				statistics.jsHeapText = "n/a";
			}
		}
		const rowHeight = 16;
		const rows = [
			["fps", System.Math.round(1 / System.Math.max(statistics.smoothedFrameSeconds, 0.0001)).toString()],
			["display", canvas.width + " x " + canvas.height],
			["render buffer", sceneRenderTarget.getWidth() + " x " + sceneRenderTarget.getHeight()],
			["triangles", System.Math.round(triangleCount).toLocaleString("en-US")],
			["vertices", vertexCount.toLocaleString("en-US")],
			["draw calls", statistics.drawCallCount.toString()],
			["morph targets", morphTargetCount.toString()],
			["gpu shadow", formatPassTime("shadow")],
			["gpu scene", formatPassTime("scene")],
			["gpu sss + ao", formatPassTime("scatter")],
			["gpu post", formatPassTime("post")],
			["gpu memory (est.)", statistics.gpuMemoryText],
			["js heap", statistics.jsHeapText],
		];
		const panelWidth = 214;
		const panelHeight = rows.length * rowHeight + 18;
		const panelX = cssWidth - panelWidth - 18;
		let panelY = cssHeight - panelHeight - 18;
		const homeLinkRect = homeLinkElement.getBoundingClientRect();
		const isOverlappingHomeLink = homeLinkRect.right > panelX && homeLinkRect.top < panelY + panelHeight;
		if (isOverlappingHomeLink) {
			panelY = homeLinkRect.top - panelHeight - 12;
		}
		// 옵션 패널 / 머티리얼 그래프는 이 HUD 위까지만 내려오게 한다 (겹침 방지)
		statistics.hudTop = panelY;
		const optionMaximumHeight = System.Math.max(120, panelY - 18 - 12);
		if (statistics.optionMaximumHeight !== optionMaximumHeight) {
			statistics.optionMaximumHeight = optionMaximumHeight;
			optionPanelElement.style.maxHeight = optionMaximumHeight + "px";
		}
		const panelRect = Rect.create(panelX, panelY, panelWidth, panelHeight);
		uiGraphic.setFillColor("rgba(14, 12, 14, 0.55)");
		uiGraphic.drawRoundRect(panelRect, 10);
		uiGraphic.setStrokeColor("rgba(242, 236, 226, 0.14)");
		uiGraphic.drawStrokeRoundRect(panelRect, 10, 1);
		uiGraphic.setFontString(`400 10.5px "Segoe UI", "Malgun Gothic", sans-serif`);
		uiGraphic.setTextBaseline("middle");
		for (let rowIndex = 0; rowIndex < rows.length; ++rowIndex) {
			const rowY = panelY + 9 + rowHeight * rowIndex + rowHeight * 0.5;
			uiGraphic.setTextAlign("left");
			uiGraphic.setFillColor("rgba(242, 236, 226, 0.45)");
			uiGraphic.drawFillText(rows[rowIndex][0], panelX + 14, rowY);
			uiGraphic.setTextAlign("right");
			uiGraphic.setFillColor("rgba(242, 236, 226, 0.88)");
			uiGraphic.drawFillText(rows[rowIndex][1], panelX + panelWidth - 14, rowY);
		}
	}

	//==============================================================================
	// 메인 루프. (섀도우 깊이 → 피부 MRT → 화면 공간 SSS → 합성(HDR) → 블룸 → 톤 매핑 → FXAA → 와이어프레임 → 머티리얼 그래프 → HUD)
	//==============================================================================
	const startTimestamp = System.performance.now();
	let previousTimestamp = startTimestamp;
	// 흉상 모델 행렬. (골격이 없는 메시라 목 아래 피벗을 중심으로 포인터 방향에 맞춰 회전)
	const headPivot = Vector3.create(eyeCenter.x, eyeCenter.y - 0.22, eyeCenter.z - 0.06);
	let modelElements = Matrix4.createIdentity().getElements();
	function updateModelMatrix() {
		const modelMatrix = Matrix4.createTranslation(headPivot.x, headPivot.y, headPivot.z);
		modelMatrix.multiply(Matrix4.createRotationY(headState.currentYaw * 0.8));
		modelMatrix.multiply(Matrix4.createRotationX(headState.currentPitch * 0.7));
		modelMatrix.multiply(Matrix4.createTranslation(-headPivot.x, -headPivot.y, -headPivot.z));
		modelElements = modelMatrix.getElements();
	}
	const shadowFocusPosition = Vector3.create(eyeCenter.x, eyeCenter.y - 0.08, eyeCenter.z - 0.09);
	const shadowLightTravelDirection = KEY_LIGHT_DIRECTION.multiply(-1);

	function renderFrame() {
		// 프레임 레이트 제한. (30 / 60 / 최대 — 목표 간격보다 이르면 건너뛴다)
		const targetFrameRate = FRAME_RATE_OPTIONS[sliderStates.frameRate];
		const nowTimestamp = System.performance.now();
		if (nowTimestamp - previousTimestamp < 1000 / targetFrameRate - 1.5) {
			System.window.requestAnimationFrame(renderFrame);
			return;
		}
		resizeCanvas();
		const currentTimestamp = nowTimestamp;
		const elapsedTime = (currentTimestamp - startTimestamp) / 1000;
		const deltaTime = System.Math.min((currentTimestamp - previousTimestamp) / 1000, 0.1);
		previousTimestamp = currentTimestamp;
		statistics.smoothedFrameSeconds = statistics.smoothedFrameSeconds * 0.92 + deltaTime * 0.08;
		const aspectRatio = canvas.width / canvas.height;
		let drawCallCount = 0;

		// 카메라. (목표값 지수 접근 + 미세한 자동 흔들림)
		const cameraApproach = System.Math.min(1, deltaTime * 5);
		cameraState.yaw += (cameraState.targetYaw - cameraState.yaw) * cameraApproach;
		cameraState.pitch += (cameraState.targetPitch - cameraState.pitch) * cameraApproach;
		cameraState.distance += (cameraState.targetDistance - cameraState.distance) * cameraApproach;
		const swayYaw = cameraState.yaw + System.Math.sin(elapsedTime * 0.19) * 0.02;
		const swayPitch = cameraState.pitch + System.Math.sin(elapsedTime * 0.27 + 1) * 0.01;
		const cameraX = CAMERA_TARGET.x + System.Math.sin(swayYaw) * System.Math.cos(swayPitch) * cameraState.distance;
		const cameraY = CAMERA_TARGET.y + System.Math.sin(swayPitch) * cameraState.distance;
		const cameraZ = CAMERA_TARGET.z + System.Math.cos(swayYaw) * System.Math.cos(swayPitch) * cameraState.distance;
		const cameraPosition = Vector3.create(cameraX, cameraY, cameraZ);
		const viewMatrix = Matrix4.createLookAt(cameraPosition, CAMERA_TARGET, Vector3.up());
		const projectionMatrix = Matrix4.createPerspective(CAMERA_FIELD_OF_VIEW, aspectRatio, CAMERA_NEAR_DISTANCE, CAMERA_FAR_DISTANCE);
		const viewProjectionMatrix = projectionMatrix.clone();
		viewProjectionMatrix.multiply(viewMatrix);
		const viewProjectionElements = viewProjectionMatrix.getElements();

		// 표정 / 머리 방향 / 스키닝 갱신.
		updateExpressions(elapsedTime, deltaTime);
		updateHeadDirection(elapsedTime, deltaTime);
		updateWrinkleWeights();
		skinRenderer.setDetailStrength(optionStates.detail ? sliderStates.poreDetail : 0);
		skinRenderer.setCavityStrength(optionStates.detail ? sliderStates.cavity : 0);
		skinRenderer.setMicroDetail(38, optionStates.detail ? sliderStates.microNormal : 0);
		skinRenderer.setNormalStrength(sliderStates.normalStrength);
		skinRenderer.setWrinkleMaps(optionStates.wrinkle, sliderStates.wrinkleDepth, System.Math.min(1, sliderStates.wrinkleDepth * 0.45));
		skinRenderer.setSpecularStrength(sliderStates.specular);
		skinRenderer.setRoughnessRange(sliderStates.roughness * 0.85, sliderStates.roughness * 1.1);
		skinRenderer.setSheenStrength(sliderStates.sheen);
		skinRenderer.setShadowSoftness(sliderStates.shadowSoftness);
		skinRenderer.setLight(0, KEY_LIGHT_DIRECTION.x, KEY_LIGHT_DIRECTION.y, KEY_LIGHT_DIRECTION.z, 1.0, 0.92, 0.82, sliderStates.keyIntensity);
		skinRenderer.setLight(1, FILL_LIGHT_DIRECTION.x, FILL_LIGHT_DIRECTION.y, FILL_LIGHT_DIRECTION.z, 0.6, 0.7, 0.9, sliderStates.fillIntensity);
		skinRenderer.setLight(2, RIM_LIGHT_DIRECTION.x, RIM_LIGHT_DIRECTION.y, RIM_LIGHT_DIRECTION.z, 0.95, 0.97, 1.0, sliderStates.rimIntensity);
		const ambientScale = sliderStates.ambientIntensity;
		skinRenderer.setAmbientColors([0.2 * ambientScale, 0.21 * ambientScale, 0.25 * ambientScale], [0.13 * ambientScale, 0.12 * ambientScale, 0.12 * ambientScale], [0.09 * ambientScale, 0.08 * ambientScale, 0.075 * ambientScale]);
		const hairLevel = HAIR_LEVEL_DEFINITIONS[sliderStates.hairQuality];
		skinRenderer.setHairFringe(hairLevel.fringe);
		skinRenderer.setHairSway(sliderStates.hairSway * hairLevel.sway * 0.012, elapsedTime, 1.6);
		skinRenderer.setHairParameters([-0.1, 0.16], [160, 24], [0.24 * sliderStates.hairSpecular, 0.52 * sliderStates.hairSpecular, 0.2], sliderStates.hairRootShade);
		skinRenderer.setEyeParameters(sliderStates.irisSize, sliderStates.pupilSize, sliderStates.irisDepth);
		subsurfaceEffect.setScatterWidth(sliderStates.subsurfaceWidth * 0.001);
		ambientOcclusionEffect.setParameters(sliderStates.occlusionRadius, sliderStates.occlusionStrength, 0.0015);
		bloomEffect.setThreshold(sliderStates.bloomThreshold, sliderStates.bloomThreshold + 0.85);
		const activeModels = getActiveModels();
		for (const model of activeModels) {
			model.update(deltaTime);
		}
		const renderWidth = sceneRenderTarget.getWidth();
		const renderHeight = sceneRenderTarget.getHeight();

		pollPassTimers();

		// === 1. 섀도우 깊이 패스 (키 라이트) ===
		beginPass("shadow");
		webGL2RenderingContext.enable(webGL2RenderingContext.CULL_FACE);
		webGL2RenderingContext.cullFace(webGL2RenderingContext.BACK);
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		shadowMap.updateLightMatrix(shadowFocusPosition, shadowLightTravelDirection, 0.45, 0.2, 4);
		const lightViewProjectionMatrix = shadowMap.getLightViewProjectionMatrix();
		const lightViewProjectionElements = lightViewProjectionMatrix.getElements();
		if (optionStates.shadow) {
			shadowMap.beginRender();
			for (const model of activeModels) {
				skinRenderer.drawDepth(model, lightViewProjectionElements, modelElements);
				drawCallCount += model.getDrawableList().length;
			}
		}
		const shadowDepthTexture = shadowMap.getDepthTexture();
		skinRenderer.setShadowMap(shadowDepthTexture, lightViewProjectionElements, 1 / shadowMapResolution);
		skinRenderer.setShadowStrength(optionStates.shadow ? sliderStates.shadowStrength : 0);

		endPass();

		// === 2. 피부 MRT 패스 (조도 / 알베도 / 스펙큘러 + 깊이) ===
		beginPass("scene");
		sceneRenderTarget.bind();
		webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
		webGL2RenderingContext.depthMask(true);
		webGL2RenderingContext.clearColor(0, 0, 0, 0);
		webGL2RenderingContext.clear(webGL2RenderingContext.COLOR_BUFFER_BIT | webGL2RenderingContext.DEPTH_BUFFER_BIT);
		webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
		backgroundPass.use();
		webGL2RenderingContext.uniform1f(backgroundPass.getUniformLocation("aspectRatio"), aspectRatio);
		backgroundPass.draw();
		webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
		drawCallCount += 1;
		for (const model of activeModels) {
			skinRenderer.draw(model, viewProjectionElements, modelElements, cameraX, cameraY, cameraZ);
			drawCallCount += model.getDrawableList().length;
		}

		// === 2b. 블렌드 패스 (머리카락 프린지 / 눈꺼풀 차폐 / 눈물선 / 침 — 깊이 쓰기 없이 어태치먼트별 알파 블렌드) ===
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFuncSeparate(webGL2RenderingContext.SRC_ALPHA, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA, webGL2RenderingContext.ZERO, webGL2RenderingContext.ONE);
		webGL2RenderingContext.depthMask(false);
		webGL2RenderingContext.disable(webGL2RenderingContext.CULL_FACE);
		for (const model of activeModels) {
			skinRenderer.drawBlended(model, viewProjectionElements, modelElements, cameraX, cameraY, cameraZ);
		}
		webGL2RenderingContext.enable(webGL2RenderingContext.CULL_FACE);
		webGL2RenderingContext.depthMask(true);
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		drawCallCount += 6;

		endPass();

		// === 3. 화면 공간 서브서피스 스캐터링 / 앰비언트 오클루전 ===
		beginPass("scatter");
		const irradianceTexture = sceneRenderTarget.getColorTexture(0);
		const albedoTexture = sceneRenderTarget.getColorTexture(1);
		const specularTexture = sceneRenderTarget.getColorTexture(2);
		const normalTexture = sceneRenderTarget.getColorTexture(3);
		const sceneDepthTexture = sceneRenderTarget.getDepthTexture();
		let occlusionResultTexture = albedoTexture;
		if (optionStates.occlusion) {
			const viewMatrixElements = viewMatrix.getElements();
			ambientOcclusionEffect.render(sceneDepthTexture, normalTexture, viewMatrixElements, CAMERA_FIELD_OF_VIEW, aspectRatio, CAMERA_NEAR_DISTANCE, CAMERA_FAR_DISTANCE);
			occlusionResultTexture = ambientOcclusionEffect.getResultTexture();
			drawCallCount += 3;
		}
		let scatteredIrradianceTexture = irradianceTexture;
		if (optionStates.subsurface) {
			subsurfaceEffect.render(irradianceTexture, sceneDepthTexture, CAMERA_FIELD_OF_VIEW, aspectRatio, CAMERA_NEAR_DISTANCE, CAMERA_FAR_DISTANCE);
			scatteredIrradianceTexture = subsurfaceEffect.getResultTexture();
			drawCallCount += 2;
		}

		endPass();

		// === 4. 합성 → HDR (조도 x 알베도 + 스펙큘러 + 배경) ===
		beginPass("post");
		hdrRenderTarget.bind();
		webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
		combinePass.use();
		webGL2RenderingContext.uniform1i(combinePass.getUniformLocation("irradianceTexture"), 0);
		webGL2RenderingContext.uniform1i(combinePass.getUniformLocation("albedoTexture"), 1);
		webGL2RenderingContext.uniform1i(combinePass.getUniformLocation("specularTexture"), 2);
		webGL2RenderingContext.uniform1i(combinePass.getUniformLocation("occlusionTexture"), 3);
		webGL2RenderingContext.uniform1f(combinePass.getUniformLocation("aspectRatio"), aspectRatio);
		webGL2RenderingContext.uniform1f(combinePass.getUniformLocation("occlusionStrength"), optionStates.occlusion ? System.Math.min(1, sliderStates.occlusionStrength) : 0);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, scatteredIrradianceTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, albedoTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE2);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, specularTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE3);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, occlusionResultTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		combinePass.draw();
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, null);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		drawCallCount += 1;

		// === 5. 블룸 ===
		const hdrColorTexture = hdrRenderTarget.getColorTexture();
		if (optionStates.bloom) {
			bloomEffect.render(hdrColorTexture);
			const bloomIterationCount = bloomEffect.getIterationCount();
			drawCallCount += 1 + bloomIterationCount * 2;
		}

		// === 6. 톤 매핑 합성 → LDR (FXAA 켜짐) 또는 화면 ===
		const useAntialias = sliderStates.antialias > 0;
		if (useAntialias) {
			ldrRenderTarget.bind();
		}
		else {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
		}
		compositePass.use();
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("sceneTexture"), 0);
		webGL2RenderingContext.uniform1i(compositePass.getUniformLocation("bloomTexture"), 1);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("exposure"), sliderStates.exposure);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("bloomStrength"), optionStates.bloom ? sliderStates.bloomStrength : 0);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("vignetteStrength"), sliderStates.vignette);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("grainStrength"), sliderStates.grain);
		webGL2RenderingContext.uniform1f(compositePass.getUniformLocation("elapsedTime"), elapsedTime);
		webGL2RenderingContext.uniform2f(compositePass.getUniformLocation("resolution"), renderWidth, renderHeight);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, hdrColorTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		const bloomResultTexture = optionStates.bloom ? bloomEffect.getResultTexture() : hdrColorTexture;
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, bloomResultTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		compositePass.draw();
		drawCallCount += 1;

		// === 7. FXAA (+ 샤픈) → 화면 ===
		if (useAntialias) {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
			antialiasPass.use();
			webGL2RenderingContext.uniform1i(antialiasPass.getUniformLocation("sourceTexture"), 0);
			webGL2RenderingContext.uniform2f(antialiasPass.getUniformLocation("texelSize"), 1 / renderWidth, 1 / renderHeight);
			webGL2RenderingContext.uniform1f(antialiasPass.getUniformLocation("sharpenStrength"), sliderStates.antialias >= 2 ? 0.5 : 0);
			const ldrColorTexture = ldrRenderTarget.getColorTexture();
			webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, ldrColorTexture);
			antialiasPass.draw();
			drawCallCount += 1;
		}

		endPass();

		// === 8. 와이어프레임 (화면 깊이 프리패스로 앞면 모서리만 — 모프 / 스키닝 반영) ===
		if (optionStates.wireframe) {
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
			webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
			webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
			webGL2RenderingContext.depthMask(true);
			webGL2RenderingContext.clear(webGL2RenderingContext.DEPTH_BUFFER_BIT);
			webGL2RenderingContext.colorMask(false, false, false, false);
			webGL2RenderingContext.enable(webGL2RenderingContext.POLYGON_OFFSET_FILL);
			webGL2RenderingContext.polygonOffset(1.5, 2);
			for (const model of activeModels) {
				skinRenderer.drawDepth(model, viewProjectionElements, modelElements);
			}
			webGL2RenderingContext.disable(webGL2RenderingContext.POLYGON_OFFSET_FILL);
			webGL2RenderingContext.colorMask(true, true, true, true);
			webGL2RenderingContext.depthMask(false);
			webGL2RenderingContext.depthFunc(webGL2RenderingContext.LEQUAL);
			webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
			webGL2RenderingContext.blendFunc(webGL2RenderingContext.SRC_ALPHA, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
			for (const model of activeModels) {
				skinRenderer.drawWireframe(model, viewProjectionElements, modelElements, 0.91, 0.79, 0.54, 0.55);
			}
			webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
			webGL2RenderingContext.depthMask(true);
			webGL2RenderingContext.depthFunc(webGL2RenderingContext.LESS);
			webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
			drawCallCount += (triangleCount > 0 ? activeModels.length : 0) * 2;
		}

		// === 9. 머티리얼 그래프 (좌측 — 텍스처 / 셰이딩 흐름 + 중간 버퍼 실시간 미리보기) ===
		webGL2RenderingContext.disable(webGL2RenderingContext.CULL_FACE);
		if (optionStates.materialGraph) {
			drawCallCount += renderMaterialGraph({
				irradianceTexture: irradianceTexture,
				albedoTexture: albedoTexture,
				specularTexture: specularTexture,
				scatteredIrradianceTexture: scatteredIrradianceTexture,
				hdrColorTexture: hdrColorTexture,
			});
		}

		// === 10. HUD (엔진 Graphic — 프리멀티플라이드 알파 블렌딩, 컬링 해제) ===
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFunc(webGL2RenderingContext.ONE, webGL2RenderingContext.ONE_MINUS_SRC_ALPHA);
		statistics.drawCallCount = drawCallCount;
		renderHud();
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);

		System.window.requestAnimationFrame(renderFrame);
	}

	System.document.getElementById("loadingOverlay").classList.add("hidden");
	System.window.requestAnimationFrame(renderFrame);
	</script>
</body>
</html>
