<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics 2D</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1f2a; touch-action: none; user-select: none; }
#mainCanvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="mainCanvas"></canvas>
<script type="module">
"use strict";
const System = globalThis;

//==============================================================================
// 2D 물리 초안 페이지. (러스트 예제 physics2d 와 같은 장면, 저장소의 import.js 를 바로 읽는 개발용 페이지)
// - 주소 ?prestep=180 이면 처음에 180 걸음을 돌고 멈춘다. (러스트 PHYSICS2D_PRESTEP, 두 엔진의 찍은 화면을 견줄 때)
//==============================================================================
const engineModule = await import("../../import.js");
const sceneModule = await import("./physics2dscene.js");
const query = new System.URLSearchParams(System.location.search);
const prestepCount = query.has("prestep") ? System.Math.max(0, System.Math.floor(System.Number(query.get("prestep")))) : 0;
const engineConfiguration = new engineModule.EngineConfiguration();
engineConfiguration.referenceResolutionSize = engineModule.Vector2.create(1280, 720);
engineConfiguration.canvasId = "mainCanvas";
engineConfiguration.autoResizeOnWindowResize = true;
engineConfiguration.useStatistics = false;
const engine = new engineModule.Engine(engineConfiguration);
engine.run(new sceneModule.Physics2DScene(prestepCount));
</script>
</body>
</html>
