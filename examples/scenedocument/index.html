<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Document</title>
<link rel="icon" href="../assets/favicon.svg">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
#mainCanvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="mainCanvas"></canvas>
<script type="module">
"use strict";
const System = globalThis;

//==============================================================================
// UI 문서 예제. (UIDocument 로 씬 파일을 읽어 노드 트리를 짓고 그린다, 러스트 예제 scenedocument 와 같은 장면)
// - scenedocument.scene.json 은 UIDocument 와 비주얼 에디터 저장 꼴(문서에 frameSize 를 얹은 것)로 만든 씬이다.
//   Panel 아래 제목 글, 그림(Sprite, 돌린 Sprite, UIImageView), 테(Outline), 진행 고리, 라벨, 단추(content 안의 글), 슬라이더, 진행 막대, 스크롤 뷰(content 안의 줄 넷), 별 셋이 있다.
// - 그림은 ../timelineshowcase/assets 에서 받아 UIDocument.setImageResolver 로 잇는다. (fromJsonText 앞에 다 받아 둔다)
// - 지은 트리를 toJsonText 로 다시 내보내 읽은 문서와 같은지 화면 아래에 적는다.
// - 화면 저장: ?capture=90 (러스트 VANILLA_CAPTURE_FRAMES=90)
//==============================================================================
import { Engine, EngineConfiguration, Scene, WorldNode, Vector2, Rect, Color, Pivot, Text, TextAlign, UIDocument } from "../../import.js";

//==============================================================================
// 전역 상수 목록.
//==============================================================================
const SCENE_FILE_PATH = "scenedocument.scene.json";
const IMAGE_ASSET_DIRECTORY = "../timelineshowcase/assets/";
const VIEW_WIDTH = 1280;
const VIEW_HEIGHT = 720;
const BACKGROUND_COLOR = "#0d1117";

//==============================================================================
// 문서 안의 그림 경로 모으기. (재귀)
//==============================================================================
function collectImagePaths(nodeData, imagePathSet) {
	for (const componentData of nodeData.components || []) {
		if (typeof componentData.imagePath === "string" && componentData.imagePath !== "") {
			imagePathSet.add(componentData.imagePath);
		}
	}
	for (const childData of (nodeData.children || []).concat(nodeData.contentChildren || [])) {
		collectImagePaths(childData, imagePathSet);
	}
}

//==============================================================================
// 두 JSON 값이 같은지. (객체 열쇠 차례는 보지 않는다)
//==============================================================================
function isSameJsonValue(left, right) {
	if (left === right) {
		return true;
	}
	if (typeof left !== "object" || typeof right !== "object" || left === null || right === null) {
		return false;
	}
	if (System.Array.isArray(left) !== System.Array.isArray(right)) {
		return false;
	}
	const leftKeys = System.Object.keys(left);
	const rightKeys = System.Object.keys(right);
	if (leftKeys.length !== rightKeys.length) {
		return false;
	}
	for (const key of leftKeys) {
		if (!isSameJsonValue(left[key], right[key])) {
			return false;
		}
	}
	return true;
}

//==============================================================================
// 노드 수 세기. (뿌리와 그 자손)
//==============================================================================
function countNodes(node) {
	let nodeCount = 1;
	for (const child of node.getChildren()) {
		nodeCount += countNodes(child);
	}
	return nodeCount;
}

//==============================================================================
// UI 문서 씬.
//==============================================================================
class SceneDocumentScene extends Scene {
	/** @private @type { string } */ #sceneText = "";

	//==============================================================================
	// 읽기. (씬 파일과 그림을 받는다)
	//==============================================================================
	async load(engine) {
		await super.load(engine);
		const response = await System.fetch(SCENE_FILE_PATH);
		this.#sceneText = await response.text();
		const imagePathSet = new System.Set();
		collectImagePaths(System.JSON.parse(this.#sceneText).root, imagePathSet);
		const imageTable = new System.Map();
		await System.Promise.all([...imagePathSet].map(async (imagePath) => {
			const image = new System.Image();
			image.src = IMAGE_ASSET_DIRECTORY + imagePath;
			await image.decode();
			imageTable.set(imagePath, image);
		}));
		UIDocument.setImageResolver((imagePath) => {
			const image = imageTable.get(imagePath);
			return image !== undefined ? image : null;
		});
	}

	//==============================================================================
	// 초기화. (문서로 트리를 지은 뒤, 다시 내보내 견준다)
	//==============================================================================
	initialize(engine) {
		super.initialize(engine);
		const root = this.getRoot();
		const documentRootNode = UIDocument.fromJsonText(this.#sceneText);
		root.addChild(documentRootNode);

		// 다시 내보내 읽은 문서의 root 와 견준다. (에디터 값 frameSize 는 문서 밖이라 빼고 본다)
		const exportedText = UIDocument.toJsonText(documentRootNode, true);
		const readRoot = System.JSON.parse(this.#sceneText).root;
		const exportedRoot = System.JSON.parse(exportedText).root;
		const comparison = isSameJsonValue(readRoot, exportedRoot) ? "같다" : "다르다";
		const nodeCount = countNodes(documentRootNode);
		const statusText = `씬 파일 ${SCENE_FILE_PATH} 에서 노드 ${nodeCount}개를 지었다. 다시 내보낸 문서(${[...exportedText].length}자)가 읽은 문서와 ${comparison}.`;

		// 상태 줄. (문서 밖에서 코드로 만든 노드)
		const statusLabelNode = new WorldNode();
		root.addChild(statusLabelNode);
		statusLabelNode.setName("status");
		statusLabelNode.setPivot(Pivot.topLeft);
		statusLabelNode.setLocalPosition(Vector2.create(60, 690));
		statusLabelNode.setContentSize(Vector2.create(1160, 24));
		const statusTextComponent = statusLabelNode.addComponent(Text);
		statusTextComponent.setFontSize(18);
		statusTextComponent.setText(statusText);
		statusTextComponent.setTextAlign(TextAlign.left);
		statusTextComponent.setTextColor(new Color(0.75, 0.8, 0.9, 1));
	}

	//==============================================================================
	// 이전 출력. (배경을 칠하고 기준 해상도 좌표계를 건다)
	//==============================================================================
	preDraw(graphic) {
		const viewManager = this.getEngine().getViewManager();
		const canvasNativeSize = viewManager.getCanvasNativeSize();
		viewManager.applyCanvasNativeRect(graphic);
		graphic.setFillColor(BACKGROUND_COLOR);
		graphic.drawRect(Rect.create(0, 0, canvasNativeSize.x, canvasNativeSize.y));
		viewManager.applyViewRect(graphic);
	}
}

//==============================================================================
// 시작.
//==============================================================================
const engineConfiguration = new EngineConfiguration();
engineConfiguration.title = "UI 문서 (바닐라엔진)";
engineConfiguration.canvasId = "mainCanvas";
engineConfiguration.referenceResolutionSize = Vector2.create(VIEW_WIDTH, VIEW_HEIGHT);
engineConfiguration.autoResizeOnWindowResize = true;
const engine = new Engine(engineConfiguration);
engine.run(new SceneDocumentScene());
</script>
</body>
</html>
