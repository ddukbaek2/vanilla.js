<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>NEON HORIZON - vanilla.js 3D Example</title>
	<link rel="icon" href="./favicon.svg">
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #0d0704;
			touch-action: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}
		#mainCanvas {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			display: block;
		}
		#titleOverlay {
			position: absolute;
			left: 50%;
			top: 13%;
			transform: translateX(-50%);
			text-align: center;
			pointer-events: none;
			user-select: none;
			font-family: "Segoe UI Light", "Segoe UI", "Malgun Gothic", sans-serif;
			animation: titleEntrance 3.2s cubic-bezier(0.16, 1, 0.3, 1) both;
		}
		#titleMain {
			font-size: clamp(28px, 5.6vw, 68px);
			font-weight: 200;
			letter-spacing: 0.5em;
			text-indent: 0.5em;
			color: #f1e9d8;
			text-shadow: 0 0 28px rgba(243, 229, 171, 0.4), 0 0 64px rgba(255, 180, 90, 0.2);
		}
		#titleDivider {
			width: min(240px, 40vw);
			height: 1px;
			margin: 16px auto 14px;
			background: linear-gradient(90deg, transparent, rgba(243, 229, 171, 0.7), transparent);
		}
		#titleSub {
			font-size: clamp(9px, 1.2vw, 12px);
			font-weight: 300;
			letter-spacing: 0.85em;
			text-indent: 0.85em;
			color: rgba(209, 193, 178, 0.75);
			text-shadow: 0 0 10px rgba(243, 229, 171, 0.4);
		}
		#homeLink {
			position: absolute;
			left: 50%;
			bottom: 6.5%;
			transform: translateX(-50%);
			font-family: "Segoe UI", "Malgun Gothic", sans-serif;
			font-size: clamp(9px, 1.2vw, 12px);
			font-weight: 300;
			letter-spacing: 0.45em;
			text-indent: 0.45em;
			text-decoration: none;
			color: rgba(241, 233, 216, 0.75);
			padding: 10px 22px;
			border: 1px solid rgba(243, 229, 171, 0.3);
			border-radius: 999px;
			background: rgba(13, 7, 4, 0.45);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			text-shadow: 0 0 10px rgba(243, 229, 171, 0.4);
			transition: color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
			animation: titleEntrance 3.2s cubic-bezier(0.16, 1, 0.3, 1) both;
		}
		#homeLink:hover {
			color: #fffaf0;
			border-color: rgba(243, 229, 171, 0.85);
			background: rgba(58, 36, 14, 0.55);
			box-shadow: 0 0 22px rgba(243, 229, 171, 0.35), inset 0 0 12px rgba(243, 229, 171, 0.12);
		}
		@keyframes titleEntrance {
			0% { opacity: 0; transform: translateX(-50%) translateY(-14px); filter: blur(8px); }
			100% { opacity: 1; transform: translateX(-50%) translateY(0); filter: blur(0); }
		}
	</style>
</head>
<body>
	<canvas id="mainCanvas"></canvas>
	<div id="titleOverlay">
		<div id="titleMain">NEON HORIZON</div>
		<div id="titleDivider"></div>
		<div id="titleSub">VANILLA.JS</div>
	</div>
	<a id="homeLink" href="https://ddukbaek2.com" target="_blank" rel="noopener">DDUKBAEK2.COM</a>
	<script type="module">
	"use strict";
	const System = globalThis;

	//==============================================================================
	// 셰이더 소스 목록.
	//==============================================================================
	// 풀스크린 삼각형 공용 버텍스 셰이더. (gl_VertexID 사용, 버텍스 버퍼 불필요)
	const FULLSCREEN_VERTEXSHADER_SOURCE = `#version 300 es
	out vec2 fragmentCoordinate;
	out vec2 fragmentTextureCoordinate;
	void main() {
		vec2 positions[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
		vec2 position = positions[gl_VertexID];
		fragmentCoordinate = position;
		fragmentTextureCoordinate = position * 0.5 + 0.5;
		gl_Position = vec4(position, 0.999, 1.0);
	}
	`;

	// 배경. (초콜릿 하늘 + 줄무늬 바닐라 태양 + 별 + 유성 + 지평선 글로우)
	const BACKGROUND_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec2 fragmentCoordinate;
	uniform float elapsedTime;
	uniform float aspectRatio;
	out vec4 outputColor;

	float hash21(vec2 point) {
		point = fract(point * vec2(234.34, 435.345));
		point += dot(point, point + 34.23);
		return fract(point.x * point.y);
	}

	float segmentDistance(vec2 point, vec2 segmentStart, vec2 segmentEnd) {
		vec2 startToPoint = point - segmentStart;
		vec2 startToEnd = segmentEnd - segmentStart;
		float projection = clamp(dot(startToPoint, startToEnd) / dot(startToEnd, startToEnd), 0.0, 1.0);
		return length(startToPoint - startToEnd * projection);
	}

	void main() {
		vec2 screenPoint = vec2(fragmentCoordinate.x * aspectRatio, fragmentCoordinate.y);
		float horizonY = -0.08;

		// 하늘 그라디언트. (위: 짙은 초콜릿, 지평선: 따뜻한 캐러멜)
		vec3 skyTopColor = vec3(0.045, 0.028, 0.014);
		vec3 skyHorizonColor = vec3(0.46, 0.26, 0.1);
		float skyGradient = smoothstep(1.1, horizonY, fragmentCoordinate.y);
		vec3 color = mix(skyTopColor, skyHorizonColor, skyGradient * skyGradient);

		// 별. (지평선 위에서만, 셀 내 원형 스프라이트 + 반짝임)
		if (fragmentCoordinate.y > horizonY) {
			vec2 starGrid = screenPoint * 60.0;
			vec2 starCell = floor(starGrid);
			float starRandom = hash21(starCell);
			if (starRandom > 0.93) {
				vec2 starLocalPoint = fract(starGrid) - vec2(fract(starRandom * 13.7), fract(starRandom * 71.3));
				float starDistance = length(starLocalPoint);
				float starSize = 0.04 + fract(starRandom * 93.1) * 0.08;
				float starIntensity = smoothstep(starSize, 0.0, starDistance);
				float twinkle = 0.45 + 0.55 * sin(elapsedTime * (2.0 + starRandom * 6.0) + starRandom * 40.0);
				float starFade = smoothstep(horizonY, horizonY + 0.35, fragmentCoordinate.y);
				color += vec3(1.0, 0.95, 0.84) * starIntensity * twinkle * starFade * 0.8;
			}
		}

		// 전투순양함. (저 멀리 우주에 정박한 거대 함선 실루엣)
		{
			// 함선 로컬 좌표. (좌측 상공, 미세 표류 + 살짝 기울어진 자세)
			vec2 shipCenter = vec2(-0.45 * aspectRatio + sin(elapsedTime * 0.05) * 0.015, 0.55 + sin(elapsedTime * 0.08) * 0.01);
			vec2 shipLocal = screenPoint - shipCenter;
			float tiltRadian = -0.07;
			float cosTilt = cos(tiltRadian);
			float sinTilt = sin(tiltRadian);
			shipLocal = vec2(shipLocal.x * cosTilt - shipLocal.y * sinTilt, shipLocal.x * sinTilt + shipLocal.y * cosTilt);

			// 선체: 길쭉한 몸통 + 앞으로 갈수록 좁아지는 프로우.
			float hullHalfHeight = 0.02 * (1.0 - smoothstep(0.1, 0.34, shipLocal.x));
			float hullMask = step(-0.3, shipLocal.x) * step(shipLocal.x, 0.34) * smoothstep(0.004, -0.002, abs(shipLocal.y) - hullHalfHeight);

			// 상부 구조물 + 함교.
			float superstructureMask = step(-0.16, shipLocal.x) * step(shipLocal.x, 0.02) * smoothstep(0.003, -0.002, abs(shipLocal.y - 0.026) - 0.014);
			float bridgeMask = step(-0.09, shipLocal.x) * step(shipLocal.x, -0.03) * smoothstep(0.003, -0.002, abs(shipLocal.y - 0.052) - 0.012);
			float shipMask = max(hullMask, max(superstructureMask, bridgeMask));

			if (shipMask > 0.001) {
				// 실루엣: 하늘보다 짙은 함체 + 태양 방향(하부) 캐러멜 림 라이트.
				vec3 shipColor = vec3(0.045, 0.03, 0.02);
				float rimLight = smoothstep(0.2, 1.0, -shipLocal.y / max(hullHalfHeight, 0.001)) * hullMask;
				shipColor += vec3(0.85, 0.5, 0.2) * rimLight * 0.5;

				// 창문 불빛. (드문드문, 느리게 깜빡임)
				vec2 windowCell = floor(shipLocal * vec2(220.0, 400.0));
				float windowRandom = hash21(windowCell);
				float windowLight = step(0.965, windowRandom) * (0.6 + 0.4 * sin(elapsedTime * (1.0 + windowRandom * 2.0) + windowRandom * 60.0));
				shipColor += vec3(1.0, 0.9, 0.65) * windowLight * 0.5;
				color = mix(color, shipColor, shipMask);
			}

			// 선미 엔진 글로우 3기. (맥동하는 골드 추진광)
			float enginePulse = 0.75 + 0.25 * sin(elapsedTime * 3.1);
			for (int engineIndex = 0; engineIndex < 3; ++engineIndex) {
				float engineOffsetY = (float(engineIndex) - 1.0) * 0.012;
				float engineDistance = length((shipLocal - vec2(-0.305, engineOffsetY)) * vec2(1.0, 1.6));
				color += vec3(1.0, 0.72, 0.32) * exp(-engineDistance * 260.0) * enginePulse * 0.9;
				color += vec3(1.0, 0.6, 0.25) * exp(-engineDistance * 60.0) * enginePulse * 0.25;
			}
		}

		// 유성. (몇 초에 한 번씩 대각선 스트릭)
		{
			float shootingCycle = 6.0;
			float shootingSeed = floor(elapsedTime / shootingCycle);
			float shootingPhase = fract(elapsedTime / shootingCycle);
			float seedRandom = hash21(vec2(shootingSeed, 17.0));
			if (shootingPhase < 0.16) {
				float travel = shootingPhase / 0.16;
				vec2 startPoint = vec2(-aspectRatio + seedRandom * aspectRatio * 2.0, 0.95 - seedRandom * 0.3);
				vec2 velocity = vec2(1.6 + seedRandom * 0.8, -0.55);
				vec2 headPoint = startPoint + velocity * travel;
				vec2 tailPoint = headPoint - velocity * 0.16;
				float streakDistance = segmentDistance(screenPoint, tailPoint, headPoint);
				float streakFade = (1.0 - travel) * smoothstep(horizonY + 0.1, horizonY + 0.3, fragmentCoordinate.y);
				color += vec3(1.0, 0.94, 0.8) * exp(-streakDistance * 220.0) * streakFade * 1.6;
				color += vec3(0.9, 0.68, 0.38) * exp(-streakDistance * 40.0) * streakFade * 0.35;
			}
		}

		// 태양. (지평선에 걸친 그라디언트 디스크, 하단은 대기 헤이즈에 녹아듦)
		vec2 sunCenter = vec2(0.0, horizonY + 0.18);
		float sunDistance = length(vec2(screenPoint.x, (fragmentCoordinate.y - sunCenter.y) * 1.0) - vec2(sunCenter.x, 0.0));
		float sunRadius = 0.34;
		float sunDisc = smoothstep(sunRadius, sunRadius - 0.012, sunDistance);

		// 하단 대기 용해. (수평선 근처에서 부드럽게 사라짐)
		float sunLocalY = (fragmentCoordinate.y - (sunCenter.y - sunRadius)) / (sunRadius * 2.0);
		sunDisc *= smoothstep(-0.08, 0.3, sunLocalY);

		// 태양 색상 그라디언트. (위: 크림 바닐라, 아래: 구운 캐러멜)
		vec3 sunColor = mix(vec3(0.95, 0.42, 0.12), vec3(1.0, 0.93, 0.66), clamp(sunLocalY, 0.0, 1.0));
		color = mix(color, sunColor, sunDisc);

		// 태양 주변 글로우 + 지평선 글로우.
		float sunGlow = exp(-sunDistance * 4.2) * 0.38;
		color += vec3(1.0, 0.62, 0.24) * sunGlow;
		float horizonGlow = exp(-abs(fragmentCoordinate.y - horizonY) * 9.0) * 0.5;
		color += vec3(0.95, 0.55, 0.2) * horizonGlow;

		outputColor = vec4(color, 1.0);
	}
	`;

	// 지형. (정점에서 높이 변위 + 등장 페이드, 프래그먼트에서 네온 그리드 + 유광 물웅덩이)
	const TERRAIN_VERTEXSHADER_SOURCE = `#version 300 es
	in vec2 vertexGridPosition;
	uniform mat4 projectionMatrix;
	uniform mat4 viewMatrix;
	uniform float scrollOffset;
	out vec3 fragmentWorldPosition;
	out float fragmentViewDistance;
	out float fragmentHeight;

	float riverDistanceAt(vec2 worldXZ) {
		// 도로 좌우를 따라 굽이치며 끝없이 이어지는 강줄기 2개까지의 거리.
		float riverCenter1 = 6.5 + sin(worldXZ.y * 0.09 + 1.7) * 2.4 + sin(worldXZ.y * 0.045) * 1.8;
		float riverCenter2 = -6.0 - sin(worldXZ.y * 0.075 + 4.1) * 2.6 - sin(worldXZ.y * 0.05 + 2.3) * 1.6;
		return min(abs(worldXZ.x - riverCenter1), abs(worldXZ.x - riverCenter2));
	}

	float terrainHeight(vec2 worldXZ) {
		// 중앙(도로)은 평평하고 좌우로 갈수록 산이 솟는 구조.
		float sideFactor = smoothstep(2.2, 9.0, abs(worldXZ.x));
		float wave1 = sin(worldXZ.x * 0.42 + worldXZ.y * 0.31);
		float wave2 = sin(worldXZ.x * 0.19 - worldXZ.y * 0.23 + 1.7);
		float wave3 = sin(worldXZ.x * 0.83 + worldXZ.y * 0.57 + 4.1);
		float height = (wave1 * 0.9 + wave2 * 1.15 + wave3 * 0.35);
		height = max(height, 0.0) * sideFactor * 2.6;

		// 강이 지나는 자리는 지형을 깎아 계곡을 만든다. (강이 언덕에서 끊기지 않도록)
		float riverCarve = 1.0 - smoothstep(1.6, 3.6, riverDistanceAt(worldXZ));
		return height * (1.0 - riverCarve);
	}

	void main() {
		// 셀 단위 스냅 스크롤: 높이를 셀 경계에 고정 샘플링하고 잔여분만큼 메시를 밀어서
		// 언덕이 출렁이지 않고 단단한 지형 그대로 카메라 쪽으로 흘러오게 한다.
		float snappedOffset = floor(scrollOffset / 2.0) * 2.0;
		float residualOffset = scrollOffset - snappedOffset;
		vec2 worldXZ = vec2(vertexGridPosition.x, vertexGridPosition.y + snappedOffset);
		float height = terrainHeight(worldXZ);
		float viewDistance = vertexGridPosition.y - residualOffset;

		// 등장 페이드: 먼 곳의 언덕이 잘려 나타나지 않고 지평선에서 서서히 솟아오르도록.
		float emergenceFade = 1.0 - smoothstep(34.0, 44.0, viewDistance);
		height *= emergenceFade;

		// 카메라는 -z 방향을 바라보므로 렌더 좌표의 z 는 부호를 뒤집는다.
		vec3 renderPosition = vec3(vertexGridPosition.x, height, -viewDistance);
		fragmentWorldPosition = vec3(worldXZ.x, height, worldXZ.y);
		fragmentViewDistance = viewDistance;
		fragmentHeight = height;
		gl_Position = projectionMatrix * viewMatrix * vec4(renderPosition, 1.0);
	}
	`;
	const TERRAIN_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec3 fragmentWorldPosition;
	in float fragmentViewDistance;
	in float fragmentHeight;
	uniform float elapsedTime;
	uniform float scrollOffset;
	uniform vec3 cameraPosition;
	out vec4 outputColor;

	void main() {
		// 셀 경계까지의 거리 기반 안티앨리어싱 그리드 라인. (월드 좌표 고정 → 지형과 함께 흐름)
		vec2 gridCoordinate = fragmentWorldPosition.xz * 0.5;
		vec2 gridDistance = abs(fract(gridCoordinate - 0.5) - 0.5) / fwidth(gridCoordinate);
		float lineDistance = min(gridDistance.x, gridDistance.y);
		float lineIntensity = 1.0 - smoothstep(0.0, 1.6, lineDistance);

		// 높이에 따른 네온 색상. (캐러멜 → 크림 바닐라)
		float heightRatio = clamp(fragmentHeight * 0.22, 0.0, 1.0);
		vec3 lineColor = mix(vec3(0.95, 0.58, 0.14), vec3(1.0, 0.95, 0.75), heightRatio);

		// 면 단위(플랫 셰이딩) 라이팅. (태양의 캐러멜 필 + 하늘의 아이보리 필)
		vec3 surfacePosition = vec3(fragmentWorldPosition.x, fragmentHeight, fragmentViewDistance);
		vec3 surfaceNormal = normalize(cross(dFdx(surfacePosition), dFdy(surfacePosition)));
		if (surfaceNormal.y < 0.0) {
			surfaceNormal = -surfaceNormal;
		}
		vec3 sunDirection = normalize(vec3(-fragmentWorldPosition.x * 0.02, 0.25, 1.0));
		float sunLight = pow(max(dot(surfaceNormal, sunDirection), 0.0), 2.0);
		float skyLight = max(surfaceNormal.y, 0.0);

		// 바닥 면 색상. (라이팅 반영된 로우폴리 패싯)
		vec3 floorColor = vec3(0.05, 0.032, 0.016);
		floorColor += vec3(0.42, 0.24, 0.09) * sunLight * smoothstep(0.2, 2.5, fragmentHeight);
		floorColor += vec3(0.12, 0.1, 0.07) * skyLight * 0.35;

		float lineGlow = 1.0 - smoothstep(0.0, 6.0, lineDistance);
		vec3 color = floorColor + lineColor * lineIntensity * 1.35 + lineColor * lineGlow * 0.22;

		// 도로 중앙 에너지 스트림. (주기가 티 나지 않는 다층 파동이 매끄럽게 흘러오는 형태)
		float lateralGlow = exp(-abs(fragmentWorldPosition.x) * 1.6);
		float coreGlow = exp(-abs(fragmentWorldPosition.x) * 5.0);
		float flowShimmer = sin(fragmentViewDistance * 0.55 + scrollOffset * 1.4) * 0.5
		                  + sin(fragmentViewDistance * 0.23 + scrollOffset * 0.8 + 1.7) * 0.35
		                  + sin(fragmentViewDistance * 0.91 + scrollOffset * 2.3 + 3.9) * 0.15;
		float streamFlow = 0.55 + 0.3 * flowShimmer;
		color += vec3(1.0, 0.88, 0.55) * (lateralGlow * 0.3 + coreGlow * 0.45) * streamFlow;

		// 강. (도로 좌우를 따라 끝없이 이어지는 물길 — terrainHeight 의 계곡과 동일 경로)
		float riverCenter1 = 6.5 + sin(fragmentWorldPosition.z * 0.09 + 1.7) * 2.4 + sin(fragmentWorldPosition.z * 0.045) * 1.8;
		float riverCenter2 = -6.0 - sin(fragmentWorldPosition.z * 0.075 + 4.1) * 2.6 - sin(fragmentWorldPosition.z * 0.05 + 2.3) * 1.6;
		float riverDistance = min(abs(fragmentWorldPosition.x - riverCenter1), abs(fragmentWorldPosition.x - riverCenter2));
		float puddleMask = (1.0 - smoothstep(1.5, 2.4, riverDistance)) * (1.0 - smoothstep(0.05, 0.4, fragmentHeight));
		if (puddleMask > 0.001) {
			// 물 표면: 다중 옥타브 물결 높이장을 해석적으로 미분해 노멀을 만든다.
			// 물결 좌표가 물길 방향(z)으로 계속 밀려 내려와 흐르는 느낌을 만든다.
			// 굴절(수면 아래 그리드가 일렁이며 비침) + 반사(하늘/태양) + 태양 글리터.
			vec2 flowCoordinate = vec2(fragmentWorldPosition.x * 1.5, fragmentWorldPosition.z - elapsedTime * 3.2);
			float wavePhase1 = dot(flowCoordinate, vec2(1.9, 1.2)) + elapsedTime * 0.7;
			float wavePhase2 = dot(flowCoordinate, vec2(-1.3, 2.3)) - elapsedTime * 0.5;
			float wavePhase3 = dot(flowCoordinate, vec2(3.1, -0.8)) + elapsedTime * 0.9;
			float wavePhase4 = dot(flowCoordinate, vec2(5.7, 4.3)) + elapsedTime * 1.2;
			vec2 waveGradient = vec2(1.9, 1.2) * cos(wavePhase1) * 0.05
			                  + vec2(-1.3, 2.3) * cos(wavePhase2) * 0.035
			                  + vec2(3.1, -0.8) * cos(wavePhase3) * 0.02
			                  + vec2(5.7, 4.3) * cos(wavePhase4) * 0.008;
			vec3 waterNormal = normalize(vec3(-waveGradient.x, 1.0, -waveGradient.y));

			// 실제 시선 벡터와 반사 벡터. (렌더 공간)
			vec3 surfaceRenderPosition = vec3(fragmentWorldPosition.x, fragmentHeight, -fragmentViewDistance);
			vec3 viewDirection = normalize(cameraPosition - surfaceRenderPosition);
			vec3 reflectDirection = reflect(-viewDirection, waterNormal);
			float fresnel = pow(1.0 - max(dot(waterNormal, viewDirection), 0.0), 3.0);

			// 굴절: 수면 아래의 그리드 라인이 리플에 왜곡되어 일렁이며 비친다.
			vec2 refractedCoordinate = (fragmentWorldPosition.xz + waveGradient * 5.0) * 0.5;
			vec2 refractedGridDistance = abs(fract(refractedCoordinate - 0.5) - 0.5) / fwidth(gridCoordinate);
			float refractedLine = 1.0 - smoothstep(0.0, 2.2, min(refractedGridDistance.x, refractedGridDistance.y));

			// 반사된 하늘. (지평선 캐러멜 → 상공 초콜릿)
			float reflectUp = clamp(reflectDirection.y, 0.0, 1.0);
			vec3 reflectedSkyColor = mix(vec3(0.52, 0.3, 0.12), vec3(0.08, 0.055, 0.03), pow(reflectUp, 0.6));

			// 반사된 태양. (샤프 스파클 + 부드러운 헤일로)
			vec3 reflectedSunDirection = normalize(vec3(0.0, 0.09, -1.0));
			float sunAlignment = max(dot(reflectDirection, reflectedSunDirection), 0.0);
			float sunSpecular = pow(sunAlignment, 240.0);
			float sunHalo = pow(sunAlignment, 24.0);

			// 태양 글리터. (물길을 따라 반짝이며 흘러 내려오는 잔반짝임)
			float glitterColumn = exp(-riverDistance * 0.5);
			float glitterSparkle = smoothstep(0.035, 0.085, length(waveGradient));
			float sunGlitter = glitterColumn * glitterSparkle;

			// 합성: 물에 젖은 바닥(굴절 그리드) 위에 밝은 반사가 뜨는 수면.
			vec3 waterBedColor = vec3(0.16, 0.1, 0.05) + vec3(0.85, 0.52, 0.16) * refractedLine * 0.9;
			vec3 waterColor = waterBedColor;
			waterColor += reflectedSkyColor * (0.45 + 0.45 * fresnel);
			waterColor += vec3(1.0, 0.85, 0.55) * sunHalo * 0.55;
			waterColor += vec3(1.0, 0.95, 0.75) * sunGlitter * 0.9;
			waterColor += vec3(1.0, 0.93, 0.7) * sunSpecular * 2.0;

			float waterBlend = smoothstep(0.0, 0.5, puddleMask);
			color = mix(color, waterColor, waterBlend);

			// 웅덩이 가장자리: 바깥은 젖은 바닥(어둡게), 안쪽은 얇은 크림 하이라이트.
			float wetRim = smoothstep(0.0, 0.12, puddleMask) * (1.0 - smoothstep(0.12, 0.3, puddleMask));
			color *= 1.0 - wetRim * 0.25;
			float puddleEdge = smoothstep(0.12, 0.22, puddleMask) * (1.0 - smoothstep(0.22, 0.45, puddleMask));
			color += vec3(1.0, 0.9, 0.6) * puddleEdge * 0.25;
		}

		// 맥동. (라인이 은은하게 숨쉬듯)
		color *= 0.94 + 0.06 * sin(elapsedTime * 2.2 + fragmentViewDistance * 0.35);

		// 거리 안개. (지평선 색으로 흡수, 측면 원거리도 함께 흡수해 지형 가장자리를 감춤)
		float lateralDistance = max(abs(fragmentWorldPosition.x - cameraPosition.x) - 12.0, 0.0);
		float fogFactor = smoothstep(18.0, 46.0, fragmentViewDistance + lateralDistance * 1.6);
		vec3 fogColor = vec3(0.42, 0.24, 0.1);
		color = mix(color, fogColor, fogFactor);

		outputColor = vec4(color, 1.0);
	}
	`;

	// 부스트 빛살. (꾹 누르면 가속하며 카메라를 스쳐 지나가는 먼지빛살)
	const STREAK_VERTEXSHADER_SOURCE = `#version 300 es
	in vec4 streakData; // x, y, z, seed
	in float streakEndFlag; // 0 = 머리, 1 = 꼬리
	uniform mat4 projectionMatrix;
	uniform mat4 viewMatrix;
	uniform float streakScroll;
	uniform float boostFactor;
	uniform float heightOffset;
	uniform float lateralOffset;
	out float fragmentSeed;
	out float fragmentTailRatio;

	void main() {
		float seed = streakData.w;

		// 먼 곳에서 카메라 쪽으로 접근. (개체별 속도 편차, 부스트 시 꼬리가 길어짐)
		// 밴드 전체가 카메라 높이를 따라 이동해 언덕 위에서도 빈 구간이 없다.
		float speedFactor = 0.7 + seed * 0.6;
		float loopZ = 46.0 - mod(streakData.z + streakScroll * speedFactor, 46.0);
		float streakLength = (0.6 + seed * 1.0) * (0.35 + boostFactor * 2.2);
		vec3 worldPosition = vec3(streakData.x + lateralOffset, streakData.y + heightOffset, loopZ + streakEndFlag * streakLength);

		// 카메라는 -z 방향을 바라보므로 렌더 좌표의 z 는 부호를 뒤집는다.
		vec3 renderPosition = vec3(worldPosition.x, worldPosition.y, -worldPosition.z);
		gl_Position = projectionMatrix * viewMatrix * vec4(renderPosition, 1.0);
		fragmentSeed = seed;
		fragmentTailRatio = streakEndFlag;
	}
	`;
	const STREAK_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in float fragmentSeed;
	in float fragmentTailRatio;
	uniform float boostFactor;
	out vec4 outputColor;

	void main() {
		vec3 goldColor = vec3(1.0, 0.72, 0.35);
		vec3 creamColor = vec3(0.97, 0.9, 0.68);
		vec3 color = mix(goldColor, creamColor, fract(fragmentSeed * 3.77));
		float headFade = 1.0 - fragmentTailRatio;

		// 부스트 중에만 선명해짐. (평상시엔 거의 보이지 않음)
		float boostAlpha = 0.04 + boostFactor * 0.9;
		outputColor = vec4(color * headFade * boostAlpha, 0.0);
	}
	`;

	// 부유 먼지 파티클. (가산 합성 포인트 스프라이트, 지형 깊이에 가려짐)
	const PARTICLE_VERTEXSHADER_SOURCE = `#version 300 es
	in vec4 vertexParticle; // x, y, z, seed
	uniform mat4 projectionMatrix;
	uniform mat4 viewMatrix;
	uniform float elapsedTime;
	uniform float heightOffset;
	uniform float lateralOffset;
	out float fragmentSeed;
	out float fragmentProximityFade;

	void main() {
		float seed = vertexParticle.w;

		// 각자 다른 속도로 떠오르고 좌우로 흔들림.
		// 밴드 전체가 카메라 높이를 따라 이동해 언덕 위에서도 빈 구간이 없다.
		float floatY = mod(vertexParticle.y + elapsedTime * (0.12 + seed * 0.25), 7.0);
		float swayX = vertexParticle.x + sin(elapsedTime * (0.4 + seed) + seed * 40.0) * 0.4;
		float loopZ = mod(vertexParticle.z + elapsedTime * 1.2, 38.0) + 2.0;

		// 카메라는 -z 방향을 바라보므로 렌더 좌표의 z 는 부호를 뒤집는다.
		vec3 renderPosition = vec3(swayX + lateralOffset, floatY + 0.2 + heightOffset, -loopZ);

		vec4 viewPosition = viewMatrix * vec4(renderPosition, 1.0);
		gl_Position = projectionMatrix * viewPosition;
		float viewDepth = max(-viewPosition.z, 0.1);
		gl_PointSize = clamp(70.0 / viewDepth, 1.5, 14.0);

		// 카메라에 너무 가까운 파티클은 페이드. (거대한 원이 화면을 가리지 않도록)
		fragmentProximityFade = smoothstep(1.2, 5.0, viewDepth);
		fragmentSeed = seed;
	}
	`;
	const PARTICLE_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in float fragmentSeed;
	in float fragmentProximityFade;
	uniform float elapsedTime;
	uniform float fadeFactor;
	out vec4 outputColor;

	void main() {
		// 원형 소프트 스프라이트.
		vec2 pointOffset = gl_PointCoord - 0.5;
		float pointDistance = length(pointOffset);
		float alpha = smoothstep(0.5, 0.05, pointDistance);

		// 파티클마다 색상과 반짝임 위상 차이.
		vec3 goldColor = vec3(1.0, 0.72, 0.35);
		vec3 creamColor = vec3(0.97, 0.9, 0.68);
		vec3 color = mix(goldColor, creamColor, fract(fragmentSeed * 7.31));
		float twinkle = 0.55 + 0.45 * sin(elapsedTime * (1.5 + fragmentSeed * 3.0) + fragmentSeed * 50.0);

		outputColor = vec4(color * alpha * twinkle * fragmentProximityFade * fadeFactor * 0.45, 0.0);
	}
	`;

	// 블룸 1단계: 밝은 영역 추출. (씬 → 하프 해상도)
	const BRIGHTPASS_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec2 fragmentTextureCoordinate;
	uniform sampler2D sceneTexture;
	out vec4 outputColor;

	void main() {
		vec3 sceneColor = texture(sceneTexture, fragmentTextureCoordinate).rgb;
		float brightness = max(max(sceneColor.r, sceneColor.g), sceneColor.b);
		float extractFactor = smoothstep(0.5, 0.95, brightness);
		outputColor = vec4(sceneColor * extractFactor, 1.0);
	}
	`;

	// 블룸 2단계: 9탭 가우시안 블러. (가로/세로 분리)
	const BLUR_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec2 fragmentTextureCoordinate;
	uniform sampler2D sourceTexture;
	uniform vec2 blurDirection; // (1/width, 0) 또는 (0, 1/height)
	out vec4 outputColor;

	void main() {
		float weights[5] = float[5](0.227027, 0.1945946, 0.1216216, 0.054054, 0.016216);
		vec3 color = texture(sourceTexture, fragmentTextureCoordinate).rgb * weights[0];
		for (int tapIndex = 1; tapIndex < 5; ++tapIndex) {
			vec2 tapOffset = blurDirection * float(tapIndex) * 1.6;
			color += texture(sourceTexture, fragmentTextureCoordinate + tapOffset).rgb * weights[tapIndex];
			color += texture(sourceTexture, fragmentTextureCoordinate - tapOffset).rgb * weights[tapIndex];
		}
		outputColor = vec4(color, 1.0);
	}
	`;

	// 최종 합성: 씬 + 블룸 + 색수차 + 필믹 톤맵 + 비네트 + 레터박스.
	const COMPOSITE_FRAGMENTSHADER_SOURCE = `#version 300 es
	precision highp float;
	in vec2 fragmentCoordinate;
	in vec2 fragmentTextureCoordinate;
	uniform sampler2D sceneTexture;
	uniform sampler2D bloomTexture;
	uniform float elapsedTime;
	uniform float boostFactor;
	uniform vec2 resolution;
	uniform float bloomStrength;
	uniform float aberrationStrength;
	uniform float filmStrength;
	uniform float letterboxStrength;
	out vec4 outputColor;

	float hash21(vec2 point) {
		point = fract(point * vec2(234.34, 435.345));
		point += dot(point, point + 34.23);
		return fract(point.x * point.y);
	}

	void main() {
		// 색수차. (가장자리로 갈수록 RGB 채널 분리, 부스트 시 강화되어 가속감)
		vec2 centerOffset = fragmentTextureCoordinate - 0.5;
		float aberrationAmount = dot(centerOffset, centerOffset) * (0.012 + boostFactor * 0.02) * aberrationStrength;
		vec2 aberrationOffset = centerOffset * aberrationAmount;
		float channelRed = texture(sceneTexture, fragmentTextureCoordinate + aberrationOffset).r;
		float channelGreen = texture(sceneTexture, fragmentTextureCoordinate).g;
		float channelBlue = texture(sceneTexture, fragmentTextureCoordinate - aberrationOffset).b;
		vec3 color = vec3(channelRed, channelGreen, channelBlue);

		// 블룸 가산.
		vec3 bloomColor = texture(bloomTexture, fragmentTextureCoordinate).rgb;
		color += bloomColor * 0.95 * bloomStrength;

		// 은은한 스캔라인.
		float scanline = sin(fragmentTextureCoordinate.y * resolution.y * 1.6) * 0.5 + 0.5;
		color *= mix(1.0, 0.97 + scanline * 0.03, filmStrength);

		// 필름 그레인.
		float grain = hash21(fragmentTextureCoordinate * resolution.xy + fract(elapsedTime) * 371.0);
		color += (grain - 0.5) * 0.012 * filmStrength;

		// 비네트.
		float vignette = 1.0 - dot(fragmentCoordinate * 0.5, fragmentCoordinate * 0.5);
		color *= clamp(vignette, 0.0, 1.0);

		// ACES 근사 필믹 톤 매핑.
		color = clamp((color * (2.51 * color + 0.03)) / (color * (2.43 * color + 0.59) + 0.14), 0.0, 1.0);

		// 시네마틱 레터박스.
		float letterboxCurve = smoothstep(0.0, 0.01, fragmentTextureCoordinate.y - 0.045)
		                     * smoothstep(0.0, 0.01, 0.955 - fragmentTextureCoordinate.y);
		color *= mix(1.0, letterboxCurve, letterboxStrength);

		// 인트로 페이드인. (검은 화면에서 서서히 등장)
		float introFade = smoothstep(0.2, 2.6, elapsedTime);
		color *= introFade;

		outputColor = vec4(color, 1.0);
	}
	`;

	//==============================================================================
	// 셰이더 프로그램 생성.
	//==============================================================================
	function createShaderProgram(webGL2RenderingContext, vertexShaderSource, fragmentShaderSource) {
		const vertexShader = webGL2RenderingContext.createShader(webGL2RenderingContext.VERTEX_SHADER);
		webGL2RenderingContext.shaderSource(vertexShader, vertexShaderSource.trim());
		webGL2RenderingContext.compileShader(vertexShader);
		if (!webGL2RenderingContext.getShaderParameter(vertexShader, webGL2RenderingContext.COMPILE_STATUS)) {
			throw new Error(webGL2RenderingContext.getShaderInfoLog(vertexShader));
		}

		const fragmentShader = webGL2RenderingContext.createShader(webGL2RenderingContext.FRAGMENT_SHADER);
		webGL2RenderingContext.shaderSource(fragmentShader, fragmentShaderSource.trim());
		webGL2RenderingContext.compileShader(fragmentShader);
		if (!webGL2RenderingContext.getShaderParameter(fragmentShader, webGL2RenderingContext.COMPILE_STATUS)) {
			throw new Error(webGL2RenderingContext.getShaderInfoLog(fragmentShader));
		}

		const program = webGL2RenderingContext.createProgram();
		webGL2RenderingContext.attachShader(program, vertexShader);
		webGL2RenderingContext.attachShader(program, fragmentShader);
		webGL2RenderingContext.linkProgram(program);
		if (!webGL2RenderingContext.getProgramParameter(program, webGL2RenderingContext.LINK_STATUS)) {
			throw new Error(webGL2RenderingContext.getProgramInfoLog(program));
		}

		return program;
	}

	//==============================================================================
	// 렌더 타겟(프레임버퍼 + 컬러 텍스처 [+ 깊이]) 생성.
	//==============================================================================
	function createRenderTarget(webGL2RenderingContext, width, height, useDepth) {
		const colorTexture = webGL2RenderingContext.createTexture();
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, colorTexture);
		webGL2RenderingContext.texImage2D(webGL2RenderingContext.TEXTURE_2D, 0, webGL2RenderingContext.RGBA8, width, height, 0, webGL2RenderingContext.RGBA, webGL2RenderingContext.UNSIGNED_BYTE, null);
		webGL2RenderingContext.texParameteri(webGL2RenderingContext.TEXTURE_2D, webGL2RenderingContext.TEXTURE_MIN_FILTER, webGL2RenderingContext.LINEAR);
		webGL2RenderingContext.texParameteri(webGL2RenderingContext.TEXTURE_2D, webGL2RenderingContext.TEXTURE_MAG_FILTER, webGL2RenderingContext.LINEAR);
		webGL2RenderingContext.texParameteri(webGL2RenderingContext.TEXTURE_2D, webGL2RenderingContext.TEXTURE_WRAP_S, webGL2RenderingContext.CLAMP_TO_EDGE);
		webGL2RenderingContext.texParameteri(webGL2RenderingContext.TEXTURE_2D, webGL2RenderingContext.TEXTURE_WRAP_T, webGL2RenderingContext.CLAMP_TO_EDGE);

		const framebuffer = webGL2RenderingContext.createFramebuffer();
		webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, framebuffer);
		webGL2RenderingContext.framebufferTexture2D(webGL2RenderingContext.FRAMEBUFFER, webGL2RenderingContext.COLOR_ATTACHMENT0, webGL2RenderingContext.TEXTURE_2D, colorTexture, 0);

		let depthRenderbuffer = null;
		if (useDepth) {
			depthRenderbuffer = webGL2RenderingContext.createRenderbuffer();
			webGL2RenderingContext.bindRenderbuffer(webGL2RenderingContext.RENDERBUFFER, depthRenderbuffer);
			webGL2RenderingContext.renderbufferStorage(webGL2RenderingContext.RENDERBUFFER, webGL2RenderingContext.DEPTH_COMPONENT16, width, height);
			webGL2RenderingContext.framebufferRenderbuffer(webGL2RenderingContext.FRAMEBUFFER, webGL2RenderingContext.DEPTH_ATTACHMENT, webGL2RenderingContext.RENDERBUFFER, depthRenderbuffer);
		}

		webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
		return { framebuffer: framebuffer, colorTexture: colorTexture, depthRenderbuffer: depthRenderbuffer, width: width, height: height };
	}

	//==============================================================================
	// 렌더 타겟 파기.
	//==============================================================================
	function destroyRenderTarget(webGL2RenderingContext, renderTarget) {
		if (!renderTarget) {
			return;
		}
		webGL2RenderingContext.deleteFramebuffer(renderTarget.framebuffer);
		webGL2RenderingContext.deleteTexture(renderTarget.colorTexture);
		if (renderTarget.depthRenderbuffer) {
			webGL2RenderingContext.deleteRenderbuffer(renderTarget.depthRenderbuffer);
		}
	}

	//==============================================================================
	// 원근 투영 행렬 생성. (열우선)
	//==============================================================================
	function createPerspectiveMatrix(fieldOfViewRadian, aspectRatio, nearDistance, farDistance) {
		const focalLength = 1.0 / System.Math.tan(fieldOfViewRadian / 2);
		const rangeInverse = 1.0 / (nearDistance - farDistance);
		return new Float32Array([
			focalLength / aspectRatio, 0, 0, 0,
			0, focalLength, 0, 0,
			0, 0, (nearDistance + farDistance) * rangeInverse, -1,
			0, 0, nearDistance * farDistance * rangeInverse * 2, 0,
		]);
	}

	//==============================================================================
	// 뷰 행렬 생성. (카메라 위치 + 피치/요 회전, 열우선)
	//==============================================================================
	function createViewMatrix(cameraPosition, pitchRadian, yawRadian) {
		const cosPitch = System.Math.cos(pitchRadian);
		const sinPitch = System.Math.sin(pitchRadian);
		const cosYaw = System.Math.cos(yawRadian);
		const sinYaw = System.Math.sin(yawRadian);

		// 카메라 기저 축 벡터. (-z 를 바라보는 표준 시선, yaw + 는 오른쪽, pitch + 는 위쪽)
		const rightAxis = [cosYaw, 0, sinYaw];
		const upAxis = [-sinPitch * sinYaw, cosPitch, sinPitch * cosYaw];
		const backAxis = [-sinYaw * cosPitch, -sinPitch, cosYaw * cosPitch];

		return new Float32Array([
			rightAxis[0], upAxis[0], backAxis[0], 0,
			rightAxis[1], upAxis[1], backAxis[1], 0,
			rightAxis[2], upAxis[2], backAxis[2], 0,
			-(rightAxis[0] * cameraPosition[0] + rightAxis[1] * cameraPosition[1] + rightAxis[2] * cameraPosition[2]),
			-(upAxis[0] * cameraPosition[0] + upAxis[1] * cameraPosition[1] + upAxis[2] * cameraPosition[2]),
			-(backAxis[0] * cameraPosition[0] + backAxis[1] * cameraPosition[1] + backAxis[2] * cameraPosition[2]),
			1,
		]);
	}

	//==============================================================================
	// 초기화.
	//==============================================================================
	const canvas = System.document.getElementById("mainCanvas");
	const webGL2RenderingContext = canvas.getContext("webgl2", { antialias: false, depth: false });
	if (!webGL2RenderingContext) {
		System.document.body.innerHTML = "<p style=\"color:#fff;font-family:sans-serif;padding:2em\">WebGL2 를 지원하지 않는 브라우저입니다.</p>";
		throw new Error("WebGL2 Not Supported.");
	}

	// 풀스크린 패스 공용 VAO. (버텍스 버퍼 불필요)
	const fullscreenVertexArray = webGL2RenderingContext.createVertexArray();

	// 배경 프로그램.
	const backgroundProgram = createShaderProgram(webGL2RenderingContext, FULLSCREEN_VERTEXSHADER_SOURCE, BACKGROUND_FRAGMENTSHADER_SOURCE);
	const backgroundElapsedTimeLocation = webGL2RenderingContext.getUniformLocation(backgroundProgram, "elapsedTime");
	const backgroundAspectRatioLocation = webGL2RenderingContext.getUniformLocation(backgroundProgram, "aspectRatio");

	// 지형 프로그램 + 그리드 메시.
	const terrainProgram = createShaderProgram(webGL2RenderingContext, TERRAIN_VERTEXSHADER_SOURCE, TERRAIN_FRAGMENTSHADER_SOURCE);
	const terrainProjectionMatrixLocation = webGL2RenderingContext.getUniformLocation(terrainProgram, "projectionMatrix");
	const terrainViewMatrixLocation = webGL2RenderingContext.getUniformLocation(terrainProgram, "viewMatrix");
	const terrainScrollOffsetLocation = webGL2RenderingContext.getUniformLocation(terrainProgram, "scrollOffset");
	const terrainElapsedTimeLocation = webGL2RenderingContext.getUniformLocation(terrainProgram, "elapsedTime");
	const terrainCameraPositionLocation = webGL2RenderingContext.getUniformLocation(terrainProgram, "cameraPosition");

	// 그리드 정점 목록. (x: -40..40, z: 0..48, 셀 크기 2 — 좌우 이동 한계에서도 끝이 안 보이게 넓게)
	const GRID_HALF_WIDTH = 40;
	const GRID_DEPTH = 48;
	const GRID_CELL_SIZE = 2;
	const gridColumnCount = (GRID_HALF_WIDTH * 2) / GRID_CELL_SIZE;
	const gridRowCount = GRID_DEPTH / GRID_CELL_SIZE;
	const terrainPositions = [];
	const terrainIndices = [];
	for (let rowIndex = 0; rowIndex <= gridRowCount; ++rowIndex) {
		for (let columnIndex = 0; columnIndex <= gridColumnCount; ++columnIndex) {
			const positionX = -GRID_HALF_WIDTH + columnIndex * GRID_CELL_SIZE;
			const positionZ = rowIndex * GRID_CELL_SIZE;
			terrainPositions.push(positionX, positionZ);
		}
	}
	const gridVertexStride = gridColumnCount + 1;
	for (let rowIndex = 0; rowIndex < gridRowCount; ++rowIndex) {
		for (let columnIndex = 0; columnIndex < gridColumnCount; ++columnIndex) {
			const topLeft = rowIndex * gridVertexStride + columnIndex;
			const topRight = topLeft + 1;
			const bottomLeft = topLeft + gridVertexStride;
			const bottomRight = bottomLeft + 1;
			terrainIndices.push(topLeft, bottomLeft, topRight, topRight, bottomLeft, bottomRight);
		}
	}
	const terrainVertexArray = webGL2RenderingContext.createVertexArray();
	webGL2RenderingContext.bindVertexArray(terrainVertexArray);
	const terrainVertexBuffer = webGL2RenderingContext.createBuffer();
	webGL2RenderingContext.bindBuffer(webGL2RenderingContext.ARRAY_BUFFER, terrainVertexBuffer);
	webGL2RenderingContext.bufferData(webGL2RenderingContext.ARRAY_BUFFER, new Float32Array(terrainPositions), webGL2RenderingContext.STATIC_DRAW);
	const terrainGridPositionLocation = webGL2RenderingContext.getAttribLocation(terrainProgram, "vertexGridPosition");
	webGL2RenderingContext.enableVertexAttribArray(terrainGridPositionLocation);
	webGL2RenderingContext.vertexAttribPointer(terrainGridPositionLocation, 2, webGL2RenderingContext.FLOAT, false, 0, 0);
	const terrainIndexBuffer = webGL2RenderingContext.createBuffer();
	webGL2RenderingContext.bindBuffer(webGL2RenderingContext.ELEMENT_ARRAY_BUFFER, terrainIndexBuffer);
	webGL2RenderingContext.bufferData(webGL2RenderingContext.ELEMENT_ARRAY_BUFFER, new Uint16Array(terrainIndices), webGL2RenderingContext.STATIC_DRAW);
	webGL2RenderingContext.bindVertexArray(null);
	const terrainIndexCount = terrainIndices.length;

	// 부스트 빛살 프로그램 + 라인 버퍼. (빛살당 머리/꼬리 2정점 인터리브)
	const streakProgram = createShaderProgram(webGL2RenderingContext, STREAK_VERTEXSHADER_SOURCE, STREAK_FRAGMENTSHADER_SOURCE);
	const streakProjectionMatrixLocation = webGL2RenderingContext.getUniformLocation(streakProgram, "projectionMatrix");
	const streakViewMatrixLocation = webGL2RenderingContext.getUniformLocation(streakProgram, "viewMatrix");
	const streakScrollLocation = webGL2RenderingContext.getUniformLocation(streakProgram, "streakScroll");
	const streakBoostFactorLocation = webGL2RenderingContext.getUniformLocation(streakProgram, "boostFactor");
	const streakHeightOffsetLocation = webGL2RenderingContext.getUniformLocation(streakProgram, "heightOffset");
	const streakLateralOffsetLocation = webGL2RenderingContext.getUniformLocation(streakProgram, "lateralOffset");
	const STREAK_COUNT = 300;
	const STREAK_FLOATS_PER_VERTEX = 5;
	const streakVertexData = new Float32Array(STREAK_COUNT * 2 * STREAK_FLOATS_PER_VERTEX);
	for (let streakIndex = 0; streakIndex < STREAK_COUNT; ++streakIndex) {
		const sideSign = streakIndex % 2 === 0 ? 1 : -1;
		const streakX = sideSign * (1.5 + System.Math.random() * 16);
		const streakY = 0.3 + System.Math.random() * 6.2;
		const streakZ = System.Math.random() * 46;
		const streakSeed = System.Math.random();
		for (let endIndex = 0; endIndex < 2; ++endIndex) {
			const vertexOffset = (streakIndex * 2 + endIndex) * STREAK_FLOATS_PER_VERTEX;
			streakVertexData[vertexOffset + 0] = streakX;
			streakVertexData[vertexOffset + 1] = streakY;
			streakVertexData[vertexOffset + 2] = streakZ;
			streakVertexData[vertexOffset + 3] = streakSeed;
			streakVertexData[vertexOffset + 4] = endIndex;
		}
	}
	const streakVertexArray = webGL2RenderingContext.createVertexArray();
	webGL2RenderingContext.bindVertexArray(streakVertexArray);
	const streakVertexBuffer = webGL2RenderingContext.createBuffer();
	webGL2RenderingContext.bindBuffer(webGL2RenderingContext.ARRAY_BUFFER, streakVertexBuffer);
	webGL2RenderingContext.bufferData(webGL2RenderingContext.ARRAY_BUFFER, streakVertexData, webGL2RenderingContext.STATIC_DRAW);
	const streakDataLocation = webGL2RenderingContext.getAttribLocation(streakProgram, "streakData");
	const streakEndFlagLocation = webGL2RenderingContext.getAttribLocation(streakProgram, "streakEndFlag");
	const streakStrideBytes = STREAK_FLOATS_PER_VERTEX * 4;
	webGL2RenderingContext.enableVertexAttribArray(streakDataLocation);
	webGL2RenderingContext.vertexAttribPointer(streakDataLocation, 4, webGL2RenderingContext.FLOAT, false, streakStrideBytes, 0);
	webGL2RenderingContext.enableVertexAttribArray(streakEndFlagLocation);
	webGL2RenderingContext.vertexAttribPointer(streakEndFlagLocation, 1, webGL2RenderingContext.FLOAT, false, streakStrideBytes, 16);
	webGL2RenderingContext.bindVertexArray(null);

	// 파티클 프로그램 + 정적 시드 버퍼.
	const particleProgram = createShaderProgram(webGL2RenderingContext, PARTICLE_VERTEXSHADER_SOURCE, PARTICLE_FRAGMENTSHADER_SOURCE);
	const particleProjectionMatrixLocation = webGL2RenderingContext.getUniformLocation(particleProgram, "projectionMatrix");
	const particleViewMatrixLocation = webGL2RenderingContext.getUniformLocation(particleProgram, "viewMatrix");
	const particleElapsedTimeLocation = webGL2RenderingContext.getUniformLocation(particleProgram, "elapsedTime");
	const particleFadeFactorLocation = webGL2RenderingContext.getUniformLocation(particleProgram, "fadeFactor");
	const particleHeightOffsetLocation = webGL2RenderingContext.getUniformLocation(particleProgram, "heightOffset");
	const particleLateralOffsetLocation = webGL2RenderingContext.getUniformLocation(particleProgram, "lateralOffset");
	const PARTICLE_COUNT = 500;
	const particleData = new Float32Array(PARTICLE_COUNT * 4);
	for (let particleIndex = 0; particleIndex < PARTICLE_COUNT; ++particleIndex) {
		particleData[particleIndex * 4 + 0] = (System.Math.random() - 0.5) * 34;
		particleData[particleIndex * 4 + 1] = System.Math.random() * 7;
		particleData[particleIndex * 4 + 2] = System.Math.random() * 38;
		particleData[particleIndex * 4 + 3] = System.Math.random();
	}
	const particleVertexArray = webGL2RenderingContext.createVertexArray();
	webGL2RenderingContext.bindVertexArray(particleVertexArray);
	const particleVertexBuffer = webGL2RenderingContext.createBuffer();
	webGL2RenderingContext.bindBuffer(webGL2RenderingContext.ARRAY_BUFFER, particleVertexBuffer);
	webGL2RenderingContext.bufferData(webGL2RenderingContext.ARRAY_BUFFER, particleData, webGL2RenderingContext.STATIC_DRAW);
	const particleAttributeLocation = webGL2RenderingContext.getAttribLocation(particleProgram, "vertexParticle");
	webGL2RenderingContext.enableVertexAttribArray(particleAttributeLocation);
	webGL2RenderingContext.vertexAttribPointer(particleAttributeLocation, 4, webGL2RenderingContext.FLOAT, false, 0, 0);
	webGL2RenderingContext.bindVertexArray(null);

	// 포스트 프로세싱 프로그램 목록.
	const brightPassProgram = createShaderProgram(webGL2RenderingContext, FULLSCREEN_VERTEXSHADER_SOURCE, BRIGHTPASS_FRAGMENTSHADER_SOURCE);
	const brightPassSceneTextureLocation = webGL2RenderingContext.getUniformLocation(brightPassProgram, "sceneTexture");
	const blurProgram = createShaderProgram(webGL2RenderingContext, FULLSCREEN_VERTEXSHADER_SOURCE, BLUR_FRAGMENTSHADER_SOURCE);
	const blurSourceTextureLocation = webGL2RenderingContext.getUniformLocation(blurProgram, "sourceTexture");
	const blurDirectionLocation = webGL2RenderingContext.getUniformLocation(blurProgram, "blurDirection");
	const compositeProgram = createShaderProgram(webGL2RenderingContext, FULLSCREEN_VERTEXSHADER_SOURCE, COMPOSITE_FRAGMENTSHADER_SOURCE);
	const compositeSceneTextureLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "sceneTexture");
	const compositeBloomTextureLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "bloomTexture");
	const compositeElapsedTimeLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "elapsedTime");
	const compositeBoostFactorLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "boostFactor");
	const compositeResolutionLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "resolution");
	const compositeBloomStrengthLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "bloomStrength");
	const compositeAberrationStrengthLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "aberrationStrength");
	const compositeFilmStrengthLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "filmStrength");
	const compositeLetterboxStrengthLocation = webGL2RenderingContext.getUniformLocation(compositeProgram, "letterboxStrength");

	// 렌더 타겟. (리사이즈 시 재생성)
	let sceneRenderTarget = null;
	let bloomRenderTargetA = null;
	let bloomRenderTargetB = null;

	//==============================================================================
	// 입력. (마우스 / 터치: 시선 시차 + 드래그 좌우 이동 + 꾹 누르면 부스트)
	//==============================================================================
	const PLAYER_MOVE_LIMIT = 14;
	let pointerTargetX = 0;
	let pointerTargetY = 0;
	let pointerCurrentX = 0;
	let pointerCurrentY = 0;
	let isBoostPressed = false;
	let dragLastClientX = null;
	let playerTargetX = 0;
	function updatePointerTarget(clientX, clientY) {
		pointerTargetX = (clientX / System.window.innerWidth) * 2 - 1;
		pointerTargetY = (clientY / System.window.innerHeight) * 2 - 1;
	}
	function updateDragMove(clientX) {
		if (dragLastClientX !== null) {
			const dragDelta = clientX - dragLastClientX;
			playerTargetX += dragDelta * (26 / System.window.innerWidth);
			playerTargetX = System.Math.max(-PLAYER_MOVE_LIMIT, System.Math.min(PLAYER_MOVE_LIMIT, playerTargetX));
		}
		dragLastClientX = clientX;
	}
	System.window.addEventListener("mousemove", (event) => {
		updatePointerTarget(event.clientX, event.clientY);
		if (isBoostPressed) {
			updateDragMove(event.clientX);
		}
	});
	System.window.addEventListener("mousedown", (event) => {
		if (event.button !== 0) {
			return;
		}
		if (event.target && event.target.id === "homeLink") {
			return;
		}
		if (handlePanelPress(event.clientX, event.clientY)) {
			return;
		}
		isBoostPressed = true;
		dragLastClientX = event.clientX;
	});
	System.window.addEventListener("mouseup", () => {
		isBoostPressed = false;
		dragLastClientX = null;
	});

	// 우클릭 컨텍스트 메뉴 차단.
	System.window.addEventListener("contextmenu", (event) => {
		event.preventDefault();
	});

	// 모바일 롱프레스 선택/번역/확대 등 시스템 인터랙션 차단. (passive: false + preventDefault)
	System.window.addEventListener("touchstart", (event) => {
		if (event.target && event.target.id === "homeLink") {
			return;
		}
		event.preventDefault();
		if (event.touches.length > 0) {
			if (handlePanelPress(event.touches[0].clientX, event.touches[0].clientY)) {
				return;
			}
			updatePointerTarget(event.touches[0].clientX, event.touches[0].clientY);
			dragLastClientX = event.touches[0].clientX;
		}
		isBoostPressed = true;
	}, { passive: false });
	System.window.addEventListener("touchmove", (event) => {
		if (event.target && event.target.id === "homeLink") {
			return;
		}
		event.preventDefault();
		if (event.touches.length > 0) {
			updatePointerTarget(event.touches[0].clientX, event.touches[0].clientY);
			updateDragMove(event.touches[0].clientX);
		}
	}, { passive: false });
	System.window.addEventListener("touchend", () => {
		isBoostPressed = false;
		dragLastClientX = null;
	});
	System.window.addEventListener("touchcancel", () => {
		isBoostPressed = false;
		dragLastClientX = null;
	});

	//==============================================================================
	// 옵션 패널. (vanilla.js 엔진의 Graphic 으로 캔버스 안에서 직접 렌더링)
	// - 같은 캔버스의 WebGL2 컨텍스트를 공유한다. (getContext 는 동일 컨텍스트 반환)
	//==============================================================================
	const optionDefinitions = [
		{ name: "bloom", label: "BLOOM" },
		{ name: "aberration", label: "CHROMATIC" },
		{ name: "film", label: "FILM GRAIN" },
		{ name: "letterbox", label: "LETTERBOX" },
		{ name: "particles", label: "PARTICLES" },
	];
	const optionStates = {
		bloom: true,
		aberration: true,
		film: true,
		letterbox: true,
		particles: true,
	};
	const optionBlendValues = {
		bloom: 1,
		aberration: 1,
		film: 1,
		letterbox: 1,
		particles: 1,
	};
	let isPanelCollapsed = true;
	let panelCollapseBlend = 0;

	// 엔진 모듈 로드. (배포본은 ./vanilla.js, 저장소는 ../build/vanilla.js)
	let uiGraphic = null;
	let engineRect = null;
	let engineVector2 = null;
	try {
		let engineModule = null;
		try {
			engineModule = await import("./vanilla.js");
		}
		catch (importError) {
			engineModule = await import("../build/vanilla.js");
		}
		uiGraphic = new engineModule.Graphic(canvas);
		engineRect = engineModule.Rect;
		engineVector2 = engineModule.Vector2;
	}
	catch (engineError) {
		console.warn("vanilla.js 엔진 모듈을 불러오지 못해 옵션 패널을 표시하지 않습니다.", engineError);
	}

	// 패널 레이아웃. (CSS 픽셀 기준, 우측 상단 고정)
	const PANEL_WIDTH = 236;
	const PANEL_HEADER_HEIGHT = 40;
	const PANEL_ROW_HEIGHT = 30;
	const PANEL_MARGIN_RIGHT = 18;
	function calculatePanelLayout() {
		const panelX = System.window.innerWidth - PANEL_MARGIN_RIGHT - PANEL_WIDTH;
		const panelY = System.window.innerHeight * 0.08;
		const listHeight = (optionDefinitions.length * PANEL_ROW_HEIGHT + 10) * panelCollapseBlend;
		const panelHeight = PANEL_HEADER_HEIGHT + listHeight;
		return { panelX: panelX, panelY: panelY, panelHeight: panelHeight, listHeight: listHeight };
	}

	// 패널 히트 테스트. (true 반환 시 부스트/드래그 입력으로 전달하지 않음)
	function handlePanelPress(clientX, clientY) {
		if (!uiGraphic) {
			return false;
		}
		const panelLayout = calculatePanelLayout();
		if (clientX < panelLayout.panelX || clientX > panelLayout.panelX + PANEL_WIDTH) {
			return false;
		}
		if (clientY < panelLayout.panelY || clientY > panelLayout.panelY + panelLayout.panelHeight) {
			return false;
		}

		// 헤더: 접기/펴기.
		if (clientY < panelLayout.panelY + PANEL_HEADER_HEIGHT) {
			isPanelCollapsed = !isPanelCollapsed;
			return true;
		}

		// 목록: 행 토글.
		if (panelCollapseBlend > 0.9) {
			const rowIndex = System.Math.floor((clientY - panelLayout.panelY - PANEL_HEADER_HEIGHT - 4) / PANEL_ROW_HEIGHT);
			if (rowIndex >= 0 && rowIndex < optionDefinitions.length) {
				const optionName = optionDefinitions[rowIndex].name;
				optionStates[optionName] = !optionStates[optionName];
			}
		}
		return true;
	}

	//==============================================================================
	// 옵션 패널 렌더링. (매 프레임, 포스트 프로세싱이 끝난 화면 위에)
	//==============================================================================
	function renderOptionPanel(introFade) {
		if (!uiGraphic) {
			return;
		}
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const panelLayout = calculatePanelLayout();

		uiGraphic.applySettings(null);
		uiGraphic.scale(devicePixelRatio, devicePixelRatio);
		uiGraphic.setGlobalAlpha(introFade);

		// 패널 배경 + 테두리.
		const panelRect = engineRect.create(panelLayout.panelX, panelLayout.panelY, PANEL_WIDTH, panelLayout.panelHeight);
		uiGraphic.setFillColor("rgba(13, 7, 4, 0.6)");
		uiGraphic.drawRoundRect(panelRect, 14);
		uiGraphic.setStrokeColor("rgba(243, 229, 171, 0.25)");
		uiGraphic.drawStrokeRoundRect(panelRect, 14, 1);

		// 헤더.
		uiGraphic.setFontString(`300 11px "Segoe UI", sans-serif`);
		uiGraphic.setTextAlign("left");
		uiGraphic.setTextBaseline("middle");
		uiGraphic.setFillColor("rgba(243, 229, 171, 0.9)");
		uiGraphic.drawFillText("O P T I O N S", panelLayout.panelX + 16, panelLayout.panelY + PANEL_HEADER_HEIGHT * 0.5 + 1);
		uiGraphic.setTextAlign("right");
		uiGraphic.setFillColor("rgba(243, 229, 171, 0.6)");
		const arrowText = isPanelCollapsed ? "▸" : "▾";
		uiGraphic.drawFillText(arrowText, panelLayout.panelX + PANEL_WIDTH - 16, panelLayout.panelY + PANEL_HEADER_HEIGHT * 0.5 + 1);

		// 목록. (접힘 애니메이션에 따라 알파 페이드)
		if (panelCollapseBlend > 0.05) {
			const listAlpha = introFade * panelCollapseBlend;
			for (let rowIndex = 0; rowIndex < optionDefinitions.length; ++rowIndex) {
				const optionDefinition = optionDefinitions[rowIndex];
				const rowY = panelLayout.panelY + PANEL_HEADER_HEIGHT + 4 + rowIndex * PANEL_ROW_HEIGHT;
				if (rowY + PANEL_ROW_HEIGHT > panelLayout.panelY + panelLayout.panelHeight) {
					break;
				}
				const rowMiddleY = rowY + PANEL_ROW_HEIGHT * 0.5;
				uiGraphic.setGlobalAlpha(listAlpha);

				// 레이블.
				uiGraphic.setTextAlign("left");
				uiGraphic.setFontString(`300 11px "Segoe UI", sans-serif`);
				uiGraphic.setFillColor("rgba(241, 233, 216, 0.8)");
				uiGraphic.drawFillText(optionDefinition.label, panelLayout.panelX + 16, rowMiddleY + 1);

				// 토글 스위치. (트랙 + 이동 노브, 상태 전환은 매 프레임 보간)
				const toggleBlend = optionBlendValues[optionDefinition.name];
				const switchX = panelLayout.panelX + PANEL_WIDTH - 16 - 36;
				const switchY = rowMiddleY - 9.5;
				const trackRect = engineRect.create(switchX, switchY, 36, 19);
				const trackRed = 0.16 + (0.85 - 0.16) * toggleBlend;
				const trackGreen = 0.14 + (0.72 - 0.14) * toggleBlend;
				const trackBlue = 0.1 + (0.35 - 0.1) * toggleBlend;
				uiGraphic.setFillColor(`rgba(${System.Math.round(trackRed * 255)}, ${System.Math.round(trackGreen * 255)}, ${System.Math.round(trackBlue * 255)}, 0.85)`);
				uiGraphic.drawRoundRect(trackRect, 9.5);
				uiGraphic.setStrokeColor(`rgba(243, 229, 171, ${0.25 + toggleBlend * 0.45})`);
				uiGraphic.drawStrokeRoundRect(trackRect, 9.5, 1);
				const knobX = switchX + 9.5 + toggleBlend * 17;
				const knobCenter = engineVector2.create(knobX, rowMiddleY);
				uiGraphic.setFillColor(toggleBlend > 0.5 ? "#fffaf0" : "rgba(241, 233, 216, 0.75)");
				uiGraphic.drawCircle(knobCenter, 6.5);
			}
		}
	}

	//==============================================================================
	// 지형 높이. (셰이더의 terrainHeight 와 동일한 수식 — 플레이어 발밑 계산용)
	//==============================================================================
	function smoothstepValue(edgeStart, edgeEnd, value) {
		const normalized = System.Math.max(0, System.Math.min(1, (value - edgeStart) / (edgeEnd - edgeStart)));
		return normalized * normalized * (3 - 2 * normalized);
	}
	function terrainHeightAt(worldX, worldZ) {
		const sideFactor = smoothstepValue(2.2, 9.0, System.Math.abs(worldX));
		const wave1 = System.Math.sin(worldX * 0.42 + worldZ * 0.31);
		const wave2 = System.Math.sin(worldX * 0.19 - worldZ * 0.23 + 1.7);
		const wave3 = System.Math.sin(worldX * 0.83 + worldZ * 0.57 + 4.1);
		let height = wave1 * 0.9 + wave2 * 1.15 + wave3 * 0.35;
		height = System.Math.max(height, 0) * sideFactor * 2.6;

		// 강이 지나는 자리는 지형을 깎아 계곡을 만든다. (셰이더 terrainHeight 와 동일)
		const riverCenter1 = 6.5 + System.Math.sin(worldZ * 0.09 + 1.7) * 2.4 + System.Math.sin(worldZ * 0.045) * 1.8;
		const riverCenter2 = -6.0 - System.Math.sin(worldZ * 0.075 + 4.1) * 2.6 - System.Math.sin(worldZ * 0.05 + 2.3) * 1.6;
		const riverDistance = System.Math.min(System.Math.abs(worldX - riverCenter1), System.Math.abs(worldX - riverCenter2));
		const riverCarve = 1 - smoothstepValue(1.6, 3.6, riverDistance);
		return height * (1 - riverCarve);
	}

	//==============================================================================
	// 지형 표면 높이. (메시와 동일하게 셀 코너 높이를 쌍선형 보간 — 표면 관통 방지)
	//==============================================================================
	function terrainSurfaceHeightAt(worldX, worldZ) {
		const cellStartX = System.Math.floor(worldX / GRID_CELL_SIZE) * GRID_CELL_SIZE;
		const cellStartZ = System.Math.floor(worldZ / GRID_CELL_SIZE) * GRID_CELL_SIZE;
		const normalizedX = (worldX - cellStartX) / GRID_CELL_SIZE;
		const normalizedZ = (worldZ - cellStartZ) / GRID_CELL_SIZE;
		const cornerHeight00 = terrainHeightAt(cellStartX, cellStartZ);
		const cornerHeight10 = terrainHeightAt(cellStartX + GRID_CELL_SIZE, cellStartZ);
		const cornerHeight01 = terrainHeightAt(cellStartX, cellStartZ + GRID_CELL_SIZE);
		const cornerHeight11 = terrainHeightAt(cellStartX + GRID_CELL_SIZE, cellStartZ + GRID_CELL_SIZE);
		const nearHeight = cornerHeight00 + (cornerHeight10 - cornerHeight00) * normalizedX;
		const farHeight = cornerHeight01 + (cornerHeight11 - cornerHeight01) * normalizedX;
		return nearHeight + (farHeight - nearHeight) * normalizedZ;
	}

	//==============================================================================
	// 리사이즈. (캔버스 크기 + 렌더 타겟 재생성)
	//==============================================================================
	function resizeCanvas() {
		const devicePixelRatio = System.Math.min(System.window.devicePixelRatio || 1, 2);
		const displayWidth = System.Math.floor(canvas.clientWidth * devicePixelRatio);
		const displayHeight = System.Math.floor(canvas.clientHeight * devicePixelRatio);
		if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
			canvas.width = displayWidth;
			canvas.height = displayHeight;

			destroyRenderTarget(webGL2RenderingContext, sceneRenderTarget);
			destroyRenderTarget(webGL2RenderingContext, bloomRenderTargetA);
			destroyRenderTarget(webGL2RenderingContext, bloomRenderTargetB);
			const bloomWidth = System.Math.max(1, displayWidth >> 1);
			const bloomHeight = System.Math.max(1, displayHeight >> 1);
			sceneRenderTarget = createRenderTarget(webGL2RenderingContext, displayWidth, displayHeight, true);
			bloomRenderTargetA = createRenderTarget(webGL2RenderingContext, bloomWidth, bloomHeight, false);
			bloomRenderTargetB = createRenderTarget(webGL2RenderingContext, bloomWidth, bloomHeight, false);
		}
	}

	//==============================================================================
	// 메인 루프.
	//==============================================================================
	const startTimestamp = System.performance.now();
	let previousTimestamp = startTimestamp;
	let boostFactor = 0;
	let scrollDistance = 0;
	let streakScroll = 0;
	let playerCurrentX = 0;
	let runBobPhase = 0;
	function renderFrame() {
		resizeCanvas();
		const currentTimestamp = System.performance.now();
		const elapsedTime = (currentTimestamp - startTimestamp) / 1000;
		const deltaTime = System.Math.min((currentTimestamp - previousTimestamp) / 1000, 0.1);
		previousTimestamp = currentTimestamp;
		const aspectRatio = canvas.width / canvas.height;

		// 부스트 가감속. (누르면 서서히 가속, 떼면 서서히 감속)
		const boostTarget = isBoostPressed ? 1 : 0;
		const boostBlend = isBoostPressed ? 2.2 : 1.2;
		boostFactor += (boostTarget - boostFactor) * System.Math.min(boostBlend * deltaTime, 1);

		// 옵션 토글 / 패널 접힘 보간. (부드러운 트랜지션)
		for (const optionDefinition of optionDefinitions) {
			const optionTarget = optionStates[optionDefinition.name] ? 1 : 0;
			optionBlendValues[optionDefinition.name] += (optionTarget - optionBlendValues[optionDefinition.name]) * System.Math.min(7 * deltaTime, 1);
		}
		const collapseTarget = isPanelCollapsed ? 0 : 1;
		panelCollapseBlend += (collapseTarget - panelCollapseBlend) * System.Math.min(8 * deltaTime, 1);

		// 전진 거리 적분. (지형 스크롤 / 빛살 이동)
		scrollDistance += (4.2 + boostFactor * 16) * deltaTime;
		streakScroll += (10 + boostFactor * 34) * deltaTime;

		// 포인터 지연 추적. (부드러운 시차)
		pointerCurrentX += (pointerTargetX - pointerCurrentX) * 0.04;
		pointerCurrentY += (pointerTargetY - pointerCurrentY) * 0.04;

		// 플레이어 좌우 이동. (드래그 목표를 부드럽게 추적)
		playerCurrentX += (playerTargetX - playerCurrentX) * System.Math.min(5 * deltaTime, 1);

		// 플레이어 발밑 지형 높이. (메시와 동일한 보간 → 언덕을 오르내리고 관통하지 않음)
		const playerWorldZ = scrollDistance - 0.5;
		const surfaceHeight = terrainSurfaceHeightAt(playerCurrentX, playerWorldZ);

		// 달리기 보행 바운스. (속도에 비례한 발걸음 리듬)
		runBobPhase += (4.2 + boostFactor * 16) * deltaTime * 0.55;
		const runBobY = System.Math.sin(runBobPhase * 2) * 0.05 * (1 + boostFactor * 0.6);
		const runSwayX = System.Math.sin(runBobPhase) * 0.05;

		// 카메라. (지면 + 눈높이 + 보행 바운스 + 포인터 시차 + 부스트 시 화각 확장)
		const cameraPosition = [
			playerCurrentX + runSwayX + pointerCurrentX * 0.4,
			surfaceHeight + 1.9 + runBobY + pointerCurrentY * -0.3,
			0.5,
		];
		const cameraPitch = -0.06 + pointerCurrentY * 0.08;
		const cameraYaw = pointerCurrentX * 0.12;
		const fieldOfViewRadian = (System.Math.PI / 3) * (1 + boostFactor * 0.1);
		const projectionMatrix = createPerspectiveMatrix(fieldOfViewRadian, aspectRatio, 0.1, 100);
		const viewMatrix = createViewMatrix(cameraPosition, cameraPitch, cameraYaw);

		// === 1. 씬 → 오프스크린 렌더 타겟 ===
		webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, sceneRenderTarget.framebuffer);
		webGL2RenderingContext.viewport(0, 0, sceneRenderTarget.width, sceneRenderTarget.height);
		webGL2RenderingContext.clearColor(0.04, 0.025, 0.012, 1.0);
		webGL2RenderingContext.clear(webGL2RenderingContext.COLOR_BUFFER_BIT | webGL2RenderingContext.DEPTH_BUFFER_BIT);

		// 1-1. 배경.
		webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.useProgram(backgroundProgram);
		webGL2RenderingContext.bindVertexArray(fullscreenVertexArray);
		webGL2RenderingContext.uniform1f(backgroundElapsedTimeLocation, elapsedTime);
		webGL2RenderingContext.uniform1f(backgroundAspectRatioLocation, aspectRatio);
		webGL2RenderingContext.drawArrays(webGL2RenderingContext.TRIANGLES, 0, 3);

		// 1-2. 지형.
		webGL2RenderingContext.enable(webGL2RenderingContext.DEPTH_TEST);
		webGL2RenderingContext.useProgram(terrainProgram);
		webGL2RenderingContext.bindVertexArray(terrainVertexArray);
		webGL2RenderingContext.uniformMatrix4fv(terrainProjectionMatrixLocation, false, projectionMatrix);
		webGL2RenderingContext.uniformMatrix4fv(terrainViewMatrixLocation, false, viewMatrix);
		webGL2RenderingContext.uniform1f(terrainScrollOffsetLocation, scrollDistance);
		webGL2RenderingContext.uniform1f(terrainElapsedTimeLocation, elapsedTime);
		webGL2RenderingContext.uniform3f(terrainCameraPositionLocation, cameraPosition[0], cameraPosition[1], cameraPosition[2]);
		webGL2RenderingContext.drawElements(webGL2RenderingContext.TRIANGLES, terrainIndexCount, webGL2RenderingContext.UNSIGNED_SHORT, 0);

		// 1-3. 부스트 빛살. (가산 합성, 깊이 기록 없이 테스트만)
		webGL2RenderingContext.enable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.blendFunc(webGL2RenderingContext.ONE, webGL2RenderingContext.ONE);
		webGL2RenderingContext.depthMask(false);
		webGL2RenderingContext.useProgram(streakProgram);
		webGL2RenderingContext.bindVertexArray(streakVertexArray);
		webGL2RenderingContext.uniformMatrix4fv(streakProjectionMatrixLocation, false, projectionMatrix);
		webGL2RenderingContext.uniformMatrix4fv(streakViewMatrixLocation, false, viewMatrix);
		webGL2RenderingContext.uniform1f(streakScrollLocation, streakScroll);
		webGL2RenderingContext.uniform1f(streakBoostFactorLocation, boostFactor);
		webGL2RenderingContext.uniform1f(streakHeightOffsetLocation, cameraPosition[1] - 2.1);
		webGL2RenderingContext.uniform1f(streakLateralOffsetLocation, playerCurrentX);
		webGL2RenderingContext.drawArrays(webGL2RenderingContext.LINES, 0, STREAK_COUNT * 2);

		// 1-5. 파티클. (가산 합성, 깊이 테스트로 지형에 가려짐, 옵션 페이드)
		if (optionBlendValues.particles > 0.01) {
			webGL2RenderingContext.useProgram(particleProgram);
			webGL2RenderingContext.bindVertexArray(particleVertexArray);
			webGL2RenderingContext.uniformMatrix4fv(particleProjectionMatrixLocation, false, projectionMatrix);
			webGL2RenderingContext.uniformMatrix4fv(particleViewMatrixLocation, false, viewMatrix);
			webGL2RenderingContext.uniform1f(particleElapsedTimeLocation, elapsedTime);
			webGL2RenderingContext.uniform1f(particleFadeFactorLocation, optionBlendValues.particles);
			webGL2RenderingContext.uniform1f(particleHeightOffsetLocation, cameraPosition[1] - 2.1);
			webGL2RenderingContext.uniform1f(particleLateralOffsetLocation, playerCurrentX);
			webGL2RenderingContext.drawArrays(webGL2RenderingContext.POINTS, 0, PARTICLE_COUNT);
		}
		webGL2RenderingContext.depthMask(true);
		webGL2RenderingContext.disable(webGL2RenderingContext.DEPTH_TEST);
		webGL2RenderingContext.disable(webGL2RenderingContext.BLEND);
		webGL2RenderingContext.bindVertexArray(fullscreenVertexArray);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);

		// === 2. 블룸: 밝은 영역 추출 (하프 해상도) ===
		webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, bloomRenderTargetA.framebuffer);
		webGL2RenderingContext.viewport(0, 0, bloomRenderTargetA.width, bloomRenderTargetA.height);
		webGL2RenderingContext.useProgram(brightPassProgram);
		webGL2RenderingContext.uniform1i(brightPassSceneTextureLocation, 0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, sceneRenderTarget.colorTexture);
		webGL2RenderingContext.drawArrays(webGL2RenderingContext.TRIANGLES, 0, 3);

		// === 3. 블룸: 가로/세로 가우시안 블러 핑퐁 ===
		webGL2RenderingContext.useProgram(blurProgram);
		webGL2RenderingContext.uniform1i(blurSourceTextureLocation, 0);
		const BLUR_ITERATION_COUNT = 2;
		for (let blurIndex = 0; blurIndex < BLUR_ITERATION_COUNT; ++blurIndex) {
			// 가로. (A → B)
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, bloomRenderTargetB.framebuffer);
			webGL2RenderingContext.uniform2f(blurDirectionLocation, 1 / bloomRenderTargetA.width, 0);
			webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, bloomRenderTargetA.colorTexture);
			webGL2RenderingContext.drawArrays(webGL2RenderingContext.TRIANGLES, 0, 3);

			// 세로. (B → A)
			webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, bloomRenderTargetA.framebuffer);
			webGL2RenderingContext.uniform2f(blurDirectionLocation, 0, 1 / bloomRenderTargetB.height);
			webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, bloomRenderTargetB.colorTexture);
			webGL2RenderingContext.drawArrays(webGL2RenderingContext.TRIANGLES, 0, 3);
		}

		// === 4. 최종 합성 → 화면 ===
		webGL2RenderingContext.bindFramebuffer(webGL2RenderingContext.FRAMEBUFFER, null);
		webGL2RenderingContext.viewport(0, 0, canvas.width, canvas.height);
		webGL2RenderingContext.useProgram(compositeProgram);
		webGL2RenderingContext.uniform1i(compositeSceneTextureLocation, 0);
		webGL2RenderingContext.uniform1i(compositeBloomTextureLocation, 1);
		webGL2RenderingContext.uniform1f(compositeElapsedTimeLocation, elapsedTime);
		webGL2RenderingContext.uniform1f(compositeBoostFactorLocation, boostFactor);
		webGL2RenderingContext.uniform2f(compositeResolutionLocation, canvas.width, canvas.height);
		webGL2RenderingContext.uniform1f(compositeBloomStrengthLocation, optionBlendValues.bloom);
		webGL2RenderingContext.uniform1f(compositeAberrationStrengthLocation, optionBlendValues.aberration);
		webGL2RenderingContext.uniform1f(compositeFilmStrengthLocation, optionBlendValues.film);
		webGL2RenderingContext.uniform1f(compositeLetterboxStrengthLocation, optionBlendValues.letterbox);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, sceneRenderTarget.colorTexture);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE1);
		webGL2RenderingContext.bindTexture(webGL2RenderingContext.TEXTURE_2D, bloomRenderTargetA.colorTexture);
		webGL2RenderingContext.drawArrays(webGL2RenderingContext.TRIANGLES, 0, 3);
		webGL2RenderingContext.activeTexture(webGL2RenderingContext.TEXTURE0);

		// === 5. 옵션 패널 (vanilla.js 엔진 Graphic 으로 캔버스 안에 렌더링) ===
		const introFade = System.Math.max(0, System.Math.min(1, (elapsedTime - 0.2) / 2.4));
		renderOptionPanel(introFade);

		System.window.requestAnimationFrame(renderFrame);
	}

	System.window.requestAnimationFrame(renderFrame);
	</script>
</body>
